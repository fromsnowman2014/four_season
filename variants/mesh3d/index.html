<html lang="ko">
<head>

<style>

        background: linear-gradient(160deg, rgba(40,62,88,0.30), rgba(24,40,60,0.36)); border: 1px solid var(--line); color: var(--ink);
        -webkit-backdrop-filter: blur(16px) saturate(1.25); backdrop-filter: blur(16px) saturate(1.25);
        box-shadow: 0 10px 34px rgba(18,38,66,0.20), inset 0 1px 0 rgba(255,255,255,0.25);

<script type="module">
import * as THREE from 'three';

/* =====================================================================================
   설원의 계곡 — real-time snowfall over an alpine valley (Three.js r170, fully rasterized)
   Pipeline:  scene (MSAA, HDR, depth tex)  ->  snow flakes (instanced quads, soft vs depth)
              -> composite (+ distant snow veil)  ->  bloom (dual filter)  ->  ACES + grade
   ===================================================================================== */

// ---------------------------------------------------------------- URL / test hooks
const Q = new URLSearchParams(location.search);
const qnum = (k, d) => { const v = parseFloat(Q.get(k)); return Number.isFinite(v) ? v : d; };
const SEED = Math.floor(qnum('seed', 7)) >>> 0;
const T_START = Math.max(0, qnum('t', 0));
const COVER_Q = Q.has('cover') ? Math.min(1, Math.max(0, qnum('cover', 0))) : null;
const STORM_Q = Q.get('storm');
const WIND_Q = (Q.get('wind') || '').split(',').map(Number);
const SHOW_UI = Q.get('ui') !== '0';
const NOSNOW = !!Q.get('nosnow');
if (!SHOW_UI) { document.getElementById('ui').style.display = 'none'; document.getElementById('hint').style.display = 'none'; }

function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const clamp = (x, a, b) => x < a ? a : x > b ? b : x;
const smooth = (e0, e1, x) => { const t = clamp((x - e0) / (e1 - e0), 0, 1); return t * t * (3 - 2 * t); };
const lerp = (a, b, t) => a + (b - a) * t;

// ---------------------------------------------------------------- CPU value noise (terrain, fixed seed)
const PERM = new Uint8Array(512), VALS = new Float32Array(256);
{ const r = mulberry32(90210); const p = new Uint8Array(256); for (let i = 0; i < 256; i++) p[i] = i;
  for (let i = 255; i > 0; i--) { const j = Math.floor(r() * (i + 1)); const t = p[i]; p[i] = p[j]; p[j] = t; }
  for (let i = 0; i < 512; i++) PERM[i] = p[i & 255]; for (let i = 0; i < 256; i++) VALS[i] = r() * 2 - 1; }
function vn(x, y) {               // quintic value noise, [-1,1]
  const xf = Math.floor(x), yf = Math.floor(y), fx = x - xf, fy = y - yf, xi = xf & 255, yi = yf & 255;
  const p0 = PERM[xi], p1 = PERM[xi + 1];
  const a = VALS[PERM[p0 + yi]], b = VALS[PERM[p1 + yi]], c = VALS[PERM[p0 + yi + 1]], d = VALS[PERM[p1 + yi + 1]];
  const ux = fx * fx * fx * (fx * (fx * 6 - 15) + 10), uy = fy * fy * fy * (fy * (fy * 6 - 15) + 10);
  return a + (b - a) * ux + (c - a) * uy + (a - b - c + d) * ux * uy;
}
const ND = [0, 0, 0];
function vnd(x, y) {              // value noise + analytic derivatives -> ND
  const xf = Math.floor(x), yf = Math.floor(y), fx = x - xf, fy = y - yf, xi = xf & 255, yi = yf & 255;
  const p0 = PERM[xi], p1 = PERM[xi + 1];
  const a = VALS[PERM[p0 + yi]], b = VALS[PERM[p1 + yi]], c = VALS[PERM[p0 + yi + 1]], d = VALS[PERM[p1 + yi + 1]];
  const ux = fx * fx * fx * (fx * (fx * 6 - 15) + 10), uy = fy * fy * fy * (fy * (fy * 6 - 15) + 10);
  const dux = 30 * fx * fx * (fx * (fx - 2) + 1), duy = 30 * fy * fy * (fy * (fy - 2) + 1);
  const k = a - b - c + d;
  ND[0] = a + (b - a) * ux + (c - a) * uy + k * ux * uy; ND[1] = dux * (b - a + k * uy); ND[2] = duy * (c - a + k * ux);
}
function fbm(x, y, oct) { let s = 0, a = 0.5, n = 0;
  for (let i = 0; i < oct; i++) { s += a * vn(x, y); n += a; const nx = 1.6 * x - 1.2 * y + 17.13, ny = 1.2 * x + 1.6 * y - 9.71; x = nx; y = ny; a *= 0.5; }
  return s / n; }
function ridged(x, y, oct) {      // ridged multifractal: sharp crests, octaves weighted by previous octave
  let s = 0, a = 0.5, w = 1, n = 0;
  for (let i = 0; i < oct; i++) { let v = 1 - Math.abs(vn(x, y)); v *= v; v *= w; w = clamp(v * 1.8, 0, 1); s += v * a; n += a * 0.55;
    const nx = 1.66 * x - 1.18 * y + 5.3, ny = 1.18 * x + 1.66 * y - 2.9; x = nx; y = ny; a *= 0.52; }
  return s / n; }
function erosionFbm(x, y, oct) {  // gradient-damped fbm (IQ) - smooth valleys, detailed ridges
  let a = 0, b = 0.5, dx = 0, dy = 0;
  for (let i = 0; i < oct; i++) { vnd(x, y); dx += ND[1]; dy += ND[2]; a += b * ND[0] / (1 + dx * dx + dy * dy);
    const nx = 1.6 * x - 1.2 * y + 3.7, ny = 1.2 * x + 1.6 * y + 1.1; x = nx; y = ny; b *= 0.5; }
  return a; }

// ---------------------------------------------------------------- terrain layout (meters; camera at x=0,z=0 looking -Z)
const CAM_Y = 2000;
const SUN = new THREE.Vector3(qnum('sx', -0.62), qnum('sy', 0.55), qnum('sz', -0.56)).normalize();     // from the left and ahead: grazing light on the wall, backlit flakes
// Winding dirt paths, analytic so the fragment shader can draw them exactly (x = f(d), d = -z)
function path1X(d) { return 30 + 75 * Math.sin(d * 0.0041 + 0.9) + 30 * Math.sin(d * 0.0115 + 2.1) - 0.07 * d; }
function path2D(x) { return 880 + 150 * Math.sin(x * 0.0029 + 0.4) + 0.12 * x; }
let lastUplift = 0, lastWall = 0;
function cone(x, d, cx, cd, rx, rd, p) { const dx = (x - cx) / rx, dd = (d - cd) / rd, r = Math.sqrt(dx * dx + dd * dd); return r >= 1 ? 0 : Math.pow(1 - r, p) * (r < 0.15 ? 1 : 1); }
function uplift(x, d) {
  let e = 0;
  { // right wall: steep face along a line running from near-right to far-centre
    const tx = -0.3496, td = 0.9369, rx = x - 1750, rd = d - 1900;
    const along = rx * tx + rd * td, across = rx * td - rd * tx;
    const A = 1550 - 0.055 * along;
    const ramp = smooth(-300, 1250, across + 260 * fbm(along * 0.0011, 3.3, 3));
    e += A * ramp * smooth(8300, 6400, along);
    lastWall = A * ramp * smooth(8300, 6400, along);
  }
  e += 2300 * cone(x, d, -4700, 11200, 3300, 2700, 0.95);     // left pyramid peak (massive)
  e += 2250 * cone(x, d, -2700, 15200, 3900, 3000, 0.85);     // broad glaciated massif, centre-left
  e += 1500 * cone(x, d, -800, 12000, 2300, 2100, 0.95);      // central peaks behind the wall's end
  e += 1500 * cone(x, d, -12500, 22500, 7500, 3800, 0.9);     // far left range (hazy)
  e += 900 * cone(x, d, 3500, 17000, 5000, 3000, 0.9);        // far right range behind the wall
  { const dx = (x + 4400 + 0.2 * (d - 5000)) / 1500, dd = (d - 5600) / 2500; e += 650 * Math.exp(-(dx * dx + dd * dd)); } // valley foothills
  return e;
}
function baseH(x, d) {
  const dd = Math.max(d, 0);
  let m = 1768 + 120 * Math.exp(-dd / 380) + 105 * smooth(-400, 2600, x + 0.12 * d);
  m += 44 * fbm(x * 0.0016 + 11.3, d * 0.0016 + 7.1, 4) + 11 * fbm(x * 0.0068 + 3.3, d * 0.0068 - 2.2, 3);
  const ax = -1650 - 0.34 * dd;                                    // deep glacial valley on the left
  const vf = 1040 + 0.022 * dd + 25 * fbm(dd * 0.0008, x * 0.0008 + 9, 3);
  const s = x - ax;
  if (s > 0) return vf + (m - vf) * smooth(220, 1500 + 0.08 * dd, s);
  const rim = 1500 + 0.02 * dd + 120 * fbm(x * 0.0006 + 2, d * 0.0006, 3);
  return vf + (rim - vf) * smooth(220, 1700, -s);
}
function knollEdge(x) { return 10.4 + 0.42 * clamp(x, -14, 19) - 1.2 * Math.max(x - 19, 0) + 0.9 * fbm(x * 0.09 + 5.5, 1.7, 2); }
function heightAt(x, z) {
  const d = -z;
  let h = baseH(x, d);
  lastWall = 0; const e = uplift(x, d); lastUplift = e; const wallF = e > 1 ? lastWall / e : 0;
  if (e > 2) {   // mountains: domain-warped ridged multifractal + erosion detail, scaled by massif envelope
    const X = x * 0.001, D = d * 0.001;
    const wx = X + 0.42 * fbm(X * 0.55 + 4.1, D * 0.55 + 1.3, 3);
    const wy = D + 0.42 * fbm(X * 0.55 - 3.7, D * 0.55 + 8.9, 3);
    const r = ridged(wx * 0.62, wy * 0.62, 8) / 1.2;
    const er = erosionFbm(wx * 2.4, wy * 2.4, 6);
    // undamped high-frequency ridges: buttresses & gullies survive on steep faces (erosion fbm smooths them away)
    const r2 = wallF > 0.02 ? ridged(wx * 5.2 + 3.1, wy * 5.2 - 1.7, 4) / 1.2 : 0.45;
    h += e * (0.58 + (0.30 + 0.08 * wallF) * r + 0.30 * er + 0.09 * wallF * (r2 - 0.45));
  }
  if (d > -120 && d < 260 && x > -150 && x < 200) {   // the viewpoint knoll we stand on
    const ed = knollEdge(x), u = d - ed;
    let k = (CAM_Y - 6.4) - 0.02 * d + 0.03 * x + 0.35 * fbm(x * 0.21, d * 0.21, 2);
    if (u > 0) k -= 0.95 * u + 0.03 * u * u;
    const kk = 4, dh = Math.abs(h - k), hh = Math.max(kk - dh, 0) / kk;
    h = Math.max(h, k) + hh * hh * kk * 0.25;     // smooth max
  }
  return h;
}
function forestDensity(x, d, h, ny) {
  if (d < 120) return 0;
  let f = 0.5 + 0.5 * fbm(x * 0.0021 + 5.5, d * 0.0021 - 3.3, 4);
  f += 0.55 * Math.exp(-Math.pow((d - 1250 - 260 * Math.sin(x * 0.0019)) / 240, 2));   // forest band across the middle
  f += 0.35 * smooth(-150, -900, x - 0.15 * d) * smooth(250, 700, d);                  // dark wooded hillside, left
  f += 0.25 * smooth(900, 1800, x) * smooth(400, 900, d) * smooth(4000, 2500, d);      // right side groves
  f *= smooth(2350, 2150, h) * smooth(0.72, 0.86, ny);                                // tree line / steepness
  const p1 = Math.abs(x - path1X(d)), p2 = Math.abs(d - path2D(x));
  f *= smooth(8, 30, Math.min(p1, x > path1X(900) ? p2 : 1e9));                          // clear along the paths
  return clamp((f - 0.66) * 2.4, 0, 1);
}

// ---------------------------------------------------------------- renderer
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, alpha: false, powerPreference: 'high-performance', stencil: false, depth: true });
renderer.autoClear = false;
renderer.outputColorSpace = THREE.LinearSRGBColorSpace;   // we do tonemap + sRGB ourselves
const MAX_PR = Math.min(window.devicePixelRatio || 1, 1.5);
let quality = { pr: Math.min(MAX_PR, 1.25), msaa: 4 };

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 1.0, 90000);
const BASE_PITCH = -11 * Math.PI / 180, BASE_YAW = 0;
camera.position.set(0, CAM_Y, 0);
camera.rotation.order = 'YXZ'; camera.rotation.set(BASE_PITCH, BASE_YAW, 0);
camera.updateMatrixWorld();
const snowCam = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.05, 2000);
// fixed snow-volume axes = initial camera basis (drift never re-wraps the flakes)
const AX_R = new THREE.Vector3(), AX_U = new THREE.Vector3(), AX_B = new THREE.Vector3();
camera.matrixWorld.extractBasis(AX_R, AX_U, AX_B);

// ---------------------------------------------------------------- noise texture (tileable value noise, 4 seeds)
function bakeNoise() {
  const N = 512, C = 32, data = new Uint8Array(N * N * 4);
  for (let ch = 0; ch < 4; ch++) {
    const r = mulberry32(1234 + ch * 977), lat = new Float32Array(C * C);
    for (let i = 0; i < C * C; i++) lat[i] = r();
    for (let y = 0; y < N; y++) { const gy = y / N * C, iy = Math.floor(gy), fy = gy - iy, uy = fy * fy * fy * (fy * (fy * 6 - 15) + 10);
      for (let x = 0; x < N; x++) { const gx = x / N * C, ix = Math.floor(gx), fx = gx - ix, ux = fx * fx * fx * (fx * (fx * 6 - 15) + 10);
        const x0 = ix % C, x1 = (ix + 1) % C, y0 = iy % C, y1 = (iy + 1) % C;
        const a = lat[y0 * C + x0], b = lat[y0 * C + x1], c = lat[y1 * C + x0], d = lat[y1 * C + x1];
        const v = a + (b - a) * ux + (c - a) * uy + (a - b - c + d) * ux * uy;
        data[(y * N + x) * 4 + ch] = Math.round(v * 255); } } }
  const t = new THREE.DataTexture(data, N, N, THREE.RGBAFormat);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.magFilter = THREE.LinearFilter; t.minFilter = THREE.LinearMipmapLinearFilter;
  t.generateMipmaps = true; t.anisotropy = 8; t.needsUpdate = true; return t;
}
const noiseTex = bakeNoise();

// ---------------------------------------------------------------- shared uniforms
const U = {
  uTime: { value: 0 }, uStorm: { value: 0 }, uCoverage: { value: 0 },
  uSunDir: { value: SUN.clone() }, uSunColor: { value: new THREE.Vector3() }, uSkyAmb: { value: new THREE.Vector3() }, uGroundAmb: { value: new THREE.Vector3() },
  uRayleigh: { value: new THREE.Vector3() }, uRayCol: { value: new THREE.Vector3() }, uHazeCol: { value: new THREE.Vector3() },
  uHazeDen: { value: 0 }, uHazeBase: { value: 1150 }, uHazeScale: { value: 420 },
  uZenith: { value: new THREE.Vector3() }, uHorizon: { value: new THREE.Vector3() },
  uCloudOff: { value: new THREE.Vector2() }, uCloudCov: { value: 0.4 }, uCloudDark: { value: 0 },
  uWind: { value: new THREE.Vector3() }, uNoise: { value: noiseTex },
  uShadowN: { value: null }, uShadowF: { value: null }, uShMatN: { value: new THREE.Matrix4() }, uShMatF: { value: new THREE.Matrix4() },
  uShTexN: { value: 1 / 2048 }, uShTexF: { value: 1 / 2048 },
};

const COMMON = /* glsl */`
uniform float uTime, uStorm, uCoverage;
uniform vec3 uSunDir, uSunColor, uSkyAmb, uGroundAmb;
uniform vec3 uRayleigh, uRayCol, uHazeCol;
uniform float uHazeDen, uHazeBase, uHazeScale;
uniform vec3 uZenith, uHorizon;
uniform vec2 uCloudOff; uniform float uCloudCov, uCloudDark;
uniform vec3 uWind;
uniform sampler2D uNoise;
uniform sampler2D uShadowN, uShadowF; uniform mat4 uShMatN, uShMatF; uniform float uShTexN, uShTexF;
// noise texture: 32 value-noise cells per tile; p in cell units
float nR(vec2 p){ return texture2D(uNoise, p * 0.03125).r; }
float nG(vec2 p){ return texture2D(uNoise, p * 0.03125).g; }
float nB(vec2 p){ return texture2D(uNoise, p * 0.03125).b; }
float fbmT(vec2 p){ float s = 0., a = 0.5; for (int i = 0; i < 4; i++){ s += a * texture2D(uNoise, p * 0.03125).r; p = mat2(1.6, 1.2, -1.2, 1.6) * p + vec2(3.1, 1.7); a *= 0.5; } return s / 0.9375; }
float hash12(vec2 p){ vec3 p3 = fract(vec3(p.xyx) * .1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
float hash13(vec3 p3){ p3 = fract(p3 * .1031); p3 += dot(p3, p3.zyx + 31.32); return fract((p3.x + p3.y) * p3.z); }
// clouds: 2.5D layer at ~5.2 km; shared by sky and the cloud-shadow lookup on the ground
float cloudDens(vec2 cp, float cov){
  vec2 p = (cp + uCloudOff) / 2400.0;
  float n = 0.52 * nR(p) + 0.26 * nG(p * 2.03 + vec2(1.7, 9.2)) + 0.14 * nB(p * 4.1 + vec2(8.3, 2.8)) + 0.08 * nR(p * 8.7 + vec2(3.3, 5.1));
  return smoothstep(1.0 - cov, 1.0 - cov + 0.26, n);
}
float cloudShadow(vec3 P){
  vec2 cp = P.xz + uSunDir.xz / max(uSunDir.y, 0.2) * (5200.0 - P.y);
  return 1.0 - 0.38 * cloudDens(cp, 0.40) * (1.0 - uStorm);
}
// aerial perspective: Rayleigh-like (wavelength dependent, thin uniform air) + height-fog haze / valley mist (analytic exp height integral)
vec3 atmo(vec3 col, vec3 P){
  vec3 rv = P - cameraPosition; float dist = length(rv); vec3 rd = rv / max(dist, 1e-3);
  float mu = dot(rd, uSunDir);
  vec3 tR = exp(-uRayleigh * dist);
  float k = 1.0 / uHazeScale;
  float dy = rd.y * dist;
  float od = uHazeDen * exp(-k * (cameraPosition.y - uHazeBase)) * (abs(dy) > 0.5 ? (1.0 - exp(-k * dy)) / (k * rd.y) : dist);

  }
  const P = (i, j, o) => pos[(i * na + j) * 3 + o];

    const ax = P(i1, j, 0) - P(i0, j, 0), ay = P(i1, j, 1) - P(i0, j, 1), az = P(i1, j, 2) - P(i0, j, 2);
    const bx = P(i, j1, 0) - P(i, j0, 0), by = P(i, j1, 1) - P(i, j0, 1), bz = P(i, j1, 2) - P(i, j0, 2);

const $ = id => document.getElementById(id);
const amtEl = $('amt'), amtV = $('amtv');
function amtLabel(v) { return v < 0.5 ? '적게' : v < 1.3 ? '보통' : v < 1.9 ? '많이' : '아주 많이'; }
function syncAmt() { sim.amount = parseFloat(amtEl.value); amtV.textContent = amtLabel(sim.amount); amtEl.style.setProperty('--p', ((sim.amount - 0.2) / 2.3 * 100).toFixed(1) + '%'); }
amtEl.addEventListener('input', syncAmt); syncAmt();
$('bstorm').addEventListener('click', () => { sim.override = null; sim.manual = { start: sim.t, dur: 52, up: 8.5, down: 9.5 }; });
$('auto').checked = sim.auto;
$('auto').addEventListener('change', e => { sim.auto = e.target.checked; });
$('breset').addEventListener('click', () => { sim.coverage = 0; });
const wArrow = $('warrow'), wVal = $('wval');

// ---------------------------------------------------------------- frame loop
const invVP = new THREE.Matrix4();
let last = performance.now(), frames = 0, fpsT = 0, slowT = 0;
let fadeEl = $('fade');
let hintEl = SHOW_UI ? $('hint') : null; const startWall = performance.now();
function frame() {
  requestAnimationFrame(frame);
  const now = performance.now();   // (rAF timestamps are not wall-clock in some headless/throttled modes)
  const rawDt = (now - last) / 1000; last = now;
  const dt = clamp(rawDt, 0.0005, 0.05);
  sim.t += dt;
  // fps + adaptive quality (only downgrades; rAF is vsync-capped so we cannot see headroom)
  if (rawDt < 0.25) { frames++; fpsT += rawDt; }   // ignore tab-switch gaps
  if (fpsT > 0.5) { sim.fps = frames / fpsT; frames = 0; fpsT = 0;
    if (sim.fps < 42 && sim.t - T_START > 6) { slowT += 0.5; if (slowT > 4) { slowT = 0; degrade(); } } else slowT = Math.max(0, slowT - 0.5); }

  // storm & accumulation
  const st = stormTarget(sim.t);
  sim.storm = lerp(sim.storm, st, 1 - Math.exp(-dt / 0.6));   // schedule ramps are already smooth; this only softens manual switches
  if (!sim.frozenCover) sim.coverage = Math.min(1, sim.coverage + covRate(sim.storm, sim.amount) * dt);
  updateWind(dt);
  updateEnv();
  U.uTime.value = sim.t;
  U.uCloudOff.value.x -= (wind.slow.x * 4 + 6) * dt; U.uCloudOff.value.y -= (wind.slow.z * 4 + 1.5) * dt;

  // camera: very slow subtle drift, composition stays put
  const tt = sim.t;
  camera.rotation.set(BASE_PITCH + 0.0016 * Math.sin(tt * 0.031 + 1.0), BASE_YAW + 0.0045 * Math.sin(tt * 0.019), 0);
  camera.position.set(0.8 * Math.sin(tt * 0.023), CAM_Y + 0.25 * Math.sin(tt * 0.029), 0);
  camera.updateMatrixWorld();
  snowCam.position.copy(camera.position); snowCam.quaternion.copy(camera.quaternion); snowCam.updateMatrixWorld();
  invVP.multiplyMatrices(camera.projectionMatrix, camera.matrixWorldInverse).invert();
  skyMat.uniforms.uInvVP.value.copy(invVP);

  // push field (mouse local push / swirl)
  const tv = Math.tan(camera.fov * Math.PI / 360);
  {
    const pm = pushMat.uniforms;
    const prev = pushRT[pushIdx], next = pushRT[1 - pushIdx];
    pm.uPrev.value = prev.texture; pm.uDt.value = dt;
    if (pm.uM1.value.x < 0) pm.uM0.value.set(mouse.x, mouse.y); else pm.uM0.value.copy(pm.uM1.value);
    pm.uM1.value.set(mouse.x, mouse.y);
    pm.uActive.value = mouse.moved ? 1 : 0; mouse.moved = false;
    pm.uMVel.value.set(mouse.vx, mouse.vy).clampLength(0, 6);
    const dRef = 6.0;
    const wr = wind.slow.dot(AX_R), wu = wind.slow.dot(AX_U) - 0.9;
    pm.uAdv.value.set(wr / dRef / (2 * tv * camera.aspect), wu / dRef / (2 * tv));
    pass(pushMat, next);
    pushIdx = 1 - pushIdx; compMat.uniforms.uPushDbg.value = next.texture;
    snowLayers.forEach(({ mat }) => { mat.uniforms.uPush.value = next.texture; mat.uniforms.uPushPrev.value = prev.texture; mat.uniforms.uPushDt.value = dt; });
  }

  // snow layer uniforms
  const calm = clamp(sim.amount / 6, 0.02, 1);
  // blizzard: x6 density (near layers less, so the frame is not just smeared)
  const fogCol = U.uHazeCol.value;
  snowLayers.forEach(({ L, mat, geo }) => {
    const u = mat.uniforms;
    u.uDensity.value = clamp(calm * (1 + ((L.stormMul || 6) - 1) * sim.storm), 0, 1) * quality.snowScale;
    u.uFadeN.value = 1 / 0.04;
    geo.instanceCount = Math.min(L.count, Math.ceil((u.uDensity.value + 0.04) * L.count));
    u.uBoxCenter.value.copy(camera.position).addScaledVector(AX_B, -(Math.max(0.05, L.near - L.fin * 1.5) + L.far + L.fout * 1.5) * 0.5);
    u.uDispF.value.copy(wind.dispF); u.uDispS.value.copy(wind.dispS);
    u.uWindF.value.copy(wind.fast); u.uWindS.value.copy(wind.slow);
    u.uTurbAmp.value = 0.6 + 0.12 * wind.cur.length() + 0.8 * sim.storm;
    u.uShutter.value = 1 / 90;
    u.uFlakeFog.value = lerp(0.0008, 0.014, sim.storm);
    u.uFogCol.value.copy(fogCol);
  });
  compMat.uniforms.uWindScr.value.set(wind.cur.dot(AX_R), wind.cur.dot(AX_U));
  mixEnv('veil', ease(sim.storm), compMat.uniforms.uVeilCol.value);

  // ---- render
  renderer.setRenderTarget(sceneRT); renderer.setClearColor(0x000000, 1); renderer.clear(true, true, false);
  renderer.render(scene, camera);
  renderer.setRenderTarget(snowRT); renderer.setClearColor(0x000000, 0); renderer.clear(true, false, false);
  if (!NOSNOW) renderer.render(snowScene, snowCam);
  const cu = compMat.uniforms; cu.uScene.value = sceneRT.texture; cu.uSnow.value = snowRT.texture; cu.uDepth.value = sceneRT.depthTexture;
  pass(compMat, compRT);
  // bloom: threshold + dual-filter down/up chain
  let src = compRT;
  bloomRTs.forEach((rt, i) => { downMat.uniforms.uSrc.value = src.texture; downMat.uniforms.uHp.value.set(0.5 / src.width, 0.5 / src.height); downMat.uniforms.uThresh.value = i === 0 ? 2.2 : 0; pass(downMat, rt); src = rt; });
  for (let i = bloomRTs.length - 2; i >= 0; i--) { const s = bloomRTs[i + 1]; upMat.uniforms.uSrc.value = s.texture; upMat.uniforms.uHp.value.set(0.5 / s.width, 0.5 / s.height); upMat.uniforms.uW.value = 0.9; pass(upMat, bloomRTs[i]); }
  finalMat.uniforms.uComp.value = compRT.texture; finalMat.uniforms.uBloom.value = bloomRTs[0].texture;
  finalMat.uniforms.uExposure.value = lerp(1.0, 0.74, smooth(0.25, 1.0, sim.coverage)) * lerp(1.0, 0.95, sim.storm);   // expose for snow
  pass(finalMat, null);

  // hint: driven from the frame loop (deterministic in captures); fades in, holds, fades out
  if (hintEl) { const ht = (now - startWall) / 1000; const o = smooth(0.5, 1.6, ht) * (1 - smooth(6.0, 8.5, ht));
    const os = o.toFixed(2); if (hintEl.dataset.o !== os) { hintEl.dataset.o = os; hintEl.style.opacity = os; } if (ht > 9) { hintEl.remove(); hintEl = null; } }
  // UI readout
  const wx = wind.cur.dot(RIGHT_H), wz = wind.cur.dot(FWD_H), wm = Math.hypot(wx, wz);
  wArrow.style.transform = `rotate(${Math.atan2(wx, wz) * 180 / Math.PI}deg)`;
  wVal.textContent = wm.toFixed(1);
  if (fadeEl && fadeEl.style.opacity !== '0') { fadeEl.style.opacity = '0'; const f = fadeEl; setTimeout(() => f.remove(), 1800); fadeEl = null; }
}
quality.snowScale = 1;
function degrade() {
  if (quality.msaa > 0) { quality.msaa = 0; allocTargets(); console.log('quality: msaa off'); return; }
  if (quality.pr > 0.8) { quality.pr = Math.max(0.75, quality.pr - 0.2); allocTargets(); console.log('quality: pr', quality.pr); return; }
  if (quality.snowScale > 0.5) { quality.snowScale -= 0.15; console.log('quality: snow', quality.snowScale); }
}

// ---------------------------------------------------------------- public API (test hooks)
window.snowSim = {
  state: () => ({ coverage: +sim.coverage.toFixed(4), storm: +sim.storm.toFixed(4), windX: +wind.cur.x.toFixed(3), windZ: +wind.cur.z.toFixed(3),
    flakeCount: snowLayers.reduce((a, l) => a + l.geo.instanceCount, 0), fps: +sim.fps.toFixed(1) }),
  setCoverage: v => { sim.coverage = clamp(+v || 0, 0, 1); },
  setStorm: v => { sim.override = (v === null || v === undefined) ? null : clamp(+v, 0, 1); if (sim.override !== null) sim.storm = sim.override; else sim.manual = null; },
  reset: () => { sim.coverage = 0; },
  schedule: () => stormEvents.slice(0, 6).map(e => ({ start: +e.start.toFixed(1), dur: +e.dur.toFixed(1) })),
};
window.__timing.ready = Math.round(performance.now());
window.__dbg = { pushRT, renderer, mouse, pushMat, sim, quality, get idx() { return pushIdx; } };
requestAnimationFrame(frame);
</script>
</body>
</html>

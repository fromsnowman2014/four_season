<script>/* js/render.js */
// =====================================================================================
//  render.js — the frame uniform bundle S.F (S.deriveF: the static fields, then the derive modules) and its generic
//  upload, the G-buffer binding, and render(): the seven passes of one frame. The precipitation pass is
//  S.drawPrecip (precip.js), followed by the hazard draws S.drawHazards (precip.js). Registers only.
//  Texture units (WebGL2 guarantees 16 per stage): 0, 1 pass inputs (uTex / uSrc / uPrev, uPrevD / uHdr, uBloom),
//  2 uScene (scene colour + snow alpha; flakes, rain, composite), 3, 4 uSky, uSkyD (shade; the house's shade also reads
//  unit 3 as uSkyH), 5 uPrevHdr (the house's shade: the previous frame, wet-ground reflections) / uBoltSky (the bolt),
//  6 uBoltSkyD (the bolt), 7 uNoise (S.F), 8-11 uG0..uG3 (the shown G-buffer), 12-15 uN0..uN3 (the one being baked;
//  the house bake's dissolve copy mode reads them too), bound by bindGB(u, 8) in every pass that reads the G-buffer
//  (sky, shade, precipitation, the hazard draws, composite).
// =====================================================================================
(function (S) {
  'use strict';
  const { CAM, camR, camU, camF, SUN } = S;   // the camera arrays are mutated in place by S.frameCamera; S.TANH is read per use
  const R = S.R;

  // =====================================================================================
  //                                   frame uniform bundle
  // =====================================================================================
  // S.deriveF fills S.F (the contract is in core.js / ARCHITECTURE.md) once per frame, after the sim step: the static
  // camera / sun / clock / noise fields here, then the derive modules in a fixed order (surface, precip, atmos, the
  // active scene's own derive if it has one: the house's, then events: the hazards, which may override anything).
  // S.uploadF(prog) uploads every S.F entry the program declares, with the setter cached for its getActiveUniform
  // type (gl.js).
  const NOISE = { unit: 7, tex: null };
  // Phase 3 (lane H): the bake variant / dissolve uniforms of a scene bake (set again per draw below) and two samplers
  // for a scene's shading: uPrevHdr = the previous frame's scene (R.hdr, still holding it during the shade pass: wet-
  // ground screen-space reflections) on unit 5, uSkyH = this frame's cloud pass on unit 3 (the texture the shade pass
  // binds as uSky). Only the programs that declare them receive them (SURFACE_HOUSE, the house bake)
  const DIS = new Float32Array(3), PREV = { unit: 5, tex: null }, SKYC = { unit: 3, tex: null };
  S.deriveF = function () {
    const F = S.F;
    F.uCamPos = CAM.pos; F.uCamR = camR; F.uCamU = camU; F.uCamF = camF;
    F.uTanH = S.TANH;
    F.uSunDir = SUN;
    // shading clock (stratus / mist drift): 512000 s is a common period of their noise scrolls (0.01, 0.004, 0.0015 x 256-periodic noise)
    F.uTime = S.anim.time % 512000;
    NOISE.tex = S.noiseTex; F.uNoise = NOISE;
    F.uVariant = R.gbNextVar; F.uDissolve = DIS;
    PREV.tex = R.hdr ? R.hdr.texs[0] : null; F.uPrevHdr = PREV;
    SKYC.tex = R.sky[1 - R.skyI] ? R.sky[1 - R.skyI].texs[0] : null; F.uSkyH = SKYC;
    S.derive.surface.frame(F);
    S.derive.precip.frame(F);
    S.derive.atmos.frame(F);
    // Phase 3: the active scene's own derive (house: uCozy and its look over the atmosphere), then the hazards (they
    // may override anything above: smoke, flash, window-light flicker)
    if (S.scene.derive) S.derive[S.scene.derive].frame(F);
    S.derive.events.frame(F);
  };
  S.uploadF = function (prog) {
    const F = S.F, list = prog.list;
    for (let i = 0; i < list.length; i++) { const e = list[i], v = F[e.name]; if (v !== undefined) e.set(e.loc, v); }
  };
  // bind a program and upload the bundle (pass-local uniforms follow explicitly)
  function use(prog) { S.gl.useProgram(prog.p); S.uploadF(prog); return prog.u; }
  function bindTex(unit, t, loc) { const gl = S.gl; gl.activeTexture(gl.TEXTURE0 + unit); gl.bindTexture(gl.TEXTURE_2D, t); gl.uniform1i(loc, unit); }
  function drawFull() { S.gl.drawArrays(S.gl.TRIANGLES, 0, 3); }

  // =====================================================================================
  //                                   G-buffer binding
  // =====================================================================================
  // (the bake budget, the iteration cap of the bake's state machine, is the scene's: S.scene.bakeIter)

  // bind the G-buffer(s) for a per-frame pass (see GBUF): uG* = shown buffer at unit0 + i, uN* = the one being baked
  // at unit0 + 4 + i (only the samplers the program uses), uGb = how to mix them
  // (a variant rebake, R.varBake, is not shown while it bakes: every pass reads only the shown buffer, which the
  // dissolve updates in place)
  const NGB = S.GB_LAYOUT.length;
  function bindGB(u, unit0) {
    const one = !R.gbNext || R.varBake;
    const cur = R.gbCur || R.gbNext, nxt = one ? cur : R.gbNext;
    const frac = one ? 0 : R.gbDone < 0 ? R.gbRow / R.gbNext.h : 1 + 0.08 * Math.min(1, (S.anim.wall - R.gbDone) / 0.3);
    for (let i = 0; i < NGB; i++) {
      if (u['uG' + i]) bindTex(unit0 + i, cur.texs[i], u['uG' + i]);
      if (u['uN' + i]) bindTex(unit0 + NGB + i, nxt.texs[i], u['uN' + i]);
    }
    S.gl.uniform3f(u.uGb, R.gbAsp, frac, one ? 0 : R.gbCur ? 1 : 2);
  }
  // what the precipitation pass gets from the renderer (precip.js)
  const ctx = S.passCtx = { use, bindGB, bindTex };
  // (polish) every hazard hook is the identity while these hold: the frame then draws the hook-free twins of sky, shade
  // and comp (gl.js '~idle', HAZARD_IDLE: the same image, the Phase-2 code, less of it). Mirrors the early-outs of
  // hazardSky / hazardLight (uFlash.w, uSmoke.w), hazardSurface (uCrack.w), hazardShake (uQuakeZ.x, uQuake.w) and
  // hazardComp (uQuakeZ.yz) in glsl/hazard.js; tests/check.mjs pins those lines, so a hook change fails it until this
  // follows. R.drawn: the sky / shade / comp programs of the last frame (tests)
  function hazardsIdle(F) {
    const z = F.uQuakeZ;
    return !(F.uFlash[3] > 0) && !(F.uSmoke[3] > 0) && !(F.uCrack[3] > 0) && !(F.uQuake[3] > 0) && !(z[0] > 1) && z[1] * z[1] + z[2] * z[2] < 1e-12;
  }
  R.drawn = { sky: null, shade: null, comp: null };

  // =====================================================================================
  //                                   render
  // =====================================================================================
  S.render = function () {
    const gl = S.gl, P = S.P, anim = S.anim, perf = S.perf, FIXED = S.cfg.fixed;
    const W = R.W, H = R.H, Ws = R.Ws, Hs = R.Hs;
    if (!R.gbCur && !R.gbNext) return;
    const idle = hazardsIdle(S.F);
    const D = R.drawn;
    D.sky = idle && P.skyIdle || P.sky; D.shade = idle && P.shadeIdle || P.shade; D.comp = idle && P.compIdle || P.comp;
    // ---- 1. progressive G-buffer: one stripe per frame, sized by adaptStripe() so the frame keeps its budget. When the
    // last stripe lands the buffers are kept 0.3 s longer (the reveal edge clears the top), then swapped. A variant
    // rebake (Phase 3, lane H: S.variantTick starts one behind the live scene) is dissolved in instead: for
    // S.VARIANT_DISSOLVE s the bake program's copy mode writes the new buffer into the shown one where a smooth screen
    // noise lies in this frame's band [disP, p), then the buffers swap (identical by then)
    S.variantTick();
    if (R.gbNext) {
      const g = R.gbNext;
      if (R.gbDone < 0) {
        gl.bindFramebuffer(gl.FRAMEBUFFER, g.fbo);
        gl.viewport(0, 0, g.w, g.h);
        gl.enable(gl.SCISSOR_TEST);
        gl.scissor(0, R.gbRow, g.w, R.gbRows);
        const u = use(P.gbuf);
        gl.uniform2f(u.uRes, g.w, g.h);
        gl.uniform1f(u.uPixAng, 2 * S.TANH / g.h);
        gl.uniform1i(u.uIter, S.scene.bakeIter);
        if (u.uVariant) gl.uniform1f(u.uVariant, R.gbNextVar);
        if (u.uDissolve) { gl.uniform3f(u.uDissolve, 0, 0, 0); for (let i = 0; i < NGB; i++) gl.uniform1i(u['uN' + i], 7); }   // (never sampled: the noise unit)
        drawFull();
        gl.disable(gl.SCISSOR_TEST);
        R.gbRow += R.gbRows; R.bakeFrame = true;
        if (R.gbRow >= g.h) R.gbDone = anim.wall;
      } else if (R.varBake) {
        const p = Math.min(1, (anim.wall - R.gbDone) / S.VARIANT_DISSOLVE);
        if (p >= 1 || !R.gbCur) {
          S.freeRT(R.gbCur); R.gbCur = g; R.gbNext = null; R.gbAsp = 1;
          R.gbVar = R.gbNextVar; R.varBake = false; R.varMs = performance.now() - R.buildStart;
          perf.skip = 2;
        } else {
          const c = R.gbCur, u = use(P.gbuf);
          gl.bindFramebuffer(gl.FRAMEBUFFER, c.fbo);
          gl.viewport(0, 0, c.w, c.h);
          gl.uniform2f(u.uRes, c.w, c.h);
          for (let i = 0; i < NGB; i++) bindTex(12 + i, g.texs[i], u['uN' + i]);
          const hi = p;
          gl.uniform3f(u.uDissolve, 1, R.disP, hi);
          drawFull();
          R.disP = hi;
        }
      } else if (anim.wall - R.gbDone >= 0.3) {
        S.freeRT(R.gbCur); R.gbCur = g; R.gbNext = null; R.gbAsp = 1;
        R.gbVar = R.gbNextVar;
        R.buildMs = performance.now() - R.buildStart;  // wall time from allocate() to the swap: what the viewer waited
        perf.skip = 2;                                  // the next dt still carries the last stripe
        if (R.readyTime < 0) R.readyTime = anim.wall;
      }
    }

    // ---- 2. sky + clouds (half res, temporal accumulation)
    const sp = R.sky[R.skyI], sc = R.sky[1 - R.skyI];
    gl.bindFramebuffer(gl.FRAMEBUFFER, sc.fbo);
    gl.viewport(0, 0, sc.w, sc.h);
    {
      const u = use(D.sky);
      gl.uniform2f(u.uRes, sc.w, sc.h);
      bindTex(0, sp.texs[0], u.uPrev); bindTex(1, sp.texs[1], u.uPrevD);
      bindGB(u, 8);     // G0: the march stops at the terrain
      gl.uniform1f(u.uBlend, R.skyReset ? 1.0 : 0.3);
      gl.uniform1f(u.uFrame, (FIXED ? Math.round(anim.time * 60) : S.frameNo) % 64);
      gl.uniform1f(u.uSteps, perf.skySteps);
      drawFull();
    }
    R.skyReset = false; R.skyI = 1 - R.skyI;

    // ---- 3. scene shading (at the render scale; the G-buffer is sampled by normalised uv). Output alpha: snow fraction
    // x sun visibility (read by the flakes and the composite)
    gl.bindFramebuffer(gl.FRAMEBUFFER, R.scene.fbo);
    gl.viewport(0, 0, Ws, Hs);
    {
      const u = use(D.shade);
      gl.uniform2f(u.uRes, Ws, Hs);
      bindGB(u, 8);
      bindTex(3, sc.texs[0], u.uSky); bindTex(4, sc.texs[1], u.uSkyD);
      const wA = S.wind.s.windA, wl = wA[0] * camR[0] + wA[2] * camR[2];
      gl.uniform3f(u.uSway, wl, anim.swayPh, Hs * 0.5 / S.TANH);
      drawFull();
    }

    // ---- 4. FXAA -> hdr
    gl.bindFramebuffer(gl.FRAMEBUFFER, R.hdr.fbo);
    {
      const u = use(P.fxaa);
      bindTex(0, R.scene.texs[0], u.uTex);
      gl.uniform2f(u.uInv, 1 / Ws, 1 / Hs);
      drawFull();
    }

    // ---- 5. precipitation (precip.js) into hdr, premultiplied (ash and embers are precipitation layers too), then the
    // hazard draws (S.drawHazards, precip.js: the quake's dust plumes and the lightning bolt; nothing while neither is
    // on); neither over a ?view= debug channel
    if (!S.cfg.view) { S.drawPrecip(ctx); S.drawHazards(ctx); }
    else for (const k of Object.keys(S.precipCount)) S.precipCount[k] = 0;

    // ---- 6. bloom
    {
      const u = use(P.down);
      let src = R.hdr;
      for (let i = 0; i < R.bloom.length; i++) {
        const d = R.bloom[i];
        gl.bindFramebuffer(gl.FRAMEBUFFER, d.fbo); gl.viewport(0, 0, d.w, d.h);
        bindTex(0, src.texs[0], u.uSrc);
        gl.uniform2f(u.uSrcInv, 1 / src.w, 1 / src.h); gl.uniform2f(u.uDstRes, d.w, d.h);
        gl.uniform1f(u.uThresh, i === 0 ? 1.15 : 0.0);
        drawFull(); src = d;
      }
    }
    {
      const u = use(P.up);
      gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE);
      for (let i = R.bloom.length - 1; i > 0; i--) {
        const s = R.bloom[i], d = R.bloom[i - 1];
        gl.bindFramebuffer(gl.FRAMEBUFFER, d.fbo); gl.viewport(0, 0, d.w, d.h);
        bindTex(0, s.texs[0], u.uSrc);
        gl.uniform2f(u.uSrcInv, 1 / s.w, 1 / s.h); gl.uniform2f(u.uDstRes, d.w, d.h);
        drawFull();
      }
      gl.disable(gl.BLEND);
    }

    // ---- 7. composite (canvas resolution; the hdr / bloom / scene textures are bilinearly upsampled). Exposure, bloom
    // strength, uOvercast and uSunCol come from S.F; the clocks and inputs here are pass-local
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.viewport(0, 0, W, H);
    {
      const u = use(D.comp);
      bindTex(0, R.hdr.texs[0], u.uHdr); bindTex(1, R.bloom[0].texs[0], u.uBloom); bindTex(2, R.scene.texs[0], u.uScene);
      bindGB(u, 8);     // sparkle distance; reveal edge
      gl.uniform2f(u.uRes, W, H);
      gl.uniform1f(u.uTwinkleT, anim.time % 3600);
      // grain clock: the frame index modulo 1024 (fract(x * 0.618) loses its 1-px randomness once x reaches ~2e6)
      gl.uniform1f(u.uFrame, FIXED ? Math.round(anim.time * 60) % 1024 : S.frameNo % 1024);
      drawFull();
    }
  };
})(window.SNOW);

</script>
<script>/* js/input.js */
// =====================================================================================
//  input.js — pointer input (stage-1 owner: lane B). Wind comes ONLY from a left-button drag on the canvas: the drag
//  velocity feeds the wind (sim/wind.js reads S.mouse) and the wake segments the flake VS pushes flakes with
//  (precip.js uploads them). Plain pointer movement changes nothing but `lastMove` (the chrome's idle timer).
//  Touch / pen: a one-finger drag is that drag. A primary touch or pen contact arrives as pointerdown with button 0 and
//  buttons 1, so it passes the same test; a lifted finger ends it (pointerup / pointercancel / lostpointercapture);
//  further fingers (isPrimary false) are ignored. The canvas has touch-action: none (no page pan / zoom over it).
//  Positions and velocities are taken against the canvas box (S.cssSize), the same box the canvas is sized from.
//  Registers only; main.js calls S.bindInput at boot and S.stepInput(dt) first in every live sim step.
//  S.mouse, the input -> wind contract (wind.js reads only these):
//    drag     the left button is held on the canvas (pointer captured)
//    inside   true only while dragging (Phase 2: hovering is not presence for the wind)
//    x, y     the drag position in ndc (-1..1); held at the last drag position after release
//    vxn      horizontal drag velocity in viewport widths per second (decayed by stepInput, ~0.09 s)
//    vyn      vertical drag velocity, viewport heights per second, up positive (same decay)
//    segs     wake segments { x, y, dx, dy (ndc), t (S.anim.wall) }, at most 32, pushed only while dragging
//    lastMove S.anim.wall of the last pointer movement of any kind (UI idle logic only)
// =====================================================================================
(function (S) {
  'use strict';
  const { lerp } = S;
  const mouse = S.mouse = { inside: false, x: 0, y: 0, lx: null, ly: null, lt: 0, vx: 0, vy: 0, vxn: 0, vyn: 0, drag: false, pid: -1,
                            accX: 0, accY: 0, segT: 0, segs: [], lastMove: 0 };
  let canvas = null;

  function endDrag() {
    if (!mouse.drag) return;
    mouse.drag = false; mouse.inside = false; mouse.lx = null;
    if (canvas) {
      canvas.classList.remove('drag');
      try { if (canvas.hasPointerCapture(mouse.pid)) canvas.releasePointerCapture(mouse.pid); } catch (e) { /* pointer already gone */ }
    }
    mouse.pid = -1;
  }
  // one drag sample: velocity (fast attack; stepInput releases it) and the accumulated wake segment
  function dragMove(e) {
    const now = performance.now() / 1000, [W, H] = S.cssSize();
    mouse.x = e.clientX / W * 2 - 1; mouse.y = 1 - e.clientY / H * 2;
    if (mouse.lx !== null) {
      const dx = e.clientX - mouse.lx, dy = e.clientY - mouse.ly, dtE = Math.max(now - mouse.lt, 0.004);
      mouse.vx = lerp(mouse.vx, dx / dtE, 0.35);
      mouse.vy = lerp(mouse.vy, -dy / dtE, 0.35);
      mouse.accX += dx / W * 2; mouse.accY += -dy / H * 2;
      if (now - mouse.segT > 0.035) {
        if (Math.hypot(mouse.accX, mouse.accY) > 1e-4) {
          mouse.segs.push({ x: mouse.x, y: mouse.y, dx: mouse.accX, dy: mouse.accY, t: S.anim.wall });
          if (mouse.segs.length > 32) mouse.segs.shift();
        }
        mouse.accX = 0; mouse.accY = 0; mouse.segT = now;
      }
    }
    mouse.lx = e.clientX; mouse.ly = e.clientY; mouse.lt = now;
  }

  S.bindInput = function () {
    canvas = document.getElementById('c');
    // any movement counts as activity for the chrome's idle dimming, and nothing else
    addEventListener('pointermove', () => { mouse.lastMove = S.anim.wall; }, { passive: true });
    canvas.addEventListener('pointerdown', e => {
      // the canvas listener runs before ui.js's document listener, so a click that only closes the open pop-over
      // still sees it open here and never starts a drag
      if (e.button !== 0 || !e.isPrimary || mouse.drag || (S.ui && S.ui.open)) return;
      e.preventDefault();                                   // no text selection / focus change from a drag
      mouse.drag = true; mouse.inside = true; mouse.pid = e.pointerId;
      mouse.lx = null; mouse.accX = 0; mouse.accY = 0; mouse.segT = performance.now() / 1000;
      try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* synthetic pointer: capture unavailable */ }
      canvas.classList.add('drag');
      dragMove(e);
    });
    canvas.addEventListener('pointermove', e => {
      if (!mouse.drag || e.pointerId !== mouse.pid) return;
      if (!(e.buttons & 1)) { endDrag(); return; }          // the button came up outside the window
      dragMove(e);
    }, { passive: true });
    for (const ev of ['pointerup', 'pointercancel', 'lostpointercapture']) canvas.addEventListener(ev, e => { if (e.pointerId === mouse.pid) endDrag(); });
    addEventListener('blur', endDrag);
  };
  // one live input step (before the wind): the drag velocity decays (fast attack in dragMove, ~0.09 s release, also
  // after the button is released) and the wake segments older than their envelope are dropped
  S.stepInput = function (dt) {
    const k = Math.exp(-dt / 0.09);
    mouse.vx *= k; mouse.vy *= k;
    const [W, H] = S.cssSize();
    mouse.vxn = mouse.vx / W; mouse.vyn = mouse.vy / H;
    S.pruneSegs();
  };
  S.pruneSegs = function () {   // drop wake segments older than their envelope, in place
    const wall = S.anim.wall;
    let k = 0;
    for (let i = 0; i < mouse.segs.length; i++) if (wall - mouse.segs[i].t < 3.6) mouse.segs[k++] = mouse.segs[i];
    mouse.segs.length = k;
  };
})(window.SNOW);

</script>
<script>/* js/ui.js */
// =====================================================================================
//  ui.js — the chrome (Phase-3 owner: lane U): one season glyph in the corner, a glass pop-over, a start hint, a
//  place toast. Registers only; main.js calls S.bindUI and S.syncUI at boot, and S.updateUI every frame. It drives the
//  sim only through the calls window.snowSim exposes (S.setScene; S.climate.api: setSeason, speed; S.weather.api:
//  setWeather, amount, auto; S.events.api: trigger, hazardsAuto) and reads the module state / snapshots for the
//  status line and the checked controls.
//  Places: the cards (S.scenes[id].name), and ← / → anywhere on the page while the pop-over is closed and focus is
//  not in a text / radio / slider / switch control (the radiogroups keep their own arrow keys); a key switch shows the
//  place's name in a toast. While a switched scene is baking (state().ready false) the open pop-over stays open and
//  the checked card shimmers.
// =====================================================================================
(function (S) {
  'use strict';
  const SEASONS = ['spring', 'summer', 'autumn', 'winter'];
  const WX_KO = { clear: '맑음', cumulus: '구름', overcast: '흐림', fog: '안개', rain: '비', snow: '눈', blizzard: '폭설', thunder: '뇌우' };
  const SPEEDS = [0.25, 0.5, 1, 2, 4, 8];
  const TOAST_S = 1.6;   // s the place toast stays up after a key switch
  const YEAR_MIN = 20;   // one year at 1x, in real minutes (YEAR = 1200 climate-s)

  // open: pop-over shown; hover: the pointer rests on it; last: S.anim.wall of the last interaction (it closes after
  // 6 s idle unless hovered or keyboard-focused); hintDone: the pop-over was opened, the hint stays hidden; txt: last
  // written text per element (DOM writes only on change)
  const ui = S.ui = {
    icon: null, pop: null, hint: null, toast: null, toastT: -1, hintDone: false, el: {}, open: false, hover: false, last: 0, season: -1, busy: false, txt: new Map(),
    touch() { ui.last = S.anim.wall; },
    show(kbd) {
      if (ui.hint) { ui.hintDone = true; ui.hint.classList.remove('on'); }   // the hint never sits under the open glass
      ui.open = true; ui.pop.classList.add('open'); ui.icon.classList.add('open'); ui.icon.setAttribute('aria-expanded', 'true');
      ui.touch(); syncUI();
      if (kbd) (ui.el.seasons.querySelector('[tabindex="0"]') || ui.pop.querySelector('button')).focus();
    },
    close() {
      ui.open = false; ui.pop.classList.remove('open'); ui.icon.classList.remove('open'); ui.icon.setAttribute('aria-expanded', 'false');
      const a = document.activeElement;   // never leave focus inside the hidden glass
      if (a && ui.pop.contains(a)) { if (a.matches(':focus-visible')) ui.icon.focus(); else a.blur(); }
    },
  };

  const seasonOf = phase => Math.floor(phase * 4) % 4;
  // 1년 = 20분 at 1x: 80분 -> '1시간 20분', 2.5분 -> '2분 30초'
  function yearText(speed) {
    if (!(speed > 0)) return '시간 멈춤';
    const sec = Math.round(YEAR_MIN * 60 / speed), h = Math.floor(sec / 3600), m = Math.floor(sec / 60) % 60, s = sec % 60;
    return '1년 = ' + [h ? h + '시간' : '', m ? m + '분' : '', s ? s + '초' : ''].filter(Boolean).join(' ');
  }
  const speedText = v => (v === 0.25 ? '0.25' : v === 0.5 ? '0.5' : String(+v.toFixed(2))) + '배';
  const nearestStop = v => { let k = 0; for (let i = 1; i < SPEEDS.length; i++) if (Math.abs(Math.log2(SPEEDS[i] / v)) < Math.abs(Math.log2(SPEEDS[k] / v))) k = i; return k; };
  function setText(el, t) { if (ui.txt.get(el) !== t) { ui.txt.set(el, t); el.textContent = t; } }
  function setProp(el, k, v) { if (el.style.getPropertyValue(k) !== v) el.style.setProperty(k, v); }

  // a radiogroup of buttons: roving tabindex, arrows move and pick, Home / End. ← / → step through the DOM order
  // (wrapping); ↑ / ↓ are `vert(i, d)` (default: the same as ← / →)
  function radios(group, pick, vert) {
    const btns = [...group.querySelectorAll('[role=radio]')];
    group.addEventListener('click', e => { const b = e.target.closest('[role=radio]'); if (b) { pick(b.dataset.v); syncUI(); } });
    group.addEventListener('keydown', e => {
      const i = btns.indexOf(document.activeElement), n = btns.length;
      if (i < 0) return;
      const h = { ArrowRight: 1, ArrowLeft: -1 }[e.key], v = { ArrowDown: 1, ArrowUp: -1 }[e.key];
      let j = h !== undefined ? (i + h + n) % n : v !== undefined ? (vert ? vert(i, v) : (i + v + n) % n)
        : e.key === 'Home' ? 0 : e.key === 'End' ? n - 1 : -1;
      if (j < 0) return;
      e.preventDefault();
      if (j === i) return;   // the edge of the weather grid's column: stay, pick nothing
      btns[j].focus(); btns[j].click();
    });
    return btns;
  }
  function check(btns, v) {
    let idx = 0;
    btns.forEach((b, i) => {
      const on = b.dataset.v === v;
      if (on) idx = i;
      if (b.getAttribute('aria-checked') !== String(on)) { b.setAttribute('aria-checked', String(on)); b.tabIndex = on ? 0 : -1; }
    });
    return idx;
  }

  // the weather grid: 자동 (index 0) is one tall cell on the left, the eight states two rows of four beside it (dry
  // skies over precipitation); ↑ / ↓ move between the rows in a column, 자동 stays
  const wxVert = (i, d) => i === 0 ? 0 : i + 4 * d >= 1 && i + 4 * d <= 8 ? i + 4 * d : i;

  // the next / previous place (wrapping), from a key: the toast names it while the pop-over is closed
  function stepScene(d) {
    const ids = Object.keys(S.scenes), n = ids.length, id = ids[(ids.indexOf(S.sceneId) + d + n) % n];
    if (id === S.sceneId) return;
    S.setScene(id);
    if (ui.toast) {
      if (ui.hint) { ui.hintDone = true; ui.hint.classList.remove('on'); }
      setText(ui.toast, S.scenes[id].name); ui.toast.classList.add('on'); ui.toastT = S.anim.wall;
    }
  }
  // a key that may switch the place: ← / → alone, not repeated, the pop-over closed, focus not in a control that
  // owns the arrow keys (text, radios, sliders, switches; the radiogroups handle theirs and stop nothing)
  const ARROW_OWNER = 'input, textarea, select, [contenteditable]:not([contenteditable="false"]), [role=radio], [role=radiogroup], [role=slider], [role=switch], [role=listbox], [role=menu], [role=tablist]';
  function sceneKey(e) {
    if ((e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') || e.repeat || e.defaultPrevented || e.altKey || e.ctrlKey || e.metaKey || e.shiftKey) return;
    if (ui.open) return;
    const a = document.activeElement;
    if (a && a !== document.body && a.closest && a.closest(ARROW_OWNER)) return;
    e.preventDefault();
    stepScene(e.key === 'ArrowRight' ? 1 : -1);
  }

  S.bindUI = function () {
    const $ = id => document.getElementById(id);
    if (!S.cfg.ui) { for (const id of ['icon', 'pop', 'hint', 'toast']) $(id).remove(); document.querySelector('.sprite').remove(); return; }
    const clim = S.climate.api, wx = S.weather.api, ev = S.events.api;
    ui.icon = $('icon'); ui.pop = $('pop'); ui.hint = $('hint'); ui.toast = $('toast');
    // touch screens have no hover and no mouse button: the wind comes from a finger sweeping across the scene
    if (matchMedia('(hover: none) and (pointer: coarse)').matches) ui.hint.textContent = '화면을 쓸어 바람을 일으켜 보세요';
    const el = ui.el = { glyphs: [...ui.icon.querySelectorAll('.glyph')], season: $('stSeason'), wx: $('stWx'), prog: $('stProg'), year: ui.pop.querySelector('.yr'),
      seasons: $('seasons'), thumb: ui.pop.querySelector('.seg .thumb'), speed: $('speed'), speedV: $('speedv'), ticks: [...ui.pop.querySelectorAll('.ticks b')],
      amount: $('amount'), amountV: $('amountv'), place: $('stPlace'), places: $('places'), hzAuto: $('hzAuto'),
      hzBtns: [...ui.pop.querySelectorAll('#hazards button')] };
    // the cards are labelled with the registry's names (the markup's are the same, as a fallback)
    for (const b of el.places.querySelectorAll('[role=radio]')) { const sc = S.scenes[b.dataset.v]; if (sc && sc.name) setText(b.querySelector('span'), sc.name); }
    el.placeBtns = radios(el.places, v => S.setScene(v));
    el.seasonBtns = radios(el.seasons, v => clim.setSeason(v === 'auto' ? null : v));
    el.wxBtns = radios($('weathers'), v => { wx.setWeather(v); if (v === 'auto') wx.auto = true; }, wxVert);
    // hazards: momentary (a press starts one now; a running quake restarts, a running fire is renewed)
    for (const b of el.hzBtns) b.addEventListener('click', () => { ev.trigger(b.dataset.k); syncUI(); });
    el.hzAuto.addEventListener('click', () => { ev.hazardsAuto = !ev.hazardsAuto; syncUI(); });
    el.speed.addEventListener('input', () => { clim.speed = SPEEDS[+el.speed.value]; syncUI(); });
    el.amount.addEventListener('input', () => { wx.amount = +el.amount.value; });   // the setter re-syncs the chrome
    ui.season = seasonOf(S.climate.s.phase);                                          // the boot glyph shows without a fade
    el.glyphs[ui.season].classList.add('on');

    ui.icon.addEventListener('click', () => { if (ui.open) ui.close(); else ui.show(false); });
    ui.icon.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); if (ui.open) ui.close(); else ui.show(true); } });
    for (const ev of ['pointermove', 'pointerdown', 'input', 'click', 'keydown']) ui.pop.addEventListener(ev, ui.touch, { passive: true });
    ui.pop.addEventListener('pointerenter', () => { ui.hover = true; });
    ui.pop.addEventListener('pointerleave', () => { ui.hover = false; ui.touch(); });
    // outside press closes (bubble phase: input.js's canvas listener has already seen the pop-over open and so
    // started no drag)
    document.addEventListener('pointerdown', e => { if (ui.open && !ui.pop.contains(e.target) && !ui.icon.contains(e.target)) ui.close(); });
    addEventListener('keydown', sceneKey);
    addEventListener('keydown', e => {
      if (e.key !== 'Escape' || !ui.open) return;
      const inside = ui.pop.contains(document.activeElement);
      ui.close();
      if (inside) ui.icon.focus();
    });
  };

  // the controls follow the sim state (they also change through window.snowSim); cheap: writes only on change
  function syncUI() {
    if (!ui.pop) return;
    const el = ui.el, c = S.climate.s, w = S.weather.s, e = S.events.s;
    // place: the checked card; busy (a shimmer on it) from a switch until state().ready
    check(el.placeBtns, S.sceneId);
    ui.busy = ui.open && !!S.state && !S.state().ready;   // (closed: nothing to show; show() re-syncs)
    for (const b of el.placeBtns) b.classList.toggle('busy', ui.busy && b.dataset.v === S.sceneId);
    if (el.places.getAttribute('aria-busy') !== String(ui.busy)) el.places.setAttribute('aria-busy', String(ui.busy));
    // hazards: a button glows while its event runs (its age; the envelope itself starts at 0)
    const hz = S.events.snapshot().hazards, run = { quake: e.quakeT >= 0 || hz.quake > 0, wildfire: e.fireT >= 0 || hz.smoke > 0 };
    for (const b of el.hzBtns) b.classList.toggle('on', run[b.dataset.k]);
    if (el.hzAuto.getAttribute('aria-checked') !== String(hz.auto)) el.hzAuto.setAttribute('aria-checked', String(hz.auto));
    const sv = c.pinned === null ? 'auto' : SEASONS[seasonOf(c.pinned)];
    setProp(el.thumb, '--i', String(check(el.seasonBtns, sv)));
    check(el.wxBtns, w.manual || (w.auto ? 'auto' : w.cur));
    const k = nearestStop(c.speed || 0.25);
    if (+el.speed.value !== k) el.speed.value = k;
    setProp(el.speed, '--p', (k * 20) + '%');
    el.ticks.forEach((b, i) => b.classList.toggle('on', i === k));
    setText(el.speedV, yearText(c.speed));
    const vt = speedText(c.speed) + ', ' + yearText(c.speed);
    if (el.speed.getAttribute('aria-valuetext') !== vt) el.speed.setAttribute('aria-valuetext', vt);
    if (+el.amount.value !== w.amount) el.amount.value = w.amount;
    setProp(el.amount, '--p', (w.amount * 100).toFixed(1) + '%');
    setText(el.amountV, Math.round(w.amount * 100) + '%');
    status();
  }
  S.syncUI = syncUI;

  // status line: '알프스 계곡 · 늦가을 · 눈', or '… · 눈 → 맑음' with the hairline filling while a transition runs (the season
  // label is the sim's: 초봄 / 봄 / 늦봄 ... 늦겨울, see sim/climate.js); the dot
  // under the season segments shows how far the year (from 1 March) has come
  function status() {
    const el = ui.el, c = S.climate.s, w = S.weather.s, sc = S.scenes[S.sceneId];
    setText(el.place, sc ? sc.name : '');
    setText(el.season, S.climate.seasonKo(c.phase));      // the same label as snowSim.state().seasonKo
    const moving = !!w.next && w.next !== w.cur && w.progress < 1;
    setText(el.wx, moving ? WX_KO[w.cur] + ' → ' + WX_KO[w.next] : (WX_KO[w.cur] || ''));
    el.prog.classList.toggle('on', moving);
    setProp(el.prog, '--p', moving ? w.progress.toFixed(3) : '0');
    setProp(el.year, '--y', c.phase.toFixed(4));
  }

  S.updateUI = function () {
    if (!ui.icon || S.frameNo % 6) return;
    const wall = S.anim.wall, readyTime = S.R.readyTime;
    if (ui.open) syncUI();
    if (ui.busy) ui.touch();   // a switching place keeps the glass open; the 6 s start once it is shown
    if (ui.open && !ui.hover && !ui.pop.querySelector(':focus-visible') && wall - ui.last > 6) ui.close();
    if (ui.toastT >= 0 && wall - ui.toastT > TOAST_S) { ui.toast.classList.remove('on'); ui.toastT = -1; }
    ui.icon.classList.toggle('idle', !ui.open && wall - S.mouse.lastMove > 4);
    const si = seasonOf(S.climate.s.phase);   // the glyph cross-fades on a season change
    if (si !== ui.season) { ui.season = si; ui.el.glyphs.forEach((g, i) => g.classList.toggle('on', i === si)); }
    // the hint fades in once the scene is ready, out after ~5 s, then leaves the DOM; as it goes, the icon lifts
    // for two seconds (the one moment the corner glyph announces itself)
    if (readyTime >= 0) {
      const since = wall - readyTime;
      if (ui.hint) {
        if (since > 0.5 && since < 5.5 && !ui.hintDone) ui.hint.classList.add('on');
        else if (since >= 5.5) { ui.hint.classList.remove('on'); if (since > 7.2) { ui.hint.remove(); ui.hint = null; } }
      }
      ui.icon.classList.toggle('lift', since >= 5.5 && since < 7.5);
    }
  };
})(window.SNOW);

</script>
<script>/* js/main.js */
// =====================================================================================
//  main.js — the orchestrator (frozen): the animation clocks, one sim step in the contract order, fastForward /
//  advance, window.snowSim (state() + every sim module's api), the scene switch, the frame loop and boot. The only file
//  with load-time side effects: it boots at the end when a document exists (in node, for tests/sim.mjs, it only
//  registers).
//
//  Per live step (dt real s): input -> climate / weather / ground (dt x speed climate s, substeps <= 0.25 s) -> wind
//  (dt) -> events (dt: the hazards) -> the animation integrals (dt): dispA / dispB here, the derive modules' own (cloud;
//  fallI, tumI, rainI, veilI, veilR, gustR; house, events), the tree-sway phase here. Then per frame: S.deriveF() ->
//  S.render().
// =====================================================================================
(function (S) {
  'use strict';
  const { clamp, lerp, worldR } = S;
  const cfg = S.cfg;
  const FRAMES = cfg.frames;
  const R = S.R, perf = S.perf;
  const MODS = ['climate', 'weather', 'ground', 'wind', 'events'];
  // every derive module runs init / step whatever the scene (their clocks never depend on the scene history); frame():
  // surface, precip, atmos, the active scene's derive, events (render.js S.deriveF). The scenes' own derives come from
  // the registry (js/scenes/*.js load before this file), in registration order: today ['house']
  const DERIVE = ['surface', 'precip', 'atmos', ...new Set(Object.values(S.scenes).map(sc => sc.derive).filter(Boolean)), 'events'];
  const SUB = 0.25;      // the climate substep limit (climate s) and the fastForward / advance step (s)

  // =====================================================================================
  //                                   animation state
  // =====================================================================================
  // Physical time only (never scaled by the climate speed): particle motion, flutter, sway and the twinkle clocks.
  //   time    animation clock (s): shader clocks (uTime, uFlakeT, uTwinkleT), the natural wind, ?fixed frame indices
  //   wall    wall clock (s): UI timers, wake segment ages, bake swap / reveal timing; never fast-forwarded
  //   fps     smoothed frame rate (snowSim.state)
  //   dispA, dispB   integrals of S.wind.s.windA / windB (m): the only wind the particles see (lattice-wrapped)
  //   swayPh  tree-sway phase (rad, wrapped by 2 pi)
  // The derive modules add their own integrals in init() (derive/atmos.js: cloud; derive/precip.js: fallI, tumI,
  // rainI, veilI, veilR, gustR) and advance them in step(dt, ff).
  const anim = S.anim = { time: 0, wall: 0, fps: 60, dispA: [0, 0, 0], dispB: [0, 0, 0], swayPh: 0 };

  S.initSim = function (c) {
    anim.time = 0; anim.wall = 0; anim.dispA = [0, 0, 0]; anim.dispB = [0, 0, 0]; anim.swayPh = 0;
    for (const m of MODS) S[m].init(c);
    for (const k of DERIVE) S.derive[k].init();
  };

  // One sim step of dt real seconds. ff: inside fastForward / advance: no input and no wall clock (the wind steer only
  // decays), the periodic phases (sway, veil / rain-veil scrolls) hold; climate, weather and ground run exactly the
  // live steps, so ?t and snowSim.advance are deterministic
  function simStep(dt, ff) {
    if (!ff) { anim.wall += dt; anim.time += dt; S.stepInput(dt); }
    const dtc = dt * S.climate.s.speed, n = Math.max(1, Math.ceil(dtc / SUB - 1e-9)), h = dtc / n;
    for (let i = 0; i < n; i++) { S.climate.step(h, ff); S.weather.step(h, ff); S.ground.step(h, ff); }
    S.wind.step(dt, ff);
    S.events.step(dt, ff);
    const wA = S.wind.s.windA, wB = S.wind.s.windB;
    for (let i = 0; i < 3; i++) { anim.dispA[i] += wA[i] * dt; anim.dispB[i] += wB[i] * dt; }
    for (const k of DERIVE) S.derive[k].step(dt, ff);
    if (!ff) {
      const wl = wA[0] * worldR[0] + wA[2] * worldR[2];     // (the world's frame, core.js: scene-independent)
      anim.swayPh = (anim.swayPh + (1.3 + 0.08 * Math.abs(wl)) * dt) % (2 * Math.PI);
    } else anim.time += dt;
  }
  // run T real seconds of sim with the fastForward step (deterministic: ?t at boot, snowSim.advance in the console)
  function advance(T) { for (let t = 0; t < T; t += SUB) simStep(Math.min(SUB, T - t), true); }
  S.simStep = simStep; S.advance = advance;

  // snowSim.state(): the Phase-1 fields first, then every module's snapshot (keys never override earlier ones). ready:
  // the active scene is fully shown (false from a scene switch until its bake is swapped in; a resize rebake behind a
  // live scene stays ready)
  S.state = function () {
    const wx = S.weather.s, w = S.wind.s;
    const st = { coverage: +S.ground.s.cover.toFixed(4), storm: +wx.curtain.toFixed(4), sky: +wx.ch.overcast.toFixed(4), tail: +wx.tail.toFixed(4),
      windX: +((w.windA[0] + w.windB[0]) / 2).toFixed(3), windZ: +((w.windA[2] + w.windB[2]) / 2).toFixed(3),
      flakeCount: S.precipCount.snow, fps: +anim.fps.toFixed(1), ready: R.readyTime >= 0 && !!R.gbCur, amount: wx.amount, auto: wx.auto,
      quality: perf.rs, perfLevel: perf.level, frameMs: +perf.avgMs.toFixed(1), buildMs: Math.round(R.buildMs), compileMs: Math.round(S.compileMs), res: [R.W, R.H], renderRes: [R.Ws, R.Hs] };
    for (const m of MODS) { const snap = S[m].snapshot(); for (const k of Object.keys(snap)) if (!(k in st)) st[k] = snap[k]; }
    st.rainCount = S.precipCount.rain;
    st.g3 = R.g3Fmt;
    st.scene = S.sceneId;
    return st;
  };
  // window.snowSim: state, advance, setScene / scene, and the api of every sim module (accessors kept): climate
  // (setSeason, speed), weather (setWeather, setStorm, triggerBlizzard, amount, auto), ground (setCoverage, reset,
  // resetSnow), wind, events (trigger, hazardsAuto)
  S.makeApi = function () {
    const api = { state: S.state, advance(sec) { advance(Math.max(0, +sec || 0)); return S.state(); },
      setScene(id) { return S.setScene(id); }, get scene() { return S.sceneId; } };
    for (const m of MODS) Object.defineProperties(api, Object.getOwnPropertyDescriptors(S[m].api));
    return api;
  };

  // Switch the scene (valley | house; snowSim.setScene, the UI): the world goes on (climate, weather, ground, wind,
  // hazards, every clock), only the place changes: the sun and the camera are the new scene's, its programs are built
  // once (then cached), the old G-buffer is dropped and the new one revealed like a first load, the sky history and
  // the precipitation boxes restart (gl.js S.switchSceneGL). Unknown ids and the active scene are a no-op. Returns
  // the active scene id
  S.setScene = function (id) {
    id = String(id);
    if (!S.scenes[id] || id === S.sceneId) return S.sceneId;
    S.useScene(id);
    S.switchSceneGL();
    if (S.syncUI) S.syncUI();
    return S.sceneId;
  };

  // =====================================================================================
  //                                   frame loop + boot
  // =====================================================================================
  let lastNow = 0;
  S.frameNo = 0;
  // one frame: real dt (clamped) -> stripe budget -> fixed step under ?fixed / ?frames -> sim step -> S.F -> render ->
  // quality controller -> chrome
  function frame() {
    if (!FRAMES || S.frameNo + 1 < FRAMES) requestAnimationFrame(frame);
    const now = performance.now() / 1000;
    let dt = clamp(now - lastNow, 0, 0.1); lastNow = now;   // clamp tab switches / stalls
    if (R.bakeFrame) { S.adaptStripe(dt); R.bakeFrame = false; }   // dt is the cost of the previous (stripe) frame
    if (cfg.fixed || FRAMES) dt = 1 / 60;
    if (dt > 0) { anim.fps = lerp(anim.fps, 1 / Math.max(dt, 1e-3), 0.05); }
    simStep(dt, false);
    if (!S.ctxLost) {
      S.deriveF();
      S.render();
      if (!cfg.fixed && R.readyTime >= 0 && anim.wall - R.readyTime > 3 && !R.gbNext) S.controller(dt);
      S.prewarmTick();          // the other scenes' programs, in the background once this one is shown (gl.js)
    }
    S.updateUI();
    S.checkSize();            // twice a second: a stale canvas size (a missed resize event on a phone) schedules a resize
    S.frameNo++;
    if (FRAMES && S.frameNo >= FRAMES) window.__done = true;   // test hook: the loop has stopped
  }

  function boot() {
    S.initContext();          // fatal (throws) without WebGL2
    S.bindGLEvents();
    S.useScene(S.scenes[cfg.scene] ? cfg.scene : 'valley');        // ?scene= (the valley by default)
    { const [w, h] = S.targetSize(); S.frameCamera(w / h); }       // this viewport's framing before the sim starts (its wind is camera-relative)
    S.initSim(cfg);
    S.bindInput();
    S.bindUI();
    S.syncUI();
    window.snowSim = S.makeApi();
    lastNow = performance.now() / 1000;
    advance(cfg.t0); anim.time = cfg.t0;                           // ?t: the same steps as snowSim.advance
    if (cfg.cover !== null) S.ground.api.setCoverage(cfg.cover);   // ?cover applies after the fast-forward
    if (cfg.event) S.events.api.trigger(cfg.event);                // ?event= starts now (after the fast-forward)
    try { S.initGL(); } catch (e) { S.fatal('초기화 실패: ' + e.message); }
    requestAnimationFrame(frame);
  }
  if (typeof document !== 'undefined') boot();
})(window.SNOW);

</script>

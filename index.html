  // then fewer flakes. Per 90-frame window it compares the mean dt with the window's 10th-percentile dt (the display's
  // own frame period when the GPU keeps up): a slow mean that is also jittery above that floor is a GPU that cannot
  // keep up. A rung down is followed by two windows of cooldown; a run of windows at the display's cadence steps back up
  // (the run required doubles after each step down), so a transient blizzard cannot pin the calm scene low.
  // Two guards for phones (vsync-locked 60 Hz displays):
  //  - The ladder never climbs back into a rung it had to leave after climbing into it: a step down out of a rung that
  //    was reached by a step up makes the rung below the ceiling (minLevel) until the next resize / context restore.
  //    A step up is also judged on the very next window (a cadence clearly worse than before steps straight back), so
  //    a failed probe costs one window. Without this a GPU on the edge flapped between two rungs every ~2 minutes for
  //    ever; now every rung is re-entered at most once and the ladder settles.
  //  - A slow but steady cadence (<= ~38 fps, no jitter) is either a 30 Hz display / a low-power or throttled frame
  //    rate (nothing to gain) or a GPU that misses every vsync (a vsync-locked phone shows a steady 30 fps, which the
  //    jitter test alone takes for a 30 Hz display). One probe at the cheapest rung tells them apart: if the cadence
  //    improves the ladder stays there and climbs back rung by rung (each step judged); if not it returns and never
  //    probes again (slowOK) until the next resize.
  const PERF_RS = [1, 0.87, 0.74, 0.6];
  const PERF_WIN = 90;
  const TOP = 5;
  const perf = S.perf = { level: 0, rs: 1, skySteps: 36, flakeMul: 1, n: 0, cool: 0, good: 0, goodNeed: 10, skip: 0,
                          frameMs: 1000 / 60, avgMs: 0, dts: new Float32Array(PERF_WIN),
                          minLevel: 0, upMs: 0, cameUp: false, probeFrom: -1, probeMs: 0, probeMin: 0, slowOK: false };
  function setLevel(level) {
    if (level > perf.level && perf.cameUp) perf.minLevel = Math.max(perf.minLevel, perf.level + 1);   // left a rung it had climbed into
    perf.cameUp = level < perf.level;
    perf.level = level;
    perf.skySteps = level >= 4 ? 22 : 36;
    perf.flakeMul = level >= 5 ? 0.7 : 1;
    const rs = PERF_RS[Math.min(level, 3)];
    if (rs !== perf.rs) { perf.rs = rs; S.allocScaled(); }
  }
  S.resetPerf = function () {   // the GPU budget changed (new canvas size / restored context): start the ladder over
    perf.level = 0; perf.rs = 1; perf.skySteps = 36; perf.flakeMul = 1;
    perf.n = 0; perf.cool = 0; perf.good = 0; perf.skip = 2;
    perf.minLevel = 0; perf.upMs = 0; perf.cameUp = false; perf.probeFrom = -1; perf.slowOK = false;
  };
  // Stripe budget, from the wall dt of the frame that drew the previous stripe (the browser queues GPU work a frame or
  // two deep, so the feedback lags that much; growth is slow enough not to overshoot far). The stripe grows while its
  // frame stays inside the limit and shrinks hard when it overruns (then grows gently). First load, with nothing else
  // to show: frames up to 34 ms (a 30 Hz display's own frames pass; the reveal takes ~1-2 s on an M-series GPU).
  // Rebake behind a live scene: the frame must stay close to the display's own frame period (perf.frameMs)
  S.adaptStripe = function (dt) {
    const R = S.R;
    const base = perf.frameMs / 1000;
    const limit = R.gbCur ? Math.max(1.35 * base, base + 0.006) : 0.034;
    if (dt > limit) { R.gbRows = Math.max(1, Math.floor(R.gbRows * 0.6)); R.gbMiss = true; }
    else R.gbRows = Math.min(Math.ceil(R.gbRows * (R.gbMiss ? 1.03 : 1.15)), Math.ceil(R.H / 6));
  };
  // quality controller (see perf), once per PERF_WIN frames of a ready, bake-free scene; the 2 frames after a bake are
  // skipped (they still carry the last stripe). perf.frameMs, the display's frame period estimate, also sets the
  // rebake stripe budget (adaptStripe)
  S.controller = function (dt) {
    if (perf.skip > 0) { perf.skip--; return; }
    perf.dts[perf.n++] = dt;
    if (perf.n < PERF_WIN) return;
    perf.n = 0;
    let sum = 0; for (let i = 0; i < PERF_WIN; i++) sum += perf.dts[i];
    perf.dts.sort();                                           // Float32Array: numeric
    const floor = Math.max(4, perf.dts[PERF_WIN / 10] * 1000), avg = sum / PERF_WIN * 1000;
    perf.frameMs = floor; perf.avgMs = avg;
    if (perf.probeFrom >= 0) {               // the window after a steady-slow probe at the cheapest rung
      const from = perf.probeFrom; perf.probeFrom = -1; perf.good = 0;
      if (avg >= 0.8 * perf.probeMs) { setLevel(from); perf.minLevel = perf.probeMin; perf.cameUp = false; perf.slowOK = true; perf.skip = 2; }   // not the GPU: back as it was, no more probes
      return;                                // else the GPU was the limit: stay, climb back with the usual good runs
    }
    if (perf.upMs > 0) {                     // the window after a step up
      const was = perf.upMs; perf.upMs = 0;
      if (avg > 1.15 * was && avg > 18) { setLevel(perf.level + 1); perf.skip = 2; perf.good = 0; return; }
    }
    if (perf.cool > 0) { perf.cool--; return; }
    if (avg > 21.5 && avg > 1.2 * floor) {
      perf.good = 0;
      if (perf.level < TOP) { setLevel(perf.level + 1); perf.cool = 2; perf.goodNeed = Math.min(80, perf.goodNeed * 2); }
    } else if (avg > 26 && !perf.slowOK && perf.level < TOP) {
      perf.probeFrom = perf.level; perf.probeMs = avg; perf.probeMin = perf.minLevel; perf.good = 0; setLevel(TOP); perf.skip = 2;
    } else if (avg <= 1.02 * floor && perf.level > perf.minLevel) {
      if (++perf.good >= perf.goodNeed) { perf.upMs = avg; setLevel(perf.level - 1); perf.good = 0; perf.skip = 2; }
    } else perf.good = 0;
  };
})(window.SNOW);

</script>
<script>/* js/sim/climate.js */
// =====================================================================================
//  sim/climate.js (stage-1 owner: lane A) — the year clock. Pure JS: no GL, no DOM (loads in node, tests/sim.mjs).
//  YEAR = 1200 climate-s at speed 1 (a season every 5 min). The phase starts from the real date (1 Mar = 0; whole
//  calendar days, so ?seed&t reproduce exactly within a day) unless ?season= / ?yp= is given. A season pick (setSeason) never jumps: the phase eases along the shortest arc to its
//  target over PIN_EASE climate-s, then holds; releasing it (null) lets the year flow on from where it is.
//
//  S.climate = { s, init(cfg), step(dtc, ff), snapshot(), api, seasonKo(phase) }     (main.js steps it first, in
//  climate seconds; seasonKo is the Korean season label of state().seasonKo and the pop-over's status line)
//    s.t        climate seconds since boot (advances by real dt x speed)
//    s.phase    year phase in [0, 1): 0 = start of spring (~1 Mar), .25 summer, .5 autumn, .75 winter
//    s.pinned   null (the year runs), or the phase the season is held at (?season= / setSeason)
//    s.speed    climate seconds per real second (0..8; the UI offers 0.25, 0.5, 1, 2, 4, 8; 0 = paused, api only)
//    s.seasonW  [spring, summer, autumn, winter]: smooth cyclic weights centred mid-season, summing to 1
//    s.tSeason  the seasonal meadow temperature without the weather (deg C): 4 + 10 sin(2 pi (phase - 0.125))
//  ff (fastForward / advance) is passed through; the climate does not depend on it.
//  Debug hook ?yp= pins s.phase after every step (and at init).
// =====================================================================================
(function (S) {
  'use strict';
  const YEAR = 1200;           // climate-s per year at speed 1
  const PIN_EASE = 60;         // climate-s: a season pick eases to its phase over one weather-transition length
  const NAMES = ['spring', 'summer', 'autumn', 'winter'];
  const KO = ['봄', '여름', '가을', '겨울'];
  const s = { t: 0, phase: 0, pinned: null, speed: 1, seasonW: [0, 0, 0, 1], tSeason: 0 };
  let yp = null;
  // the pin ease: phase(t) = from + arc * smooth(t0, t0 + PIN_EASE, t), arc the signed shortest way to s.pinned
  const ease = { from: 0, arc: 0, t0: -1e9 };
  const wrap = x => x - Math.floor(x);
  // a season name, or a phase 0..1 (string or number) -> phase; null for none / 'auto'
  function phaseOf(v) {
    if (v === null || v === undefined || v === '' || v === 'auto') return null;
    const i = NAMES.indexOf(String(v));
    if (i >= 0) return (i + 0.5) / 4;
    const n = parseFloat(v);
    return isFinite(n) ? wrap(n) : null;
  }
  // year phase of a calendar date (0 on 1 March), by whole calendar days: the start phase must not depend on the time
  // of day, or the same ?seed&t would give a different state from one run to the next (determinism)
  function datePhase(d) {
    const y = d.getFullYear();
    let days = (Date.UTC(y, d.getMonth(), d.getDate()) - Date.UTC(y, 2, 1)) / 864e5;
    if (days < 0) days += 365.25;
    return (days / 365.25) % 1;
  }
  function derive() {
    // smoothstep partition of unity: neighbouring seasons cross-fade over a quarter year, peaking mid-season
    for (let i = 0; i < 4; i++) {
      let d = Math.abs(s.phase - (i + 0.5) / 4); d = Math.min(d, 1 - d);
      const a = Math.max(0, 1 - d / 0.25);
      s.seasonW[i] = a * a * (3 - 2 * a);
    }
    s.tSeason = 4 + 10 * Math.sin(2 * Math.PI * (s.phase - 0.125));
  }
  const seasonIdx = (ph = s.phase) => Math.floor(ph * 4) % 4;     // = argmax of seasonW (the weights peak mid-quarter)
  // Korean name with an early / mid / late prefix (초봄, 한여름, 늦가을, ...): the first 30% of a season is early, the
  // last 45% late (Korean usage: late October is already 늦가을). The one season label: state().seasonKo and the
  // pop-over's status line (ui.js, through S.climate.seasonKo) both use it
  function seasonKo(ph = s.phase) {
    const i = seasonIdx(ph), f = ph * 4 - Math.floor(ph * 4);
    if (f < 0.3) return '초' + KO[i];
    if (f >= 0.55) return '늦' + KO[i];
    return (i === 1 || i === 3 ? '한' : '') + KO[i];
  }

  S.climate = {
    s,
    seasonKo,                  // (phase = s.phase) -> the Korean season label
    init(cfg) {
      yp = cfg.yp;
      s.t = 0; s.speed = S.clamp(+cfg.speed || 0, 0, 8);
      s.pinned = phaseOf(cfg.season);                       // a boot pin applies at once (no ease)
      ease.t0 = -1e9; ease.arc = 0;
      s.phase = yp !== null ? yp : s.pinned !== null ? s.pinned : datePhase(cfg.date);
      ease.from = s.phase;
      derive();
    },
    step(dtc) {
      s.t += dtc;
      if (s.pinned !== null) s.phase = wrap(ease.from + ease.arc * S.smooth(ease.t0, ease.t0 + PIN_EASE, s.t));
      else s.phase = wrap(s.phase + dtc / YEAR);
      if (yp !== null) s.phase = yp;
      derive();
    },
    snapshot: () => ({ season: NAMES[seasonIdx()], seasonKo: seasonKo(), phase: +s.phase.toFixed(4), speed: s.speed, seasonPinned: s.pinned !== null }),
    api: {
      // name | 0..1 | null ('auto' = null: the year runs on from where it is). A name eases to its mid-season phase,
      // a number to that phase. Returns the climate snapshot
      setSeason(v) {
        const p = phaseOf(v);
        if (p === null) s.pinned = null;
        else {
          s.pinned = p;
          ease.from = s.phase; ease.t0 = s.t;
          ease.arc = wrap(p - s.phase + 0.5) - 0.5;        // signed shortest arc in (-0.5, 0.5]
        }
        return S.climate.snapshot();
      },
      get speed() { return s.speed; },
      set speed(v) { s.speed = S.clamp(+v || 0, 0, 8); },
    },
  };
})(window.SNOW);

</script>
<script>/* js/sim/weather.js */
// =====================================================================================
//  sim/weather.js (stage-1 owner: lane A) — the weather state and its channels. Pure JS: no GL, no DOM.
//  Seven states, each a target over the channels (PRESET below). Every change is a staged transition of D = 60
//  climate-s that starts from the CURRENT channel values (so a pick in mid-transition never jumps): clouds lead,
//  precipitation lags in and leads out, the gale sits between, fog has its own window, the sky clears last.
//  A season-dependent Markov scheduler picks the next state; a manual pick transitions and then holds.
//
//  S.weather = { s, init(cfg), step(dtc, ff), snapshot(), api }     (stepped after the climate, in climate seconds)
//    s.t         the weather clock (S.climate.s.t)
//    s.cur, s.next, s.progress, s.manual, s.nextAt
//                cur: the state the weather is in (while a transition runs, the one it is leaving); next: the
//                transition target (null when settled); progress 0..1 (1 settled); manual: the held pick (null =
//                automatic); nextAt: climate time of the next scheduled change (0 = none: manual or auto off)
//    s.auto      the scheduler runs (Phase-1 "automatic storms"; false holds the current weather)
//    s.amount    the user precipitation amount 0..1; S.amountMul() = 0.2 + 1.6 amount scales flake counts and snowfall
//    s.ch        the channels, 0..1 unless noted:
//                cloudCov  weather-map cloud coverage (= uCloudCov)        cumulus   near cumulus and their shadows
//                overcast  the stratus deck / storm light                  cirrus    cirrus amount (1 = Phase-1 veil)
//                fog       valley fog                                      precip    precipitation rate
//                gale      gale strength (the wind blends into the gale by smooth(gale))
//                heavy     heavy-snowfall / blizzard intensity             tempOff   temperature offset (deg C)
//                snowFrac  snow share of the precipitation: follows 1 - smooth(1, 3, temp) (snow below 1 C, rain above
//                          3 C) at most 1/SF_TIME per climate-s, so a fast temperature swing (a season pick, a pick
//                          across the freezing line) turns snow into rain through ~15 s of sleet, never at once
//    s.temp      meadow temperature, deg C (S.climate.s.tSeason + ch.tempOff)
//    s.curtain   0..1 the snow curtain = heavy x snowFrac (Phase 1 sim.storm): flake turbulence, extinction, veil
//    s.white     0..1 the whiteout = curtain x a slow gust beat (physical time)
//    s.tail      0..1 residual thinning snow after the curtain opens: follows the curtain up (~4 s), decays ~25 s
//    s.heading   gale direction offset (rad): each event draws one, eased over the gale window of its transition
//  Randomness is counter based, S.rand(seed, eventIdx, k), so UI actions never shift the seeded sequence.
//  ff is ignored: fastForward runs exactly the live steps. Debug hook ?wx= overrides s.ch after every step
//  (temp, snowFrac, curtain and white follow it; an explicit snowFrac in ?wx wins over the derived one).
// =====================================================================================
(function (S) {
  'use strict';
  const { lerp, smooth, clamp } = S;
  const D = 60;                                  // climate-s: one weather transition
  const DWELL = [70, 180];                       // climate-s between scheduled transition starts (uniform)
  const SF_TIME = 15;                            // climate-s: the fastest full snow <-> rain conversion
  const FIRST_COLD = 2.5;                        // deg C: the opening snowfall is at least this far below freezing
  const STATES = ['clear', 'cumulus', 'overcast', 'fog', 'rain', 'snow', 'blizzard'];
  const KEYS = ['cloudCov', 'cumulus', 'overcast', 'cirrus', 'fog', 'precip', 'gale', 'heavy', 'tempOff'];
  // canonical presets (the contract lanes C/D/E tune against via ?wx=); order = KEYS
  const PRESET = {
    clear:    [0.15, 0,   0,    0.35, 0,    0,    0.05, 0,  1],
    cumulus:  [0.55, 1,   0.1,  0.2,  0,    0,    0.2,  0,  0],
    overcast: [0.95, 0.2, 0.75, 0,    0.1,  0,    0.3,  0, -1],
    fog:      [0.75, 0,   0.5,  0,    1,    0,    0,    0, -1],
    rain:     [0.97, 0,   0.85, 0,    0.2,  0.65, 0.4,  0,  1],
    snow:     [0.75, 0.2, 0.35, 0.4,  0.05, 0.75, 0.15, 0, -3],    // Phase-1 sunlit snowfall: broken sun, not grey
    blizzard: [0.98, 0,   1,    0,    0.2,  1,    1,    1, -6],
  };
  const IS_PRECIP = { rain: 1, snow: 1, blizzard: 1 };
  // ---- the Markov scheduler: P(i -> j) ∝ ROW[season][j] · LINK[i][j] · feasible(j), rows blended by seasonW.
  // ROW: how much each season favours a state; LINK: the structural affinity of a move (0 = forbidden: no self
  // transitions, precipitation only out of overcast / cumulus / fog, blizzard only out of snow / overcast).
  // Columns in STATES order: clear cumulus overcast fog rain snow blizzard
  const ROW = [
    [1.0, 1.1, 0.7, 0.5, 1.5, 0.35, 0.2],  // spring: mixed, showery, late snow early on
    [1.5, 1.7, 0.4, 0.2, 0.75, 0,  0],     // summer: sunny and cumulus days, some showers
    [0.8, 0.4, 1.0, 1.6, 1.1, 0.6, 0.2],   // autumn: fog and rain, first snow late
    [0.55, 0.2, 1.0, 0.35, 0.3, 2.8, 1.1], // winter: snowy (sunny spells between the snowfalls)
  ];
  // dwell bias per season and state (-1 short .. +1 long): the dwell is 70 + 110 u^g with g = 2^(-1.5 bias), so the
  // mean is 125 s neutral, ~150 s at +1, ~100 s at -1 (always inside 70-180): winter snow lingers and the grey
  // gateways pass quickly, summer showers are brief
  const DWELL_BIAS = [
    [0, 0, -0.3, -0.3, 0.2, 0.2, -0.3],      // spring
    [0.5, 0.5, -0.5, -0.5, -0.5, 0, 0],      // summer
    [0, -0.3, 0, 0.5, 0.3, 0.3, -0.3],       // autumn
    [0, -0.6, -0.6, -0.6, 0, 1, 0],          // winter
  ];
  const LINK = {
    clear:    [0,   1.4, 1.0, 0.8, 0,   0,   0],
    cumulus:  [1.2, 0,   1.0, 0.4, 1.4, 0.6, 0],
    overcast: [0.7, 0.7, 0,   0.8, 2.0, 2.0, 1.0],
    fog:      [1.5, 0.8, 1.0, 0,   0.6, 0.6, 0],
    rain:     [0.8, 1.0, 1.5, 0.9, 0,   0,   0],
    snow:     [1.0, 0.5, 1.4, 0.5, 0,   0,   1.6],
    blizzard: [0.6, 0,   1.0, 0.2, 0,   2.0, 0],
  };
  // ---- transition windows in progress units (0..1 of D), by channel and direction (up = the target is higher)
  function windowOf(k, up, intoPrecip, outOfPrecip) {
    switch (k) {
      case 'cloudCov': case 'overcast': case 'cumulus': return up ? [0, 0.6] : [0.4, 1];       // clouds lead, sky clears last
      case 'cirrus': return up ? [0, 0.5] : [0.25, 0.85];
      case 'fog': return up ? [0.15, 0.8] : [0, 0.6];                                            // fog forms slowly, lifts early
      case 'precip': return up ? [0.4, 1] : [0, 0.55];                                           // lags in, leads out
      case 'heavy': return up ? [0.5, 1] : [0, 0.45];
      case 'gale': return up ? [0.25, 0.8] : [0.15, 0.75];                                       // between clouds and precip
      default: return intoPrecip ? [0, 0.45] : outOfPrecip ? [0.5, 1] : [0.1, 0.9];             // tempOff: precip type set first
    }
  }

  const ch = { cloudCov: 0.6, cumulus: 0, overcast: 0, cirrus: 1, fog: 0, precip: 1, gale: 0, heavy: 0, tempOff: 0, snowFrac: 1 };
  const s = { t: 0, cur: 'snow', next: null, progress: 1, manual: null, nextAt: 0, auto: true, amount: 0.5,
              ch, temp: 0, curtain: 0, white: 0, tail: 0, heading: 0,
              forced: null };   // the legacy forced storm level (?storm=1 / setStorm), null = none
  // the running transition: from-channel values, target state, start time, per-channel windows, heading ease
  // first: the opening snowfall (cold snap, see targetOf), cleared by the first transition
  const tr = { from: {}, to: 'snow', t0: -1e9, win: {}, h0: 0, h1: 0, first: false };
  let wx = null, seed = 1, eventIdx = 0, sf2 = 1;     // sf2: snowFrac before any ?wx override (the rate-limited state)
  S.amountMul = () => 0.2 + 1.6 * s.amount;

  const presetOf = (name, k) => PRESET[name][KEYS.indexOf(k)];
  // the target of a channel. tempOff of a MANUAL (or forced) precipitation pick is pushed so the pick shows what was
  // asked for in any season (a cold snap for snow in summer, a thaw for rain in winter); it follows tSeason live.
  // The opening snowfall (the first weather, until the first transition) is a cold snap too: at least FIRST_COLD
  // below freezing, so the first snow of late autumn falls as crisp, dry Phase-1 crystals (not the wet-snow band
  // around 0 deg C) and settles at once
  function targetOf(name, k) {
    const v = presetOf(name, k);
    if (k === 'tempOff' && tr.first && name === 'snow' && s.manual === null && s.forced === null) return Math.min(v, -FIRST_COLD - S.climate.s.tSeason);
    if (k !== 'tempOff' || (s.manual === null && s.forced === null)) return v;
    const tS = S.climate.s.tSeason;
    if (name === 'snow') return Math.min(v, -0.5 - tS);
    if (name === 'blizzard') return Math.min(v, -2 - tS);
    if (name === 'rain') return Math.max(v, 3.5 - tS);
    return v;
  }
  // temperature feasibility of an automatic draw (a conflicting draw is redrawn = dropped from the row): rain that
  // would fall as snow (T < 1 C), snow that would fall as rain (T > 3 C), blizzard unless it is freezing (T < 0)
  function feasible(name) {
    const tS = S.climate.s.tSeason, T = tS + presetOf(name, 'tempOff');
    if (name === 'rain') return T >= 1;
    if (name === 'snow') return T <= 3;
    if (name === 'blizzard') return s.temp < 0 && T < 1;
    return true;
  }
  // next state from `from` (null: the first weather, no link mask) with the uniform u
  function draw(from, u) {
    const w = S.climate.s.seasonW, p = new Array(7);
    let sum = 0;
    for (let j = 0; j < 7; j++) {
      const row = w[0] * ROW[0][j] + w[1] * ROW[1][j] + w[2] * ROW[2][j] + w[3] * ROW[3][j];
      p[j] = row * (from ? LINK[from][j] : 1) * (feasible(STATES[j]) ? 1 : 0);
      sum += p[j];
    }
    if (sum <= 0) return from === 'clear' ? 'cumulus' : 'clear';     // never happens with the tables above
    let acc = 0;
    for (let j = 0; j < 7; j++) { acc += p[j] / sum; if (u < acc) return STATES[j]; }
    for (let j = 6; j >= 0; j--) if (p[j] > 0) return STATES[j];
  }
  function dwell(i, k, name) {
    const w = S.climate.s.seasonW, j = STATES.indexOf(name);
    const bias = w[0] * DWELL_BIAS[0][j] + w[1] * DWELL_BIAS[1][j] + w[2] * DWELL_BIAS[2][j] + w[3] * DWELL_BIAS[3][j];
    return DWELL[0] + (DWELL[1] - DWELL[0]) * Math.pow(S.rand(seed, i, k), Math.pow(2, -1.5 * bias));
  }
  // the state the weather is heading to (the scheduler's "current" state)
  const target = () => tr.to;

  // start a transition to `name` from the current channel values (instant: settle at once, test / legacy hooks)
  function begin(name, instant) {
    tr.first = false;
    const intoP = !!IS_PRECIP[name], outP = !IS_PRECIP[name] && (IS_PRECIP[tr.to] || ch.precip > 0.01);
    s.cur = s.progress < 0.5 && s.next ? s.cur : tr.to;
    tr.to = name; tr.t0 = instant ? s.t - D : s.t;
    for (const k of KEYS) {
      tr.from[k] = ch[k];
      tr.win[k] = windowOf(k, targetOf(name, k) > ch[k], intoP, outP);
    }
    tr.h0 = s.heading;
    // the new event's gale heading, +-35 deg about the prevailing gale line, eased the short way round
    const h = (S.rand(seed, eventIdx, 2) - 0.5) * 1.2;
    tr.h1 = tr.h0 + Math.atan2(Math.sin(h - tr.h0), Math.cos(h - tr.h0));
    s.next = name; s.progress = 0;
    evalChannels(0, instant);
  }
  // one scheduled event: draw the next state from the current one, and the time of the event after it
  function schedule() {
    const from = target();

      temp: +s.temp.toFixed(2), snowFrac: +ch.snowFrac.toFixed(4), precip: +ch.precip.toFixed(4), white: +s.white.toFixed(4) }),

<script>/* js/sim/ground.js */
// =====================================================================================
//  sim/ground.js (stage-1 owner: lane A) — the ground state. Pure JS: no GL, no DOM.
//  The meadow snowpack (cover: snowfall minus melt), the ground wetness, and the altitude snowline.
//
//  S.ground = { s, init(cfg), step(dtc, ff), snapshot(), api }     (stepped after the weather, in climate seconds)
//    s.cover     0..1 snow cover level, compared against the baked snowT (Phase-1 threshold semantics)

//  late autumn. A boot ?season= pin starts there at once; a season picked from the UI (setSeason with a phase or a

  // up to ~-180 m (sun exposure) and +-130 m (noise), so the meadow (-100..40 m) is untouched only from about -450 m

  // slopes above stay white), summer leaves the high couloirs, the first dusting reaches the meadow in late autumn

      // (the cover alone decides there), except in a thaw (no snow falling and the meadow above 1.5 C): then it climbs
      // toward the 4 C isotherm and the meadow melts out from below, sunny ground first (stage 2b)
      const meadow = g.cover > 0.005, thaw = T > 1.5 && ch.precip * ch.snowFrac < 0.02;

    },

<script>/* js/sim/wind.js */
// =====================================================================================
//  sim/wind.js (stage-1 owner: lane A) — the wind. Pure JS: no GL, no DOM (the pointer arrives through S.mouse).
//  natural: closed form in the animation clock and the seed. A breeze whose direction veers slowly about the
//  prevailing line (seeded 1D value noise S.vn1, ~+-50 deg over minutes) and whose speed follows the season and
//  the Phase-1 gust beat, blended into the gale by smooth(ch.gale) along the event's gale line (the Phase-1 line,
//  rotated by the weather heading and partly by the veer).
//  steer: ONLY while the left button is held (S.mouse.drag), the drag velocity becomes a horizontal wind: screen
//  right -> camR, screen up -> away from the camera (camF on the ground), 10 m/s per viewport per second, capped
//  at 14 m/s, fast attack (0.12 s; easing 1.5 s when the drag slows). After release it decays with a 15 s
//  half-life. Plain pointer motion (no button) never changes the wind.

//
//  S.wind = { s, init(cfg), step(dt, ff), snapshot(), api }     (stepped in PHYSICAL seconds, after the ground)
//    s.windA, s.windB   [x, y, z] m/s, the slow and the quick wind response. Flakes mix them affinely; main.js
//                       integrates them into S.anim.dispA / dispB (the only positional wind the particles see)
//    s.target           the wind target of this step (natural + steer)
//    s.natural          [x, 0, z] the natural part of the target (breeze / gale, no steer): what clouds follow
//    s.steer            [x, 0, z] the user's drag wind (m/s)
//    s.bias, s.gust     the steer along camR and along the ground-projected camF (m/s)
//    s.baseWind         the calm base wind: [0.9, 0, 0.35] or ?wind=X,Z (a ?wind base does not veer)
//  Reads S.anim.time, S.climate.s.seasonW, S.weather.s.ch.gale / s.heading and S.mouse (drag, vxn, vyn).

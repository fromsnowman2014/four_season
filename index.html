<script>/* js/sim/weather.js */
// =====================================================================================
//  sim/weather.js (stage-1 owner: lane A; Phase 3: lane Z) — the weather state and its channels. Pure JS: no GL, no DOM.
//  Eight states (Phase 3 added 'thunder'), each a target over the channels (PRESET below). Every change is a staged transition of D = 60
//  climate-s that starts from the CURRENT channel values (so a pick in mid-transition never jumps): clouds lead,
//  precipitation lags in and leads out, the gale sits between, fog has its own window, the sky clears last.
//  A season-dependent Markov scheduler picks the next state; a manual pick transitions and then holds.
//  Thunderstorms (Phase 3) are a variant of the Phase-2 chain: the scheduler draws exactly the Phase-2 states; an event
//  drawn as rain out of cumulus / overcast, or as overcast out of rain, becomes 'thunder' with a probability that peaks
//  in summer and late spring (thunderOdds, its own counter S.rand(seed, eventIdx, 4)). The chain goes on from the
//  drawn ('base') state, so every event's time and base state stay the Phase-2 ones: a seeded sequence differs from
//  Phase 2 only where an event is shown (and felt: heavier rain, gusts, the deck, strikes) as a thunderstorm, and in
//  what such a storm leaves behind: its heavier rain leaves the ground wetter, and its gusts and deck advance the wind
//  integrals and the cloud drift (uCloudOff) differently, so later frames of that seed differ from Phase 2 for good
//  (measured: seed 3 at t=2400, a season after 11 strikes, an autumn fog day with its fog banks elsewhere: mean 15.6,
//  max 147 per channel). The chain of states and times stays the Phase-2 one.
//
//  S.weather = { s, init(cfg), step(dtc, ff), snapshot(), api }     (stepped after the climate, in climate seconds)
//    s.t         the weather clock (S.climate.s.t)
//    s.cur, s.next, s.progress, s.manual, s.nextAt
//                cur: the state the weather is in (while a transition runs, the one it is leaving); next: the
//                transition target (null when settled); progress 0..1 (1 settled); manual: the held pick (null =
//                automatic); nextAt: climate time of the next scheduled change (0 = none: manual or auto off)
//    s.auto      the scheduler runs (Phase-1 "automatic storms"; false holds the current weather)
//    s.amount    the user precipitation amount 0..1; S.amountMul() = 0.2 + 1.6 amount scales flake counts and snowfall
//    s.ch        the channels, 0..1 unless noted:
//                cloudCov  weather-map cloud coverage (= uCloudCov)        cumulus   near cumulus and their shadows
//                overcast  the stratus deck / storm light                  cirrus    cirrus amount (1 = Phase-1 veil)
//                fog       valley fog                                      precip    precipitation rate
//                gale      gale strength (the wind blends into the gale by smooth(gale))
//                heavy     heavy-snowfall / blizzard intensity             tempOff   temperature offset (deg C)
//                lightning strike rate 0..1 (Phase 3; sim/events.js: ~1 strike / 8 s at 1)
//                snowFrac  snow share of the precipitation: follows 1 - smooth(1, 3, temp) (snow below 1 C, rain above
//                          3 C) at most 1/SF_TIME per climate-s, so a fast temperature swing (a season pick, a pick
//                          across the freezing line) turns snow into rain through ~15 s of sleet, never at once
//    s.temp      meadow temperature, deg C (S.climate.s.tSeason + ch.tempOff)
//    s.curtain   0..1 the snow curtain = heavy x snowFrac (Phase 1 sim.storm): flake turbulence, extinction, veil
//    s.white     0..1 the whiteout = curtain x a slow gust beat (physical time)
//    s.tail      0..1 residual thinning snow after the curtain opens: follows the curtain up (~4 s), decays ~25 s
//    s.heading   gale direction offset (rad): each event draws one, eased over the gale window of its transition
//  Randomness is counter based, S.rand(seed, eventIdx, k), so UI actions never shift the seeded sequence.
//  ff is ignored: fastForward runs exactly the live steps. Debug hook ?wx= overrides s.ch after every step
//  (temp, snowFrac, curtain and white follow it; an explicit snowFrac in ?wx wins over the derived one).
// =====================================================================================
(function (S) {
  'use strict';
  const { lerp, smooth, clamp } = S;
  const D = 60;                                  // climate-s: one weather transition
  const DWELL = [70, 180];                       // climate-s between scheduled transition starts (uniform)
  const SF_TIME = 15;                            // climate-s: the fastest full snow <-> rain conversion
  const FIRST_COLD = 2.5;                        // deg C: the opening snowfall is at least this far below freezing
  // Phase 3: 'thunder' (뇌우) is the eighth state: a manual pick, or an automatic event turned into a storm by
  // thunderOdds (its ROW / LINK / DWELL_BIAS columns stay 0: the chain itself is the Phase-2 one); 'lightning' is the
  // strike rate channel (0 everywhere but thunder; sim/events.js turns it into strikes)
  const STATES = ['clear', 'cumulus', 'overcast', 'fog', 'rain', 'snow', 'blizzard', 'thunder'];
  const N = STATES.length;
  const KEYS = ['cloudCov', 'cumulus', 'overcast', 'cirrus', 'fog', 'precip', 'gale', 'heavy', 'tempOff', 'lightning'];
  // canonical presets (the contract lanes C/D/E tune against via ?wx=); order = KEYS
  const PRESET = {
    clear:    [0.15, 0,   0,    0.35, 0,    0,    0.05, 0,  1, 0],
    cumulus:  [0.55, 1,   0.1,  0.2,  0,    0,    0.2,  0,  0, 0],
    overcast: [0.95, 0.2, 0.75, 0,    0.1,  0,    0.3,  0, -1, 0],
    fog:      [0.75, 0,   0.5,  0,    1,    0,    0,    0, -1, 0],
    rain:     [0.97, 0,   0.85, 0,    0.2,  0.65, 0.4,  0,  1, 0],
    snow:     [0.75, 0.2, 0.35, 0.4,  0.05, 0.75, 0.15, 0, -3, 0],    // Phase-1 sunlit snowfall: broken sun, not grey
    blizzard: [0.98, 0,   1,    0,    0.2,  1,    1,    1, -6, 0],
    // a thunderstorm: a low, dark deck (derive/events.js darkens and lowers it further by the lightning channel),
    // heavier rain (precip .85 and heavy .35: the rain layers' heavy multipliers), gusts (gale .65), strikes. tempOff
    // follows rain's (the same feasibility: T >= 1 C)
    thunder:  [0.99, 0,   1,    0,    0.15, 0.85, 0.65, 0.35, 1, 1],
  };
  const IS_PRECIP = { rain: 1, snow: 1, blizzard: 1, thunder: 1 };
  // ---- the Markov scheduler: P(i -> j) ∝ ROW[season][j] · LINK[i][j] · feasible(j), rows blended by seasonW.
  // ROW: how much each season favours a state; LINK: the structural affinity of a move (0 = forbidden: no self
  // transitions, precipitation only out of overcast / cumulus / fog, blizzard only out of snow / overcast).
  // Columns in STATES order: clear cumulus overcast fog rain snow blizzard thunder
  const ROW = [
    [1.0, 1.1, 0.7, 0.5, 1.5, 0.35, 0.2, 0],  // spring: mixed, showery, late snow early on
    [1.5, 1.7, 0.4, 0.2, 0.75, 0,  0, 0],     // summer: sunny and cumulus days, some showers
    [0.8, 0.4, 1.0, 1.6, 1.1, 0.6, 0.2, 0],   // autumn: fog and rain, first snow late
    [0.55, 0.2, 1.0, 0.35, 0.3, 2.8, 1.1, 0], // winter: snowy (sunny spells between the snowfalls)
  ];
  // dwell bias per season and state (-1 short .. +1 long): the dwell is 70 + 110 u^g with g = 2^(-1.5 bias), so the
  // mean is 125 s neutral, ~150 s at +1, ~100 s at -1 (always inside 70-180): winter snow lingers and the grey
  // gateways pass quickly, summer showers are brief
  const DWELL_BIAS = [
    [0, 0, -0.3, -0.3, 0.2, 0.2, -0.3, 0],      // spring
    [0.5, 0.5, -0.5, -0.5, -0.5, 0, 0, 0],      // summer
    [0, -0.3, 0, 0.5, 0.3, 0.3, -0.3, 0],       // autumn
    [0, -0.6, -0.6, -0.6, 0, 1, 0, 0],          // winter
  ];
  const LINK = {
    clear:    [0,   1.4, 1.0, 0.8, 0,   0,   0,   0],
    cumulus:  [1.2, 0,   1.0, 0.4, 1.4, 0.6, 0,   0],
    overcast: [0.7, 0.7, 0,   0.8, 2.0, 2.0, 1.0, 0],
    fog:      [1.5, 0.8, 1.0, 0,   0.6, 0.6, 0,   0],
    rain:     [0.8, 1.0, 1.5, 0.9, 0,   0,   0,   0],
    snow:     [1.0, 0.5, 1.4, 0.5, 0,   0,   1.6, 0],
    blizzard: [0.6, 0,   1.0, 0.2, 0,   2.0, 0,   0],
    thunder:  [0.8, 1.0, 1.5, 0.9, 0.6, 0,   0,   0],   // a storm passes into broken cloud, a grey deck or plain rain
  };
  // ---- transition windows in progress units (0..1 of D), by channel and direction (up = the target is higher)
  function windowOf(k, up, intoPrecip, outOfPrecip) {
    switch (k) {
      case 'cloudCov': case 'overcast': case 'cumulus': return up ? [0, 0.6] : [0.4, 1];       // clouds lead, sky clears last
      case 'cirrus': return up ? [0, 0.5] : [0.25, 0.85];
      case 'fog': return up ? [0.15, 0.8] : [0, 0.6];                                            // fog forms slowly, lifts early
      case 'precip': return up ? [0.4, 1] : [0, 0.55];                                           // lags in, leads out
      case 'heavy': case 'lightning': return up ? [0.5, 1] : [0, 0.45];
      case 'gale': return up ? [0.25, 0.8] : [0.15, 0.75];                                       // between clouds and precip
      default: return intoPrecip ? [0, 0.45] : outOfPrecip ? [0.5, 1] : [0.1, 0.9];             // tempOff: precip type set first
    }
  }

  const ch = { cloudCov: 0.6, cumulus: 0, overcast: 0, cirrus: 1, fog: 0, precip: 1, gale: 0, heavy: 0, tempOff: 0, lightning: 0, snowFrac: 1 };
  const s = { t: 0, cur: 'snow', next: null, progress: 1, manual: null, nextAt: 0, auto: true, amount: 0.5,
              ch, temp: 0, curtain: 0, white: 0, tail: 0, heading: 0,
              forced: null };   // the legacy forced storm level (?storm=1 / setStorm), null = none
  // the running transition: from-channel values, target state, start time, per-channel windows, heading ease
  // first: the opening snowfall (cold snap, see targetOf), cleared by the first transition
  // base: the Phase-2 state the scheduler drew (an automatic thunderstorm's base is rain or overcast; else = to)
  const tr = { from: {}, to: 'snow', base: 'snow', t0: -1e9, win: {}, h0: 0, h1: 0, first: false };
  let wx = null, seed = 1, eventIdx = 0, sf2 = 1;     // sf2: snowFrac before any ?wx override (the rate-limited state)
  S.amountMul = () => 0.2 + 1.6 * s.amount;

  const presetOf = (name, k) => PRESET[name][KEYS.indexOf(k)];
  // the target of a channel. tempOff of a MANUAL (or forced) precipitation pick is pushed so the pick shows what was
  // asked for in any season (a cold snap for snow in summer, a thaw for rain in winter); it follows tSeason live.
  // The opening snowfall (the first weather, until the first transition) is a cold snap too: at least FIRST_COLD
  // below freezing, so the first snow of late autumn falls as crisp, dry Phase-1 crystals (not the wet-snow band
  // around 0 deg C) and settles at once
  function targetOf(name, k) {
    const v = presetOf(name, k);
    if (k === 'tempOff' && tr.first && name === 'snow' && s.manual === null && s.forced === null) return Math.min(v, -FIRST_COLD - S.climate.s.tSeason);
    if (k !== 'tempOff' || (s.manual === null && s.forced === null)) return v;
    const tS = S.climate.s.tSeason;
    if (name === 'snow') return Math.min(v, -0.5 - tS);
    if (name === 'blizzard') return Math.min(v, -2 - tS);
    if (name === 'rain' || name === 'thunder') return Math.max(v, 3.5 - tS);
    return v;
  }
  // temperature feasibility of an automatic draw (a conflicting draw is redrawn = dropped from the row): rain that
  // would fall as snow (T < 1 C), snow that would fall as rain (T > 3 C), blizzard unless it is freezing (T < 0)
  function feasible(name) {
    const tS = S.climate.s.tSeason, T = tS + presetOf(name, 'tempOff');
    if (name === 'rain' || name === 'thunder') return T >= 1;
    if (name === 'snow') return T <= 3;
    if (name === 'blizzard') return s.temp < 0 && T < 1;
    return true;
  }
  // next state from `from` (null: the first weather, no link mask) with the uniform u
  function draw(from, u) {
    const w = S.climate.s.seasonW, p = new Array(N);
    let sum = 0;
    for (let j = 0; j < N; j++) {
      const row = w[0] * ROW[0][j] + w[1] * ROW[1][j] + w[2] * ROW[2][j] + w[3] * ROW[3][j];
      p[j] = row * (from ? LINK[from][j] : 1) * (feasible(STATES[j]) ? 1 : 0);
      sum += p[j];
    }
    if (sum <= 0) return from === 'clear' ? 'cumulus' : 'clear';     // never happens with the tables above
    let acc = 0;
    for (let j = 0; j < N; j++) { acc += p[j] / sum; if (u < acc) return STATES[j]; }
    for (let j = N - 1; j >= 0; j--) if (p[j] > 0) return STATES[j];
  }
  function dwell(i, k, name) {
    const w = S.climate.s.seasonW, j = STATES.indexOf(name);
    const bias = w[0] * DWELL_BIAS[0][j] + w[1] * DWELL_BIAS[1][j] + w[2] * DWELL_BIAS[2][j] + w[3] * DWELL_BIAS[3][j];
    return DWELL[0] + (DWELL[1] - DWELL[0]) * Math.pow(S.rand(seed, i, k), Math.pow(2, -1.5 * bias));
  }
  // the state the weather is heading to (the scheduler's "current" state): the base state of an automatic thunderstorm
  const target = () => tr.base || tr.to;
  // thunderstorms: the chance that an event drawn as `name` out of `from` turns into one. Late spring through summer
  // (phase ~.12-.46, peaking mid-summer); out of cumulus (afternoon storms) most, out of overcast less; a storm may also
  // build out of rain (an event drawn as overcast). Never twice in a row, never where rain could not fall
  function thunderOdds(from, name) {
    if (tr.to === 'thunder' || !feasible('thunder')) return 0;
    const ph = S.climate.s.phase, season = smooth(0.1, 0.2, ph) * (1 - smooth(0.4, 0.48, ph)) * (0.75 + 0.25 * smooth(0.18, 0.3, ph));
    const k = name === 'rain' ? (from === 'cumulus' ? 0.8 : from === 'overcast' ? 0.55 : 0) : (name === 'overcast' && from === 'rain' ? 0.35 : 0);
    return k * season;
  }

  // start a transition to `name` from the current channel values (instant: settle at once, test / legacy hooks)
  function begin(name, instant) {
    tr.first = false;
    const intoP = !!IS_PRECIP[name], outP = !IS_PRECIP[name] && (IS_PRECIP[tr.to] || ch.precip > 0.01);
    s.cur = s.progress < 0.5 && s.next ? s.cur : tr.to;
    tr.to = name; tr.base = name; tr.t0 = instant ? s.t - D : s.t;
    for (const k of KEYS) {
      tr.from[k] = ch[k];
      tr.win[k] = windowOf(k, targetOf(name, k) > ch[k], intoP, outP);
    }
    tr.h0 = s.heading;
    // the new event's gale heading, +-35 deg about the prevailing gale line, eased the short way round
    const h = (S.rand(seed, eventIdx, 2) - 0.5) * 1.2;
    tr.h1 = tr.h0 + Math.atan2(Math.sin(h - tr.h0), Math.cos(h - tr.h0));
    s.next = name; s.progress = 0;
    evalChannels(0, instant);
  }
  // one scheduled event: draw the next state from the current one, and the time of the event after it
  function schedule() {
    const from = target();
    const name = draw(from, S.rand(seed, eventIdx, 0));
    const storm = S.rand(seed, eventIdx, 4) < thunderOdds(from, name);
    begin(storm ? 'thunder' : name, false);
    tr.base = name;                                  // the chain goes on from the drawn state (and its dwell)
    s.nextAt = s.t + dwell(eventIdx, 1, name);
    eventIdx++;
  }
  // resume the scheduler from wherever the weather is (auto back on, a manual pick or forced storm released). The
  // held state's target may differ from its automatic one (tempOff of a manual precipitation pick), so it eases back
  // through a transition of its own; the next scheduled change comes a dwell later
  function resume(wasHeld) {
    const base = target();
    if (wasHeld) { begin(tr.to, false); tr.base = base; }
    s.nextAt = s.t + dwell(eventIdx, 3, base);
  }

  // storm whiteout: the plateau sits at ~86% and only gust peaks (a slow beat of two sines) push it to 100%
  function gustPeak(t) { return smooth(0.62, 1.0, 0.5 + 0.5 * (0.6 * Math.sin(t * 0.23 + 2.5) + 0.4 * Math.sin(t * 0.41 + 4.0))); }
  // the transition at s.t -> the channels (+ ?wx) -> temp, snowFrac, curtain, whiteout. dtc: the climate time since
  // the last evaluation (the snowFrac rate limit); snap: settle snowFrac on its temperature value (init, instant picks)
  function evalChannels(dtc, snap) {
    const p = clamp((s.t - tr.t0) / D, 0, 1);
    if (s.forced !== null) {
      // legacy forced storm: snow .. blizzard by the level, at once
      for (const k of KEYS) ch[k] = lerp(targetOf('snow', k), targetOf('blizzard', k), s.forced);
      s.heading = 0;
    } else {
      for (const k of KEYS) { const w = tr.win[k]; ch[k] = lerp(tr.from[k], targetOf(tr.to, k), smooth(w[0], w[1], p)); }
      const gw = tr.win.gale;
      s.heading = lerp(tr.h0, tr.h1, smooth(gw[0], gw[1], p));
    }
    s.progress = p;
    if (p >= 1 && s.next) { s.cur = s.next; s.next = null; }
    S.override(ch, wx);
    s.temp = S.climate.s.tSeason + ch.tempOff;
    const sf = 1 - smooth(1, 3, s.temp), lim = (dtc || 0) / SF_TIME;
    ch.snowFrac = snap || wx ? sf : sf2 + clamp(sf - sf2, -lim, lim);     // the debug hook ?wx snaps too
    if (wx && 'snowFrac' in wx) ch.snowFrac = wx.snowFrac;
    sf2 = ch.snowFrac;
    s.curtain = ch.heavy * ch.snowFrac;
    s.white = s.curtain * (0.86 + 0.14 * gustPeak(S.anim ? S.anim.time : 0));
  }

  S.weather = {
    s,
    init(cfg) {
      wx = cfg.wx; seed = cfg.seed >>> 0; eventIdx = 0;
      s.t = S.climate.s.t; s.auto = cfg.storm !== '0'; s.forced = null; s.amount = 0.5;
      s.manual = null; s.next = null; s.progress = 1; s.tail = 0; s.heading = 0;
      for (const k of KEYS) ch[k] = presetOf('clear', k);
      s.temp = S.climate.s.tSeason + ch.tempOff;
      // the first weather: snow whenever the season allows it (the Phase-1 opening, snow falling on the late-autumn
      // meadow), else a draw from the season row; it starts at full strength
      const first = S.climate.s.tSeason + presetOf('snow', 'tempOff') < 1 ? 'snow' : draw(null, S.rand(seed, 0, 0));
      tr.to = 'clear'; begin(first, true); s.cur = first; s.next = null;
      tr.first = first === 'snow'; evalChannels(0, true);
      s.nextAt = dwell(0, 1, first); eventIdx = 1;
      if (cfg.storm === '1') S.weather.api.setStorm(1);                        // legacy: an instant, held blizzard
      else if (cfg.storm === '0') { begin('clear', true); s.cur = 'clear'; s.next = null; }   // legacy: clear, auto off
      if (cfg.weather) S.weather.api.setWeather(cfg.weather, { instant: true });
      if (!s.auto || s.manual !== null) s.nextAt = 0;
      s.tail = s.curtain;
    },
    step(dtc) {
      s.t = S.climate.s.t;
      if (s.auto && s.manual === null && s.forced === null) {
        // a season change (or pin) can leave an automatic precipitation state on the wrong side of the rain / snow
        // line: end it early instead of labelling rain as snow for the rest of its dwell
        // (not before the minimum dwell)
        const b = target();
        if (!s.next && IS_PRECIP[b] && !feasible(b) && !(b === 'blizzard' && s.temp < 0)) s.nextAt = Math.min(s.nextAt, Math.max(s.t, tr.t0 + DWELL[0]));
        if (s.t >= s.nextAt) schedule();
      }
      evalChannels(dtc, false);
      // tail: fast attack (4 s) behind the curtain, slow release (25 s) once it opens
      const tau = s.curtain > s.tail ? 4 : 25;
      s.tail += (s.curtain - s.tail) * (1 - Math.exp(-dtc / tau));
    },
    snapshot: () => ({ weather: { cur: s.cur, next: s.next, progress: +s.progress.toFixed(3), manual: s.manual, nextAt: +s.nextAt.toFixed(2) },
      temp: +s.temp.toFixed(2), snowFrac: +ch.snowFrac.toFixed(4), precip: +ch.precip.toFixed(4), white: +s.white.toFixed(4) }),
    api: {
      // pick a weather state (clear, cumulus, overcast, fog, rain, snow, blizzard, thunder): a 60 climate-s transition, then
      // it holds; 'auto' (or null) resumes the scheduler from the current weather. opt.instant settles at once (test
      // and legacy hooks only). Returns the weather snapshot
      setWeather(name, opt) {
        const instant = !!(opt && opt.instant);
        if (name === 'auto' || !name) {
          if (s.manual !== null || s.forced !== null || !s.auto) {
            const held = s.manual !== null || s.forced !== null;
            s.manual = null; s.forced = null; s.auto = true; resume(held);
          }
        } else if (PRESET[name]) {
          const again = s.manual === name && s.forced === null;
          s.forced = null; s.manual = String(name); s.nextAt = 0;
          // a pick of the state the weather is already in still eases (its manual tempOff target may differ)
          if (instant) begin(name, true);
          else if (!again) begin(name, false);
        }
        if (instant) evalChannels(0, true);
        return S.weather.snapshot();
      },
      // legacy (Phase 1): force the storm level 0..1 at once (snow .. blizzard), null = back to automatic weather
      setStorm(v) {
        if (v === null || v === undefined) { if (s.forced !== null) { s.forced = null; s.manual = null; resume(true); } }
        else { s.forced = clamp(+v, 0, 1); s.manual = null; s.nextAt = 0; s.cur = s.forced > 0.5 ? 'blizzard' : 'snow'; s.next = null; tr.to = tr.base = s.cur; tr.t0 = s.t - D; }
        evalChannels(0, v !== null && v !== undefined);
      },
      // legacy (Phase 1, the 폭설 button): a blizzard now (60 s transition) that ends after dur like a Phase-1 front:
      // the scheduler moves on from it then (unless automatic weather is off)
      triggerBlizzard(dur = 100) {
        s.forced = null; s.manual = null;
        begin('blizzard', false);
        s.nextAt = s.auto ? s.t + Math.max(D + 10, dur) : 0;
      },
      get amount() { return s.amount; }, set amount(v) { s.amount = clamp(+v || 0, 0, 1); S.syncUI(); },
      get auto() { return s.auto; },
      set auto(v) {
        const on = !!v;
        if (on && !s.auto) { s.auto = true; if (s.manual === null && s.forced === null) resume(false); }
        else if (!on) { s.auto = false; s.nextAt = 0; }
        S.syncUI();
      },
    },
  };
})(window.SNOW);

</script>
<script>/* js/sim/ground.js */
// =====================================================================================
//  sim/ground.js (stage-1 owner: lane A) — the ground state. Pure JS: no GL, no DOM.
//  The meadow snowpack (cover: snowfall minus melt), the ground wetness, and the altitude snowline.
//
//  S.ground = { s, init(cfg), step(dtc, ff), snapshot(), api }     (stepped after the weather, in climate seconds)
//    s.cover     0..1 snow cover level, compared against the baked snowT (Phase-1 threshold semantics)
//    s.wet       0..1 ground wetness
//    s.snowline  altitude (m) below which the per-frame snowline bares the ground (effectiveCover, SURFACE)
//    s.hold      the cover is held (?cover= with ?storm=0)
//    s.melt, s.meltFrom   the eased reset: seconds into it (null when idle) and the cover it started from
//  Per climate-s (T the meadow temperature, sun = 1 - overcast, rain = precip (1 - snowFrac)):
//    snowfall  +(1/ACC)(1 + 4 heavy) amountMul precip snowFrac, ACC = 200 s (stage 2b: the Phase-1 rate 1/300 at its
//              precip 1; the snow preset falls at precip .75, so 1/200 keeps the Phase-1 pace on the meadow: roofs
//              white within a minute, the meadow patchy-white in two, and a real winter snowpack)
//    melt      -(max(T, 0)/900 (1 + 1.5 sun) (0.3 + 0.7 cover) + rain/120)   (only while there is cover; stage 2b: the
//              last patches, the shaded and high ground where snowT is lowest, hold out longer than a full pack, so a
//              spring meadow melts out over about half a minute instead of in seconds)
//    wet       rain wets toward min(1, 1.6 rain) with tau 20 s; it dries with tau 120 s / ((0.35 + 0.65 sun)
//              (1 + 0.1 wind m/s)); melting snow adds 0.6 x the melted cover x (1 - wet)
//    snowline  a seasonal level (SEASONAL below, metres) that fresh snow pulls down: while it precipitates, the
//              level descends (tau 12 s / precip) to the snow level (T - 1.5)/0.0065 m (the 1.5 C isotherm by the
//              6.5 C/km lapse rate, meadow ~0 m); it relaxes back up with tau 100 s / ((0.25 + 0.75 sun)
//              (1 + max(T, 0)/5)) (summer fresh snow is gone in ~1-2 min, spring snow lingers), and down to a falling
//              seasonal level with tau 20 s. While the meadow holds snow (cover > 0.005) the level is drawn below it
//              (MEADOW_CAP, tau 8 s) and cannot rise above it, so the cover alone decides there.
//  World altitudes (terrain): valley floor ~-1000 m, meadow -100..40 m, camera 132 m, treeline ~330 m, the far
//  peaks' snowfields ~1900-2500 m (at cover 0 the bake whitens flat ground above ~1.8-2.3 km; a snowline of
//  2200-2300 m leaves only the topmost couloirs white).
//  Climatological spin-up (stage 2b): a pinned season starts from the ground that time of year has (CLIM: phase ->
//  cover, wetness; the snowline is the seasonal one, under the meadow while it holds snow): deep winter snow, the
//  patchy melting snow of early spring, bare summer meadows with only the high couloirs white, the first dustings of
//  late autumn. A boot ?season= pin starts there at once; a season picked from the UI (setSeason with a phase or a
//  name) eases there over SPIN climate-s: the free-running ground (snowfall, melt, wetting, drying go on in a shadow
//  copy) is blended into the target season's climatology by a smoothstep in climate time, then runs on its own. ?yp
//  (a debug pin) has none; ?cover and ?ground still override.
//  ff is ignored (fastForward runs the live steps). Debug hook ?ground= overrides s after every step, e.g.
//  cover:.3,wet:.8,snowline:2200.
// =====================================================================================
(function (S) {
  'use strict';
  const { smooth, clamp } = S;
  const LAPSE = 0.0065;          // C per m
  const ACC = 200;               // climate-s: a full snowpack at precip 1 (amountMul 1, no heavy snowfall)
  const LOW = -1600;             // m: below the valley floor (no snowline effect anywhere)
  // m: the snowline while the meadow holds snow. SURFACE's offset spans the 300 m half-width plus a per-pixel shift of
  // up to ~-180 m (sun exposure) and +-130 m (noise), so the meadow (-100..40 m) is untouched only from about -450 m
  // down (measured with ?view=cEff: -350 still bared ~1% of the meadow, -450 / -550 none)
  const MEADOW_CAP = -550;
  // the seasonal snowline (m) at year-phase keypoints, cosine-eased between them (cyclic): early spring 1100 rising
  // to 2100 at the start of summer and 2300 in late summer (only the top couloirs white), lowering through autumn
  // to 1500 by late autumn, then below the valley floor for the winter
  const SEASONAL = [[0, 1100], [0.25, 2100], [0.4, 2300], [0.5, 2150], [0.7, 1500], [0.78, LOW], [0.95, LOW], [1, 1100]];
  function seasonal(ph) {
    let i = 0;
    while (i < SEASONAL.length - 2 && ph >= SEASONAL[i + 1][0]) i++;
    const [p0, a0] = SEASONAL[i], [p1, a1] = SEASONAL[i + 1], u = (ph - p0) / (p1 - p0);
    return a0 + (a1 - a0) * (0.5 - 0.5 * Math.cos(Math.PI * clamp(u, 0, 1)));
  }
  // the ground's climatology: [phase, cover, wetness], cosine-eased between keypoints (cyclic). Winter builds a deep pack
  // (mid-winter ~.9: white to the valley floor); early spring is patchy and melting (wet), the meadow bare by late
  // spring; summer and autumn bare (the snowline keeps the high couloirs / the first peak dustings), late autumn's first
  // dustings on the meadow
  // [phase, cover, wetness, snowline m] (the wetness is the spring meltwater; summer / autumn rain wets the ground
  // through the weather): spring melts out from below (the snowline climbs through the meadow while the
  // slopes above stay white), summer leaves the high couloirs, the first dusting reaches the meadow in late autumn
  const CLIM = [[0, 0.93, 0.1, -700], [0.05, 0.92, 0.3, -450], [0.1, 0.9, 0.36, -120], [0.15, 0.86, 0.36, 120], [0.2, 0.7, 0.3, 650],
                [0.25, 0.3, 0.2, 1500], [0.3, 0, 0.06, 2100], [0.45, 0, 0.02, 2300], [0.55, 0, 0.02, 2050], [0.68, 0, 0.04, 1550],
                [0.74, 0.1, 0.08, MEADOW_CAP], [0.8, 0.6, 0.04, LOW], [0.86, 0.97, 0.02, LOW], [0.95, 0.99, 0.02, LOW], [1, 0.93, 0.1, -700]];
  const SPIN = 60;               // climate-s: a season picked from the UI brings its ground in over one transition
  function interp(T, ph, k) {
    let i = 0;
    while (i < T.length - 2 && ph >= T[i + 1][0]) i++;
    const a = T[i], b = T[i + 1], u = clamp((ph - a[0]) / (b[0] - a[0]), 0, 1);
    return a[k] + (b[k] - a[k]) * (0.5 - 0.5 * Math.cos(Math.PI * u));
  }
  function climatology(ph, o) {
    o.cover = interp(CLIM, ph, 1); o.wet = interp(CLIM, ph, 2); o.snowline = interp(CLIM, ph, 3);
    return o;
  }
  const s = { cover: 0, wet: 0, snowline: -10000, hold: false, melt: null, meltFrom: 0 };
  let gr = null;
  // the spin-up: target (the picked season's climatology), its start (climate s), the free-running shadow state
  const spin = { on: false, t0: 0, tgt: { cover: 0, wet: 0, snowline: 0 }, free: { cover: 0, wet: 0, snowline: 0 } };
  let lastPin = null;

  S.ground = {
    s,
    init(cfg) {
      gr = cfg.ground;
      s.cover = 0; s.wet = 0; s.melt = null; s.meltFrom = 0;
      s.hold = cfg.cover !== null && cfg.storm === '0';
      // the seasonal level, or the fresh-snow level when the first weather already precipitates (the opening snowfall);
      // a pinned season (?season=) starts from its climatology
      const wx = S.weather.s, cl = S.climate.s;
      spin.on = false; lastPin = cl.pinned;
      if (cl.pinned !== null) climatology(cl.pinned, s);
      s.snowline = Math.min(cl.pinned !== null ? s.snowline : seasonal(cl.phase), wx.ch.precip > 0.02 ? (wx.temp - 1.5) / LAPSE : Infinity);
      S.override(s, gr);
    },
    step(dtc) {
      const wx = S.weather.s, ch = wx.ch, T = wx.temp, cl = S.climate.s;
      const sun = 1 - ch.overcast, rain = ch.precip * (1 - ch.snowFrac);
      // a season picked from the UI: from here the ground runs in the shadow copy and is blended into the climatology of
      // the picked season over SPIN climate-s (a release, null, lets the ground run on from where it is)
      if (cl.pinned !== lastPin) {
        lastPin = cl.pinned;
        if (cl.pinned !== null && !s.hold) {
          spin.on = true; spin.t0 = cl.t - dtc; climatology(cl.pinned, spin.tgt);
          spin.free.cover = s.cover; spin.free.wet = s.wet; spin.free.snowline = s.snowline;
        } else spin.on = false;
      }
      const g = spin.on ? spin.free : s;
      // ---- the snowpack
      let melted = 0;
      if (s.melt !== null) {
        s.melt += dtc;
        g.cover = s.meltFrom * (1 - smooth(0, 1.5, s.melt));
        if (s.melt >= 1.5) { g.cover = 0; s.melt = null; }
      } else if (!s.hold) {
        const fall = (1 / ACC) * (1 + 4 * ch.heavy) * S.amountMul() * ch.precip * ch.snowFrac;
        // the snow left lies near and above the snowline: it melts at the air temperature there (up to 600 m above the
        // meadow), so in a spring thaw the meadow melts out first and the slopes above stay white for minutes
        const Tm = T - LAPSE * clamp(g.snowline + 300, 0, 600);
        const meltR = g.cover > 0 ? Math.max(Tm, 0) / 900 * (1 + 1.5 * sun) * (0.3 + 0.7 * g.cover) + rain / 120 : 0;
        const c = clamp(g.cover + (fall - meltR) * dtc, 0, 1);
        melted = Math.max(0, Math.min(meltR * dtc, g.cover + fall * dtc - c));
        g.cover = c;
      }
      // ---- wetness: rain wets fast, sun and wind dry slowly, melt water adds a little
      const wetIn = Math.min(1, 1.6 * rain);
      if (wetIn > g.wet) g.wet += (wetIn - g.wet) * (1 - Math.exp(-dtc / 20));
      else {
        const w = S.wind.s.natural, wind = Math.hypot(w[0], w[2]);
        g.wet += (wetIn - g.wet) * (1 - Math.exp(-dtc * (0.35 + 0.65 * sun) * (1 + 0.1 * wind) / 120));
      }
      g.wet = Math.min(1, g.wet + 0.6 * melted * (1 - g.wet));
      // ---- the snowline: seasonal, pulled down by fresh snow. While snow lies (cover > 0.005) it is held under the meadow
      // (the cover alone decides there), except in a thaw (no snow falling and the meadow above 1.5 C): then it climbs
      // toward the 4 C isotherm and the meadow melts out from below, sunny ground first (stage 2b)
      const meadow = g.cover > 0.005, thaw = T > 1.5 && ch.precip * ch.snowFrac < 0.02;
      const capL = thaw ? Math.max(MEADOW_CAP, (T - 4) / LAPSE) : MEADOW_CAP;
      const sea = meadow ? Math.min(seasonal(cl.phase), capL) : seasonal(cl.phase);
      const zs = (T - 1.5) / LAPSE;
      let L = g.snowline;
      if (ch.precip > 0.02 && zs < L) {
        L += (zs - L) * (1 - Math.exp(-dtc * ch.precip / 12));
        // snowing onto a meadow that already holds snow (a snow level near the meadow, e.g. -0.5 C -> -308 m): the cap
        // applies here too, so SURFACE's 300 m transition never bares sunny meadow pixels under falling snow
        if (meadow && L > MEADOW_CAP) L += (MEADOW_CAP - L) * (1 - Math.exp(-dtc / 8));
      } else if (L < sea) L += (sea - L) * (1 - Math.exp(-dtc * (0.25 + 0.75 * sun) * (1 + Math.max(T, 0) / 5) / 100));
      else L += (sea - L) * (1 - Math.exp(-dtc / (meadow && !thaw ? 8 : 20)));
      g.snowline = L;
      // ---- the spin-up blend (smooth in climate time, so the ground eases in with the season's colours)
      if (spin.on) {
        // the snowline leads (over the first 60%): snow comes in as patches that spread, and melts out from below
        const e = smooth(spin.t0, spin.t0 + SPIN, cl.t), eL = smooth(spin.t0, spin.t0 + 0.6 * SPIN, cl.t), f = spin.free, tg = spin.tgt;
        s.cover = f.cover + (tg.cover - f.cover) * e;
        s.wet = f.wet + (tg.wet - f.wet) * e;
        s.snowline = f.snowline + (tg.snowline - f.snowline) * eL;
        if (e >= 1) spin.on = false;
      }
      S.override(s, gr);
    },
    snapshot: () => ({ wet: +s.wet.toFixed(4), snowline: Math.round(s.snowline) }),
    api: {
      setCoverage(v) { s.cover = clamp(+v || 0, 0, 1); s.melt = null; spin.on = false; },
      reset() { s.cover = 0; s.melt = null; spin.on = false; },
      resetSnow() { s.meltFrom = s.cover; s.melt = 0; spin.on = false; },     // the eased reset (1.5 s)
    },
  };
})(window.SNOW);

</script>
<script>/* js/sim/wind.js */
// =====================================================================================
//  sim/wind.js (stage-1 owner: lane A) — the wind. Pure JS: no GL, no DOM (the pointer arrives through S.mouse).
//  natural: closed form in the animation clock and the seed. A breeze whose direction veers slowly about the
//  prevailing line (seeded 1D value noise S.vn1, ~+-50 deg over minutes) and whose speed follows the season and
//  the Phase-1 gust beat, blended into the gale by smooth(ch.gale) along the event's gale line (the Phase-1 line,
//  rotated by the weather heading and partly by the veer; in the world's reference frame S.worldR / worldF, the valley's
//  camera, whichever scene is shown).
//  steer: ONLY while the left button is held (S.mouse.drag), the drag velocity becomes a horizontal wind: screen
//  right -> camR, screen up -> away from the camera (camF on the ground), 10 m/s per viewport per second, capped
//  at 14 m/s, fast attack (0.12 s; easing 1.5 s when the drag slows). After release it decays with a 15 s
//  half-life. Plain pointer motion (no button) never changes the wind.
//  windA / windB follow natural + steer with 1.1 s / 0.4 s lags.
//
//  S.wind = { s, init(cfg), step(dt, ff), snapshot(), api }     (stepped in PHYSICAL seconds, after the ground)
//    s.windA, s.windB   [x, y, z] m/s, the slow and the quick wind response. Flakes mix them affinely; main.js
//                       integrates them into S.anim.dispA / dispB (the only positional wind the particles see)
//    s.target           the wind target of this step (natural + steer)
//    s.natural          [x, 0, z] the natural part of the target (breeze / gale, no steer): what clouds follow
//    s.steer            [x, 0, z] the user's drag wind (m/s)
//    s.bias, s.gust     the steer along camR and along the ground-projected camF (m/s)
//    s.baseWind         the calm base wind: [0.9, 0, 0.35] or ?wind=X,Z (a ?wind base does not veer)
//  Reads S.anim.time, S.climate.s.seasonW, S.weather.s.ch.gale / s.heading and S.mouse (drag, vxn, vyn).
//  ff (fastForward / advance): no pointer (the steer only decays); otherwise the same step.
// =====================================================================================
(function (S) {
  'use strict';
  const { lerp, smooth, camR, camF, worldR, worldF } = S;
  const STEER_K = 10, STEER_MAX = 14, STEER_HALF = 15;   // m/s per (viewport / s); cap m/s; release half-life s
  const SEASON_SPEED = [1.35, 0.85, 1.15, 1.0];          // breeze speed factor: spring, summer, autumn, winter
  // the ground-projected camF, refreshed per step: the camera is re-framed per aspect ratio (S.frameCamera mutates
  // camR / camF in place), and the steer and the gale line follow the view
  const fwd = [0, 0, 1];
  function setFwd() { const l = Math.hypot(camF[0], camF[2]); fwd[0] = camF[0] / l; fwd[2] = camF[2] / l; }
  const s = { windA: [0, 0, 0], windB: [0, 0, 0], target: [0, 0, 0], natural: [0, 0, 0], steer: [0, 0, 0], bias: 0, gust: 0, baseWind: [0.9, 0, 0.35] };
  let seed = 1, veers = true, baseAng = 0, baseMag = 1;

  // the natural wind at time t (s.natural)
  function natural(t) {
    const wx = S.weather.s, w = S.climate.s.seasonW;
    // direction: the prevailing line veering slowly (two octaves of seeded value noise, periods ~90 s and ~25 s)
    const veer = veers ? 0.75 * S.vn1(seed * 31 + 7, t / 90) + 0.2 * S.vn1(seed * 31 + 8, t / 25) : 0;
    const ang = baseAng + veer;
    // speed: the season, the Phase-1 gust beat, and slower seeded lulls / freshening
    const g1 = Math.sin(t * 0.37) * 0.5 + Math.sin(t * 0.91 + 1.3) * 0.3 + Math.sin(t * 2.3 + 0.4) * 0.2;
    const sp = baseMag * (w[0] * SEASON_SPEED[0] + w[1] * SEASON_SPEED[1] + w[2] * SEASON_SPEED[2] + w[3] * SEASON_SPEED[3])
      * (1 + 0.45 * g1) * (1 + 0.3 * S.vn1(seed * 31 + 9, t / 40));
    const cx = Math.cos(ang) * sp, cz = Math.sin(ang) * sp;
    // gale: slow swell (g2) times a phase-modulated gust train (1.3 / 2.9 / 6.1 rad/s beat), along the Phase-1 gale
    // line (mostly screen-right, a little away from the camera) turned by the event heading and 40% of the veer. The
    // line is the world's (S.worldR / worldF, core.js: the valley's camera for this aspect), not the live camera's, so
    // the wind never depends on the scene shown (polish; in the valley the same numbers as Phase 2)
    const g2 = Math.sin(t * 0.53 + 2.0) * 0.45 + Math.sin(t * 1.37 + 0.7) * 0.35 + Math.sin(t * 3.1) * 0.2;
    const gustTrain = 1 + 0.22 * Math.sin(t * 1.3 + 0.9) + 0.14 * Math.sin(t * 2.9 + 1.8) + 0.08 * Math.sin(t * 6.1);
    const mag = (10.5 + 3.0 * g2) * gustTrain;
    const gx = worldR[0] * 0.88 + worldF[0] * 0.3, gz = worldR[2] * 0.88 + worldF[2] * 0.3;
    const h = wx.heading + 0.4 * veer, c = Math.cos(h), sn = Math.sin(h);
    let sx = gx * c - gz * sn, sz = gx * sn + gz * c;
    const l = Math.hypot(sx, sz); sx /= l; sz /= l;
    const ss = smooth(0, 1, wx.ch.gale);
    s.natural[0] = lerp(cx, sx * mag, ss); s.natural[1] = 0; s.natural[2] = lerp(cz, sz * mag, ss);
  }
  // the drag steer: follows the drag velocity while the button is held, decays after release
  function steer(dt, ff) {
    const m = S.mouse, st = s.steer;
    if (!ff && m && m.drag) {
      let tx = (m.vxn || 0) * STEER_K * camR[0] + (m.vyn || 0) * STEER_K * fwd[0];
      let tz = (m.vxn || 0) * STEER_K * camR[2] + (m.vyn || 0) * STEER_K * fwd[2];
      const tl = Math.hypot(tx, tz);
      if (tl > STEER_MAX) { tx *= STEER_MAX / tl; tz *= STEER_MAX / tl; }
      const k = 1 - Math.exp(-dt / (Math.hypot(tx, tz) > Math.hypot(st[0], st[2]) ? 0.12 : 1.5));
      st[0] += (tx - st[0]) * k; st[2] += (tz - st[2]) * k;
    } else {
      const k = Math.pow(0.5, dt / STEER_HALF);
      st[0] *= k; st[2] *= k;
    }
    s.bias = st[0] * camR[0] + st[2] * camR[2];
    s.gust = st[0] * fwd[0] + st[2] * fwd[2];
  }

  S.wind = {
    s,
    init(cfg) {
      const w = cfg.wind;
      veers = !(w.length === 2 && w.every(isFinite));
      s.baseWind = veers ? [0.9, 0, 0.35] : [w[0], 0, w[1]];
      baseAng = Math.atan2(s.baseWind[2], s.baseWind[0]); baseMag = Math.hypot(s.baseWind[0], s.baseWind[2]);
      seed = cfg.seed >>> 0;
      s.steer = [0, 0, 0]; s.bias = 0; s.gust = 0;
      natural(S.anim.time);
      s.target = [...s.natural]; s.windA = [...s.natural]; s.windB = [...s.natural];
    },
    step(dt, ff) {
      setFwd();
      natural(S.anim.time);
      steer(dt, ff);
      const kA = 1 - Math.exp(-dt / 1.1), kB = 1 - Math.exp(-dt / 0.4);
      for (let i = 0; i < 3; i++) {
        s.target[i] = s.natural[i] + s.steer[i];
        s.windA[i] += (s.target[i] - s.windA[i]) * kA;
        s.windB[i] += (s.target[i] - s.windB[i]) * kB;
      }
    },
    snapshot: () => ({ wind: { x: +((s.windA[0] + s.windB[0]) / 2).toFixed(3), z: +((s.windA[2] + s.windB[2]) / 2).toFixed(3), steer: +Math.hypot(s.steer[0], s.steer[2]).toFixed(3) } }),
    api: {},
  };
})(window.SNOW);

</script>
<script>/* js/sim/events.js */
// =====================================================================================
//  sim/events.js (Phase-3 owner: lane Z, hazards) — the natural hazards: earthquakes, wildfire smoke and lightning
//  strikes, as deterministic timelines. Pure JS: no GL, no DOM. derive/events.js maps the state to uniforms (the flash,
//  the shake, the smoke look, the bolt geometry), precip.js draws the bolts, the dust and the ash / ember particles.
//
//  S.events = { s, init(cfg), step(dt, ff), snapshot(), api }     (stepped in PHYSICAL seconds, after the wind)
//    s.t         the hazard clock (s since boot; advances in fastForward too, exactly like the live steps)
//    s.auto      hazardsAuto: rare quakes and late-summer / autumn wildfires on their own (default false)
//    s.quake     0..1 the quake envelope now x the event's magnitude (P waves, the S-wave main shock, aftershocks;
//                QUAKE_DUR s), s.quakeT its age (s; -1 = none), s.quakeMag the magnitude 0.6..1, s.quakeN the event's
//                counter (its shake noise, dust plumes and cracks), s.crackT the age of the newest cracks (s; -1 = none:
//                they open with the main shock and fade over CRACK_FADE s)
//    s.smoke     0..1 the wildfire-smoke amount now (ramp in, hold, clear; FIRE_DUR s), s.fireT its age (-1 = none),
//                s.fireN the fire's counter (where its columns stand), s.fireClock the time since it broke out (s; a
//                renewal keeps it running: the columns' animation clock never jumps)
//    s.flash     0..1 the lightning flash envelope now (2-4 return strokes over 0.2-0.8 s), s.strikes the strike count,
//                s.strike the last strike { n, t0, kind, az, dist, u, dur, amp, pulses }:
//                  kind  'cg' cloud-to-ground, 'ic' intra-cloud (a crawler under the deck), 'heat' (a distant flash
//                        below the horizon: a strike triggered under a clear sky)
//                  az    azimuth from the camera's forward (rad, + = right), dist (m): a scene-neutral placement; each
//                        scene maps them (derive/events.js), u: six more uniforms for the scene's placement / shape
//                  dur, amp, pulses [[t (s after t0), amplitude]]: the strokes (fast attack, ~45 ms decay)
//    s.nextAuto  the hazard clock of the next automatic quake (hazardsAuto)
//  Lightning: the weather's ch.lightning (0..1; the 'thunder' state, ?wx=lightning:x) is a strike rate of up to
//  1 / STRIKE_MEAN s. A hazard accumulator integrates the rate; natural strike n fires when it reaches -ln(1 - u_n).
//  Every random number is counter based (S.rand(seed, n, 1000 + k); natural strikes, triggered strikes, quakes, fires
//  and the automatic hazards have counters of their own): UI actions, the scene and the speed never shift the natural
//  sequence, and the same ?seed&t give the same strikes.
//  hazardsAuto: quakes every 30-60 min (physical time, uniform); wildfires through a seasonal hazard rate (late summer
//  and autumn, phase ~.38-.74) normalised to about one fire per year at 1x speed, at least FIRE_GAP s apart.
//  API: trigger('quake' | 'wildfire' | 'strike') starts one now (returns the snapshot; unknown kinds do nothing);
//  hazardsAuto (accessor). Boot hook ?event=quake|wildfire|strike (main.js, after ?t).
// =====================================================================================
(function (S) {
  'use strict';
  const { clamp, smooth } = S;
  const QUAKE_DUR = 15, FIRE_DUR = 180, STRIKE_MEAN = 8, CRACK_FADE = 60;
  const QUAKE_GAP = [1800, 3600];          // s between automatic quakes (uniform)
  const FIRE_GAP = 900;                    // s: no automatic fire within this long after the last one ended
  const KINDS = ['quake', 'wildfire', 'strike'];
  const s = { t: 0, auto: false, quake: 0, quakeT: -1, quakeMag: 0, quakeN: 0, crackT: -1, smoke: 0, fireT: -1, fireN: 0, fireClock: 0,
              flash: 0, strikes: 0, strike: null, nextAuto: 0 };
  // nat: the next natural strike's index (its own counter, so a triggered strike never shifts the natural sequence);
  // man: triggered strikes (indices from 1e5); quakes from 2e6, fires from 3e6, the automatic schedule from 1e6 / 4e6
  let seed = 1, acc = 0, quakeT0 = -1e9, crackT0 = -1e9, fireT0 = -1e9, autoIdx = 0, quakeIdx = 0, fireIdx = 0, nat = 0, man = 0;
  let fireAcc = 0, fireAutoIdx = 0, fireStart = 0;
  const R = (n, k) => S.rand(seed, n, 1000 + k);
  const thr = n => -Math.log(1 - R(n, 0) * 0.999999);
  const sq = x => x * x;

  // quake envelope over its age a (s): P waves (a weak, fast tremor, 0-2.5 s), the S-wave main shock (peak ~3-4.5 s,
  // easing out by ~9 s), two aftershocks (~10.6 and 13 s), all gone by QUAKE_DUR
  function quakeEnv(a) {
    if (a < 0 || a > QUAKE_DUR) return 0;
    const p = 0.25 * smooth(0, 1.2, a);
    const sw = smooth(2.2, 3.2, a) * (1 - smooth(4.5, 9.0, a));
    const af = 0.35 * Math.exp(-sq((a - 10.6) / 0.6)) + 0.2 * Math.exp(-sq((a - 13.0) / 0.5));
    return clamp(Math.max(p * (1 - smooth(2.5, 3.5, a)), sw, af), 0, 1) * (1 - smooth(QUAKE_DUR - 1, QUAKE_DUR, a));
  }
  // smoke over the fire's age: ramp in over 25 s, hold, clear over the last 30 s
  const smokeEnv = a => a < 0 || a > FIRE_DUR ? 0 : smooth(0, 25, a) * (1 - smooth(FIRE_DUR - 30, FIRE_DUR, a));
  // a strike's flash envelope over its age a: its pulses (fast attack, ~45 ms decay; a heat flash flickers softer)
  function flashEnv(st, a) {
    if (!st || a < 0 || a > st.dur + 0.4) return 0;
    const tau = st.kind === 'heat' ? 0.07 : 0.045;
    let e = 0;
    for (const [pt, pa] of st.pulses) if (a >= pt) e += pa * Math.exp(-(a - pt) / tau) * smooth(0, 0.008, a - pt);
    return clamp(e, 0, 1);
  }
  // how cloudy the sky is for a triggered strike: under a clear or fair sky it is a distant heat flash instead
  function cloudy() { const c = S.weather.s.ch; return Math.max(c.overcast, c.precip, 0.8 * c.cumulus * c.cloudCov); }
  // strike n (deterministic from the seed and n): its kind, placement, duration, brightness and return strokes. kind:
  // natural strikes are cloud-to-ground (70%) or intra-cloud; a triggered one under a clear sky is heat lightning
  function makeStrike(n, triggered) {
    const heat = triggered && cloudy() < 0.35;
    const kind = heat ? 'heat' : R(n, 6) < 0.3 ? 'ic' : 'cg';
    const np = 2 + Math.floor(R(n, 4) * 3), dur = (heat ? 0.35 : 0.2) + 0.6 * R(n, 3), pulses = [];
    for (let i = 0; i < np; i++) pulses.push([i === 0 ? 0 : dur * (i / np + 0.15 * (R(n, 10 + i) - 0.5)), i === 0 ? 1 : 0.45 + 0.55 * R(n, 20 + i)]);
    // azimuth: biased toward the middle of the view (most strikes are in frame, some only light the clouds aside)
    const ua = 2 * R(n, 1) - 1, az = 1.25 * Math.sign(ua) * Math.pow(Math.abs(ua), 1.35);
    const u = [R(n, 30), R(n, 31), R(n, 32), R(n, 33), R(n, 34), R(n, 35)];
    return { n, t0: s.t, kind, az, dist: 400 * Math.pow(15, R(n, 2)), u, dur, amp: (heat ? 0.35 : 0.6) + 0.4 * R(n, 5), pulses };
  }
  function fire(n, triggered) { s.strike = makeStrike(n, triggered); s.strikes++; }
  // start a hazard now (no envelope update)
  function start(kind) {
    if (kind === 'quake') {
      // a quake during the main shock of another keeps going (no restart of a shaking frame); its cracks restart
      quakeT0 = s.t; s.quakeN = quakeIdx; s.quakeMag = 0.6 + 0.4 * R(2e6 + quakeIdx, 0); quakeIdx++;
    } else if (kind === 'wildfire') {
      if (s.fireT < 0) { s.fireN = fireIdx++; fireT0 = fireStart = s.t; } else fireT0 = s.t - Math.min(s.fireT, 25);   // renewed without dimming
    } else if (kind === 'strike') fire(1e5 + man++, true);
  }
  // the envelopes at s.t
  function envelopes() {
    const qa = s.t - quakeT0;
    s.quakeT = qa <= QUAKE_DUR ? qa : -1;
    s.quake = quakeEnv(qa) * s.quakeMag;
    // the cracks open with the main shock (2.5 s into the quake) and fade over CRACK_FADE s
    if (qa >= 2.5 && qa < 2.5 + CRACK_FADE && crackT0 < quakeT0 + 2.5) crackT0 = quakeT0 + 2.5;
    s.crackT = s.t - crackT0 >= 0 && s.t - crackT0 <= CRACK_FADE ? s.t - crackT0 : -1;
    s.fireT = s.t - fireT0 <= FIRE_DUR ? s.t - fireT0 : -1;
    s.smoke = smokeEnv(s.t - fireT0);
    s.fireClock = s.fireT >= 0 ? s.t - fireStart : 0;
    s.flash = s.strike ? flashEnv(s.strike, s.t - s.strike.t0) * s.strike.amp : 0;
  }
  // the automatic wildfire's seasonal hazard rate (per physical s): late summer and autumn (phase .38-.74), normalised
  // so that a free-running year at 1x (1200 s) integrates to 2: a fire in ~86% of the years (one at most: FIRE_GAP)
  const FIRE_NORM = 1200 * 0.3 / 2;
  const fireGate = ph => smooth(0.36, 0.44, ph) * (1 - smooth(0.66, 0.75, ph));

  S.events = {
    s,
    init(cfg) {
      seed = cfg.seed >>> 0; acc = 0; quakeT0 = crackT0 = fireT0 = -1e9; autoIdx = 0; quakeIdx = 0; fireIdx = 0; nat = 0; man = 0;
      fireAcc = 0; fireAutoIdx = 0; fireStart = 0;
      Object.assign(s, { t: 0, auto: false, quake: 0, quakeT: -1, quakeMag: 0, quakeN: 0, crackT: -1, smoke: 0, fireT: -1, fireN: 0, fireClock: 0,
        flash: 0, strikes: 0, strike: null, nextAuto: 0 });
    },
    step(dt) {
      s.t += dt;
      // lightning: the weather's strike rate, integrated; natural strike nat fires at its threshold
      const rate = clamp(S.weather.s.ch.lightning || 0, 0, 1) / STRIKE_MEAN;
      if (rate > 0) {
        acc += rate * dt;
        while (acc >= thr(nat)) { acc -= thr(nat); fire(nat++, false); }
      }
      // automatic hazards (off by default): quakes every 30-60 min; wildfires in late summer / autumn
      if (s.auto) {
        if (s.t >= s.nextAuto) {
          start('quake'); autoIdx++;
          s.nextAuto = s.t + QUAKE_GAP[0] + (QUAKE_GAP[1] - QUAKE_GAP[0]) * R(1e6 + autoIdx, 1);
        }
        if (s.fireT < 0 && s.t - fireT0 > FIRE_DUR + FIRE_GAP) {
          fireAcc += fireGate(S.climate.s.phase) / FIRE_NORM * dt;
          if (fireAcc >= -Math.log(1 - R(4e6 + fireAutoIdx, 0) * 0.999999)) { fireAcc = 0; fireAutoIdx++; start('wildfire'); }
        }
      }
      envelopes();
    },
    snapshot: () => ({ hazards: { quake: +s.quake.toFixed(4), smoke: +s.smoke.toFixed(4), flash: +s.flash.toFixed(4), strikes: s.strikes,
      lightning: +(S.weather.s.ch.lightning || 0).toFixed(4), auto: s.auto } }),
    api: {
      // start a hazard now: 'quake' (QUAKE_DUR s; a new one restarts it), 'wildfire' (FIRE_DUR s; a running fire is
      // renewed without dimming), 'strike' (one lightning strike, whatever the weather: a distant heat flash under a
      // clear sky). Returns the snapshot
      trigger(kind) {
        kind = String(kind);
        if (KINDS.includes(kind)) { start(kind); envelopes(); }
        return S.events.snapshot();
      },
      get hazardsAuto() { return s.auto; },
      set hazardsAuto(v) {
        const on = !!v;
        if (on && !s.auto) s.nextAuto = s.t + QUAKE_GAP[0] + (QUAKE_GAP[1] - QUAKE_GAP[0]) * R(1e6 + autoIdx, 1);
        s.auto = on;
        if (S.syncUI) S.syncUI();
      },
    },
  };
})(window.SNOW);

</script>
<script>/* js/derive/surface.js */
// =====================================================================================
//  derive/surface.js (stage-1 owner: lane D) — the ground surface: the sim state -> S.F for the SURFACE chunk.
//  Pure JS (no GL, no DOM). Climate: the year phase (vegetation clock) and the season weights; weather: the meadow
//  temperature and whether snow is falling (thaw gate); ground: cover, wetness and the snowline (scene metres; a
//  snowline far below the scene, e.g. the core default -10000 or winter's -1600, leaves effectiveCover() the Phase-1
//  cover).
//
//  S.derive.surface = { init(), step(dt, ff), frame(F), visCover, coverAt(alt) }   frame runs first of the three
//    frame(F)     uCover uWet uSnowline uSeasonW uTemp uGrassDisp uYearPhase uMelt
//    coverAt(alt) the cover level left at altitude alt (m) after this frame's snowline: SURFACE's effectiveCover through
//                 its JS twin S.snowlineOffset (glsl/surface.js, the same constants), without the per-pixel aspect /
//                 noise shift; 0..1. derive/atmos.js keys the exposure to it (it runs after this frame)
//    visCover     coverAt(scene.surface.meadowAlt; the valley's chalet meadow, -50 m): the snow the meadow shows
// =====================================================================================
(function (S) {
  'use strict';
  const GRASS_PERIOD = 2560000 / 45;        // m: 10 periods of the 0.045 grass-wave octave = 27 of the 0.1215 one (SURFACE)
  const snowline = new Float32Array(2), grassDisp = new Float32Array(3);
  const { clamp } = S;

  // the scene's surface profile (S.scene.surface, js/scenes/*.js): snowlineW, the half-width of the snowline transition
  // (uSnowline.y; valley 300 m), and meadowAlt, the altitude of the ground the camera mostly sees (visCover; valley: the
  // chalet meadow, -50 m)
  let cover = 0, line = -10000, width = 300;   // this frame's cover level, snowline and its half-width (coverAt)
  // (stage 2b) A milder ground for a scene whose surface profile has `mild` (the house: a California valley floor rarely
  // holds snow): the scene keeps its own snowline. While snow falls it follows the shared one down (the same patches
  // coming in, the same cover); once the snowfall stops it climbs back to mild.line over ~mild.tau climate-s (faster in
  // sun and in warmth, mild.dT C warmer than the alpine meadow), so the snow melts out of the yard, the sunny lawn
  // first, the shaded roof last, a few minutes after the snow stopped (at 1x). The shared ground and the valley are
  // untouched; a pinned ground (?cover with ?storm=0, ?ground) shows as pinned. Stepped whatever the scene (every
  // derive clock runs), so a switch shows the yard as it is now.
  const mild = {};                             // scene id -> its own snowline (m)
  const pinned = () => S.ground.s.hold || !!S.cfg.ground;
  const snowing = () => S.weather.s.ch.precip * S.weather.s.ch.snowFrac > 0.02;
  function mildInit() {
    for (const id in S.scenes) { const M = S.scenes[id].surface.mild; if (M) mild[id] = snowing() ? S.ground.s.snowline : Math.max(S.ground.s.snowline, M.line); }
  }
  function mildStep(dt) {
    const g = S.ground.s, wx = S.weather.s, dtc = dt * S.climate.s.speed;
    for (const id in mild) {
      const M = S.scenes[id].surface.mild;
      let L = mild[id];
      if (snowing()) { if (g.snowline < L) L += (g.snowline - L) * (1 - Math.exp(-dtc / 8)); }
      else {
        const warm = clamp((wx.temp + M.dT) / 6, 0.3, 2), sun = 1 - wx.ch.overcast;
        L += (M.line - L) * (1 - Math.exp(-dtc * (0.4 + 0.6 * sun) * warm / M.tau));
      }
      mild[id] = L;
    }
  }
  // the snowline the active scene shows (m)
  const sceneLine = () => (mild[S.sceneId] !== undefined && !pinned()) ? Math.max(mild[S.sceneId], S.ground.s.snowline) : S.ground.s.snowline;
  S.derive.surface = {
    visCover: 0,
    coverAt: alt => clamp(cover - S.snowlineOffset(alt, line, width), 0, 1),
    init() { mildInit(); },
    step(dt) { mildStep(dt); },
    frame(F) {
      const g = S.ground.s, w = S.weather.s, P = S.scene.surface;
      F.uCover = g.cover;
      F.uWet = g.wet;
      const sl = sceneLine();
      snowline[0] = sl; snowline[1] = P.snowlineW; F.uSnowline = snowline;
      F.uSeasonW = S.climate.s.seasonW;
      F.uYearPhase = S.climate.s.phase;
      F.uTemp = w.temp;
      // thaw gate: fresh snow keeps falling on top -> no melt look and no melt order while it snows
      F.uMelt = 1 - clamp(3 * w.ch.precip * w.ch.snowFrac, 0, 1);
      // the snow the meadow shows after the snowline (the shared offset model, see coverAt)
      cover = g.cover; line = sl; width = P.snowlineW;
      S.derive.surface.visCover = S.derive.surface.coverAt(P.meadowAlt);
      // grass-wave displacement, wrapped at the common period of its two noise octaves (0.045 and 0.1215 = 2.7 x 0.045
      // per metre on a 256-periodic texture: 10 and 27 periods respectively), so the sheen never jumps
      for (let i = 0; i < 3; i++) grassDisp[i] = S.anim.dispA[i] % GRASS_PERIOD;
      F.uGrassDisp = grassDisp;
    },
  };
})(window.SNOW);

</script>
<script>/* js/derive/precip.js */
// =====================================================================================
//  derive/precip.js (stage-1 owner: lane E; Phase 3: lane Z) — precipitation: the sim state -> S.F (rates, curtain, wet snow, the
//  distant veils and rain curtains, the flake / rain shutters, fall factors, wind and clocks), and the
//  precipitation clocks. Pure JS (no GL, no DOM). Reads S.weather.s (ch.precip, ch.snowFrac, ch.heavy, ch.gale,
//  temp, curtain, white, tail) and S.wind.s; the counts (precip.js) scale the rates with S.amountMul().
//
//  S.derive.precip = { init(), step(dt, ff), frame(F) }       frame runs second (after surface, before atmos)
//    init / step   the clocks, all integrals over PHYSICAL time (a rate change never jumps a phase or a particle):
//                  S.anim.fallI  snow fall integral (fall factor kS; uFallV = kS = d fallI / dt)
//                  S.anim.tumI   tumble integral (uTumT, wrapped by TW = 120)
//                  S.anim.rainI  rain fall integral (fall factor kR; uRainV = kR = d rainI / dt)
//                  S.anim.ashI, emberI  the wildfire ash / ember fall integrals (factor 1: their speed ranges are in
//                  the layer descriptors, embers' negative: they rise)
//                  S.anim.veilI[4] snow veil scroll, veilR[4] rain veil scroll, gustR[2] rain gust bands: wrapped by the
//                  256 noise period; like Phase 1's veil they hold during fastForward
//                  The wet-snow factor is slewed in physical time (tau 4 s): it scales non-integrated amplitudes
//                  (flutter, size), so a jump in temperature (a pick at 8x, a test hook) cannot jerk the flakes.
//    frame(F)      uSnowCurtain uPrecipSnow uPrecipRain uSnowFrac uGale uHeavy uWetSnow
//                  uVeilDir uVeilAmt uVeilT (snow veil), uRainDir uRainVeil uRainT uRainShaft (rain veil + curtains)
//                  uExpo uFallV uTumT (flakes), uExpoRain uRainV uRainGust (rain), uWindA uWindB uFlakeT
// =====================================================================================
(function (S) {
  'use strict';
  const { lerp, smooth, camR, worldR } = S;
  const veilDir = new Float32Array(2), veilT = new Float32Array(4);
  const rainDir = new Float32Array(2), rainT = new Float32Array(4), rainShaft = new Float32Array(4), rainGust = new Float32Array(2);
  // wet snow (big heavy aggregates) from the meadow temperature: only in the thaw band above the freezing point,
  // where the flakes partly melt and stick together (the sleet zone: snowFrac ramps out over 1..3 deg C), and only
  // partially (at most WET_MAX of the crystals turn into clumps, so crisp six-armed crystals keep falling between the
  // aggregates). Below +0.4 deg C the snow is the dry Phase-1 snowfall (the late-autumn opening at about -2.5 deg C);
  // above ~2.6 deg C the last few flakes stay dry
  const WET_MAX = 0.6;
  const wetOf = T => WET_MAX * smooth(0.4, 1.5, T) * (1 - smooth(2.1, 2.6, T));
  // fall factors (one source of truth for the integrals and the shaders' velocities): the blizzard curtain and wet
  // clumps fall faster (wet snow ~1.5-2.4 m/s); heavy rain has slightly bigger, faster drops
  const snowK = (c, w) => 1 + 0.9 * c + 0.8 * w;
  const rainK = r => 1 + 0.06 * r;
  const RAIN_V = 7.2;                         // m/s: typical drop speed, for the apparent slant of the distant rain
  const st = { wet: 0, kS: 1, kR: 1 };
  const rainRate = ch => ch.precip * (1 - ch.snowFrac);

  S.derive.precip = {
    init() {
      const a = S.anim, wx = S.weather.s;
      a.fallI = 0; a.tumI = 0; a.rainI = 0; a.ashI = 0; a.emberI = 0; a.veilI = [0, 0, 0, 0]; a.veilR = [0, 0, 0, 0]; a.gustR = [0, 0];
      st.wet = wetOf(wx.temp); st.kS = snowK(wx.curtain, st.wet); st.kR = rainK(rainRate(wx.ch));
    },
    step(dt, ff) {
      const a = S.anim, wx = S.weather.s, c = wx.curtain;
      st.wet += (wetOf(wx.temp) - st.wet) * (1 - Math.exp(-dt / 4));
      st.kS = snowK(c, st.wet); st.kR = rainK(rainRate(wx.ch));
      // shader clocks as integrals (so storm ramps / wind changes never jump a phase): fall, tumble, rain
      a.fallI += st.kS * dt;
      a.tumI += (1 + 0.8 * c) * (1 - 0.5 * st.wet) * dt;
      a.rainI += st.kR * dt;
      a.ashI += dt; a.emberI += dt;
      if (ff) return;
      // (the scroll integrals take the lateral wind in the world's reference frame, S.worldR: the valley's camera, so
      // they never depend on the scene shown; frame() below uses the live camera for the directions on screen)
      const w = S.wind.s.windA, wl = w[0] * worldR[0] + w[2] * worldR[2];
      const vdx = wl / (1.2 + 1.5 * c), vl = Math.hypot(vdx, 1);             // apparent fall direction of the distant veil
      const vI = a.veilI;
      vI[0] = (vI[0] + (2.2 + 4.0 * c) * dt) % 256; vI[1] = (vI[1] + (1.4 + 2.6 * c) * dt) % 256;
      vI[2] = (vI[2] + (0.05 - 0.25 * vdx / vl) * dt) % 256; vI[3] = (vI[3] + 0.25 / vl * dt) % 256;
      // rain veil: the grain sheets fall fast along the rain's apparent direction, the density drifts with the wind
      const rdx = wl / (RAIN_V * st.kR), rl = Math.hypot(rdx, 1), vR = a.veilR;
      vR[0] = (vR[0] + 2.6 * st.kR * dt) % 256; vR[1] = (vR[1] + 1.2 * st.kR * dt) % 256;
      vR[2] = (vR[2] + (0.02 - 0.12 * rdx / rl) * dt) % 256; vR[3] = (vR[3] + 0.05 / rl * dt) % 256;
      // rain gust bands sweep downwind (screen x) and drift down a little
      const g = a.gustR;
      g[0] = (g[0] - (0.05 * wl) * dt) % 256; g[1] = (g[1] + 0.06 * dt) % 256;
    },
    frame(F) {
      const wx = S.weather.s, ch = wx.ch, c = wx.curtain, a = S.anim, w = S.wind.s;
      const pr = ch.precip * (1 - ch.snowFrac);
      F.uSnowCurtain = c;
      F.uPrecipSnow = ch.precip * ch.snowFrac;
      F.uPrecipRain = pr;
      F.uSnowFrac = ch.snowFrac; F.uGale = ch.gale; F.uHeavy = ch.heavy;
      F.uWetSnow = st.wet;
      const wl = w.windA[0] * camR[0] + w.windA[2] * camR[2];
      // the distant snow veil (VEIL): apparent fall direction, amount (Phase 1's faint floor scaled by the snowfall
      // rate, + the whiteout, + the residual veil while a storm clears, gated by the snowfall like the atmosphere's
      // tail extinction (derive/atmos.js): 0 in dry weather), scroll
      veilDir[0] = wl / (1.2 + 1.5 * c); veilDir[1] = -1.0; F.uVeilDir = veilDir;
      F.uVeilAmt = 0.012 * Math.min(1, F.uPrecipSnow) + 0.18 * smooth(0, 1, wx.white) + 0.04 * wx.tail * smooth(0, 0.3, F.uPrecipSnow);
      for (let i = 0; i < 4; i++) veilT[i] = a.veilI[i];
      F.uVeilT = veilT;
      // the rain veil and the far rain curtains (VEIL): the faint mid-distance grain, and grey shafts hanging under
      // the cloud base (optical depth per km from the rain rate; slant = the wind over the drop speed)
      rainDir[0] = wl / (RAIN_V * st.kR); rainDir[1] = -1.0; F.uRainDir = rainDir;
      const ra = 0.6 + 0.4 * S.amountMul();             // the user's amount thins / thickens the distant rain too
      F.uRainVeil = 0.05 * smooth(0, 0.8, pr) * (1 + 0.5 * ch.gale) * ra;
      for (let i = 0; i < 4; i++) rainT[i] = a.veilR[i];
      F.uRainT = rainT;
      rainShaft[0] = 0.24 * smooth(0, 1, pr) * (0.7 + 0.6 * pr) * ra;   // (stage 2b: the far curtains read over the valley)
      rainShaft[1] = 1 - ch.overcast;                   // sunlit share: shafts under broken cloud catch the sun
      // the slant of the distant curtains (clamped: a gale lays them over by at most ~40 deg)
      const sl = Math.min(1, 0.85 / Math.max(1e-6, Math.hypot(w.windA[0], w.windA[2]) / RAIN_V));
      rainShaft[2] = w.windA[0] / RAIN_V * sl; rainShaft[3] = w.windA[2] / RAIN_V * sl;
      F.uRainShaft = rainShaft;
      // flakes: calm = fast shutter, crisp hero crystals; rain: a slow shutter, so a drop is the streak of its path
      // (~1.3 frames of motion at 60 fps: consecutive frames join into continuous rain)
      F.uExpo = lerp(1 / 220, 1 / 55, smooth(0, 1, c));
      F.uFallV = st.kS;
      F.uExpoRain = 1 / 45;
      F.uRainV = st.kR;
      rainGust[0] = a.gustR[0]; rainGust[1] = a.gustR[1]; F.uRainGust = rainGust;
      F.uWindA = w.windA; F.uWindB = w.windB;
      F.uFlakeT = a.time % 120; F.uTumT = a.tumI % 120;
    },
  };
})(window.SNOW);

<script>/* js/derive/atmos.js */
// =====================================================================================
//  derive/atmos.js (stage-1 owner: lane C) — sky, light and atmosphere: the sim state -> S.F, and the cloud drift
//  integral. Pure JS (no GL calls, no DOM). The single place that maps the weather channels, the season and the ground
//  to the light: sun / ambient / sky / fog colours, haze and extinction, the valley mist and the fog sea, the cloud
//  slab, cloud-shadow strength, exposure, white balance and grade.
//
//  Palette model: four season keys of the clear-day palette (winter = the Phase-1 palette exactly), blended by the
//  season weights. Falling snow pulls the keys toward winter (snow air is cold and clean), which keeps the Phase-1
//  anchor (?wx= Phase-1 channels) on the Phase-1 palette whatever the date. Weather then moves the clear palette:
//  `od` (smoothed overcast) toward an overcast palette keyed by the ground / precipitation (snow-lit grey = Phase-1
//  storm, wet-meadow grey for rain, bright soft grey for fog days), haze and mist densities follow fog / rain / storm.
//
//  S.derive.atmos = { init(), step(dt, ff), frame(F) }
//    init / step   S.anim.cloud: the integrated cloud drift (m, never wrapped). It follows the NATURAL wind only
//                  (S.wind.s.natural, low-passed over ~25 s so gusts do not jerk the sky), never the pointer steer.
//                  Clouds and their ground shadows move WITH the wind: the shaders sample q = p.xz + uCloudOff, so the
//                  offset integrates minus the cloud velocity.
//    frame(F)      runs last of the three derive frames (after surface and precip), so it may read F.uCover / F.uWet
//                  and F.uSnowCurtain (then the scene's derive and derive/events.js may adjust what it set). The
//                  scene-specific numbers (exposure cover keys, the mist / fog-sea profile, the cloud cuts of the
//                  composition) come from S.scene.atmos (js/scenes/*.js):
//                  uSunCol uSkyAmb uSkyZen uSkyHor uFogCol uFogP uCloudOff uCloudCov uOvercast uCumulus uFogDay uMistP
//                  uCirrus uShadowAmp uExposure uBloomStr, and lane C's own: uHorBand uCloudP uCloudQ uMistQ, uSkyResp
//                  (sky pass), uGrade / uGradeP (composite)
// =====================================================================================
(function (S) {
  'use strict';
  const { lerp, smooth, clamp } = S;

  const lighting = S.lighting = { sun: new Float32Array(3), amb: new Float32Array(3), zen: new Float32Array(3), hor: new Float32Array(3), fog: new Float32Array(3), fogP: new Float32Array(4) };
  // storm: the horizon sky is snow-lit and brighter than the whiteout inscatter (fog), so fogged rock reads as a
  // grey silhouette against it instead of merging with the sky. LIT[0] = the Phase-1 clear palette (the winter key),
  // LIT[1] = the Phase-1 storm palette (snow-lit grey: snow falling or lying)
  const LIT = { amb: [[0.30, 0.40, 0.60], [0.46, 0.50, 0.57]], zen: [[0.10, 0.25, 0.64], [0.40, 0.44, 0.50]], hor: [[0.36, 0.50, 0.78], [0.56, 0.60, 0.66]], fog: [[0.44, 0.56, 0.80], [0.44, 0.48, 0.54]] };
  function mix3(o, a, b, t) { o[0] = lerp(a[0], b[0], t); o[1] = lerp(a[1], b[1], t); o[2] = lerp(a[2], b[2], t); }
  // Storm extinction (Phase 1): plateaus at ~0.00011 (with the storm haze: T ~0.5 at the 3 km wall, ~0.65 at the
  // 1.5 km forest band), only the gust peaks (wd -> 1) push it x5 to a true whiteout; the tail keeps a faint floor
  function stormExt(wd, tail) { return 0.00012 * Math.pow(wd, 1.5) * (1 + 4.0 * smooth(0.95, 1.0, wd)) + 0.00008 * tail; }

  // ---- season keys: [spring, summer, autumn, winter], linear radiance. Winter is the Phase-1 clear day.
  //   spring: fresh, clean blue light, a little valley mist; summer: strong warm sun, milky haze, a pale horizon;
  //   autumn: golden low light (warm sun, warm haze band) under a deep clear sky; winter: crisp blue, cold balance
  const SEASON = {
    sunI: [3.15, 3.35, 2.95, 3.1],
    sun: [[1.0, 0.965, 0.91], [1.0, 0.958, 0.87], [1.0, 0.87, 0.68], [1.0, 0.955, 0.89]],
    amb: [[0.30, 0.41, 0.60], [0.33, 0.41, 0.55], [0.32, 0.36, 0.48], LIT.amb[0]],
    zen: [[0.10, 0.27, 0.66], [0.13, 0.29, 0.62], [0.08, 0.22, 0.62], LIT.zen[0]],
    // (stage 2b: deeper clear-day skies: the summer milk is a light veil over blue, not grey; autumn air is clear)
    hor: [[0.38, 0.53, 0.80], [0.42, 0.56, 0.80], [0.36, 0.48, 0.76], LIT.hor[0]],
    fog: [[0.43, 0.57, 0.82], [0.50, 0.60, 0.77], [0.44, 0.54, 0.74], LIT.fog[0]],
    band: [[0.72, 0.78, 0.87], [0.82, 0.83, 0.84], [0.86, 0.80, 0.70], [0.70, 0.76, 0.86]],   // pale haze band at the horizon
    haze: [1 / 36000, 1 / 24000, 1 / 36000, 1 / 42000],      // haze density at y = 0 (1/m)
    hazeH: [2300, 2700, 2300, 2200],                          // haze scale height (m): summer convective, winter inversion
    mist: [1 / 26000, 1 / 34000, 1 / 28000, 1 / 30000],     // valley mist at its reference level (1/m)
    wb: [[0.985, 1.0, 1.015], [1.01, 1.0, 0.985], [1.02, 1.0, 0.97], [0.97, 1.0, 1.035]],  // white balance (composite)
  };
  // overcast palettes (amb, zen, hor, fog): a wet green meadow under a low grey deck (cool, not murky), a dry
  // overcast, and a bright soft fog day; the snow-lit grey is LIT[1]. The deck stays darker than the Phase-1
  // snow-lit sky so its structure reads after the exposure lift
  const RAINP = { amb: [0.30, 0.34, 0.40], zen: [0.24, 0.27, 0.31], hor: [0.36, 0.39, 0.44], fog: [0.36, 0.39, 0.44] };
  const DULLP = { amb: [0.36, 0.39, 0.45], zen: [0.34, 0.37, 0.42], hor: [0.50, 0.52, 0.56], fog: [0.48, 0.51, 0.56] };
  const FOGP = { amb: [0.42, 0.45, 0.51], zen: [0.46, 0.50, 0.57], hor: [0.66, 0.69, 0.74], fog: [0.64, 0.67, 0.72] };

  const tmp = { a: [0, 0, 0], b: [0, 0, 0], c: [0, 0, 0] };
  // season blend of a key table into o
  function seasonMix(o, keys, w) {
    for (let i = 0; i < 3; i++) o[i] = keys[0][i] * w[0] + keys[1][i] * w[1] + keys[2][i] * w[2] + keys[3][i] * w[3];
    return o;
  }
  const sMix1 = (keys, w) => keys[0] * w[0] + keys[1] * w[1] + keys[2] * w[2] + keys[3] * w[3];
  const lum = c => 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2];

  // frame outputs (lane C's own uniforms are declared in ATMOS / FS_SKY / FS_COMP)
  const horBand = new Float32Array(3), mistP = new Float32Array(4), mistQ = new Float32Array(4);
  const cloudP = new Float32Array(4), cloudQ = new Float32Array(4), cloudOff = new Float32Array(2);
  const grade = new Float32Array(3), gradeP = new Float32Array(3);
  const sw = new Float32Array(4);
  // the exposure reference: horizontal irradiance proxy of the Phase-1 clear day (sun x 0.5 + ambient)
  const E_REF = 0.5 * 3.1 * lum([1.0, 0.955, 0.89]) + lum(LIT.amb[0]);
  const last = new Float32Array(6);        // previous frame's cloud inputs (EMA reset on a jump)
  let haveLast = false;
  let cv = null;                           // low-passed cloud velocity (m/s, xz)

  S.derive.atmos = {
    init() { S.anim.cloud = [0, 0]; cv = null; haveLast = false; },
    step(dt) {
      // cloud velocity: 3x the natural (no pointer) wind plus 10 m/s along it, low-passed over ~25 s
      const n = S.wind.s.natural, nl = Math.hypot(n[0], n[2]);
      const ux = nl > 1e-3 ? n[0] / nl : 1, uz = nl > 1e-3 ? n[2] / nl : 0;
      const tx = 3 * n[0] + 10 * ux, tz = 3 * n[2] + 10 * uz;

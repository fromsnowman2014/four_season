const GB_MARCH = 900, GB_BISECT = 6, GB_HEIGHT = 1, GB_NORMAL = 8, GB_SHADOW = 110, GB_AO = 5, GB_CANOPY = 1, GB_CURV = 8;
const GB_ITER = GB_MARCH + GB_BISECT + GB_HEIGHT + GB_NORMAL + GB_SHADOW + GB_AO + GB_CANOPY + GB_CURV;

// bind the G-buffer(s) for a per-frame pass (see GBUF): uG* = shown buffer, uN* = the one being baked, uGb = how to mix them
function bindGB(u, unit0) {
  const cur = R.gbCur || R.gbNext, nxt = R.gbNext || R.gbCur;
  const frac = !R.gbNext ? 0 : R.gbDone < 0 ? R.gbRow / R.gbNext.h : 1 + 0.08 * Math.min(1, (sim.wall - R.gbDone) / 0.3);
  for (let i = 0; i < 3; i++) {
    if (u['uG' + i]) bindTex(unit0 + i, cur.texs[i], u['uG' + i]);
    if (u['uN' + i]) bindTex(unit0 + 3 + i, nxt.texs[i], u['uN' + i]);
  }
  gl.uniform3f(u.uGb, R.gbAsp, frac, !R.gbNext ? 0 : R.gbCur ? 1 : 2);
}

function render() {
  const W = R.W, H = R.H, Ws = R.Ws, Hs = R.Hs;
  if (!R.gbCur && !R.gbNext) return;
  // ---- 1. progressive G-buffer: one stripe per frame, sized by adaptStripe() so the frame keeps its budget. When the
  // last stripe lands the buffers are kept 0.3 s longer (the reveal edge clears the top), then swapped
  if (R.gbNext) {
    const g = R.gbNext;
    if (R.gbDone < 0) {
      gl.bindFramebuffer(gl.FRAMEBUFFER, g.fbo);
      gl.viewport(0, 0, g.w, g.h);
      gl.enable(gl.SCISSOR_TEST);
      gl.scissor(0, R.gbRow, g.w, R.gbRows);
      gl.useProgram(P.gbuf.p);
      setCommon(P.gbuf.u, g.w, g.h);
      gl.uniform1f(P.gbuf.u.uPixAng, 2 * TANH / g.h);
      gl.uniform1i(P.gbuf.u.uIter, GB_ITER);
      drawFull();
      gl.disable(gl.SCISSOR_TEST);
      R.gbRow += R.gbRows; R.bakeFrame = true;
      if (R.gbRow >= g.h) R.gbDone = sim.wall;
    } else if (sim.wall - R.gbDone >= 0.3) {
      freeRT(R.gbCur); R.gbCur = g; R.gbNext = null; R.gbAsp = 1;
      buildMs = performance.now() - buildStart;      // wall time from allocate() to the swap: what the viewer waited
      perf.skip = 2;                                  // the next dt still carries the last stripe
      if (readyTime < 0) readyTime = sim.wall;
    }
  }

  // ---- 2. sky + clouds (half res, temporal accumulation)
  const sp = R.sky[R.skyI], sc = R.sky[1 - R.skyI];
  gl.bindFramebuffer(gl.FRAMEBUFFER, sc.fbo);
  gl.viewport(0, 0, sc.w, sc.h);
  gl.useProgram(P.sky.p);
  setCommon(P.sky.u, sc.w, sc.h);
  bindTex(0, sp.texs[0], P.sky.u.uPrev); bindTex(1, sp.texs[1], P.sky.u.uPrevD);
  gl.uniform1f(P.sky.u.uBlend, R.skyReset ? 1.0 : 0.3);
  gl.uniform1f(P.sky.u.uFrame, (FIXED ? Math.round(sim.time * 60) : frameNo) % 64);
  gl.uniform1f(P.sky.u.uSteps, perf.skySteps);
  drawFull();
  R.skyReset = false; R.skyI = 1 - R.skyI;

  // ---- 3. scene shading (at the render scale; the G-buffer is sampled by normalised uv)
  gl.bindFramebuffer(gl.FRAMEBUFFER, R.scene.fbo);
  gl.viewport(0, 0, Ws, Hs);
  gl.useProgram(P.shade.p);
  setCommon(P.shade.u, Ws, Hs);
  bindGB(P.shade.u, 8);
  bindTex(3, sc.texs[0], P.shade.u.uSky); bindTex(4, sc.texs[1], P.shade.u.uSkyD);
  // grass-wave displacement, wrapped at the common period of its two noise octaves (0.045 and 0.1215 = 2.7 x 0.045
  // per metre on a 256-periodic texture: 10 and 27 periods respectively), so the sheen never jumps
  for (let i = 0; i < 3; i++) grassDisp[i] = sim.dispA[i] % GRASS_PERIOD;
  gl.uniform3fv(P.shade.u.uGrassDisp, grassDisp);
  const wl = (sim.windA[0] * camR[0] + sim.windA[2] * camR[2]);
  const fallS = 1.2 + 1.5 * sim.storm;
  gl.uniform2f(P.shade.u.uVeilDir, wl / fallS, -1.0);
  gl.uniform1f(P.shade.u.uVeilAmt, 0.012 + 0.18 * smooth(0, 1, sim.white) + 0.04 * sim.tail);   // + residual veil while a storm clears
  for (let i = 0; i < 4; i++) veilT[i] = sim.veilI[i];
  gl.uniform4fv(P.shade.u.uVeilT, veilT);
  gl.uniform3f(P.shade.u.uSway, wl, sim.swayPh, Hs * 0.5 / TANH);
  drawFull();

  // ---- 4. FXAA -> hdr
  gl.bindFramebuffer(gl.FRAMEBUFFER, R.hdr.fbo);
  gl.useProgram(P.fxaa.p);
  bindTex(0, R.scene.texs[0], P.fxaa.u.uTex);
  gl.uniform2f(P.fxaa.u.uInv, 1 / Ws, 1 / Hs);
  drawFull();

  // ---- 5. snowflakes
  {
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
    gl.useProgram(P.flake.p);
    const u = P.flake.u;
    setCommon(u, Ws, Hs);
    bindGB(u, 8);
    gl.uniform1f(u.uAspect, Ws / Hs);
    gl.uniform1f(u.uFocalPx, Hs * 0.5 / TANH);
    gl.uniform1f(u.uExpo, lerp(1 / 220, 1 / 55, smooth(0, 1, sim.storm)));   // calm: fast shutter, crisp hero crystals
    // focus at 1.3 m with a gentle circle of confusion: the hero tier (0.9-2.4 m) is sharp, only the near discs defocus
    gl.uniform1f(u.uCocK, 12 * Hs / 1080);
    gl.uniform1f(u.uFocus, 1.3);
    gl.uniform3fv(u.uWindA, sim.windA); gl.uniform3fv(u.uWindB, sim.windB);
    gl.uniform1f(u.uFallV, 1 + 0.9 * sim.storm);
    gl.uniform1f(u.uFlakeT, sim.time % 120); gl.uniform1f(u.uTumT, sim.tumI % 120);
    gl.uniform1ui(u.uSeed, SEED);
    const n = mouse.segs.length;
    for (let i = 0; i < n; i++) { const m = mouse.segs[i]; msArr[i * 4] = m.x; msArr[i * 4 + 1] = m.y; msArr[i * 4 + 2] = m.dx; msArr[i * 4 + 3] = m.dy; maArr[i] = sim.wall - m.t; }
    gl.uniform4fv(u.uMs, msArr); gl.uniform1fv(u.uMa, maArr); gl.uniform1i(u.uMn, n);
    const dens = amountMul() * perf.flakeMul;
    let total = 0;
    for (const L of LAYERS) {
      const cnt = Math.min(L.max * perf.flakeMul, L.base * dens * (1 + (L.storm - 1) * sim.storm));   // the cap thins too, or the rung is a no-op in a blizzard
      const ni = Math.ceil(cnt);
      if (ni <= 0) continue;
      wrapLayer(L);
      gl.uniform3fv(u.uDispA, L.dA); gl.uniform3fv(u.uDispB, L.dB); gl.uniform3fv(u.uFallQ, L.fall);
      gl.uniform1i(u.uLayer, L.id);
      gl.uniform3f(u.uSlice, L.z0, L.z1, L.fade);
      gl.uniform2f(u.uHalfXY, L.hx, L.hy);
      gl.uniform1f(u.uCount, cnt);
      gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, ni);
      total += ni;
    }
    sim.flakeCount = total;
    gl.disable(gl.BLEND);
  }

  // ---- 6. bloom
  gl.useProgram(P.down.p);
  let src = R.hdr;
  for (let i = 0; i < R.bloom.length; i++) {
    const d = R.bloom[i];
    gl.bindFramebuffer(gl.FRAMEBUFFER, d.fbo); gl.viewport(0, 0, d.w, d.h);
    bindTex(0, src.texs[0], P.down.u.uSrc);
    gl.uniform2f(P.down.u.uSrcInv, 1 / src.w, 1 / src.h); gl.uniform2f(P.down.u.uDstRes, d.w, d.h);
    gl.uniform1f(P.down.u.uThresh, i === 0 ? 1.15 : 0.0);
    drawFull(); src = d;
  }
  gl.useProgram(P.up.p);
  gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE);
  for (let i = R.bloom.length - 1; i > 0; i--) {
    const s = R.bloom[i], d = R.bloom[i - 1];
    gl.bindFramebuffer(gl.FRAMEBUFFER, d.fbo); gl.viewport(0, 0, d.w, d.h);
    bindTex(0, s.texs[0], P.up.u.uSrc);
    gl.uniform2f(P.up.u.uSrcInv, 1 / s.w, 1 / s.h); gl.uniform2f(P.up.u.uDstRes, d.w, d.h);
    drawFull();
  }
  gl.disable(gl.BLEND);

  // ---- 7. composite (canvas resolution; the hdr / bloom textures are bilinearly upsampled)
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, W, H);
  gl.useProgram(P.comp.p);
  bindTex(0, R.hdr.texs[0], P.comp.u.uHdr); bindTex(1, R.bloom[0].texs[0], P.comp.u.uBloom);
  bindGB(P.comp.u, 2);     // sparkle: snow threshold / distance / sun shadow; reveal edge
  gl.uniform2f(P.comp.u.uRes, W, H);
  gl.uniform1f(P.comp.u.uCover, sim.coverage);
  gl.uniform1f(P.comp.u.uTwinkleT, sim.time % 3600);
  gl.uniform3fv(P.comp.u.uSunCol, lighting.sun);
  // full cover drops the exposure further so sunlit snow sits below the ACES shoulder and keeps its form
  gl.uniform1f(P.comp.u.uExposure, lerp(1.0, 0.54, Math.pow(sim.coverage, 1.3)) * lerp(1.0, 1.05, sim.storm));
  gl.uniform1f(P.comp.u.uBloomStr, 0.12);
  // grain clock: the frame index modulo 1024 (fract(x * 0.618) loses its 1-px randomness once x reaches ~2e6)
  gl.uniform1f(P.comp.u.uFrame, FIXED ? Math.round(sim.time * 60) % 1024 : frameNo % 1024);
  gl.uniform1f(P.comp.u.uStorm, sim.sky);     // grade desaturation and sparkle suppression follow the overcast front
  drawFull();
}

// quality controller (see perf), once per PERF_WIN frames of a ready, bake-free scene; the 2 frames after a bake are
// skipped (they still carry the last stripe). perf.frameMs, the display's frame period estimate, also sets the
// rebake stripe budget (adaptStripe)
function controller(dt) {
  if (perf.skip > 0) { perf.skip--; return; }
  perf.dts[perf.n++] = dt;
  if (perf.n < PERF_WIN) return;
  perf.n = 0;
  let sum = 0; for (let i = 0; i < PERF_WIN; i++) sum += perf.dts[i];
  perf.dts.sort();                                           // Float32Array: numeric
  const floor = Math.max(4, perf.dts[PERF_WIN / 10] * 1000), avg = sum / PERF_WIN * 1000;
  perf.frameMs = floor; perf.avgMs = avg;
  if (perf.cool > 0) { perf.cool--; return; }
  if (avg > 21.5 && avg > 1.2 * floor) {
    perf.good = 0;
    if (perf.level < 5) { setLevel(perf.level + 1); perf.cool = 2; perf.goodNeed = Math.min(80, perf.goodNeed * 2); }
  } else if (avg <= 1.02 * floor && perf.level > 0) {
    if (++perf.good >= perf.goodNeed) { setLevel(perf.level - 1); perf.good = 0; perf.cool = 2; }
  } else perf.good = 0;
}

function frame() {
  requestAnimationFrame(frame);
  const now = performance.now() / 1000;
  let dt = clamp(now - lastNow, 0, 0.1); lastNow = now;   // clamp tab switches / stalls
  if (R.bakeFrame) { adaptStripe(dt); R.bakeFrame = false; }   // dt is the cost of the previous (stripe) frame
  if (FIXED) dt = 1 / 60;
  if (dt > 0) { sim.fps = lerp(sim.fps, 1 / Math.max(dt, 1e-3), 0.05); }
  update(dt);
  if (!ctxLost) {
    render();
    if (!FIXED && readyTime >= 0 && sim.wall - readyTime > 3 && !R.gbNext) controller(dt);
  }
  updateUI();
  // (only when no resize is already pending, so this check can never keep pushing a pending one back)
  if (frameNo % 30 === 0 && !ctxLost && !resizeTimer) { const [W, H] = targetSize(); if (W !== R.W || H !== R.H) scheduleAllocate(); }
  frameNo++;
}
fastForward();
try { initGL(); } catch (e) { fatal('초기화 실패: ' + e.message); }
sim.white = whiteoutAt(stormAt(sim.time), sim.time);
updateLighting(sim.sky, sim.white, sim.tail);
requestAnimationFrame(frame);
</script>

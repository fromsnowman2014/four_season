// the shared cover model (= SURFACE's effectiveCover; the constants are S.SNOWLINE, the JS twin S.snowlineOffset)
float houseCover(float alt, float sunExp, vec2 xz) {
  float a = alt - 320.0 * (sunExp - 0.45) + 60.0 * (tnoise(xz * 0.05 + 3.7) - 0.5);
  return uCover - ${f(SL.K)} * (1.0 - smoothstep(uSnowline.x - uSnowline.y, uSnowline.x + uSnowline.y, a))
                - ${f(SL.K2)} * (1.0 - smoothstep(uSnowline.x - ${f(SL.LO)}, uSnowline.x - ${f(SL.HI)}, a));
}
// the decoded G3 alpha: shelter (under the eaves) and the bare variant's twig haze
float hShelter(float a) { return step(0.5, a); }
float hHaze(float a) { return sat(2.0 * a - step(0.5, a)); }
// a ray direction in pixels of a 1350-row frame (resolution-independent screen noise for the twig haze)
vec2 hScreen(vec3 rd) { return vec2(dot(rd, uCamR), dot(rd, uCamU)) / max(dot(rd, uCamF), 1e-3) * (675.0 / uTanH); }
vec2 hProj(vec3 p) {
  vec3 v = p - uCamPos; float z = max(dot(v, uCamF), 1e-3);
  return vec2(dot(v, uCamR) / (z * uTanH * uRes.x / uRes.y), dot(v, uCamU) / (z * uTanH)) * 0.5 + 0.5;
}
bool hOnScreen(vec2 s) { return s.x >= 0.0 && s.x <= 1.0 && s.y >= 0.0 && s.y <= 1.0; }
// the sky seen along r (a reflection): the analytic sky with its deck structure and haze (skyPixel), with the clouds of
// the cloud pass where r points at an on-screen sky pixel
vec3 hSkyR(vec3 r) {
  vec4 cl = vec4(0.0, 0.0, 0.0, 1.0);
  vec2 s = hProj(uCamPos + r * 5000.0);
  if (r.y > 0.0 && hOnScreen(s) && G0(s).x > 60000.0) cl = textureLod(uSkyH, s, 0.0);
  return sceneSky(normalize(vec3(r.x, max(r.y, 0.004), r.z)), cl);
}
// screen-space reflection of the previous frame along r from the wet point p: a G0 depth march in geometrically
// growing steps (no per-pixel jitter: no stipple), a hit where the ray passes behind the depth by less than about one
// step (thin objects are not walls), a 5-step refinement, a roughness blur growing with the travelled distance;
// w: the hit weight (0 = none: the caller uses the sky)
vec3 hSSR(vec3 p, vec3 r, float rough, out float w) {
  w = 0.0;
  float s = 0.15, sPrev = 0.0;
  for (int i = 0; i < 32; i++) {        // (reach 0.15 x 1.19^32 ~ 40 m)
    vec3 q = p + r * s;
    vec2 su = hProj(q);
    if (!hOnScreen(su)) break;
    float tS = G0(su).x, dS = length(q - uCamPos);
    if (dS > tS + 0.01 && dS < tS + 0.3 + 1.1 * (s - sPrev)) {
      float a = sPrev, b = s;
      for (int k = 0; k < 5; k++) { float m = 0.5 * (a + b); vec3 qm = p + r * m; if (length(qm - uCamPos) > G0(hProj(qm)).x + 0.01) b = m; else a = m; }
      su = hProj(p + r * b);
      // (wet ground smears a reflection into vertical streaks: the blur is ~3x taller than wide)
      vec2 bl = vec2(0.35 * uRes.y / uRes.x, 1.0) * rough * min(b, 12.0) * 0.0024;
      vec3 c = 0.25 * (textureLod(uPrevHdr, su + bl, 0.0).rgb + textureLod(uPrevHdr, su - bl, 0.0).rgb
                     + textureLod(uPrevHdr, su + vec2(bl.x, -bl.y) * 0.4, 0.0).rgb + textureLod(uPrevHdr, su - vec2(bl.x, -bl.y) * 0.4, 0.0).rgb);
      if (dot(c, c) <= 0.0) return c;                          // a fresh (cleared) buffer: no history yet
      w = smoothstep(0.0, 0.06, min(min(su.x, 1.0 - su.x), min(su.y, 1.0 - su.y))) * smoothstep(60.0, 30.0, b);
      return c;
    }
    sPrev = s; s *= 1.19;
  }
  return vec3(0.0);
}
// a short-range warm point light (unshadowed; house space)
vec3 hPointL(vec3 pos, vec3 n, vec3 lp, vec3 lc, float r) {
  vec3 L = lp - pos; float d2 = dot(L, L); vec3 l = L * inversesqrt(d2);
  return lc * (1.0 / (d2 + 0.3)) * sq(sat(1.0 - d2 / (r * r))) * max(dot(n, l), 0.0);
}

// rain rings on standing water: one ring per 0.32 m cell (the 2 x 2 nearest cells), born at a random point and time,
// spreading and fading over ~1 s; returns the slope (xz) of the water surface. fp: the pixel footprint (m): rings
// below a few pixels fade out
vec2 hRipple(vec2 p, float fp) {
  vec2 g = vec2(0.0);
  float fade = smoothstep(0.03, 0.012, fp);
  if (fade <= 0.0) return g;
  vec2 q = p / 0.32, b = floor(q - 0.5);
  for (int i = 0; i < 4; i++) {
    vec2 c = b + vec2(float(i & 1), float(i >> 1));
    float h = hash2(c * 1.37 + 0.5), h2 = hash2(c * 2.91 + 7.3);
    float ph = fract(uTime * (0.8 + 0.5 * h2) + h);
    vec2 d = q - c - vec2(h, h2) * 0.8 - 0.1;
    float r = length(d), rr = ph * 0.55;
    float w = (r - rr) * 22.0;
    g += d / max(r, 1e-3) * cos(clamp(w, -3.1416, 3.1416)) * (1.0 + cos(clamp(w, -3.1416, 3.1416))) * (1.0 - ph) * (1.0 - ph);
  }
  return g * 0.2 * fade;
}
// ---- seasons. ph: the year phase (0 = 1 March, .25 June, .5 September, .75 December)
// lawn (watered): lush in spring, green in winter; in summer and autumn its dry patches (G3.r) go golden / straw
vec3 lawnSeason(vec3 b, float dry, float ph) {
  float L = dot(b, vec3(0.3, 0.6, 0.1)) / 0.081;
  vec3 lush = vec3(0.06, 0.118, 0.03), green = vec3(0.07, 0.125, 0.03);     // (stage 2b: lush a touch less vivid)
  vec3 straw = mix(vec3(0.27, 0.2, 0.08), vec3(0.18, 0.16, 0.07), dry);
  float k = smoothstep(0.22 - 0.06 * dry, 0.36 - 0.05 * dry, ph) * (1.0 - smoothstep(0.68 + 0.04 * dry, 0.82 + 0.04 * dry, ph));
  float late = smoothstep(0.32, 0.46, ph) * (1.0 - smoothstep(0.6, 0.74, ph));     // late summer: the lawn goes golden
  vec3 c = mix(lush, green, smoothstep(0.08, 0.22, ph) * (1.0 - smoothstep(0.85, 0.98, ph)));
  c = mix(c, straw, k * mix(mix(0.12, 0.5, late), mix(0.8, 0.95, late), smoothstep(0.35 - 0.15 * late, 0.8 - 0.2 * late, dry)));
  float wint = smoothstep(0.75, 0.9, ph) * (1.0 - smoothstep(0.95, 1.0, ph));
  c = mix(c, c * vec3(0.92, 1.0, 0.86), wint * (1.0 - dry));
  // (stage 2b) a winter lawn is a softer, duller green (the short days, the frost nights), spring a fresh but not
  // vivid one: a little desaturated toward a muted olive
  c = mix(c, vec3(dot(c, vec3(0.3, 0.6, 0.1))) * vec3(1.05, 1.0, 0.72), 0.3 * wint + 0.2);
  return c * L;
}
// leafy deciduous / fruit crowns (the leafy variant: phase 0 .. ~.745): blossom (fruit) -> fresh leaf -> summer ->
// autumn colour (hue: gold .. red) -> browning toward the leaf drop. L: the baked leaf luminance (~1); off: the tree's
// phenology offset; pos: blossom clusters
vec3 leafSeason(vec3 b, float L, float ph, float off, float hue, bool fruit, vec3 pos) {
  float p = ph + 0.025 * (off - 0.5);
  float hv = tnoise(pos.xz * 0.9 + 3.0);
  vec3 c = b;
  c = mix(c, vec3(0.1, 0.16, 0.04) * L, smoothstep(0.0, 0.03, p) * (1.0 - smoothstep(0.1, 0.2, p)));      // fresh leaf
  vec3 aut = fruit ? mix(vec3(0.4, 0.1, 0.025), vec3(0.45, 0.27, 0.035), hv) : mix(vec3(0.5, 0.26, 0.03), vec3(0.42, 0.12, 0.03), max(hv, hue));
  c = mix(c, aut * L, smoothstep(0.55, 0.66, p));
  c = mix(c, vec3(0.16, 0.1, 0.05) * (0.7 + 0.3 * L), smoothstep(0.69, 0.745, p));                          // browning
  if (fruit) {
    // blossom: dense small clusters of petals (two fine scales), pink or white per tree, thinning as the leaves come
    float bn = 0.55 * tnoise3(pos * 16.0 + off * 9.0) + 0.45 * tnoise3(pos * 41.0 + off * 5.0);
    float th = smoothstep(0.05, 0.15, p);
    float bl = smoothstep(0.36 + 0.14 * th, 0.5 + 0.14 * th, bn);
    vec3 bloom = mix(vec3(0.9, 0.5, 0.62), vec3(0.92, 0.84, 0.84), step(0.5, hue)) * (0.75 + 0.25 * L) * (0.85 + 0.3 * tnoise3(pos * 70.0));
    c = mix(c, bloom, bl * 0.9 * (1.0 - smoothstep(0.1, 0.17, p)) * step(p, 0.3));
  }
  return c;
}

// The lit house-scene surface of a G-buffer hit (before aerial perspective). snowMask: snow x sun visibility (0 on wet /
// thawing snow), for the composite sparkle and the flake tint
vec3 shadeSurface(vec2 uv, vec4 g0, vec3 rd, float t, out float snowMask) {
  vec4 g1 = G1(uv), g2 = G2(uv);
  vec4 g3 = floor(G3(uv) * 255.0 + 0.5) / 255.0;    // the 8-bit values, so the RGBA16F fallback shades identically
  vec3 pos = uCamPos + rd * t;
  float mat = floor(g0.y + 0.001);
  bool veg = mat >= M_FRUIT && mat <= M_TREE;
  float shelter = hShelter(g3.a), haze = hHaze(g3.a);
  float ph = uYearPhase;
  snowMask = 0.0;
  // ---- the bare variant's twig haze: colour (bark, whitened by snow, white / pink blossom on the fruit twigs in late
  // February), opacity (density x a fibrous screen noise)
  float tw = 0.0; vec3 twC = vec3(0.0);
  if (haze > 0.004) {
    vec2 sp = hScreen(rd);
    float tn = tnoise(sp * vec2(0.45, 0.3)) * 0.6 + tnoise(sp * 1.3) * 0.4;
    tw = (1.0 - exp(-3.2 * haze)) * (0.7 + 0.45 * tn) * 0.86;          // (stage 2b: a little denser: .78 -> .86, 2.4 -> 3.2)
    float cs0 = cloudShadow(pos);
    twC = vec3(0.1, 0.082, 0.072) * (uSkyAmb * 1.1 + uSunCol * 0.2 * cs0) * (1.0 + 1.8 * sat(houseCover(pos.y, 0.45, pos.xz)));   // (the yard's own snow)
    if (mat == M_FRUIT) twC = mix(twC, vec3(0.8, 0.72, 0.72) * (uSkyAmb + uSunCol * 0.25 * cs0), 0.6 * smoothstep(0.955, 0.985, ph) * smoothstep(0.55, 0.75, tn));
  }
  // haze in front of the sky (the bake's haze surface): the sky with its clouds behind the twigs
  if (veg && g3.g > 0.25 && g3.g < 0.75) return mix(sceneSky(rd, textureLod(uSkyH, uv, 0.0)), twC, tw);
  vec3 nD = octDec(g2.xy), nS = octDec(g2.zw);
  vec3 alb = g1.rgb;
  float snowT = g1.w, ao = g0.w;
  float cs = cloudShadow(pos);
  float sh = g0.z * cs;
  float leafy = veg ? g3.g : 0.0;
  // ---- seasons
  if (mat == M_LAWN) alb = lawnSeason(alb, g3.r, ph);
  else if ((mat == M_FRUIT || mat == M_TREE) && leafy > 0.5) {
    float L = dot(alb, vec3(0.3, 0.6, 0.1)) / 0.075;
    alb = leafSeason(alb, L, ph, g3.b, g3.r, mat == M_FRUIT, pos);
  } else if (mat == M_CYPRESS && leafy > 0.5) {
    alb *= 1.0 - 0.12 * uSeasonW.w;
    // flowering shrubs (G3.r .45 .. .7): lavender in early summer
    float fl = smoothstep(0.6, 0.75, tnoise3(pos * 14.0)) * smoothstep(0.45, 0.5, g3.r) * (1.0 - step(0.75, g3.r)) * smoothstep(0.17, 0.24, ph) * (1.0 - smoothstep(0.34, 0.42, ph));
    alb = mix(alb, vec3(0.22, 0.14, 0.4), fl * 0.7);
    // the perennial bed (G3.r >= .75): fresh in March, in flower from April through the summer (each clump its own
    // colour by G3.b: rose, white, violet, gold, coral), browning in autumn, cut back in winter
    if (g3.r >= 0.75) {
      float bloomT = smoothstep(0.06, 0.13, ph) * (1.0 - smoothstep(0.44, 0.56, ph));
      float hb = g3.b * 5.0;
      vec3 fc = hb < 1.0 ? vec3(0.8, 0.22, 0.38) : hb < 2.0 ? vec3(0.82, 0.8, 0.74) : hb < 3.0 ? vec3(0.34, 0.16, 0.62) : hb < 4.0 ? vec3(0.86, 0.6, 0.08) : vec3(0.86, 0.3, 0.16);
      float cl = smoothstep(0.45, 0.62, tnoise3(pos * 18.0 + g3.b * 40.0)) * smoothstep(0.3, 0.7, nS.y + 0.4);
      alb = mix(alb, fc * (0.8 + 0.4 * tnoise3(pos * 40.0)), cl * bloomT * 0.9);
      alb = mix(alb, vec3(0.1, 0.075, 0.04), smoothstep(0.58, 0.7, ph) * (1.0 - smoothstep(0.93, 1.0, ph)) * 0.75);
    }
  } else if (mat == M_PALM && leafy > 0.5 && g3.r < 0.5) alb *= 1.0 - 0.1 * uSeasonW.w;
  // ---- snow: the shared cover, the per-material threshold, none under the eaves; it thaws like the valley's (sunny
  // patches, the dark roof and the trees first)
  float sunExp = max(dot(nS, uSunDir), 0.0) * (0.8 + 0.2 * g0.z);
  float cEff = houseCover(pos.y, veg ? mix(0.45, sunExp, 0.3) : sunExp, pos.xz);
  float thaw = uMelt * smoothstep(0.0, 3.0, uTemp - H_LAPSE * pos.y);
  snowT += thaw * (mat == M_ROOF ? 0.35 : veg ? 0.4 : (mat == M_ASPHALT || mat == M_CONCRETE) ? 0.3 : 0.22 * (sunExp - 0.45));
  if (mat == M_LAWN) snowT += 0.1 * (tnoise(pos.xz * 2.3 + 1.7) - 0.5) + 0.05 * (tnoise(pos.xz * 7.1) - 0.5);   // ragged melt edges
  float sw2 = mat == M_ASPHALT ? 0.16 : mat == M_ROOF ? 0.07 : 0.05;   // the street: slushy, soft-edged tyre tracks
  float snow = smoothstep(snowT - sw2, snowT + sw2, cEff) * (1.0 - shelter);
  float wetSnow = max(thaw, uWet);
  // ---- wind sheen over the lawn
  if (mat == M_LAWN) {
    vec2 gq = (pos.xz - uGrassDisp.xz) * 0.35;
    alb *= 1.0 + (1.0 - snow) * (tnoise(gq) - 0.5) * (0.12 + 0.2 * uGale) * smoothstep(60.0, 8.0, t);
  }
  // ---- wet: darkening by porosity (sheltered ground stays dry), puddles in the low spots of the hard ground: a darker
  // wet rim, standing water (the ground under it darker still, the surface a flat mirror), rain rings while it rains
  float wet = uWet * (1.0 - shelter);
  bool hard = mat >= M_CONCRETE && mat <= M_GRAVEL;
  float por = mat == M_LAWN ? 0.2 : (mat == M_CONCRETE || mat == M_BRICK || mat == M_SOIL) ? 0.45 : mat == M_ASPHALT ? 0.35
            : mat == M_GRAVEL ? 0.3 : mat == M_ROOF ? 0.4 : (mat == M_SIDING || mat == M_FENCE) ? 0.3 : veg ? 0.15 : 0.1;
  alb *= 1.0 - wet * por * (1.0 - snow);
  // (foliage: lit half on the crown's smooth normal, nS; stage 2b: soft leaf masses, not a lit bump each)
  vec3 n = normalize(mix(nD, nS, max(snow, veg && leafy > 0.5 ? 0.5 : 0.0)));
  // snow on the ground and the roofs is never flat: soft drifts and bumps (~0.5-2 m) catch the low sun on their sunward
  // flanks (warm) and fall into blue shade on the others
  if (snow > 0.01 && nS.y > 0.55) {
    vec2 sq0 = pos.xz * 0.8, sq1 = pos.xz * 2.7 + 5.0;
    float e = 0.12;
    float a0 = tnoise(sq0), a1 = tnoise(sq1);
    vec2 gs = vec2(tnoise(sq0 + vec2(e, 0.0)) - a0, tnoise(sq0 + vec2(0.0, e)) - a0) * 0.8 / e
            + vec2(tnoise(sq1 + vec2(e, 0.0)) - a1, tnoise(sq1 + vec2(0.0, e)) - a1) * 2.7 / e * 0.25 * smoothstep(0.05, 0.015, t * 2.0 * uTanH / uRes.y);
    n = normalize(n - vec3(gs.x, 0.0, gs.y) * 0.16 * snow);
  }
  float puddle = 0.0;
  float fpx = t * 2.0 * uTanH / uRes.y;
  if (hard && mat != M_GRAVEL && g3.g > 0.01 && wet > 0.03) {
    float pn = tnoise(pos.xz * 0.55 + 2.0) * 0.55 + tnoise(pos.xz * 1.7 + 9.0) * 0.3 + tnoise(pos.xz * 5.0) * 0.15;
    float pv = pn + 0.55 * g3.g + 0.45 * wet - 1.27;
    puddle = smoothstep(0.0, 0.05, pv) * (1.0 - snow);
    alb *= 1.0 - 0.3 * smoothstep(-0.1, 0.0, pv) * wet * (1.0 - snow) - 0.25 * puddle;      // wet rim, water depth
    vec2 rg = hRipple(pos.xz, fpx) * smoothstep(0.0, 0.15, uPrecipRain) * (0.3 + 0.7 * puddle);
    n = normalize(mix(n, vec3(0.0, 1.0, 0.0), puddle) + vec3(rg.x, 0.0, rg.y));
  }
  // snow albedo (wet / thawing greyer)
  vec3 snowAlb = vec3(0.86, 0.89, 0.95) * mix(vec3(1.0), vec3(0.8, 0.82, 0.83), wetSnow) * (0.94 + 0.06 * tnoise(pos.xz * 3.0));
  vec3 a = mix(alb, snowAlb, snow);
  // ---- light
  float ndl = dot(n, uSunDir);
  float diff = max(ndl, 0.0);
  if (veg && leafy > 0.5) diff = mix(diff, sat(ndl * 0.6 + 0.4), 0.3);       // foliage: a little wrap
  diff = mix(diff, sat((ndl + 0.18) / 1.18), snow);
  vec3 skyL = uSkyAmb * (0.6 + 0.4 * n.y);
  vec2 sa = normalize(uSunDir.xz);
  skyL += uSunCol * 0.05 * sat(dot(normalize(n.xz + 1e-4), sa)) * (1.0 - abs(n.y)) * (1.0 - uOvercast);   // warm sunward sky
  vec3 bounce = vec3(0.32, 0.26, 0.18) * dot(uSunCol, vec3(0.06)) * sat(0.5 - 0.5 * n.y) * mix(1.0, 2.5, sat(cEff));
  vec3 col = a * (uSunCol * diff * sh + (skyL + bounce) * ao);
  // leaves are translucent: sun through a frond / a leaf mass (its underside or far side glows a little)
  if (veg && leafy > 0.5) col += a * uSunCol * 0.14 * sat(-ndl) * cs * ao * (1.0 - snow);
  col += snow * a * uSkyAmb * vec3(0.1, 0.22, 0.5) * (1.0 - sh) * ao * (1.0 - 0.5 * wetSnow);
  // cozy lights: the porch lantern, the street lamp, the warm spill of the two windows (short range, unshadowed)
  float cz = 0.35 + 1.65 * uCozy;
  vec3 lampC = vec3(1.0, 0.62, 0.3);
  vec3 hp = hsp(pos), hn = hsp(n);
  vec3 pl = hPointL(hp, hn, L_PORCH + vec3(0.0, 0.0, 0.18), lampC * 1.5 * cz, 5.5);
  pl += hPointL(hp, hn, L_POST + vec3(0.0, -0.1, 0.0), lampC * 6.5 * cz, 11.0) * smoothstep(-0.2, 0.3, L_POST.y - 0.1 - hp.y);   // (the cap: no light above the lantern)
  pl += (hPointL(hp, hn, L_WIN0, lampC * 1.0 * cz, 5.0) + hPointL(hp, hn, L_WIN1, lampC * 1.0 * cz, 5.0)) * smoothstep(0.0, 0.6, hp.z - 0.05);
  col += a * pl * ao;
  // ---- glass, lamps, wet reflections
  vec3 hv = normalize(uSunDir - rd);
  float F = 0.04 + 0.96 * pow(1.0 - max(dot(n, -rd), 0.0), 5.0);
  bool pane = mat == M_GLASS || (mat == M_GARAGE && g3.b > 0.5);
  if (pane) {
    // Fresnel reflection of the sky over the lit room (G1 = its emission colour): the windows (G3.r 1), the door's oval
    // light (.75), the neighbour's window (.35), the garage door's arched lights
    float glow = mat == M_GARAGE ? 0.25 + 0.6 * uCozy : (0.45 + 2.6 * uCozy) * mix(0.42, 1.0, g3.r);
    col = hSkyR(reflect(rd, n)) * (0.22 + 0.78 * F) * ao + alb * glow * (1.0 - F);
  } else if (mat == M_LAMP && g3.b > 0.5) {
    // frosted lantern glass: brightest in front of the bulb, dimmer toward its frame
    vec3 lc0 = g3.r > 0.7 ? L_POST : L_PORCH;
    vec3 dq = hsp(pos) - lc0;
    float bulb = exp(-(dq.x * dq.x + dq.z * dq.z) / 0.006 - sq(dq.y + 0.03) / 0.02);
    col = alb * (1.2 + 3.6 * uCozy) * mix(0.55, 1.0, g3.r) * (0.45 + 1.1 * bulb);
  } else {
    float gloss = mat == M_LAWN ? 0.05 : mat == M_CONCRETE || mat == M_BRICK ? 0.5 : mat == M_ASPHALT ? 0.7 : mat == M_GRAVEL ? 0.2
                : mat == M_SOIL ? 0.15 : mat == M_ROOF ? 0.55 : mat == M_SIDING ? 0.15 : mat == M_TRIM || mat == M_GARAGE ? 0.3
                : mat == M_FENCE ? 0.12 : mat == M_METAL || mat == M_LAMP ? 0.5 : 0.1;
    // specular: a sun glint, stronger on wet ground (the composite's bloom lifts it)
    float spec = pow(max(dot(n, hv), 0.0), 60.0) * (0.04 + gloss * wet * 0.5) * sh;
    col += uSunCol * spec * (1.0 - snow);
    // wet gloss and puddles mirror the scene (screen-space reflection of the previous frame) or the sky behind it
    float Fs = 0.04 + 0.96 * pow(1.0 - max(dot(nS, -rd), 0.0), 5.0);
    // (damp ground after the rain, or melt water, is dull: the full gloss needs a soaked surface or falling rain)
    float soak = max(smoothstep(0.3, 0.75, uWet), smoothstep(0.0, 0.2, uPrecipRain));
    float k = wet * smoothstep(0.03, 0.12, uWet) * (1.0 - snow) * max(gloss * Fs * 0.9 * soak, puddle * (0.55 + 0.45 * Fs));
    if (k > 0.004) {
      vec3 r = reflect(rd, normalize(mix(nS, n, puddle)));
      float w = 0.0;
      vec3 refl = vec3(0.0);

//  GLSL: the cloud pass (stage-1 owner: lane C). Half resolution, temporally accumulated volumetric cloud slab.
//  Stores premultiplied cloud light + transmittance and an opacity-weighted cloud distance (km); the analytic sky is
//  evaluated in the shading pass so clouds can be composited over the sky or the far peaks. The march stops at the
//  terrain (G0's hit distance through the GBUF chunk, bound by render.js like every other pass: during a resize rebake
//  the baked rows read the new buffer and the rest the old one, aspect-remapped), so only cloud in front of a ridge is

uniform sampler2D uPrev, uPrevD;
uniform float uBlend, uFrame, uSteps;

float cloudD(vec3 p, bool hi) {

  // the right of centre, from ~13 km so a bank floats over the mid-wall ridge. Cumulus weather opens the cut to the
  // whole sky band (uCloudP)

  // (beyond ~8 km they are below the half-res pixel and only speckle the cloud)

        // half of the slab, so their ambient gradient is compressed into it)

//  GLSL: VEIL chunk (stage-1 owner: lane E). What the particles cannot show, seen from afar:
//   - the distant falling-snow veil: two screen-space streak sheets along the apparent fall direction plus a slow
//     'big' sheet (Phase 1), scaled by the snowfall rate;
//   - the rain veil: the rain beyond the particle slices (~70 m - 1 km), a faint haze with a fine falling grain;
//   - the rain curtains: grey shafts hanging from the cloud base over the far valley (patchy showers under broken

//     (uCloudOff).
//  applyVeil is the entry point the shading pass calls last on every pixel (sky and terrain). Each part sits behind
//  a uniform branch, so dry weather costs nothing. Needs COMMON + ENV + ATMOS (the cloud base uCloudQ.x, so the

    if (below <= 0.0) break;                       // the ray only climbs from here: above the base, no rain
    vec2 q = p.xz - uRainShaft.zw * below + uCloudOff;  // a drop drifts downwind as it falls

    float stri = tnoise(q * 0.0062 + 3.0) * 0.6 + tnoise(q * 0.017 + 9.0) * 0.4;
    float wisp = tnoise(q * 0.0011 + vec2(0.0, below * 0.0021) + 7.0);
    // shafts: rain cells (patchy showers under broken cloud, wide sheets under a full deck), soft fibres inside
    float lo = mix(0.66, 0.5, uCloudCov);
    // (stage 2b: soft fibres, not striations: a strongly striped shaft over a dark cliff reads as a sunbeam)
    float dens = 0.02 + smoothstep(lo, lo + 0.22, cell) * (0.7 + 0.45 * smoothstep(0.3, 0.9, stri)) * (0.55 + 0.7 * wisp);

    float od = rainCurtains(camRay(frag), t);

<script>/* js/glsl/hazard.js */
// =====================================================================================
//  GLSL: HAZARD chunk (Phase-3 owner: lane Z, hazards). The natural-hazard hooks the frozen glue calls, and their
//  uniforms (set by js/derive/events.js from js/sim/events.js; neutral defaults in core.js S.F / derive/events.js).
//  Every hook sits behind a uniform branch on its hazard's own uniforms and returns its input unchanged (bit for bit)
//  while that hazard is off: with no hazard running every pass draws exactly the Phase-2 image (tests/hazards.mjs,
//  tests/scenes.mjs). Included by the sky, shade and composite programs of every scene, right before their FS_* glue
//  (after COMMON, ENV, ATMOS, GBUF and, in the shade programs, the scene's surface chunk), so a hook may use the camera,
//  the light, the atmosphere and the G-buffer. Scene-dependent behaviour goes through uniforms (derive/events.js knows
//  S.sceneId): uCrackQ.w is the scene (0 valley, 1 house).
//    hazardSky(acc, T, rd, tHit)        the cloud pass, before its temporal blend: wildfire smoke tints the clouds (the
//                                       smoke changes over seconds: the EMA does not matter). Lightning is NOT here
//                                       (the cloud history blends 0.3 per frame): its cloud glow is in hazardLight
//    hazardLight(col, uv, g0, rd, t, cl) the shading pass, every pixel:
//                                       sky pixels (t > 60000; cl = the cloud pass, premultiplied radiance +
//                                       transmittance): the lightning's glow inside and under the clouds around the
//                                       channel (lumpy, per frame), a heat flash low on the horizon; the wildfire's
//                                       smoke-veiled red sun disc, the far fire's glow over the ridge / the trees and
//                                       its smoke columns;
//                                       surfaces (after shadeSurface + hazardSurface, before the aerial perspective):
//                                       the flash as a cool white light from the channel (its nearest point; baked
//                                       normals and AO; a rim on silhouettes when it strikes behind; a sheen on wet
//                                       ground). The ambient part of the flash comes through uSkyAmb (derive/events.js)
//    hazardSurface(col, uv, g0, rd, t)  surfaces right after shadeSurface: earthquake crack decals on hard ground
//                                       (valley: rock and the path; house: concrete, asphalt, brick)
//    hazardShake(uv) -> uv              the composite: where the frame is sampled for output uv (offset, roll and the
//                                       overscan zoom that keeps the edges out of view while shaking)
//    hazardComp(hdr, bloom, bloomStr, uv) -> rgb   the composite: hdr + bloom at the shaken uv, with a short
//                                       directional motion blur along the shake's motion over a 1/60 s shutter
//  Uniforms (S.F; derive/events.js):
//    uFlash     rgb flash irradiance at the camera's distance from the channel (linear), w envelope 0..1
//    uFlashPos  the channel's top (world m; cloud-to-ground) or one end (intra-cloud), w its length (m; 0 = none)
//    uFlashFoot the channel's foot (world m) or the other end, w kind (0 cloud-to-ground, 1 intra-cloud, 2 heat flash)
//    uQuake     xy shake offset (uv), z roll (rad), w intensity 0..1 (the house's window flicker reads it)
//    uQuakeZ    x overscan zoom (1 = none), yz the shake's motion over the shutter (uv: the blur), w unused
//    uSmoke     rgb smoke tint (linear), w amount 0..1
//    uSmokeSun  the smoke-veiled sun disc: direction (unit), w strength
//    uFire      the far fire: xy its direction (world xz, unit), z angular half-width (rad), w glow 0..1
//    uFireQ     x its base (sin of the elevation: just under the ridge / tree line), y lean (wind), z clock (s), w seed
//    uCrack     crack decals: xy centre (world xz, m), z radius (m), w strength 0..1

// =====================================================================================
(function (S) {

  C.HAZARD = `
uniform vec4 uFlash;         // lightning: rgb flash irradiance (linear), w envelope 0..1
uniform vec4 uFlashPos;      // lightning: the channel's top / one end (world m), w its length (m; 0 = none)
uniform vec4 uFlashFoot;     // lightning: the channel's foot / other end (world m), w kind (0 cg, 1 ic, 2 heat)
uniform vec4 uQuake;         // earthquake: xy screen offset (uv), z roll (rad), w intensity 0..1
uniform vec4 uQuakeZ;        // earthquake: x overscan zoom, yz motion over the shutter (uv), w unused
uniform vec4 uSmoke;         // wildfire: rgb smoke tint, w amount 0..1
uniform vec4 uSmokeSun;      // wildfire: the veiled sun disc direction (unit), w strength
uniform vec4 uFire;          // wildfire: the far fire's direction (xz, unit), z half-width (rad), w glow
uniform vec4 uFireQ;         // wildfire: x base elevation (sin), y lean, z clock (s), w seed
uniform vec4 uCrack;         // earthquake: crack decals, xz centre (world m), z radius (m), w strength 0..1
uniform vec4 uCrackQ;        // earthquake: xy fault direction (xz), z cell size (m), w scene (0 valley, 1 house)

// is hazardLight's, per frame and lumpy
vec3 hazardSky(vec3 acc, float T, vec3 rd, float tHit) {

// ---- lightning on the sky: the clouds light up from inside / below around the channel (strongest near its top,
// where it leaves the deck), lumpy with the cloud structure; a broad glow over the whole deck; the clear air only a
// little. A heat flash: a soft glow low on the horizon in its direction (and any clouds there)
vec3 flashSky(vec3 rd, vec4 cl) {

  vec3 g = uFlash.rgb * (pow(op, 0.7) * (3.2 * nearG + 0.75 * wide) * lump + op * (0.1 + 0.25 * lump) * (0.4 + 0.6 * wide) + 0.04 * wide);

// the channel (uFlash is the light there), on the baked normals with a little AO; the surface's colour comes from
// the pixel itself over the light it already has (so snow, wetness, seasons, the albedo all carry over)

// ---- earthquake cracks: a main fault across the hard ground (a noisy line through the centre along uCrackQ.xy) with
// a network of finer cracks close to it (cell edges of a jittered grid), dark gaps with chipped lighter lips; they open
// with the main shock and fade (uCrack.w)
vec2 crackCell(vec2 p) {                                       // (distance to the nearest cell edge, cell random)
  vec2 i = floor(p), f = fract(p);

  vec3 E = uSkyAmb * (0.62 + 0.38 * n.y) * g0.w + uSunCol * g0.z * max(dot(n, uSunDir), 0.0) + vec3(0.015);

  col = mix(col, col * mix(vec3(0.1), vec3(0.72, 0.78, 0.9), snow), max(gapM, 0.8 * gapN) * k * (1.0 - 0.5 * snow));
  return col;

// keeps every sample inside the frame. Identity (bit for bit) while no quake shakes the frame

  vec3 c = vec3(0.0);
  for (int i = 0; i < 7; i++) {

// =====================================================================================
//  GLSL: the lightning bolt (Phase-3 owner: lane Z). Program 'bolt': the strike's branching channel in world space
//  (derive/events.js builds it per strike: strands of points in uBolt[], precip.js uploads them), one instanced quad
//  per segment (gl_VertexID corners, gl_InstanceID segment; no buffers). Drawn by S.drawHazards (precip.js) after the
//  precipitation into R.hdr, additively (alpha 0), so its glow feeds the bloom.
//   VS_BOLT  projects a segment's two points, widens it into a screen-space quad (the core and its glow: a hot, narrow
//            core of ~1-3 px and a soft violet-blue glow of ~3-40 px, both from the distance), carries the segment's
//            distance (for the depth test), its aerial transmittance (fogAt: far strikes are hazy) and fades the part
//            inside the cloud deck (above the base, uBoltC.w)
//   FS_BOLT  capsule distance to the segment; core + glow; the caps count half (two caps meet at every joint, so a
//            joint is not a bead); depth-tested softly against the G-buffer (a ridge, the wall, the house, a palm in
//            front hides it) and against the cloud pass (a cloud nearer than the channel veils it)
//  Point format: xyz world, w = level x 4 + start x 2 + intensity (0..0.999): level 0 the main channel, 1-2 branches;
//  start: the first point of a strand (the segment ending there is skipped).
//  Pass-local uniforms (precip.js): uBolt[160], uBoltN, uBoltI (x main radiance, y branch radiance, z core width, w glow
//  width: metres at the channel, so it narrows with distance), uBoltC (rgb the core tint: warmer as it cools, w the
//  cloud base m), uAspect, uFocalPx, uBoltSky / uBoltSkyD (the cloud pass, units 5 / 6).
// =====================================================================================

  const C = S.glsl.chunks;

uniform vec4 uBolt[160];         // (160: with the shared uniforms well under the 256 vertex vectors WebGL2 guarantees)
uniform int uBoltN;
uniform vec4 uBoltI;
uniform vec4 uBoltC;
uniform float uAspect, uFocalPx;
out vec2 vP;               // px: x along the segment from its first point, y across
flat out vec4 vSeg;        // segment length px, core sigma px, glow sigma px, cap: 1 if the segment ends a strand
out vec3 vCore;            // core radiance (tint x intensity x transmittance x in-cloud fade)
out vec3 vGlow;            // glow radiance
out float vDist;

void cullV() { gl_Position = vec4(2.0, 2.0, 2.0, 1.0); }
vec3 toCam(vec3 p) { vec3 d = p - uCamPos; return vec3(dot(d, uCamR), dot(d, uCamU), dot(d, uCamF)); }

`;

uniform vec2 uRes;
uniform sampler2D uBoltSky, uBoltSkyD;    // the cloud pass: premultiplied radiance + transmittance, cloud distance (km x opacity)
in vec2 vP;
flat in vec4 vSeg;
in vec3 vCore;
in vec3 vGlow;
in float vDist;
out vec4 o;

  float L = vSeg.x;
  float da = vP.x < 0.0 ? -vP.x : max(vP.x - L, 0.0);
  float d2 = da * da + vP.y * vP.y;
  float cap = (vP.x < 0.0 || vP.x > L) ? 0.5 : 1.0;     // two caps meet at each joint
  float core = exp(-d2 / (2.0 * vSeg.y * vSeg.y));
  float sg = vSeg.z;
  float glow = 0.6 * exp(-d2 / (2.0 * sg * sg)) + 0.4 * exp(-sqrt(d2) / (2.5 * sg));
  vec3 c = (vCore * core + vGlow * glow) * cap;
  if (max(c.r, max(c.g, c.b)) < 1e-4) discard;
  vec2 suv = gl_FragCoord.xy / uRes;
  // depth: hidden where the scene is nearer (soft over ~3% of the distance)
  float st = G0(suv).x;
  float occ = clamp((st - vDist) / max(25.0, 0.03 * vDist), 0.0, 1.0);
  // a cloud nearer than the channel veils it (its transmittance)
  vec4 cl = texture(uBoltSky, suv);
  float op = 1.0 - cl.a;
  float cT = op > 0.003 ? texture(uBoltSkyD, suv).x / op * 1000.0 : 1e9;
  float vis = mix(1.0, cl.a, smoothstep(vDist * 0.97, vDist * 0.8, cT));
  o = vec4(c * occ * vis, 0.0);           // additive (premultiplied, alpha 0)

`;
  // (lazy: built on first use or by the background prewarm, not with the scene's set at boot / on a switch: gl.js)
  S.glsl.progs.bolt = { vs: ['COMMON', 'ENV', 'ATMOS', 'VS_BOLT'], fs: ['PRECISION_FI', 'ENV', 'GBUF', 'FS_BOLT'], lazy: true };
})(window.SNOW);

// =====================================================================================
//  GLSL: the hazard particles (Phase-3 owner: lane Z).
//   ash    (wildfire) program 'ash' = the stateless precipitation core (PRECIP_VS: slice-box wrap of the lattice-

//          tumbling flakes of burnt leaf and paper (pale grey to charred), drifting lazily with the wind, falling at
//          0.2-0.9 m/s (S.anim.ashI); lit by the smoky light, fogged like the snow. Premultiplied alpha.
//   ember  (wildfire) program 'ember' = PRECIP_VS + VS_EMBER / FS_EMBER: sparse glowing sparks carried by the wind,
//          rising and sinking in the turbulence (S.anim.emberI, speeds -0.7..+0.3 m/s), flickering as they cool;
//          additive (alpha 0) HDR, so the bloom halos them.

//          plumes anchored on the scene itself. Each plume picks a screen point (seeded per quake), reads the G-buffer
//          there (distance, material, normal, G3) and keeps it only on the right ground: the valley's cliffs (rock,
//          steep: rockfall dust streaming down the face, and dust rolling off the foot of the wall), the house's street,
//          driveway and walkway edges (a material edge) and the fence (puffs). Its puffs are spawned over a few seconds
//          after the main shock (some plumes on the aftershocks), slide / rise, swell, drift with the wind and settle
//          over ~10-25 s. Soft noisy billboards, lit by the sun and the sky, fogged, depth-tested against the G-buffer.
//          Its colour and strength follow the ground (derive/events.js): wet ground raises little, a snowy street none,
//          snowy cliffs shed white powder plumes.

    q.y /= max(vRot.z, 0.2);

  float a = clamp(cov * vCol.a * occ, 0.0, 1.0);

out vec2 vP;
flat out vec4 vPar;       // radius px, blur px, glow px, 0
out vec3 vCol;
out float vDist;
void main() {

in vec2 vP;
flat in vec4 vPar;

  C.VS_DUST = `
uniform vec4 uDust;        // x time since the main shock (s), y seed, z scene (0 valley, 1 house), w strength
uniform vec4 uDustC;       // rgb the dust's albedo (rock flour, street dust; powder snow off snowy cliffs)
uniform float uAspect, uFocalPx;
uniform vec3 uWindA, uWindB;   // the wind (m/s; derive/precip.js): the dust drifts with it
out vec2 vP;               // -1..1 across the puff
flat out vec4 vPar;        // radius px, seed, density, 0
out vec3 vCol;
out float vDist;
float hh(float a, float b) { return hf(uint(a) * 0x27d4eb2du ^ hu(uint(b) + 0x165667b1u)); }
void cullD() { gl_Position = vec4(2.0, 2.0, 2.0, 1.0); }
float matAt(vec2 uv) { return floor(G0(uv).y + 0.001); }
void main() {
  int NK = 36;
  int pl = gl_InstanceID / NK, k = gl_InstanceID - pl * NK;

  bool house = uDust.z > 0.5;

  if (house && pl >= 26) { cullD(); return; }
  // the plume's anchor: seeded screen points (up to 4 tries), kept only on the right ground
  //  valley: 2 of 3 plumes on the cliff faces (rock, steep: rockfall), the rest at the wall's foot (rock giving way to
  //          turf); house: hard ground at a material edge (the curbs, the driveway / walkway / sidewalk edges), the fence
  vec2 uvA = vec2(0.0); vec4 g0 = vec4(0.0); vec3 n = vec3(0.0, 1.0, 0.0);
  bool ok = false, foot = hh(fp + 300.0, sd) > 0.66;
  vec2 along = vec2(1.0, 0.0);
  for (int j = 0; j < 4; j++) {
    float fj = float(j) * 977.0;
    uvA = house ? vec2(mix(0.02, 0.98, hh(fp + fj, sd)), mix(0.08, 0.62, hh(fp + 50.0 + fj, sd)))
                : (foot ? vec2(mix(0.3, 0.99, hh(fp + fj, sd)), mix(0.42, 0.8, hh(fp + 50.0 + fj, sd)))
                        : vec2(mix(0.2, 0.99, hh(fp + fj, sd)), mix(0.55, 0.97, hh(fp + 50.0 + fj, sd))));
    g0 = G0(uvA);
    if (g0.x > 60000.0) continue;
    float mat = floor(g0.y + 0.001);
    n = octDec(G2(uvA).zw);
    if (house) {
      vec2 e = vec2(0.005, 0.009);
      bool hx = matAt(uvA + vec2(e.x, 0.0)) != mat || matAt(uvA - vec2(e.x, 0.0)) != mat;
      bool hy = matAt(uvA + vec2(0.0, e.y)) != mat || matAt(uvA - vec2(0.0, e.y)) != mat;
      // (stage 2b: and the roof's edges: dust and grit shaken off the eaves and the ridge fall as a veil)
      bool hyR = mat == 6.0 && (matAt(uvA + vec2(0.0, 0.035)) != mat || matAt(uvA - vec2(0.0, 0.035)) != mat);
      ok = (mat >= 11.0 && mat <= 14.0 && (hx || hy)) || mat == 15.0 || hyR;
      along = hx && !hy ? vec2(0.0, 1.0) : vec2(1.0, 0.0);      // spread along the edge (a curb across the view: x)
    } else {
      float rock = G3(uvA).r;
      ok = mat == 1.0 && g0.x > 700.0 && (foot ? rock > 0.15 && rock < 0.7 : rock > 0.45 && n.y < 0.85);
    }
    if (ok) break;
  }
  if (!ok) { cullD(); return; }
  vec3 A = uCamPos + camRay(uvA * uRes) * g0.x;
  bool roof = house && floor(g0.y + 0.001) == 6.0;
  // timing: most plumes go with the main shock (a few seconds' spread), the rest with the aftershocks
  float r1 = hh(fp + 100.0, sd), r2 = hh(fp + 150.0, sd), r3 = hh(fp + 200.0, sd);
  float t0 = r1 < 0.7 ? 3.0 * r2 * r2 : (r1 < 0.87 ? 8.1 : 10.5) + 0.8 * r2;
  float emit = house ? mix(0.8, 2.2, r3) : mix(3.0, 6.0, r3);
  float ts = t0 + emit * (fk + hh(fk, fp + sd)) / float(NK);
  float age = uDust.x - ts;
  float life = house ? 3.0 + 4.0 * hh(fk + 30.0, fp) : 12.0 + 12.0 * hh(fk + 30.0, fp);
  if (age < 0.0 || age > life) { cullD(); return; }
  float rk1 = hh(fk + 60.0, fp), rk2 = hh(fk + 90.0, fp), rk3 = hh(fk + 120.0, fp);
  vec3 P;
  float rad;
  if (house) {
    // a puff shaken off the edge: a little column around the spot, thrown up 0.3-1.3 m, billowing out, settling
    // (stage 2b: tighter around its spot and taller, so each plume reads as one puff of dust); off the roof: grit
    // falling from the eaves in a thin veil that spreads as it drops
    vec3 ax = along.x > 0.5 ? uCamR : normalize(vec3(uCamF.x, 0.0, uCamF.z));
    float sl = 1.0 - exp(-age / 0.8);
    if (roof) {
      P = A + ax * (rk1 - 0.5) * 1.6 + vec3(rk3 - 0.5, 0.0, rk2 - 0.5) * 0.5 * sl - vec3(0.0, min(4.0 * age * age, A.y + 0.2) * (0.6 + 0.4 * rk2), 0.0);
      rad = (0.1 + 0.32 * (1.0 - exp(-age / 1.0))) * mix(0.7, 1.3, rk3);
    } else {
      P = A + ax * (rk1 - 0.5) * 1.1 + vec3(rk3 - 0.5, 0.0, rk2 - 0.5) * 0.9 * sl + vec3(0.0, (0.3 + 1.0 * rk2 * rk2) * sl - 0.04 * age, 0.0);
      rad = (0.14 + 0.55 * (1.0 - exp(-age / 1.6))) * mix(0.7, 1.3, rk3);
    }
  } else {
    // rockfall: the debris runs down the face (its front at s(t)), leaving dust behind it that billows out from the
    // face, rises and swells; at the wall's foot it rolls out across the slope
    vec3 g = vec3(0.0, -1.0, 0.0);
    vec3 down = normalize(g - n * dot(g, n) + vec3(0.0, -1e-3, 0.0));
    vec3 side = normalize(cross(n, down) + 1e-4);
    float U = foot ? 70.0 : 110.0;
    float te = ts - t0;                                       // when the front passed: the puff starts there
    float front = U * (foot ? 2.0 : 4.5) * (1.0 - exp(-te / 2.2)) * mix(0.7, 1.2, r2);
    float bil = 1.0 - exp(-age / 2.5);
    P = A + down * front + side * (rk1 - 0.5) * U * 0.7 + n * U * (0.15 + 0.5 * rk2) * bil + vec3(0.0, U * 0.05 * age * (0.4 + 0.6 * rk3), 0.0);
    rad = U * (0.35 + 0.9 * bil) * mix(0.6, 1.3, rk3);
  }
  P += mix(uWindA, uWindB, 0.5) * age * 0.5;
  vec3 c = vec3(dot(P - uCamPos, uCamR), dot(P - uCamPos, uCamU), dot(P - uCamPos, uCamF));
  if (c.z < 0.5) { cullD(); return; }
  vec2 ndc = vec2(c.x / (c.z * uTanH * uAspect), c.y / (c.z * uTanH));
  float rPx = rad / c.z * uFocalPx;
  if (abs(ndc.x) > 1.3 || abs(ndc.y) > 1.3 || rPx < 0.5) { cullD(); return; }
  float dens = smoothstep(0.0, house ? 0.15 : 0.6, age) * sq(1.0 - age / life) * uDust.w * (house ? (roof ? 0.3 : 0.42) : 0.32) * mix(0.6, 1.0, rk1);
  if (house) dens *= mix(0.45, 1.0, smoothstep(6.0, 14.0, c.z)) * (0.55 + 0.9 * hh(fp + 400.0, sd));   // (the near ones thinner; plumes differ)
  vec2 corner = vec2(gl_VertexID & 1, gl_VertexID >> 1) * 2.0 - 1.0;
  gl_Position = vec4(ndc + corner * rPx / (0.5 * uRes), 0.0, 1.0);
  vP = corner;
  vPar = vec4(rPx, fk * 0.37 + fp * 0.11, dens, 0.0);
  float dist = length(P - uCamPos);
  vec3 V = (P - uCamPos) / dist;
  // dry dust: grey-beige rock flour in the valley, a light tan street dust at the house; lit from the sun side and
  // the sky (dust is translucent: no hard terminator), fogged
  vec3 alb = uDustC.rgb;
  float sunF = 0.5 + 0.3 * max(dot(normalize(vec3(rk1 - 0.5, 0.6, rk3 - 0.5)), uSunDir), 0.0);
  vec3 col = alb * (uSunCol * sunF * cloudShadow(P) + uSkyAmb * 0.85);
  vec4 fg = fogAt(dist, V);
  vCol = col * fg.a + fg.rgb;
  vDist = dist;
}
`;
  C.FS_DUST = `
in vec2 vP;
flat in vec4 vPar;
in vec3 vCol;
in float vDist;
out vec4 o;
void main() {
  float r = length(vP);
  if (r > 1.0) discard;
  // a soft billow: a radial falloff broken up by two octaves of noise
  vec2 q = vP * 2.2 + vPar.y * 13.0;
  float n = tnoise(q) * 0.6 + tnoise(q * 2.3 + 7.0) * 0.4;
  float d = (1.0 - smoothstep(0.1, 1.0, r + 0.45 * (n - 0.5))) * vPar.z * (0.5 + 1.0 * n);
  vec2 suv = gl_FragCoord.xy / uRes;
  float st = G0(suv).x;
  float occ = clamp((st - vDist) / max(0.3, 0.04 * vDist), 0.0, 1.0);

<script>/* js/glsl/shade.js */
// =====================================================================================
//  GLSL: the scene shading pass (frozen glue). It owns only the tree-sway remap of the G-buffer lookup, the cloud
//  pass fetch and the order of the calls into the lane chunks:
//    sky pixel:     skyPixel (ATMOS; or the scene's sceneSky: SCENE_SKY) -> hazardLight (HAZARD) -> applyVeil (VEIL)
//    surface pixel: shadeSurface (the scene's surface chunk: SURFACE / SURFACE_HOUSE) -> hazardSurface -> hazardLight
//                   (HAZARD) -> applyAtmos (ATMOS) -> applyVeil (VEIL)
//    ?view=:        surfaceDebug (the scene's surface chunk)
//  Output: rgb = scene radiance, a = snow fraction x sun visibility (0 on the sky), read by the composite sparkle and
//  the flake colour-over-snow. Program 'shade' (valley) = COMMON + ENV + ATMOS + GBUF + SURFACE + VEIL + HAZARD +
//  FS_SHADE; 'shade@house' swaps SURFACE for SURFACE_HOUSE (which also brings its own treeH: SCENE_SWAY).
// =====================================================================================
(function (S) {
  'use strict';
  const C = S.glsl.chunks;
  C.FS_SHADE = `
uniform sampler2D uSky, uSkyD;
uniform vec3 uSway;          // x: lateral wind (m/s), y: integrated sway phase (rad, CPU), z: focal length in px
out vec4 o;

// tree sway: treetops lean/oscillate with the wind. The G-buffer is static, so we invert the
// displacement field with a 2-step fixed-point lookup (starting mid-tree so silhouettes move too).
// treeH(g0): the sway weight of a G-buffer pixel (0 = rigid). A scene whose surface chunk defines SCENE_SWAY brings its
// own (its material ids differ: SURFACE_HOUSE); the valley's is material 2 (tree) with its height fraction
#ifndef SCENE_SWAY
float treeH(vec4 g) { return floor(g.y + 0.001) == 2.0 ? fract(g.y + 0.001) / 0.9 : 0.0; }
#endif
// a sky pixel's radiance: ATMOS's skyPixel, or the scene's own sky (stage 2b): a scene whose surface chunk defines
// SCENE_SKY brings sceneSky(rd, cl) (the house: its golden-hour gradient over skyPixel)
#ifndef SCENE_SKY
vec3 sceneSky(vec3 rd, vec4 cl) { return skyPixel(rd, cl); }
#endif
vec2 swayOff(float h, float t, vec2 frag) {
  float w = uSway.x;
  float osc = sin(uSway.y + frag.x * 0.013 + frag.y * 0.007) * (0.25 + 0.05 * abs(w));
  float disp = (0.012 * w + osc * 0.12) * h * h * 18.0;          // metres at the top of an ~18 m spruce
  return vec2(disp / max(t, 1.0) * uSway.z, 0.0);
}

void main() {
  vec2 uv = gl_FragCoord.xy / uRes;
  vec4 g0 = G0(uv);
  {
    vec2 oMax = swayOff(1.0, g0.x, gl_FragCoord.xy);
    if (abs(oMax.x) > 0.15 && g0.x < 6000.0) {
      vec2 x = gl_FragCoord.xy - 0.5 * oMax;
      for (int i = 0; i < 2; i++) { vec4 gi = G0(x / uRes); x = gl_FragCoord.xy - swayOff(treeH(gi), gi.x, gl_FragCoord.xy); }
      vec4 gs = G0(x / uRes);
      if (treeH(gs) > 0.0 || treeH(g0) > 0.0) { uv = x / uRes; g0 = gs; }
    }
  }
  vec3 rd = camRay(uv * uRes);
  float t = g0.x;
  vec4 cl = texture(uSky, uv);            // clouds: premultiplied radiance + transmittance
  float cOp = 1.0 - cl.a;
  float cT = cOp > 0.003 ? texture(uSkyD, uv).x / cOp : 0.0;   // opacity-weighted mean cloud distance (0 = none)
  if (uView > 0) { o = vec4(t > 60000.0 ? vec3(0.04, 0.06, 0.1) : surfaceDebug(uView, uv, g0, rd, t), 0.0); return; }
  if (t > 60000.0) {
    o = vec4(applyVeil(hazardLight(sceneSky(rd, cl), uv, g0, rd, t, cl), t, gl_FragCoord.xy), 0.0);
    return;
  }
  float snowMask;
  vec3 col = shadeSurface(uv, g0, rd, t, snowMask);
  col = hazardSurface(col, uv, g0, rd, t);      // crack decals (HAZARD; neutral in stage 0)
  col = hazardLight(col, uv, g0, rd, t, cl);    // lightning on the scene
  col = applyAtmos(col, t, rd, cl, cT);
  o = vec4(applyVeil(col, t, gl_FragCoord.xy), snowMask);
}
`;
  // the valley's shade program (scenes/valley.js progs.shade); the house's is 'shade@house' (glsl/house/surface-house.js)
  S.glsl.progs.shade = { vs: ['VS_FULL'], fs: ['COMMON', 'ENV', 'ATMOS', 'GBUF', 'SURFACE', 'VEIL', 'HAZARD', 'FS_SHADE'] };

  // HAZARD_IDLE (polish): the five hazard hooks the glue calls (FS_SKY / FS_SKY_SOFT: hazardSky; FS_SHADE: hazardLight,
  // hazardSurface; FS_COMP / FS_COMP_SCENE: hazardShake, hazardComp) as exactly what each returns while its hazard is
  // off, with HAZARD's signatures. gl.js builds a hook-free twin of every program whose recipe includes HAZARD ('<recipe>~idle':
  // HAZARD replaced by this chunk) and render.js draws the twin while no hazard is on: the same image (each hook is the
  // identity then), the Phase-2 code (the inlined hooks changed the Metal codegen of the sky expression: 1 LSB on a
  // pixel or two of some rain frames) and less of it (the valley ~2% faster in steady state). tests/check.mjs pins
  // the signatures and the hooks' early-outs that render.js's predicate mirrors.
  C.HAZARD_IDLE = `
vec3 hazardSky(vec3 acc, float T, vec3 rd, float tHit) { return acc; }
vec3 hazardLight(vec3 col, vec2 uv, vec4 g0, vec3 rd, float t, vec4 cl) { return col; }
vec3 hazardSurface(vec3 col, vec2 uv, vec4 g0, vec3 rd, float t) { return col; }
vec2 hazardShake(vec2 uv) { return uv; }
vec3 hazardComp(sampler2D hdr, sampler2D bloom, float bloomStr, vec2 uv) { return texture(hdr, uv).rgb + texture(bloom, uv).rgb * bloomStr; }
`;
})(window.SNOW);

</script>
<script>/* js/glsl/flake.js */
// =====================================================================================
//  GLSL: snowflakes (stage-1 owner: lane E). Instanced, stateless particles in camera-aligned depth slices:
//  the vertex shader places, wraps, streaks and lights each flake; the fragment shader draws the crystal shapes
//  and capsules with soft occlusion against the G-buffer and a cool tint over snow (read from the scene alpha).
//  PRECIP_VS is the stateless core both precipitation vertex shaders share (VS_FLAKE here, VS_RAIN in rain.js): the
//  per-layer uniforms, the per-instance hashes, the slice-box wrap, the projection and the drag wake.
//  Constants NB = 40 bins and TW = 120 must match precip.js (wrapLayer) and derive/precip.js (the % 120 clocks);

  float ring = 1.0 - smoothstep(0.0, 0.02 + aa, abs(hexd - core * 0.6));
  // translucent body (0.42) under bright rims / ridges / ring, so the interior structure survives tone mapping
  return c * (0.42 + 0.5 * rim + 0.3 * ridge + 0.2 * ring);
}
// hexagonal / stellar plate with ridges, an inner hexagon line and bright rims
float plate(vec2 q, vec4 s, float aa) {
  if (dot(q, q) > sq(1.06 + aa)) return 0.0;
  vec2 p = foldD6(q);
  float R = mix(0.62, 0.92, s.x);
  float hexd = dot(p, vec2(0.8660254, 0.5));
  float d;
  if (s.y > 0.45) {   // stellar plate: broad arms widening toward the tip
    float wArm = 0.07 + 0.2 * smoothstep(0.3, 0.95, p.x / R);
    d = min(max(p.y - wArm * R, p.x - R), hexd - 0.3 * R);
  } else d = hexd - R * 0.8660254;
  float c = 1.0 - smoothstep(-aa, aa, d);
  float ridge = 1.0 - smoothstep(0.0, 0.025 + aa, p.y);
  float inner = 1.0 - smoothstep(0.0, 0.025 + aa, abs(hexd - 0.4 * R));
  float rim = smoothstep(-0.07 - aa, 0.0, d);
  return c * (0.38 + 0.28 * ridge + 0.22 * inner + 0.5 * rim);      // translucent body, bright rim and ridges
}
// one small six-armed crystal used inside aggregates
float miniStar(vec2 q, float aa) {
  vec2 p = foldD6(q);
  float d = sdSeg(p, vec2(0.0), vec2(0.92, 0.0)) - 0.1 * (1.0 - 0.4 * p.x);
  d = min(d, sdSeg(p, vec2(0.5, 0.0), vec2(0.5, 0.0) + vec2(0.5, 0.866) * 0.36) - 0.07);
  d = min(d, dot(p, vec2(0.866, 0.5)) - 0.2);
  return 1.0 - smoothstep(-aa, aa, d);
}
// clumped aggregate (most large real flakes): a soft translucent lumpy core with a few
// tumbled crystals fused into it, their arms poking out of the outline. Wet snow near 0 deg C (uWetSnow): the
// crystals have melted into the clump, which grows into a bigger, lobed, denser cotton-like ball
float aggregate(vec2 q, vec4 s, float aa) {
  if (dot(q, q) > sq(1.06 + aa)) return 0.0;
  uint h = floatBitsToUint(s.x * 9.71 + s.y) ^ 0x9e3779b9u;
  float rr = length(q);
  float ang0 = atan(q.y, q.x);
  float wet = uWetSnow;
  float lump = 0.5 + 0.09 * sin(3.0 * ang0 + s.z * 6.0) + 0.06 * sin(5.0 * ang0 + s.w * 6.0) + 0.04 * (1.0 - wet) * sin(8.0 * ang0 + s.x * 6.0);
  lump += wet * (0.16 + 0.05 * sin(2.0 * ang0 + s.y * 6.0) + 0.03 * sin(4.0 * ang0 + s.z * 9.0));   // a lopsided round tuft
  float core = 1.0 - smoothstep(lump - 0.3 - 0.12 * wet - aa, lump + aa, rr);
  float tex = 0.75 + 0.25 * sin(q.x * 9.0 + s.z * 6.0) * sin(q.y * 8.0 + s.w * 6.0);
  float c = core * mix(core, 1.0, 0.35 * wet) * (0.42 + 0.3 * wet) * tex;   // translucent, denser centre (wet: a dense ball)
  float arms = 1.0 - 0.85 * wet;
  for (int k = 0; k < 3; k++) {
    h = h * 747796405u + 2891336453u;
    uint h2 = (h >> 5u) * 2654435761u;
    vec4 r = vec4(float(h >> 8u), float(h2 >> 8u), float((h2 * 1103515245u) >> 8u), float((h * 22695477u) >> 8u)) / 16777216.0;
    vec2 off = (r.xy - 0.5) * 0.45;
    float sc = mix(0.45, 0.62, r.z);
    float an = r.w * 6.2831853;
    vec2 qq = q - off;
    qq = vec2(cos(an) * qq.x - sin(an) * qq.y, sin(an) * qq.x + cos(an) * qq.y) / sc;
    qq.y /= mix(0.5, 1.0, fract(r.w * 7.3));                                 // tilted crystal
    if (dot(qq, qq) < 1.1) c = max(c, miniStar(qq, aa / sc) * mix(0.8, 1.0, r.z) * arms);
  }
  return c;
}
float shapeAt(vec2 sp) {
  // shape in units of the true radius; defocus widens the edge ramp (aa) and the quad (vPar.x) instead
  vec2 q = vec2(vRot.x * sp.x - vRot.y * sp.y, vRot.y * sp.x + vRot.x * sp.y) / vRot.w;
  q.y /= vRot.z;
  // the tumble squash shrinks the pixel footprint along y: widen the edge ramp by the geometric mean of the
  // two axes' scales, so an edge-on crystal softens instead of aliasing (and its fine detail switches off)
  float aa = vPar.w * inversesqrt(max(vRot.z, 0.2));
  if (vPar.z < 1.5) return dendrite(q, vSeed, aa);
  if (vPar.z < 2.5) return plate(q, vSeed, aa);
  return aggregate(q, vSeed, aa);
}
void main() {
  float rPx = vPar.x, blur = vPar.y;
  float cov;
  if ((uLayer == 1 || uLayer == 4) && blur < min(3.5 * rPx, 28.0)) {
    // true motion blur of the crystal shape: a box of taps along the streak at <= 1 px spacing (up to 29),
    // so a short calm blur keeps the crystal crisp with no tap structure (coarser stratified taps with
    // per-pixel jitter left a diagonal hatch across the big sharp flakes). A wet clump has only soft edges:
    // up to 2.5 px between taps is enough there
    int taps = int(ceil(blur / (vPar.z > 2.5 ? 1.0 + 1.5 * uWetSnow : 1.0))) + 1;
    float acc = 0.0;
    for (int k = 0; k < 29; k++) {
      if (k >= taps) break;
      float off = ((float(k) + 0.5) / float(taps) - 0.5) * blur;
      acc += shapeAt(vP - vec2(off, 0.0));
    }
    cov = acc / float(taps);
  } else if (uLayer == 1 || uLayer == 4) {
    // long streak: the crystal detail is smeared out anyway -> analytic soft capsule,
    // energy-normalised against the streak length, slightly brighter core.
    // Per-flake character so the blizzard is not a parallel hatch: width x0.6-1.4, brightness x0.6-1.2,
    // and a ~12% subset of thin, bright, crisp streaks (small dense flakes whipping past)
    float wv = mix(0.6, 1.4, vSeed.z), bv = mix(0.6, 1.2, vSeed.w);
    if (fract(vSeed.y * 5.3) > 0.88) { wv *= 0.4; bv *= 1.6; }
    vec2 q = vec2(max(abs(vP.x) - 0.5 * blur, 0.0), vP.y);
    float d = length(q) / (rPx * 0.55 * wv);
    float along = 1.0 - smoothstep(0.3, 0.5, abs(vP.x) / (blur + 2.0 * rPx));       // soft streak ends
    // a flake sweeping 'blur' px covers each pixel for ~2r/blur of the exposure
    cov = exp(-d * d * 2.0) * (0.55 + 0.45 * along) * min(1.0, 2.0 * rPx / (blur + 2.0 * rPx)) * 1.5 * bv;
    cov *= 0.65 + 0.35 * sin(vP.x / max(rPx, 1.0) * 1.3 + vSeed.x * 40.0);        // tumbling flicker along the streak
  } else {
    // capsule = analytically motion-blurred disc
    vec2 q = vec2(max(abs(vP.x) - 0.5 * blur, 0.0), vP.y);
    float d = length(q) / rPx;
    // near tier: a soft flat disc (no bright rim: a rimmed disc reads as a soap bubble / lens dirt)
    if (uLayer == 0) cov = (1.0 - smoothstep(1.0 - vPar.w, 1.0, d)) * 0.85;
    else cov = exp(-d * d * 2.3);
  }
  // soft occlusion against the scene (G-buffer ray distance)
  vec2 suv = gl_FragCoord.xy / uRes;
  float st = G0(suv).x;
  float occ = clamp((st - vDist) / max(0.4, 0.05 * vDist), 0.0, 1.0);
  float a = clamp(cov * vCol.a * occ, 0.0, 1.0);
  if (a < 0.0015) discard;
  // over snow-covered ground a thin ice crystal reads as a faint, slightly bluer translucent shadow (it transmits
  // the sky, the sunlit snow behind it does not), otherwise white on white vanishes. Scaled by the flake's own
  // alpha so faint flakes stay translucent rather than turning into grey stickers; in a blizzard the whiteout is
  // grey, so only a weak cool shadow side is kept on the streaks
  vec3 col = vCol.rgb;
  if (st < 60000.0) {
    float snowBG = textureLod(uScene, suv, 0.0).a;
    col *= mix(vec3(1.0), vec3(0.5, 0.56, 0.68), snowBG * mix(0.55, 0.3, uSnowCurtain) * clamp(a * 2.0, 0.0, 1.0));   // over half the tint is kept in a blizzard: the streaks stay legible over snow
  }
  o = vec4(col * a, a);    // premultiplied alpha
}
`;
  S.glsl.progs.flake = { vs: ['COMMON', 'ENV', 'ATMOS', 'PRECIP_VS', 'VS_FLAKE'], fs: ['PRECISION_FI', 'ENV', 'GBUF', 'FS_FLAKE'] };
})(window.SNOW);

</script>
<script>/* js/glsl/rain.js */
// =====================================================================================
//  GLSL: rain (stage-1 owner: lane E). Instanced, stateless raindrops in camera-aligned depth slices, drawn with the
//  same per-layer contract as the flakes and the shared PRECIP_VS core (flake.js): base point, wind integrals, the
//  40 fall bins (uFallQ over uFallLH, wrapped from S.anim.rainI), the slice-box wrap and the drag wake.
//  Each drop has a fixed diameter (1.6-4.4 mm, mostly small) and the matching terminal speed (5.7-8.9 m/s); the
//  streak is the drop's path during the rain shutter uExpoRain, so its length follows speed and depth. A drop is a
//  tiny lens: it shows the wide environment (mostly the bright sky) refracted, so it reads as a bright line over
//  dark forest and almost vanishes against the sky; sunlit drops add a forward glow and glints along the streak.
//  Near drops (0.3-1.5 m) are defocused by the same one-sided circle of confusion as the flakes.
//  Program 'rain' = COMMON + ENV + ATMOS + PRECIP_VS + VS_RAIN | PRECISION_FI + ENV + GBUF + FS_RAIN.
// =====================================================================================
(function (S) {
  'use strict';
  const C = S.glsl.chunks;
  C.VS_RAIN = `
uniform float uRainV;     // rain fall factor (= d rainI / dt)
uniform float uExpoRain;  // rain shutter (s): the streak is the drop's path while it is open
uniform float uPushK;     // the layer's drag-wake weight
uniform vec2 uRainGust;   // scroll of the gust bands (integrated wind, wrapped by the 256 noise period on the CPU)
out vec2 vP;              // quad position in px: x along the streak, y across
flat out vec4 vPar;       // half width px (incl. defocus), streak length px, bead frequency, bead phase
flat out vec3 vSun;       // sun glint colour along the streak (premultiplied by the drop's alpha later)
flat out float vDef;      // defocus share of the half width (0 sharp .. 1 a soft out-of-focus blur)
out vec4 vCol;
out float vDist;

void main() {
  vec2 corner = CORNERS[gl_VertexID];
  uint id = uint(gl_InstanceID);
  vec4 r0, r1, r2;
  precipRand(r0, r1, r2);
  vec3 bw = sliceBase(r0);
  float t = uFlakeT;

  // drop diameter (mm), skewed to small drops; terminal speed from the Atlas fit v = 9.65 - 10.3 exp(-0.6 D).
  // The distribution is fixed: heavier rain means more drops, never faster ones (speed only via the integral)
  float D = mix(1.6, 4.4, r0.w * r0.w);
  int fbin = fallBin((9.65 - 10.3 * exp(-0.6 * D) - uFallLH.x) / (uFallLH.y - uFallLH.x));
  float fall = binSpeed(fbin) * uRainV;
  // dense drops answer the wind sluggishly (an affine mix of the two integrals: the lattice wrap stays exact)
  float resp = 0.12 + 0.25 * r1.y;
  vec3 wdisp = mix(uDispA, uDispB, resp);
  vec3 wvel = mix(uWindA, uWindB, resp);
  // a little horizontal turbulence (the snow eddies at a tenth of their amplitude; rates on the W0 grid)
  float ta = 0.03 + 0.12 * uGale;
  vec3 ph = bw * vec3(0.37, 0.29, 0.33);
  float a1 = ph.x + ph.y * 0.7 + 16.0 * W0 * t, a2 = ph.z - ph.x * 0.6 + 25.0 * W0 * t + 2.0;
  vec3 turb = ta * vec3(sin(a1), 0.0, sin(a2));
  vec3 turbV = ta * W0 * vec3(16.0 * cos(a1), 0.0, 25.0 * cos(a2));

  vec3 cs = sliceWrap(bw + wdisp + uFallQ[fbin] + turb);
  vec2 ndc, sv;
  project(cs, wvel + vec3(0.0, -fall, 0.0) + turbV, ndc, sv);
  float zc = cs.z;
  precipWake(ndc, sv, zc, uPushK);
  if (offScreen(zc, ndc)) { gl_Position = vec4(2.0, 2.0, 2.0, 1.0); return; }
  float a = sliceFade(zc) * clamp(uCount - float(id), 0.0, 1.0);
  // gusts sweep the rain in bands: a screen-space density noise drifting with the integrated wind (far layers)
  if (uGale > 0.0 && uLayer >= 7) {
    vec2 gq = vec2(ndc.x * uAspect, ndc.y) * 1.6 + uRainGust;
    float gs = tnoise(gq) * 0.65 + tnoise(gq * 2.3 + 5.0) * 0.35;
    a *= mix(1.0, 0.25 + 1.5 * smoothstep(0.3, 0.72, gs), 0.85 * uGale);
  }
  if (a < 0.002) { gl_Position = vec4(2.0, 2.0, 2.0, 1.0); return; }

  float rTrue = 0.5 * D * 0.001 / max(zc, 0.05) * uFocalPx;
  float speed = length(sv);
  vec2 dir = speed > 1e-3 ? sv / speed : vec2(0.0, -1.0);
  // streak length: the path while the shutter is open (a drop crossing the lens is capped: longer is invisible)
  float blur = min(speed * uExpoRain, (uLayer == 5 ? 170.0 : 320.0) * uRes.y / 1080.0);
  float coc = min(uCocK * max(0.0, 1.0 / max(zc, 0.05) - 1.0 / uFocus), 40.0 * uRes.y / 1080.0);
  float rD = max(rTrue + coc, 0.6);
  // visibility: the true optical cover of a sub-pixel drop is ~0.5% (invisible), so it is boosted, but kept linear
  // in the drop size (a line's width cover, not a disc's area) and divided over the streak (the time share)
  float kVis = uLayer == 5 ? 3.5 : (uLayer == 6 ? 7.0 : (uLayer == 7 ? 8.0 : 9.0));
  a *= kVis * min(1.0, rTrue / rD) * (2.0 * rD + 1.0) / (blur + 2.0 * rD + 1.0);
  // per drop: most are faint, a few catch the light (brightness and visibility spread, so no even 'scratched film')
  float bri = mix(0.45, 1.25, r1.w * r1.w);
  a *= mix(0.55, 1.15, r2.x);
  a = min(a, 0.42);

  vec3 pW = uCamPos + uCamR * cs.x + uCamU * cs.y + uCamF * cs.z;
  float dist = length(cs);
  vec3 V = (pW - uCamPos) / dist;
  // the refracted environment: mostly sky (horizon-weighted), a little of the lit ground; slightly below the sky's
  // own radiance, so a drop is a faint grey line against the sky and a bright one against forest
  vec3 env = mix(uSkyHor, uSkyZen, 0.3) * 0.86 + uSkyAmb * 0.1;
  // sunlit drops (broken cloud): a forward-scattering glow toward the sun and glints along the streak
  float sunVis = (1.0 - uOvercast) * mix(1.0, cloudShadow(pW), 0.85);
  float mu = dot(V, uSunDir);
  float hg = (1.0 - 0.64) / pow(1.64 - 1.6 * mu, 1.5);         // Henyey-Greenstein, g = 0.8
  vec3 col = (env + uSunCol * sunVis * (0.03 + 0.02 * hg)) * bri;
  vec4 fg = fogAt(dist, V);
  col = col * fg.a + fg.rgb;

  float hl = rD + 0.5 * blur + 0.8, hw = rD + 0.8;
  vec2 perp = vec2(-dir.y, dir.x);
  vec2 offPx = dir * corner.x * hl + perp * corner.y * hw;
  gl_Position = vec4(ndc + offPx / (0.5 * uRes), 0.0, 1.0);
  vP = vec2(corner.x * hl, corner.y * hw);
  // the oscillating drop flashes the refracted sun a few times along its path (bead spacing ~ the drop's
  // oscillation period x its screen speed; at most ~1 bead per 6 px)
  vPar = vec4(rD, blur, 6.2831853 / max(speed * mix(0.008, 0.014, r2.y), 6.0), r2.z * 6.2831853);
  vDef = sat(coc / rD);
  vSun = uSunCol * sunVis * fg.a * bri * (0.35 + 0.25 * hg) * step(0.55, r1.z) * (1.0 - vDef);
  vCol = vec4(col, a);
  vDist = dist;
}
`;
  C.FS_RAIN = `
uniform vec2 uRes;
in vec2 vP;
flat in vec4 vPar;
flat in vec3 vSun;
flat in float vDef;
in vec4 vCol;
in float vDist;
out vec4 o;

void main() {
  float rD = vPar.x, hx = 0.5 * vPar.y;
  // capsule: a soft Gaussian line across (a defocused drop: a flatter, wider blur, like the near snow discs), the
  // exposure window along (the drop enters and leaves it: soft ends)
  float ax = max(abs(vP.x) - hx, 0.0);
  float d = length(vec2(ax, vP.y)) / rD;
  float cov = mix(exp(-d * d * 2.0), 0.75 * (1.0 - smoothstep(0.35, 1.0, d)), vDef);
  cov *= 1.0 - 0.55 * smoothstep(0.55, 1.0, abs(vP.x) / (hx + rD));
  // soft occlusion against the scene (G-buffer ray distance)
  vec2 suv = gl_FragCoord.xy / uRes;
  float occ = clamp((G0(suv).x - vDist) / max(0.4, 0.05 * vDist), 0.0, 1.0);
  float a = clamp(cov * vCol.a * occ, 0.0, 1.0);
  if (a < 0.0015) discard;
  float bead = pow(0.5 + 0.5 * sin(vP.x * vPar.z + vPar.w), 6.0);
  vec3 col = vCol.rgb + vSun * bead;
  // premultiplied; water transmits most of what is behind it, so the background is dimmed less than the
  // refracted light is added
  o = vec4(col * a, a * 0.8);
}
`;
  S.glsl.progs.rain = { vs: ['COMMON', 'ENV', 'ATMOS', 'PRECIP_VS', 'VS_RAIN'], fs: ['PRECISION_FI', 'ENV', 'GBUF', 'FS_RAIN'] };
})(window.SNOW);

</script>
<script>/* js/glsl/post.js */
// =====================================================================================
//  GLSL: post (stage-1 owner: lane C). FXAA on the scene (before the flakes), the bloom down / up chain, and the
//  composite: snow sparkle at canvas resolution (gated by the scene alpha: snow fraction x sun visibility, by the deck
//  and by the drifting cloud shadow), exposure, white balance, ACES, grade (S-curve, desaturation: derive/atmos.js),
//  vignette, grain and the first-load reveal. With ?view= the composite shows the debug channel ungraded.
// =====================================================================================
(function (S) {
  'use strict';
  const C = S.glsl.chunks;
  C.FS_FXAA = `precision highp float;
uniform sampler2D uTex; uniform vec2 uInv;
out vec4 o;
float L(vec3 c) { c = c / (1.0 + c); return dot(c, vec3(0.299, 0.587, 0.114)); }
void main() {
  vec2 uv = gl_FragCoord.xy * uInv;
  vec3 m = texture(uTex, uv).rgb;
  float lNW = L(texture(uTex, uv + vec2(-1.0, -1.0) * uInv).rgb), lNE = L(texture(uTex, uv + vec2(1.0, -1.0) * uInv).rgb);
  float lSW = L(texture(uTex, uv + vec2(-1.0, 1.0) * uInv).rgb), lSE = L(texture(uTex, uv + vec2(1.0, 1.0) * uInv).rgb);
  float lM = L(m);
  float lMin = min(lM, min(min(lNW, lNE), min(lSW, lSE))), lMax = max(lM, max(max(lNW, lNE), max(lSW, lSE)));
  if (lMax - lMin < max(0.03, lMax * 0.1)) { o = vec4(m, 1.0); return; }
  vec2 dir = vec2(-((lNW + lNE) - (lSW + lSE)), ((lNW + lSW) - (lNE + lSE)));
  float red = max((lNW + lNE + lSW + lSE) * 0.03125, 1.0 / 128.0);
  dir = clamp(dir / (min(abs(dir.x), abs(dir.y)) + red), -6.0, 6.0) * uInv;
  vec3 A = 0.5 * (texture(uTex, uv + dir * (1.0 / 3.0 - 0.5)).rgb + texture(uTex, uv + dir * (2.0 / 3.0 - 0.5)).rgb);
  vec3 B = A * 0.5 + 0.25 * (texture(uTex, uv - dir * 0.5).rgb + texture(uTex, uv + dir * 0.5).rgb);
  float lB = L(B);
  o = vec4((lB < lMin || lB > lMax) ? A : B, 1.0);
}`;
  C.FS_DOWN = `precision highp float;
uniform sampler2D uSrc; uniform vec2 uSrcInv; uniform vec2 uDstRes; uniform float uThresh;
out vec4 o;
void main() {
  vec2 uv = gl_FragCoord.xy / uDstRes;
  vec3 c = texture(uSrc, uv + uSrcInv * vec2(-1.0, -1.0)).rgb + texture(uSrc, uv + uSrcInv * vec2(1.0, -1.0)).rgb
         + texture(uSrc, uv + uSrcInv * vec2(-1.0, 1.0)).rgb + texture(uSrc, uv + uSrcInv * vec2(1.0, 1.0)).rgb;
  c *= 0.25;
  if (uThresh > 0.0) { float l = max(c.r, max(c.g, c.b)); c *= max(l - uThresh, 0.0) / max(l, 1e-4); c = min(c, vec3(30.0)); }
  o = vec4(c, 1.0);
}`;
  C.FS_UP = `precision highp float;
uniform sampler2D uSrc; uniform vec2 uSrcInv; uniform vec2 uDstRes;
out vec4 o;
void main() {
  vec2 uv = gl_FragCoord.xy / uDstRes;
  vec3 c = texture(uSrc, uv).rgb * 4.0;
  c += (texture(uSrc, uv + vec2(uSrcInv.x, 0.0)).rgb + texture(uSrc, uv - vec2(uSrcInv.x, 0.0)).rgb + texture(uSrc, uv + vec2(0.0, uSrcInv.y)).rgb + texture(uSrc, uv - vec2(0.0, uSrcInv.y)).rgb) * 2.0;
  c += texture(uSrc, uv + uSrcInv).rgb + texture(uSrc, uv - uSrcInv).rgb + texture(uSrc, uv + vec2(uSrcInv.x, -uSrcInv.y)).rgb + texture(uSrc, uv + vec2(-uSrcInv.x, uSrcInv.y)).rgb;
  o = vec4(c / 16.0, 1.0);
}`;
  // The composite. A scene may add its own composite step (Phase 3, lane H: the house's light halos in the evening air,
  // its highlight colour): FS_COMP_SCENE is FS_COMP with a prototype of sceneComp after its uniforms and one call,
  // c = sceneComp(c, uvS, frag), on the linear HDR frame (after the sparkle, before the exposure); the scene's chunk
  // follows FS_COMP_SCENE in its recipe 'comp@<scene>' (so it sees uExposure, uGrade, ...), defines sceneComp, and the
  // recipe replaces 'comp' (scene.progs). FS_COMP itself (the valley's) is generated without either line: byte-identical
  // to stage 0. (Stage 2b) FS_COMP_SCENE also lets the scene draw its reveal backdrop (sceneReveal, display space: the
  // house's evening sky instead of the flat pale screen) behind the first-load / scene-switch reveal edge.
  const comp = hook => `uniform sampler2D uHdr, uBloom, uScene;
uniform float uExposure, uBloomStr, uFrame, uTwinkleT;
uniform vec3 uGrade;         // white balance (season; rain cools it)

  let lostFlag = false;

    // striped bake; readyTime is cleared so the scene reveals itself again instead of hard-cutting in
    R.W = R.H = 0; R.gbCur = R.gbNext = R.scene = R.hdr = null; R.sky = [null, null]; R.bloom = []; R.skyI = 0;

<script>/* js/perf.js */
// =====================================================================================
//  perf.js — the adaptive quality ladder (frame-time controller) and the bake stripe budget. Registers only.
// =====================================================================================
(function (S) {
  'use strict';
  // Adaptive quality ladder, cheapest visual loss first: render scale 1 -> .87 -> .74 -> .6, then fewer cloud steps,
  // then fewer flakes. Per 90-frame window it compares the mean dt with the window's 10th-percentile dt (the display's
  // own frame period when the GPU keeps up): a slow mean that is also jittery above that floor is a GPU that cannot
  // keep up. A rung down is followed by two windows of cooldown; a run of windows at the display's cadence steps back up
  // (the run required doubles after each step down), so a transient blizzard cannot pin the calm scene low.
  // Two guards for phones (vsync-locked 60 Hz displays):
  //  - The ladder never climbs back into a rung it had to leave after climbing into it: a step down out of a rung that
  //    was reached by a step up makes the rung below the ceiling (minLevel) until the next resize / context restore.
  //    A step up is also judged on the very next window (a cadence clearly worse than before steps straight back), so
  //    a failed probe costs one window. Without this a GPU on the edge flapped between two rungs every ~2 minutes for
  //    ever; now every rung is re-entered at most once and the ladder settles.
  //  - A slow but steady cadence (<= ~38 fps, no jitter) is either a 30 Hz display / a low-power or throttled frame
  //    rate (nothing to gain) or a GPU that misses every vsync (a vsync-locked phone shows a steady 30 fps, which the
  //    jitter test alone takes for a 30 Hz display). One probe at the cheapest rung tells them apart: if the cadence
  //    improves the ladder stays there and climbs back rung by rung (each step judged); if not it returns and never
  //    probes again (slowOK) until the next resize.
  const PERF_RS = [1, 0.87, 0.74, 0.6];
  const PERF_WIN = 90;
  const TOP = 5;
  const perf = S.perf = { level: 0, rs: 1, skySteps: 36, flakeMul: 1, n: 0, cool: 0, good: 0, goodNeed: 10, skip: 0,
                          frameMs: 1000 / 60, avgMs: 0, dts: new Float32Array(PERF_WIN),
                          minLevel: 0, upMs: 0, cameUp: false, probeFrom: -1, probeMs: 0, probeMin: 0, slowOK: false };
  function setLevel(level) {
    if (level > perf.level && perf.cameUp) perf.minLevel = Math.max(perf.minLevel, perf.level + 1);   // left a rung it had climbed into
    perf.cameUp = level < perf.level;
    perf.level = level;
    perf.skySteps = level >= 4 ? 22 : 36;
    perf.flakeMul = level >= 5 ? 0.7 : 1;
    const rs = PERF_RS[Math.min(level, 3)];
    if (rs !== perf.rs) { perf.rs = rs; S.allocScaled(); }
  }
  S.resetPerf = function () {   // the GPU budget changed (new canvas size / restored context): start the ladder over
    perf.level = 0; perf.rs = 1; perf.skySteps = 36; perf.flakeMul = 1;
    perf.n = 0; perf.cool = 0; perf.good = 0; perf.skip = 2;
    perf.minLevel = 0; perf.upMs = 0; perf.cameUp = false; perf.probeFrom = -1; perf.slowOK = false;
  };

  // two deep, so the feedback lags that much; growth is slow enough not to overshoot far). The stripe grows while its
  // frame stays inside the limit and shrinks hard when it overruns (then grows gently). First load, with nothing else
  // to show: frames up to 34 ms (a 30 Hz display's own frames pass; the reveal takes ~1-2 s on an M-series GPU).
  // Rebake behind a live scene: the frame must stay close to the display's own frame period (perf.frameMs)
  S.adaptStripe = function (dt) {

    const base = perf.frameMs / 1000;
    const limit = R.gbCur ? Math.max(1.35 * base, base + 0.006) : 0.034;
    if (dt > limit) { R.gbRows = Math.max(1, Math.floor(R.gbRows * 0.6)); R.gbMiss = true; }
    else R.gbRows = Math.min(Math.ceil(R.gbRows * (R.gbMiss ? 1.03 : 1.15)), Math.ceil(R.H / 6));
  };
  // quality controller (see perf), once per PERF_WIN frames of a ready, bake-free scene; the 2 frames after a bake are
  // skipped (they still carry the last stripe). perf.frameMs, the display's frame period estimate, also sets the
  // rebake stripe budget (adaptStripe)
  S.controller = function (dt) {
    if (perf.skip > 0) { perf.skip--; return; }
    perf.dts[perf.n++] = dt;
    if (perf.n < PERF_WIN) return;
    perf.n = 0;
    let sum = 0; for (let i = 0; i < PERF_WIN; i++) sum += perf.dts[i];
    perf.dts.sort();                                           // Float32Array: numeric
    const floor = Math.max(4, perf.dts[PERF_WIN / 10] * 1000), avg = sum / PERF_WIN * 1000;
    perf.frameMs = floor; perf.avgMs = avg;

      const from = perf.probeFrom; perf.probeFrom = -1; perf.good = 0;

      return;                                // else the GPU was the limit: stay, climb back with the usual good runs
    }

      perf.probeFrom = perf.level; perf.probeMs = avg; perf.probeMin = perf.minLevel; perf.good = 0; setLevel(TOP); perf.skip = 2;
    } else if (avg <= 1.02 * floor && perf.level > perf.minLevel) {
      if (++perf.good >= perf.goodNeed) { perf.upMs = avg; setLevel(perf.level - 1); perf.good = 0; perf.skip = 2; }
    } else perf.good = 0;
  };

<script>/* js/sim/climate.js */
// =====================================================================================
//  sim/climate.js (stage-1 owner: lane A) — the year clock. Pure JS: no GL, no DOM (loads in node, tests/sim.mjs).
//  YEAR = 1200 climate-s at speed 1 (a season every 5 min). The phase starts from the real date (1 Mar = 0; whole
//  calendar days, so ?seed&t reproduce exactly within a day) unless ?season= / ?yp= is given. A season pick (setSeason) never jumps: the phase eases along the shortest arc to its
//  target over PIN_EASE climate-s, then holds; releasing it (null) lets the year flow on from where it is.
//
//  S.climate = { s, init(cfg), step(dtc, ff), snapshot(), api, seasonKo(phase) }     (main.js steps it first, in
//  climate seconds; seasonKo is the Korean season label of state().seasonKo and the pop-over's status line)
//    s.t        climate seconds since boot (advances by real dt x speed)
//    s.phase    year phase in [0, 1): 0 = start of spring (~1 Mar), .25 summer, .5 autumn, .75 winter
//    s.pinned   null (the year runs), or the phase the season is held at (?season= / setSeason)
//    s.speed    climate seconds per real second (0..8; the UI offers 0.25, 0.5, 1, 2, 4, 8; 0 = paused, api only)
//    s.seasonW  [spring, summer, autumn, winter]: smooth cyclic weights centred mid-season, summing to 1
//    s.tSeason  the seasonal meadow temperature without the weather (deg C): 4 + 10 sin(2 pi (phase - 0.125))
//  ff (fastForward / advance) is passed through; the climate does not depend on it.
//  Debug hook ?yp= pins s.phase after every step (and at init).
// =====================================================================================
(function (S) {
  'use strict';
  const YEAR = 1200;           // climate-s per year at speed 1
  const PIN_EASE = 60;         // climate-s: a season pick eases to its phase over one weather-transition length
  const NAMES = ['spring', 'summer', 'autumn', 'winter'];
  const KO = ['봄', '여름', '가을', '겨울'];
  const s = { t: 0, phase: 0, pinned: null, speed: 1, seasonW: [0, 0, 0, 1], tSeason: 0 };
  let yp = null;
  // the pin ease: phase(t) = from + arc * smooth(t0, t0 + PIN_EASE, t), arc the signed shortest way to s.pinned
  const ease = { from: 0, arc: 0, t0: -1e9 };
  const wrap = x => x - Math.floor(x);
  // a season name, or a phase 0..1 (string or number) -> phase; null for none / 'auto'
  function phaseOf(v) {
    if (v === null || v === undefined || v === '' || v === 'auto') return null;
    const i = NAMES.indexOf(String(v));
    if (i >= 0) return (i + 0.5) / 4;
    const n = parseFloat(v);
    return isFinite(n) ? wrap(n) : null;
  }
  // year phase of a calendar date (0 on 1 March), by whole calendar days: the start phase must not depend on the time
  // of day, or the same ?seed&t would give a different state from one run to the next (determinism)
  function datePhase(d) {
    const y = d.getFullYear();
    let days = (Date.UTC(y, d.getMonth(), d.getDate()) - Date.UTC(y, 2, 1)) / 864e5;
    if (days < 0) days += 365.25;

    for (let i = 0; i < 4; i++) {

  // Korean name with an early / mid / late prefix (초봄, 한여름, 늦가을, ...): the first 30% of a season is early, the
  // last 45% late (Korean usage: late October is already 늦가을). The one season label: state().seasonKo and the
  // pop-over's status line (ui.js, through S.climate.seasonKo) both use it
  function seasonKo(ph = s.phase) {

      // a number to that phase. Returns the climate snapshot
      setSeason(v) {
        const p = phaseOf(v);
        if (p === null) s.pinned = null;
        else {
          s.pinned = p;
          ease.from = s.phase; ease.t0 = s.t;
          ease.arc = wrap(p - s.phase + 0.5) - 0.5;        // signed shortest arc in (-0.5, 0.5]
        }
        return S.climate.snapshot();
      },
      get speed() { return s.speed; },
      set speed(v) { s.speed = S.clamp(+v || 0, 0, 8); },
    },
  };
})(window.SNOW);

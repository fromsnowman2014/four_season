<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>눈 내리는 들판</title>
<style>
  :root { --line: rgba(255,255,255,0.22); --ink: rgba(255,255,255,0.96); --ink2: rgba(255,255,255,0.80); }
  /* body colour = the composite's fade base (0.80, 0.85, 0.90), so the pre-script page, the first GL frame and the reveal all start from one colour */
  html, body { margin: 0; height: 100%; overflow: hidden; background: rgb(204,217,230); user-select: none; -webkit-user-select: none;
               font: 500 12.5px/1.35 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif; }
  /* the canvas fills the current layout viewport (100% of the fixed containing block, not 100vh: on phones vh is the
     largest viewport and can disagree with the visible one); its pixel size is read back from its box in allocate() */
  canvas { display: block; position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; }
  html, body { overscroll-behavior: none; -webkit-touch-callout: none; }
  /* The only chrome: a soft snowflake glyph in the corner. A dark halo keeps it readable over snow (it is a white
     flake among white flakes); it dims once the pointer rests (never below 0.25), brightens on hover / open, and
     lifts once for two seconds when the hint fades so a first-time viewer notices the corner. */
  #icon { position: fixed; right: calc(22px + env(safe-area-inset-right)); bottom: calc(20px + env(safe-area-inset-bottom)); width: 28px; height: 28px; padding: 8px; margin: -8px; cursor: pointer;
          opacity: 0.5; transition: opacity 0.9s ease; -webkit-tap-highlight-color: transparent; outline: none; }
  #icon svg { display: block; width: 100%; height: 100%; filter: drop-shadow(0 0 2.5px rgba(0,25,50,0.75)) drop-shadow(0 1px 2px rgba(0,20,40,0.5)); }
  #icon.idle { opacity: 0.25; }
  #icon.lift { opacity: 0.9; transition-duration: 0.6s; }
  #icon:hover, #icon.open, #icon:focus-visible { opacity: 0.85; transition-duration: 0.25s; }
  /* glass pop-over anchored above the icon: a cool dark frosted glass, so white ink keeps >= 4.5:1 over snow */
  #pop { position: fixed; right: calc(22px + env(safe-area-inset-right)); bottom: calc(62px + env(safe-area-inset-bottom)); width: 240px; max-width: calc(100% - 44px); box-sizing: border-box; padding: 14px 16px 13px; border-radius: 16px;
         background: linear-gradient(160deg, rgba(16,32,58,0.76), rgba(16,32,58,0.68));
         border: 1px solid var(--line); box-shadow: 0 10px 32px rgba(20,40,70,0.28), inset 0 1px 0 rgba(255,255,255,0.14);
         -webkit-backdrop-filter: blur(18px) saturate(1.3); backdrop-filter: blur(18px) saturate(1.3);
         color: var(--ink); letter-spacing: 0.01em; text-shadow: 0 1px 2px rgba(0,20,40,0.35); user-select: none;
         opacity: 0; transform: translateY(6px) scale(0.98); transform-origin: 100% 100%; pointer-events: none; visibility: hidden;
         transition: opacity 0.25s ease, transform 0.25s ease, visibility 0s linear 0.25s; }
  #pop.open { opacity: 1; transform: none; pointer-events: auto; visibility: visible; transition-delay: 0s; }
  /* one focus ring that belongs to the glass, instead of Chrome's black outline */
  #pop :focus-visible, #icon:focus-visible, .toggle input:focus-visible + .sw { outline: 1.5px solid rgba(255,255,255,0.85); outline-offset: 2px; }
  #icon:focus-visible { outline-offset: -4px; border-radius: 50%; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 0 0 9px; }
  /* two-tone track (filled part white, rest a dark groove) so the control's range reads on snow and on meadow; --p is set from JS */
  input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 3px; border-radius: 2px; margin: 5px 0 0; cursor: pointer;
                      background: linear-gradient(90deg, rgba(255,255,255,0.88) var(--p, 50%), rgba(0,20,40,0.45) var(--p, 50%)); box-shadow: inset 0 1px 0 rgba(255,255,255,0.12); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 13px; height: 13px; border-radius: 50%; background: #fff; box-shadow: 0 1px 4px rgba(0,30,60,0.35); cursor: pointer; }
  .col { display: block; margin: 0 0 12px; }
  .col span { display: flex; justify-content: space-between; color: var(--ink); }
  .col span i { font-style: normal; color: var(--ink2); font-variant-numeric: tabular-nums; }
  button { width: 100%; padding: 7px 0; margin: 0 0 8px; border-radius: 9px; border: 1px solid var(--line);
           background: rgba(255,255,255,0.10); color: var(--ink); font: inherit; text-shadow: inherit; cursor: pointer; transition: background .2s; }
  button:hover { background: rgba(255,255,255,0.18); }
  button:active { background: rgba(255,255,255,0.26); }
  button.busy { background: rgba(140,200,255,0.25); cursor: default; }
  button.last { margin-bottom: 0; }
  .toggle { cursor: pointer; margin: 2px 0 10px; }
  .sw { position: relative; width: 30px; height: 17px; border-radius: 9px; background: rgba(255,255,255,0.25); transition: background .2s; flex: none; }
  .sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 13px; height: 13px; border-radius: 50%; background: #fff; transition: transform .2s; box-shadow: 0 1px 3px rgba(0,30,60,0.3); }
  .toggle input { position: absolute; width: 1px; height: 1px; margin: -1px; opacity: 0; overflow: hidden; clip: rect(0 0 0 0); pointer-events: none; }   /* visually hidden, still keyboard-reachable */
  .toggle input:checked + .sw { background: rgba(140,200,255,0.65); }
  .toggle input:checked + .sw::after { transform: translateX(13px); }
  #hint { position: fixed; left: 50%; bottom: calc(9vh + env(safe-area-inset-bottom)); transform: translateX(-50%); padding: 9px 18px; border-radius: 20px;
          background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.25);
          -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
          color: rgba(255,255,255,0.95); font-size: 14px; line-height: 1.2; letter-spacing: 0; text-shadow: 0 1px 3px rgba(0,20,40,0.4);
          pointer-events: none; opacity: 0; transition: opacity 1.4s ease; white-space: nowrap; }
  #hint.on { opacity: 1; }
  #err { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; padding: 20px; pointer-events: none; }
  #err span { padding: 12px 20px; border-radius: 14px; background: rgba(255,255,255,0.75); color: #234; font-size: 15px; line-height: 1.6; text-align: center;
              -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); box-shadow: 0 6px 24px rgba(20,40,70,0.2); }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="icon" role="button" aria-label="눈 설정" tabindex="0" aria-haspopup="dialog" aria-expanded="false">
  <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
    <g><path d="M12 2.6v18.8M9.9 4.7 12 6.8l2.1-2.1M9.9 19.3 12 17.2l2.1 2.1M10.4 8.5 12 10.1l1.6-1.6M10.4 15.5 12 13.9l1.6 1.6"/></g>
    <g transform="rotate(60 12 12)"><path d="M12 2.6v18.8M9.9 4.7 12 6.8l2.1-2.1M9.9 19.3 12 17.2l2.1 2.1M10.4 8.5 12 10.1l1.6-1.6M10.4 15.5 12 13.9l1.6 1.6"/></g>
    <g transform="rotate(120 12 12)"><path d="M12 2.6v18.8M9.9 4.7 12 6.8l2.1-2.1M9.9 19.3 12 17.2l2.1 2.1M10.4 8.5 12 10.1l1.6-1.6M10.4 15.5 12 13.9l1.6 1.6"/></g>
  </svg>
</div>
<div id="pop" role="dialog" aria-label="눈 설정">
  <label class="col"><span>눈의 양 <i id="amountv">50%</i></span><input type="range" id="amount" min="0" max="1" step="0.01" value="0.5"></label>
  <button id="blizzard">폭설 일으키기</button>
  <label class="row toggle"><span>자동 폭설</span><input type="checkbox" id="auto" checked><span class="sw"></span></label>
  <button id="reset" class="last">쌓인 눈 초기화</button>
</div>
<div id="hint">마우스를 움직여 바람을 일으켜 보세요</div>
<div id="err"><span></span></div>

<script>
'use strict';
// =====================================================================================
//  Snow over an alpine meadow — raw WebGL2.
//  Pipeline (static camera):
//   1. G-buffer: a one-time, progressive (striped) iq-style raymarch of the heightfield
//      terrain + SDF conifers + chalets. Stores distance, material, sun shadow, AO,
//      albedo, snow-threshold and two normals. Because the camera never moves this is
//      the ultimate temporal reuse: geometry is marched once, shading runs every frame.
//   2. Cloud pass (half res, temporally accumulated volumetric cumulus slab). Stores premultiplied
//      cloud light + transmittance and an opacity-weighted cloud distance; the analytic sky is
//      evaluated in the shading pass so clouds can be composited over the sky or the far peaks.
//   3. Scene shading: snow coverage, storm lighting, cloud shadows, fog, veil.
//   4. FXAA on the scene, 5. instanced stateless snowflakes (4 depth layers, soft
//      occlusion against the G-buffer distance), 6. bloom, 7. ACES composite + grade.
//   Steps 2-6 run at an adaptive render scale (frame-time controller, down to 0.6 and back up); the G-buffer
//   stays at canvas size (DPR capped at 1.25, ~8.4 Mpx) and the composite upsamples.
//   A resize bakes a second G-buffer in time-budgeted stripes while the old one is still shown (aspect-corrected),
//   and the new rows wipe in from the bottom; the first load uses the same wipe as its progress reveal.
// =====================================================================================

const Q = new URLSearchParams(location.search);
const qNum = (k, d) => { const v = Q.get(k); if (v === null || v === '') return d; const n = parseFloat(v); return isFinite(n) ? n : d; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const SEED = Math.floor(qNum('seed', 1)) >>> 0;
const T0 = Math.max(0, qNum('t', 0));
const COVER_Q = Q.has('cover') ? clamp(qNum('cover', 0), 0, 1) : null;
const STORM_Q = Q.get('storm');
const WIND_Q = (Q.get('wind') || '').split(',').map(Number);
const SHOW_UI = Q.get('ui') !== '0';
// ?fixed=1: a fixed 1/60 s simulation step (and a grain clock derived from it) instead of the wall clock, so
// ?t&seed captures are reproducible frame for frame; the quality controller is off in this mode
const FIXED = Q.get('fixed') === '1';

function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl2', { antialias: false, depth: false, stencil: false, alpha: false, premultipliedAlpha: false, powerPreference: 'high-performance' });
const errEl = document.getElementById('err');
function showErr(msg) { errEl.style.display = 'flex'; errEl.firstElementChild.textContent = msg; }
function hideErr() { errEl.style.display = 'none'; }
function fatal(msg) { showErr(msg); throw new Error(msg); }
if (!gl) fatal('WebGL2를 지원하지 않는 브라우저입니다.');
// extension objects die with the context, so they are (re)requested in initGL()
function getExtensions() {
  if (!(gl.getExtension('EXT_color_buffer_float') || gl.getExtension('EXT_color_buffer_half_float'))) fatal('부동소수점 렌더 타깃(EXT_color_buffer_float)을 지원하지 않습니다.');
  gl.getExtension('OES_texture_float_linear');
}

// ------------------------------------------------------------------ camera & sun
// high vantage over the meadow: ~230 m above the chalet basin, tilted 12 deg down (horizon sits at ~24% from the top)
const CAM = { pos: [0, 132, 0], yaw: 0.0, pitch: -12 * Math.PI / 180, fovY: 44 * Math.PI / 180 };
const camF = [0, 0, 1], camR = [1, 0, 0], camU = [0, 1, 0];   // filled by frameCamera; mutated in place (other code holds them)
let TANH = Math.tan(CAM.fovY / 2);
// Framing per aspect ratio. Landscape (w/h >= 1.25) is the composed 44 deg view. Toward portrait (phones) the vertical
// fov widens so the horizontal fov never drops below 34 deg, the camera tilts down 4 deg (more meadow under a taller
// frame) and turns 9 deg left so the snowy peak and the hazy valley stay in frame beside the wall.
// Returns true when the camera moved (the baked G-buffer is then stale).
function frameCamera(asp) {
  const t = smooth(1.25, 0.6, asp), d = Math.PI / 180;
  const tanV = Math.tan(22 * d) + t * Math.max(0, Math.tan(17 * d) / asp - Math.tan(22 * d));
  const yaw = -9 * d * t, pitch = (-12 - 4 * t) * d;
  const changed = Math.abs(tanV - TANH) > 1e-6 || Math.abs(yaw - CAM.yaw) > 1e-6 || Math.abs(pitch - CAM.pitch) > 1e-6;
  CAM.yaw = yaw; CAM.pitch = pitch; CAM.fovY = 2 * Math.atan(tanV); TANH = tanV;
  camF[0] = Math.sin(yaw) * Math.cos(pitch); camF[1] = Math.sin(pitch); camF[2] = Math.cos(yaw) * Math.cos(pitch);
  const l = Math.hypot(camF[2], camF[0]); camR[0] = camF[2] / l; camR[1] = 0; camR[2] = -camF[0] / l;
  camU[0] = camF[1] * camR[2] - camF[2] * camR[1]; camU[1] = camF[2] * camR[0] - camF[0] * camR[2]; camU[2] = camF[0] * camR[1] - camF[1] * camR[0];  // F x R = up
  return changed;
}
frameCamera(16 / 9);
const SUN = (() => { const s = [-0.70, 0.47, -0.17]; const l = Math.hypot(...s); return s.map(v => v / l); })();

// =====================================================================================
//                                    GLSL
// =====================================================================================
const COMMON = `
precision highp float; precision highp int; precision highp sampler2D;
uniform vec2 uRes;
uniform vec3 uCamPos, uCamR, uCamU, uCamF;
uniform float uTanH;
uniform vec3 uSunDir;
uniform float uTime, uStorm, uStormSky, uCover;   // uStorm: the snow curtain; uStormSky: the overcast / wind front that leads and outlasts it
uniform vec3 uSunCol, uSkyAmb, uSkyZen, uSkyHor, uFogCol;
uniform vec4 uFogP;      // x haze density, y haze scale height, z storm extinction, w valley-mist density
uniform vec2 uCloudOff;
uniform float uCloudCov;
uniform sampler2D uNoise;

vec3 camRay(vec2 frag) {
  vec2 ndc = frag / uRes * 2.0 - 1.0;
  return normalize(uCamF + uCamR * (ndc.x * uTanH * uRes.x / uRes.y) + uCamU * (ndc.y * uTanH));
}
uint hu(uint x) { x ^= x >> 16; x *= 0x7feb352du; x ^= x >> 15; x *= 0x846ca68bu; x ^= x >> 16; return x; }
float hf(uint x) { return float(hu(x)) * (1.0 / 4294967296.0); }
float hash2(vec2 p) { ivec2 i = ivec2(floor(p)); return hf(uint(i.x) * 0x27d4eb2du ^ hu(uint(i.y) + 0x165667b1u)); }
float sat(float x) { return clamp(x, 0.0, 1.0); }
float sq(float x) { return x * x; }

// Texture value noise (cheap, per-frame use). Texel (x,y): G = A(x,y), R = A(x+37,y+17),
// which turns one bilinear fetch into a 3D noise lookup (iq's trick).
float tnoise(vec2 x) { vec2 p = floor(x), f = fract(x); f = f * f * (3.0 - 2.0 * f); return textureLod(uNoise, (p + f + 0.5) / 256.0, 0.0).g; }
float tnoise3(vec3 x) {
  vec3 p = floor(x), f = fract(x); f = f * f * (3.0 - 2.0 * f);
  vec2 uv = p.xy + vec2(37.0, 17.0) * p.z + f.xy;
  vec2 rg = textureLod(uNoise, (uv + 0.5) / 256.0, 0.0).gr;
  return mix(rg.x, rg.y, f.z);
}

// Sky radiance (analytic): Rayleigh-ish zenith/horizon gradient + Mie halo around the sun,
// plus a thin, streaky cirrus veil high up (a 2D noise sheet at ~9 km).
vec3 skyColor(vec3 rd) {
  float mu = dot(rd, uSunDir);
  float y = clamp(rd.y, 0.0, 1.0);
  vec3 c = mix(uSkyHor, uSkyZen, pow(y + 0.015, 0.5));
  c = mix(c, mix(uSkyHor, vec3(0.70, 0.76, 0.86), 0.5), exp(-max(rd.y, 0.0) * 30.0) * 0.5);   // pale haze band at the horizon
  if (rd.y > 0.0) {
    // dome projection (rd.y + 0.35) instead of a flat 9 km sheet: the visible sky only spans rd.y 0.02-0.17,
    // where a plane is foreshortened ~50:1 into horizontal scanlines; the dome keeps the wisps ~2:1
    vec2 q = rd.xz / (rd.y + 0.35) * 2500.0 + uCloudOff * 0.12;
    float v = tnoise(q * 0.0007 + 2.0) * 0.5 + tnoise(q * 0.0017 + 7.0) * 0.3 + tnoise(q * 0.0041 + 4.0) * 0.2;
    float cir = smoothstep(0.52, 0.8, v) * (0.10 - 0.05 * uStormSky) * smoothstep(0.015, 0.09, rd.y);
    c = mix(c, vec3(0.9, 0.93, 0.98) * dot(uSunCol, vec3(0.11)), cir);
  }
  float s = max(mu, 0.0);
  c += uSunCol * (0.018 * pow(s, 3.0) + 0.05 * pow(s, 24.0) + 0.9 * pow(s, 1200.0));
  return c;
}
// storm stratus deck: brightness modulation (about -0.45..+0.3) of the overcast underside, projected on a low
// dome: a slow ragged base sheet, a fast low scud layer racing under it (the deck visibly moves), and a
// zenith-to-horizon gradient (the deck is darkest overhead, the horizon is lit by the snow below). Applied to
// the whiteout itself too (the snow curtain is lit by the deck above it), so the storm sky keeps cloud
// structure instead of collapsing into one flat grey field
float stratus(vec3 rd) {
  float y = max(rd.y, 0.0);
  vec2 q = rd.xz / (y + 0.15) * 2.0 + uCloudOff * 0.0004 + vec2(uTime * 0.01, 0.0);
  float st = tnoise(q) * 0.5 + tnoise(q * 2.3 + 3.0) * 0.3 + tnoise(q * 5.1 + 7.0) * 0.2;
  vec2 q2 = rd.xz / (y + 0.08) * 3.0 + uCloudOff * 0.0012 + vec2(uTime * 0.05, uTime * 0.01);
  float sc = tnoise(q2 + 11.0) * 0.6 + tnoise(q2 * 2.1 + 5.0) * 0.4;
  float m = 0.8 * (st - 0.5) + 0.4 * (sc - 0.5) - 0.18 * smoothstep(0.0, 0.25, y);
  return m * smoothstep(-0.03, 0.1, rd.y);
}

// Cumulus slab (world altitude). It sits just above the camera so clouds drift around the peaks.
const float CB = 1500.0, CT = 3600.0;
// Large-scale cloud placement ("weather map"), shared by clouds and their ground shadows.
float weather(vec2 q) { return tnoise(q * 0.00016 + vec2(3.1, 7.7)) * 0.62 + tnoise(q * 0.00047 + vec2(9.0, 1.3)) * 0.38; }
float cloudShadow(vec3 p) {
  vec2 q = p.xz + uSunDir.xz / uSunDir.y * (0.5 * (CB + CT) - p.y) + uCloudOff;
  // the overhead cumulus (out of frame) is smaller-celled than the far field, so the dapple has ~1 km lobes
  float w = weather(q) * 0.4 + tnoise(q * 0.0012 + 2.0) * 0.35 + tnoise(q * 0.0031 + 7.0) * 0.25;
  float shape = sat((w - (1.0 - uCloudCov)) / max(uCloudCov, 0.05));
  shape += 0.16 * (tnoise(q * 0.0075 + 5.0) - 0.5);          // ragged edges that follow the cloud detail
  return 1.0 - 0.65 * smoothstep(0.06, 0.28, shape) * (1.0 - 0.7 * uStormSky);
}

// Aerial perspective: analytic integral of an exponential-height haze, a shallow dense
// valley-mist layer and a uniform storm whiteout. Returns inscatter (rgb) and transmittance (a).
vec4 fogAtM(float t, vec3 rd, float mistMod) {
  float y0 = uCamPos.y;
  float ry = abs(rd.y) < 1e-4 ? 1e-4 : rd.y;
  float k = 1.0 / uFogP.y;
  float odH = uFogP.x * exp(-y0 * k) * (1.0 - exp(clamp(-ry * t * k, -30.0, 30.0))) / (ry * k);
  float km = 1.0 / 260.0;
  float odM = uFogP.w * exp(-(y0 + 650.0) * km) * (1.0 - exp(clamp(-ry * t * km, -30.0, 30.0))) / (ry * km);
  float odS = uFogP.z * t;
  odH = max(odH, 0.0); odM = max(odM, 0.0) * mistMod;
  float od = odH + odM + odS;
  float T = exp(-od);
  float mu = max(dot(rd, uSunDir), 0.0);
  vec3 cH = uFogCol + uSunCol * (0.03 * pow(mu, 6.0));
  vec3 cM = mix(uFogCol, vec3(dot(uFogCol, vec3(0.33))), 0.35) * 1.02 + uSunCol * 0.012;
  vec3 cS = uFogCol;
  vec3 c = (cH * odH + cM * odM + cS * odS) / max(od, 1e-6);
  return vec4(c * (1.0 - T), T);
}
vec4 fogAt(float t, vec3 rd) { return fogAtM(t, rd, 1.0); }
// drifting valley mist banks: density modulation sampled at the hit (or 6 km out), continuous across the horizon
float mistBanks(vec3 rd, float t) {
  float tl = min(t, 6000.0);
  vec3 p = uCamPos + rd * tl;
  vec2 q = p.xz * 0.00045 + vec2(uTime * 0.004, uTime * 0.0015) + uCloudOff * 0.00002;
  float n = tnoise(q) * 0.55 + tnoise(q * 2.3 + 4.1) * 0.3 + tnoise(q * 4.7 + 9.0) * 0.15;   // 2.2 km / 1 km / 470 m bands
  return 0.3 + 1.3 * smoothstep(0.35, 0.8, n);
}
vec2 octEnc(vec3 n) {
  vec3 v = n / (abs(n.x) + abs(n.y) + abs(n.z));
  vec2 e = v.xz;
  if (v.y < 0.0) e = (1.0 - abs(e.yx)) * vec2(e.x >= 0.0 ? 1.0 : -1.0, e.y >= 0.0 ? 1.0 : -1.0);
  return e;
}
vec3 octDec(vec2 e) {
  vec3 v = vec3(e.x, 1.0 - abs(e.x) - abs(e.y), e.y);
  float t = max(-v.y, 0.0);
  v.x += v.x >= 0.0 ? -t : t; v.z += v.z >= 0.0 ? -t : t;
  return normalize(v);
}
`;

const VS_FULL = `#version 300 es
void main() { vec2 p = vec2((gl_VertexID << 1) & 2, gl_VertexID & 2); gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0); }`;

// G-buffer reads for the per-frame passes. While a resize rebakes, two buffers exist: uG* (the current one, baked
// for the previous canvas) and uN* (the next, striped in from the bottom row up). The vertical FOV is fixed, so a
// pixel of the old buffer still holds the right ray once u is rescaled by the aspect ratio change (uGb.x; columns
// beyond the old frame clamp to its edge); rows already baked read the new buffer, so the new frame wipes up over
// the old one and the final swap changes nothing. On the first load (uGb.z = 2) there is no old buffer: unbaked rows
// read as sky and the composite hides them behind the reveal edge.
//   uGb: x = new/old aspect, y = baked fraction of the next buffer (from the bottom), z = 0 one buffer, 1 both, 2 next only
// The no-bake case (almost every frame) is one textureLod behind a uniform branch: explicit LOD, so no implicit
// derivatives force the compiler to flatten the bake-only branches into extra fetches
const GBUF = `
uniform sampler2D uG0, uG1, uG2, uN0, uN1, uN2;
uniform vec3 uGb;
vec4 gbMix(vec4 nxt, vec4 cur, vec4 none, vec2 uv) { return uv.y < uGb.y ? nxt : (uGb.z > 1.5 ? none : cur); }
vec2 gbUV(vec2 uv) { return vec2(0.5 + (uv.x - 0.5) * uGb.x, uv.y); }
vec4 G0(vec2 uv) { if (uGb.z < 0.5) return textureLod(uG0, uv, 0.0); return gbMix(textureLod(uN0, uv, 0.0), textureLod(uG0, gbUV(uv), 0.0), vec4(65000.0, 0.0, 1.0, 1.0), uv); }
vec4 G1(vec2 uv) { if (uGb.z < 0.5) return textureLod(uG1, uv, 0.0); return gbMix(textureLod(uN1, uv, 0.0), textureLod(uG1, gbUV(uv), 0.0), vec4(0.0), uv); }
vec4 G2(vec2 uv) { if (uGb.z < 0.5) return textureLod(uG2, uv, 0.0); return gbMix(textureLod(uN2, uv, 0.0), textureLod(uG2, gbUV(uv), 0.0), vec4(0.0), uv); }
`;

// ------------------------------------------------------------------ G-buffer raymarch
const FS_GBUF = `#version 300 es
${COMMON}
uniform float uPixAng;
uniform int uIter;                  // state-machine iteration cap (a uniform bound: the driver cannot unroll the loop)
layout(location = 0) out vec4 o0;   // t, material(+grass frac), sun shadow, AO
layout(location = 1) out vec4 o1;   // albedo, snow threshold
layout(location = 2) out vec4 o2;   // oct(detail normal), oct(smooth normal)

const mat2 M2 = mat2(0.8, 0.6, -0.6, 0.8);
const float TMAX = 42000.0;
const float HMAX = 4400.0;

// value noise in [-1,1] (quintic) and with analytic derivatives
float vn(vec2 x) {
  vec2 i = floor(x), f = x - i;
  vec2 u = f * f * f * (f * (f * 6.0 - 15.0) + 10.0);
  float a = hash2(i), b = hash2(i + vec2(1, 0)), c = hash2(i + vec2(0, 1)), d = hash2(i + vec2(1, 1));
  return -1.0 + 2.0 * (a + (b - a) * u.x + (c - a) * u.y + (a - b - c + d) * u.x * u.y);
}
vec3 vnd(vec2 x) {
  vec2 i = floor(x), f = x - i;
  vec2 u = f * f * f * (f * (f * 6.0 - 15.0) + 10.0);
  vec2 du = 30.0 * f * f * (f * (f - 2.0) + 1.0);
  float a = hash2(i), b = hash2(i + vec2(1, 0)), c = hash2(i + vec2(0, 1)), d = hash2(i + vec2(1, 1));
  float k1 = b - a, k2 = c - a, k4 = a - b - c + d;
  return vec3(-1.0 + 2.0 * (a + k1 * u.x + k2 * u.y + k4 * u.x * u.y), 2.0 * du * vec2(k1 + k4 * u.y, k2 + k4 * u.x));
}
// 3D value noise (for rock detail on steep faces, where heightfield noise would be stretched)
float hash3(vec3 p) { ivec3 i = ivec3(floor(p)); return hf(uint(i.x) * 0x27d4eb2du ^ hu(uint(i.y) * 0x165667b1u ^ hu(uint(i.z) + 0x9e3779b9u))); }
float vn3(vec3 x) {
  vec3 i = floor(x), f = x - i;
  vec3 u = f * f * (3.0 - 2.0 * f);
  float a = mix(mix(hash3(i), hash3(i + vec3(1, 0, 0)), u.x), mix(hash3(i + vec3(0, 1, 0)), hash3(i + vec3(1, 1, 0)), u.x), u.y);
  float b = mix(mix(hash3(i + vec3(0, 0, 1)), hash3(i + vec3(1, 0, 1)), u.x), mix(hash3(i + vec3(0, 1, 1)), hash3(i + vec3(1, 1, 1)), u.x), u.y);
  return mix(a, b, u.z) * 2.0 - 1.0;
}
float fbm3(vec3 p, float oct) {
  float a = 0.0, b = 0.5;
  for (int i = 0; i < 7; i++) {
    float fi = float(i); if (fi >= oct) break;
    a += b * vn3(p) * clamp(oct - fi, 0.0, 1.0);
    b *= 0.5; p = p * 2.03 + vec3(1.7, -3.1, 2.3);
  }
  return a;
}
// 3D bump: perturb the normal by the surface-projected gradient of a 3D fbm (ridged-ish rock)
vec3 rockBump(vec3 p, vec3 n, float fp, float amp) {
  float sc = 70.0;
  float oct = clamp(log2(sc / max(1.5 * fp, 0.2)), 0.0, 7.0);
  float e = max(fp * 0.7, 0.3);
  vec3 q = p / sc;
  float c = abs(fbm3(q, oct));
  vec3 g = vec3(abs(fbm3(q + vec3(e / sc, 0, 0), oct)) - c, abs(fbm3(q + vec3(0, e / sc, 0), oct)) - c, abs(fbm3(q + vec3(0, 0, e / sc), oct)) - c) / e;
  g -= dot(g, n) * n;
  return normalize(n - amp * sc * g);
}

// fbm with a fractional octave count (smooth LOD by pixel footprint -> no seams)
float fbmF(vec2 p, float oct) {
  float a = 0.0, b = 0.5;
  for (int i = 0; i < 12; i++) {
    float fi = float(i); if (fi >= oct) break;
    a += b * vn(p) * clamp(oct - fi, 0.0, 1.0);
    b *= 0.5; p = M2 * p * 2.03 + 1.7;
  }
  return a;
}
// iq "erosion" fbm: each octave is damped by the accumulated slope, n/(1+|grad|^2),
// so detail collects in gullies and ridges stay sharp -> eroded mountain look.
float erodedFbm(vec2 p, float oct) {
  float a = 0.0, b = 0.5; vec2 d = vec2(0.0);
  for (int i = 0; i < 12; i++) {
    float fi = float(i); if (fi >= oct) break;
    float w = clamp(oct - fi, 0.0, 1.0);
    vec3 n = vnd(p);
    d += n.yz * w;
    a += b * w * n.x / (1.0 + dot(d, d));
    b *= 0.5; p = M2 * p * 2.0;
  }
  return a;
}
// ridged multifractal (sharp crests), weights feed back between octaves
float ridgedFbm(vec2 p, float oct) {
  float a = 0.0, b = 0.5, w = 1.0;
  for (int i = 0; i < 10; i++) {
    float fi = float(i); if (fi >= oct) break;
    float f = clamp(oct - fi, 0.0, 1.0);
    float n = 1.0 - abs(vn(p)); n *= n;
    a += b * n * w * f;
    w = clamp(n * 1.7, 0.0, 1.0);
    b *= 0.5; p = M2 * p * 2.07 + 11.7;
  }
  return a;
}
float softplus(float x, float k) { return k * log(1.0 + exp(clamp(x / k, -40.0, 40.0))); }

// ---- scene layout (metres; camera at the origin looking +z, +x is screen-right). Staged after the
// reference photo: a high vantage over a chalet meadow, the great wall on the right seen at a grazing
// angle (its foot nearest at the right edge, receding to the far centre), the glacial valley far-left.
// Two dirt paths: path 1 winds away from the viewer up through the chalets, path 2 branches off at
// the junction (z = PJ) toward the lower right.
float path1X(float z) { return 20.0 + 70.0 * sin(z * 0.0044 + 0.8) + 26.0 * sin(z * 0.0127 + 2.0) - 0.05 * z; }
float path1dX(float z) { return 0.308 * cos(z * 0.0044 + 0.8) + 0.330 * cos(z * 0.0127 + 2.0) - 0.05; }
const float PJ = 700.0;
float path2Z(float x) { float u = x - path1X(PJ); return PJ - 0.5 * u + 55.0 * sin(u * 0.011 + 0.3) * smoothstep(0.0, 60.0, u); }
float path2dZ(float x) { float u = x - path1X(PJ); return -0.5 + 0.605 * cos(u * 0.011 + 0.3) * smoothstep(0.0, 60.0, u); }
// distance to the nearest path (grows past their ends so the masks fade out)
float pathDist(vec2 p) {
  float d1 = abs(p.x - path1X(p.y)) / sqrt(1.0 + sq(path1dX(p.y))) + 40.0 * smoothstep(2300.0, 2700.0, p.y);
  float u = p.x - path1X(PJ);
  float d2 = abs(p.y - path2Z(p.x)) / sqrt(1.0 + sq(path2dZ(p.x))) + 40.0 * smoothstep(0.0, -30.0, u);
  return min(d1, d2);
}
const vec2 WP = vec2(1600.0, 2400.0);     // nearest point of the wall's foot (just off the right edge)
const vec2 WD = vec2(-0.414, 0.910);      // unit direction along the foot, receding to the far centre
const vec2 WN = vec2(0.910, 0.414);       // unit direction into the wall (perpendicular to the foot)
float valleyAxis(float z) { return -1500.0 - 0.2 * z + 260.0 * sin(z * 0.00041 + 0.4); }

// macro weights used by both height and material. across/along: wall-frame coordinates (m);
// footD: signed distance from the (wavy) foot of the rock face, positive up the face
void layoutW(vec2 w, out float mtnW, out float valW, out float wallW, out float across, out float along, out float footD) {
  float x = w.x, z = w.y;
  vec2 r = w - WP;
  along = dot(r, WD); across = dot(r, WN);
  // the foot line waves at two scales so the face is ribbed with buttresses all the way down, not a flat ramp
  float ac = across + 260.0 * vn(vec2(along * 0.0009, 0.5)) + 110.0 * vn(vec2(along * 0.0031, across * 0.0006) + 3.0);
  footD = ac + 150.0;
  wallW = smoothstep(-150.0, 1250.0, ac) * smoothstep(-3800.0, -2200.0, along) * smoothstep(14500.0, 11000.0, along);
  vec2 lp = (w - vec2(-6000.0, 16500.0)) / vec2(3600.0, 2800.0);  // left snowy massif
  float left = exp(-dot(lp, lp) * 1.2);
  float back = smoothstep(14000.0, 20000.0, z) * 0.75;             // distant range closing the valley
  mtnW = clamp(max(wallW, max(left, back)), 0.0, 1.0);
  float dv = (x - valleyAxis(z)) / 1450.0;
  valW = exp(-dv * dv) * smoothstep(400.0, 2600.0, z - 0.3 * (x + 1700.0)) * (1.0 - mtnW * 0.85);
}
float gauss2(vec2 d) { return exp(-dot(d, d)); }

float terrainH(vec2 p, float fp) {
  // gentle domain warp keeps the macro shapes organic
  vec2 w = p + 180.0 * vec2(vn(p * 0.00033 + vec2(4.1, 0.3)), vn(p * 0.00033 + vec2(-2.3, 6.1)));
  float x = w.x, z = w.y;
  float mtnW, valW, wallW, across, along, footD; layoutW(w, mtnW, valW, wallW, across, along, footD);

  // --- meadow: the hillside under the viewpoint drops into the chalet basin; a few knolls
  float h = 40.0 - 140.0 * smoothstep(-150.0, 700.0, z);
  h += 70.0 * gauss2((w - vec2(380.0, 1300.0)) / 420.0) + 50.0 * gauss2((w - vec2(-80.0, 1950.0)) / 520.0) + 35.0 * gauss2((w - vec2(430.0, 520.0)) / 260.0);
  // --- the pasture flank climbing to the wall's foot on the near (right) part of the wall ...
  float nearW = smoothstep(4200.0, 1200.0, along);
  h += 0.21 * softplus(across + 1500.0, 450.0) * nearW * (1.0 - valW);
  // ... while further along, the ground falls away into the valley so the far wall rises from low down
  h -= 550.0 * smoothstep(1200.0, 4200.0, along) * smoothstep(-2200.0, -300.0, across);
  // terraces (benches) and ribs/gullies running down the flank's fall line
  float flankM = smoothstep(-1700.0, -500.0, across) * (1.0 - smoothstep(-250.0, 150.0, across)) * nearW;
  float tz = across / 150.0 + 0.7 * vn(vec2(along * 0.004, 1.0)); float tf = fract(tz);
  h += 18.0 * (smoothstep(0.35, 0.65, tf) - tf) * flankM * (0.6 + 0.4 * vn(w * 0.0015 + 2.0));
  float og = clamp(log2(400.0 / max(2.2 * fp, 0.5)), 0.0, 6.0);
  h += 80.0 * erodedFbm(vec2(along / 230.0, across / 700.0) + vec2(8.3, 2.1), og) * flankM;
  // --- valley trough on the left
  h -= 1000.0 * valW;
  // --- mountains
  if (mtnW > 0.002) {
    float oct = clamp(log2(2800.0 / max(2.2 * fp, 0.5)), 1.0, 11.0);
    vec2 q = w / 2800.0;
    float e = erodedFbm(q + vec2(3.1, 1.7), oct);
    float r = ridgedFbm(q * 1.25 + vec2(-4.2, 9.1), oct - 1.0);
    // the wall lowers as it recedes; the left massif is a little taller than the wall's near end
    vec2 lp = (w - vec2(-6000.0, 16500.0)) / vec2(3600.0, 2800.0);
    float left = exp(-dot(lp, lp) * 1.2), back = smoothstep(14000.0, 20000.0, z) * 0.75;
    float ws = mix(1.0, 0.55, smoothstep(0.0, 7000.0, along));
    float hs = (wallW * ws + left * 1.05 + back * 0.65) / max(wallW + left + back, 1e-3);
    float m = (1700.0 + 1300.0 * e + 1100.0 * r) * hs;
    vec2 lp2 = (w - vec2(-6300.0, 16800.0)) / vec2(2400.0, 2000.0);
    m += 700.0 * exp(-dot(lp2, lp2));                               // the left massif towers higher
    // couloirs & buttresses: ridged noise stretched along the fall line (z), narrow across (x)
    float oc = clamp(log2(260.0 / max(2.2 * fp, 0.5)), 0.0, 6.0);
    float cg = ridgedFbm(vec2(w.x / 210.0, w.y / 520.0) + vec2(1.3, 7.1), oc);
    m += (cg - 0.35) * 300.0 * smoothstep(700.0, 1800.0, m);
    // mid-scale eroded rock: ribs, ledges and buttress faces
    float oe = clamp(log2(420.0 / max(2.2 * fp, 0.5)), 0.0, 6.0);
    m += 140.0 * erodedFbm(w / 420.0 + vec2(5.5, 3.3), oe) * smoothstep(700.0, 1600.0, m);
    // irregular limestone ledges: tilted, folded, in patches, and faded out where they would be
    // sub-pixel (on the far peaks they otherwise collect snow into ruler-straight lines)
    float tz2 = (m + 0.12 * w.x + 0.06 * w.y + 420.0 * vn(w * 0.0004 + 1.0) + 130.0 * vn(w * 0.0007)) / 95.0; float tf2 = fract(tz2);
    float ledgeMask = smoothstep(-0.1, 0.5, vn(w * 0.0011 + 4.4)) * smoothstep(1000.0, 1600.0, m) * smoothstep(9.0, 3.0, fp);
    m += (smoothstep(0.3, 0.7, tf2) - tf2) * 95.0 * 0.32 * ledgeMask;
    h = mix(h, h + m, mtnW);
    // buttresses and gullies on the wall face itself (in the wall frame, so they run down the fall line
    // and reach the foot instead of fading with the ramp weight)
    float faceM = smoothstep(0.02, 0.25, wallW);
    float ob = clamp(log2(300.0 / max(2.2 * fp, 0.5)), 0.0, 6.0);
    // ~130 m rib spacing, 200 m relief: real buttresses with gullies between (the material pass re-evaluates
    // this ridged value for cavity shading, since the frontal sun casts no shadow into the gullies)
    h += 200.0 * (ridgedFbm(vec2(along / 260.0, across / 900.0) + vec2(5.0, 2.0), ob) - 0.4) * faceM;
  }
  // --- rolling meadow detail (fades out on mountains), down to ~1 m bumps near the camera
  float octM = clamp(log2(800.0 / max(2.0 * fp, 0.03)), 0.0, 11.0);
  h += 38.0 * fbmF(w / 800.0 + 2.3, octM) * (1.0 - 0.7 * mtnW);
  float octK = clamp(log2(170.0 / max(2.0 * fp, 0.03)), 0.0, 7.0);
  h += 9.0 * fbmF(w / 170.0 + 5.1, octK) * (1.0 - mtnW);
  float octB = clamp(log2(18.0 / max(2.0 * fp, 0.03)), 0.0, 5.0);
  h += 1.6 * fbmF(p / 18.0 + 7.7, octB) * (1.0 - mtnW);
  float octU = clamp(log2(75.0 / max(2.0 * fp, 0.03)), 0.0, 3.0);
  h += 5.0 * fbmF(p / 75.0 + 3.1, octU) * (1.0 - mtnW);
  // paths are slightly sunken into the turf
  h -= 0.35 * (1.0 - smoothstep(1.2, 2.6, pathDist(p)));
  return h;
}

// ------------------------------------------------------------ conifers (SDF on a jittered grid)
// chalets: x, z, rotation. A cluster around the path junction, spread across the meadow
const int NCH = 13;
const vec3 CH[13] = vec3[13](vec3(74.0, 450.0, 0.4), vec3(-7.0, 520.0, -0.3), vec3(-10.0, 595.0, 0.9), vec3(-92.0, 645.0, 0.2),
                             vec3(-56.0, 740.0, -0.5), vec3(-128.0, 765.0, 1.1), vec3(-65.0, 835.0, 0.3), vec3(-105.0, 925.0, -0.8),
                             vec3(80.0, 610.0, 0.6), vec3(0.0, 745.0, -0.2), vec3(-190.0, 690.0, 0.8), vec3(-280.0, 640.0, 0.3), vec3(175.0, 520.0, -0.6));
const float TC = 11.0;
// pixel-footprint range over which SDF trees thin out and the forest-albedo term takes over
const float TREE_FP0 = 1.1, TREE_FP1 = 2.4;
float forestDensity(vec2 c, float h) {
  float x = c.x, z = c.y;
  float n = vn(c * 0.0019 + vec2(5.2, 1.3)) * 0.6 + vn(c * 0.0061 + 3.3) * 0.3 + vn(c * 0.019) * 0.1;
  float across = dot(c - WP, WN);
  // the dark forest band across the middle distance, sweeping in from the left and ending mid-frame
  float bz = 980.0 + 0.3 * x - 130.0 * sin(x * 0.0021 + 1.0);
  float band = exp(-sq((z - bz) / (150.0 + 70.0 * vn(c * 0.003 + 1.0)))) * smoothstep(520.0, 150.0, x);
  // the wooded hillside on the left, reaching the lower-left corner as a tongue
  float left = smoothstep(-150.0, -480.0, x + 0.25 * z + 70.0 * vn(c * 0.0035)) * smoothstep(100.0, 360.0, z);
  // groves on the near knoll at the lower right
  // (dense, and reaching down to the near edge of the frame like the reference's lower-right forest)
  float right = smoothstep(60.0, 360.0, x - 0.45 * (z - 450.0) + 60.0 * vn(c * 0.004 + 2.0)) * smoothstep(140.0, 330.0, z) * smoothstep(1300.0, 950.0, z);
  // sparse random stands, kept off the open pasture under the wall and thinning toward the right
  float patchy = smoothstep(0.45, 0.62, n) * 0.25 * smoothstep(-900.0, -1600.0, across) * smoothstep(900.0, 200.0, x);
  // the wooded flanks of the glacial valley (far left; only ever drawn as the unresolved-forest albedo)
  float vside = smoothstep(2000.0, 3600.0, z) * smoothstep(300.0, -700.0, x + 0.15 * z) * smoothstep(-0.6, 0.0, n);
  float d = patchy + 0.95 * band * smoothstep(-0.45, -0.05, n) + 0.9 * left * smoothstep(-0.5, -0.1, n) + 0.85 * right * smoothstep(-0.3, 0.2, n) + 0.8 * vside;
  d = max(d, 0.003 + 0.045 * smoothstep(-0.05, 0.3, n) * smoothstep(0.35, 0.6, vn(c * 0.011 + 2.0) * 0.5 + 0.5));  // scattered groups
  d *= smoothstep(5.0, 14.0, pathDist(c));                         // keep the paths clear
  d *= smoothstep(330.0, 110.0, h + 60.0 * vn(c * 0.002 + 7.0));   // ragged treeline
  float dc = 1e5;
  for (int i = 0; i < NCH; i++) dc = min(dc, length(c - CH[i].xy));
  d *= smoothstep(16.0, 42.0, dc);                                 // clearings around the chalets
  return clamp(d, 0.0, 0.93);
}
float sdBox(vec3 p, vec3 b) { vec3 q = abs(p) - b; return length(max(q, 0.0)) + min(max(q.x, max(q.y, q.z)), 0.0); }

// returns tree distance; hf = height fraction inside the tree, tid = per-tree random.
// fp thins the stand out between TREE_FP0 and TREE_FP1 (the forest-albedo term fades in over the same range)
float treesSDF(vec3 p, float hb, float fp, out float hfr, out float tid) {
  vec2 g = p.xz / TC;
  vec2 cell = floor(g);
  vec2 o = step(0.5, g - cell) - 1.0;           // 2x2 neighbourhood toward p's quadrant
  float best = 1e5; hfr = 0.0; tid = 0.0;
  float fade = smoothstep(TREE_FP1, TREE_FP0, fp);
  for (int j = 0; j < 2; j++) for (int i = 0; i < 2; i++) {
    vec2 c = cell + o + vec2(float(i), float(j));
    float r0 = hash2(c * 1.0 + 0.5), r1 = hash2(c + 71.3), r2 = hash2(c + 13.9), r3 = hash2(c - 41.7);
    float dens = forestDensity((c + 0.5) * TC, hb) * fade;
    if (r0 > dens) continue;
    vec2 tp = (c + 0.5 + (vec2(r1, r2) - 0.5) * 0.42) * TC;
    // heights: mostly 9-24 m, a few emergent old trees; denser stands grow taller
    float H = (mix(9.0, 24.0, r3) + 9.0 * step(0.92, fract(r1 * 9.1))) * mix(0.82, 1.12, dens);
    float R = H * (0.22 + 0.1 * fract(r3 * 13.7));
    vec3 q = vec3(p.x - tp.x, p.y - hb, p.z - tp.y);
    float y = q.y / H;
    // crown skew: the axis leans up to ~15% of H, so no two silhouettes are the same cone
    q.xz -= (vec2(fract(r0 * 5.3), fract(r2 * 3.7)) - 0.5) * 0.3 * H * clamp(y, 0.0, 1.0);
    float rr = length(q.xz);
    // whorled branch tiers (5-11 per tree): smooth sawtooth -> each tier widest at its base (snow shelves on top)
    float tiers = 5.0 + 6.0 * r1;
    float ty = fract(y * tiers + r2);
    float saw = min(ty * 6.0, 1.0) * (1.0 - ty);
    float ang = atan(q.z, q.x);
    float br = 0.09 * sin(ang * 7.0 + r0 * 40.0 + y * 11.0) + 0.05 * sin(ang * 13.0 - y * 23.0);
    float rad = R * (1.0 - y) * (0.55 + 0.45 * saw + br);
    float d = (rr - max(rad, 0.0)) * 0.62;
    d = max(d, 0.15 * H - q.y);
    d = max(d, q.y - H);

float chaletsSDF(vec3 p, float hb, out float m) {
  float best = 1e5; m = 3.0;
  for (int i = 0; i < NCH; i++) {
    vec3 c = CH[i];
    vec2 dxz = p.xz - c.xy;
    if (dot(dxz, dxz) > 1600.0) continue;
    float cs = cos(c.z), sn = sin(c.z);
    vec3 q = vec3(cs * dxz.x - sn * dxz.y, p.y - hb, sn * dxz.x + cs * dxz.y);
    float sc = 1.1 + 0.6 * hash2(vec2(float(i) * 3.7, 1.0));          // per-chalet scale 1.1-1.7
    q /= sc;
    // pitched roof: thin slab following |z|*tan(28deg), overhanging 0.7 m; the walls are clipped by the
    // roof plane so the gable ends are triangles under it instead of a box poking through the slab
    float ry = 4.7 - abs(q.z) * 0.53;
    float walls = max(sdBox(q - vec3(0.0, 1.0, 0.0), vec3(4.6, 3.8, 3.1)), q.y - ry + 0.12);
    float roof = max(abs(q.y - ry) * 0.88 - 0.22, max(abs(q.x) - 5.3, abs(q.z) - 3.8));
    float d = min(walls, roof) * sc;
    if (d < best) { best = d; m = roof < walls ? 4.0 : 3.0; }

}
float nearChalets(vec2 p) {
  return (p.y > 400.0 && p.y < 980.0 && p.x > -330.0 && p.x < 230.0) ? 1.0 : 0.0;
}

// Every terrain / scene distance query of main() goes through this ONE call site (a phase state machine
// drives it, matte-style), so the big height function and the tree / chalet SDFs are inlined exactly once:
// the shader stays small and compiles quickly on ANGLE/Metal (Safari) instead of inlining terrainH ~25x.
//   mode 0: heightfield only (returns p.y - h)
//   mode 1: full scene for the march / SDF normals: trees (with a bounding slab above them) + chalets
//   mode 2: sun-shadow ray: trees only where the ray is near the ground, no slab, no chalets
// mat: 1 terrain, 2 tree, 3 wall, 4 roof. fpO is the footprint used for the objects (the shadow ray keeps
// the surface's footprint for the trees while the terrain LOD coarsens along the ray).
float sceneQ(vec3 p, float fp, float fpO, int mode, out float mat, out float hb, out float dTree, out float hfr, out float tid) {
  hb = terrainH(p.xz, fp);
  float dy = p.y - hb;
  mat = 1.0; dTree = 1e5; hfr = 0.0; tid = 0.0;
  if (mode == 0) return dy;
  bool near = fpO < TREE_FP1 && dy < 36.0;
  if (near) dTree = treesSDF(p, hb, fpO, hfr, tid);
  if (mode == 2) return min(dy, dTree);
  float d = dy * 0.42;
  if (fpO < TREE_FP1 && !near) d = min(d, dy - 35.5);
  if (dTree < d) { d = dTree; mat = 2.0; }
  if (nearChalets(p.xz) > 0.5 && dy < 14.0) { float cm; float dc = chaletsSDF(p, hb, cm); if (dc < d) { d = dc; mat = cm; } }
  return d;
}

void main() {

    float coul = sat(smoothstep(0.03, 0.35, -curvL) + 0.7 * (1.0 - smoothstep(0.06, 0.35, butt))) * smoothstep(-0.25, 0.3, vn(vec2(along * 0.0025, alt * 0.002) + 3.0));
    snowT -= (0.6 + 1.3 * steep) * smoothstep(1100.0, 1700.0, alt) * coul * rockW * faceM;
    snowT = max(snowT, mix(0.09, -1.0, altF));
    snowT = min(snowT, mix(0.95, 3.0, rockW));     // every turf band whitens by full cover; only rock can stay bare
  } else if (mat == 2.0) {
    // conifer needles: dark green, per-tree hue variation (some bluish, a few yellow-green larches),
    // lighter toward the sunlit top, darker inside / at the bottom
    vec3 tc = mix(vec3(0.018, 0.040, 0.020), vec3(0.060, 0.080, 0.030), tid * tid);
    float tv = fract(tid * 7.3);
    tc = mix(tc, vec3(0.025, 0.045, 0.042), step(0.68, tv) * step(tv, 0.84));
    tc = mix(tc, vec3(0.085, 0.10, 0.034), step(0.84, tv));
    // sun-facing needles read warm yellow-green (the lit side of a spruce is never the same hue as its shade side)
    tc = mix(tc, vec3(0.05, 0.075, 0.028), 0.6 * smoothstep(0.0, 0.6, dot(nD, uSunDir)));
    alb = tc * (0.75 + 0.5 * hash2(floor(pos.xz * 3.0) + floor(pos.y * 3.0))) * (0.72 + 0.5 * hfr);
    ao *= mix(0.35, 1.0, sqrt(hfr));
    // laden spruce (matte's clump rule on this SDF's whorl geometry): snow clumps collect on the whorl tops
    // (thr 0.10-0.55, so tops read white above C~0.6), the steep rims and undersides stay dark (thr > 1).
    // Where the whorls are not resolved (far stands) the per-pixel split would be noise, so the whole
    // crowns whiten stand by stand over C 0.5-0.95 instead (the same ~250 m stand noise as the far-canopy
    // albedo, plus a per-tree jitter): distant forest lags the meadow, then goes laden in drifts
    float up = smoothstep(0.3, 0.85, nD.y);
    float tn = 0.5 + 0.5 * vn(pos.xz * 1.7 + pos.y * 0.9 + tid * 50.0);
    float tn2 = 0.5 + 0.5 * vn(pos.xz * 4.3 + pos.y * 2.1 + tid * 20.0);
    float stand = 0.5 + 0.5 * vn(pos.xz * 0.004 + 1.0);
    float res = sat(1.7 - fp * 2.2);
    snowT = mix(0.5 + 0.35 * stand + 0.1 * tid, mix(1.05 + 0.5 * tn2, 0.10 + 0.45 * tn + 0.12 * (1.0 - hfr), up), res);
  } else if (mat == 3.0) {
    // sun-bleached timber walls (planked), darker under the eaves where the overhang shades them
    alb = vec3(0.26, 0.20, 0.13) * (0.8 + 0.3 * vn(vec2(pos.y * 4.0, pos.x + pos.z))) * (0.85 + 0.3 * hash2(floor(pos.xz * 0.03) + 0.5));
    ao *= mix(1.0, 0.55, smoothstep(2.4, 4.2, pos.y - hT));
    snowT = 3.0;
  } else {
    // dark-brown shingle roofs, weathered per chalet (33 m cells ~ one chalet) and per shingle row
    alb = vec3(0.09, 0.06, 0.04) * (0.6 + 0.8 * hash2(floor(pos.xz * 0.03))) * (0.85 + 0.3 * hash2(floor(pos.xz * 1.3)));
    snowT = 0.02 + 0.5 * (1.0 - nD.y);
  }
  o0 = vec4(t, mat + (mat == 2.0 ? hfr : grass) * 0.9, sh, ao);
  o1 = vec4(alb, snowT);
  o2 = vec4(octEnc(nD), octEnc(nS));
}
`;

// ------------------------------------------------------------------ sky + clouds (half res, temporal)
const FS_SKY = `#version 300 es
${COMMON}
uniform sampler2D uPrev, uPrevD;
uniform float uBlend, uFrame, uSteps;
layout(location = 0) out vec4 o;    // premultiplied cloud radiance (with aerial perspective), transmittance
layout(location = 1) out vec4 oD;   // mean cloud distance * cloud opacity (premultiplied so bilinear/temporal filtering stays consistent)
float cloudD(vec3 p, bool hi) {
  vec2 q = p.xz + uCloudOff;
  float wm = weather(q);
  float cov = uCloudCov;
  float shape = sat((wm - (1.0 - cov)) / max(cov, 0.05));          // 0..1 inside cloud fields
  // only the far cumulus field renders: behind the left massif (19 km+, so its summit stays clear) and, to the
  // right of centre, from ~13 km so a bank floats over the mid-wall ridge like the reference's cloud hugging
  // the wall, instead of a flat slab base slicing through the summits in front of it
  vec2 dv = p.xz - uCamPos.xz;
  float dn = length(dv);
  float cut = mix(19000.0, 13000.0, smoothstep(0.0, 0.3, dv.x / max(dn, 1.0)));
  shape *= smoothstep(cut, cut + 5000.0, dn);
  float cb = CB + 700.0 * (tnoise(q * 0.00025 + 1.0) - 0.5);        // undulating base height
  float h = (p.y - cb) / (CT - cb);
  float top = 0.18 + 0.82 * sqrt(shape);                            // taller towers in the cores
  float prof = smoothstep(0.0, 0.04, h) * smoothstep(top, top * 0.3, h);
  vec3 r = vec3(q.x, p.y * 1.2, q.y) * 0.0011;
  // billowy detail: |2n-1| octaves give rounded cauliflower bulges with creases between them
  float n = tnoise3(r) * 0.5 + abs(tnoise3(r * 2.1 + 3.7) * 2.0 - 1.0) * 0.28;
  n += hi ? abs(tnoise3(r * 4.4 + 1.1) * 2.0 - 1.0) * 0.14 + abs(tnoise3(r * 9.3 + 5.3) * 2.0 - 1.0) * 0.08 : 0.11;
  float d = shape * prof * (1.0 + 0.6 * uStormSky) - (1.0 - n) * 0.58 + 0.06;
  return sat(d * 4.5);
}
void main() {
  vec3 rd = camRay(gl_FragCoord.xy);
  float T = 1.0; vec3 acc = vec3(0.0);
  float tHit = -1.0, tSum = 0.0, wSum = 0.0;   // opacity-weighted mean cloud distance (stable under temporal blending)
  float t0 = (CB - uCamPos.y) / max(rd.y, 1e-4);
  if (rd.y > 0.02 && t0 < 45000.0) {
    float t1 = min((CT - uCamPos.y) / rd.y, t0 + 28000.0);
    float jit = fract(52.9829189 * fract(dot(gl_FragCoord.xy, vec2(0.06711056, 0.00583715))) + uFrame * 0.6180339);
    float steps = uSteps;
    float dt = (t1 - t0) / steps;
    float mu = dot(rd, uSunDir);
    // dual-lobe Henyey-Greenstein: forward silver lining + soft back scatter
    float g1 = 0.7, g2 = -0.25;
    float ph = 0.75 * (1.0 - g1 * g1) / pow(1.0 + g1 * g1 - 2.0 * g1 * mu, 1.5) + 0.25 * (1.0 - g2 * g2) / pow(1.0 + g2 * g2 - 2.0 * g2 * mu, 1.5);
    ph = ph / 12.566 * 3.0 + 0.6;
    for (int i = 0; i < 48; i++) {
      if (float(i) >= steps || T < 0.02) break;
      float tt = t0 + dt * (float(i) + jit);
      vec3 p = uCamPos + rd * tt;
      float d = cloudD(p, true);
      if (d > 0.001) {
        if (tHit < 0.0) tHit = tt;
        // light march toward the sun (3 taps)
        float ld = cloudD(p + uSunDir * 160.0, false) * 160.0 + cloudD(p + uSunDir * 480.0, false) * 320.0 + cloudD(p + uSunDir * 1100.0, false) * 600.0;
        float sig = 0.0045;
        float Tl = exp(-ld * sig * 0.9) ;
        float powder = 1.0 - exp(-d * 4.0);
        float h = (p.y - CB) / (CT - CB);
        // darker, bluer bases against bright lit tops: cumulus, not a flat cotton bank
        vec3 amb = mix(uSkyAmb * vec3(0.55, 0.62, 0.78) * 0.6, uSkyAmb * 1.3 + vec3(0.05), smoothstep(0.0, 0.6, h));
        vec3 L = uSunCol * Tl * ph * mix(0.5, 1.0, powder) * 1.35 + amb;
        float a = 1.0 - exp(-d * sig * dt);
        acc += T * a * L;
        tSum += T * a * tt; wSum += T * a;
        T *= 1.0 - a;
      }
    }
    if (wSum > 1e-4) tHit = tSum / wSum;
    // aerial perspective on the clouds (haze in front of the cloud only; the sky behind gets its own)
    if (tHit > 0.0) { vec4 f = fogAt(tHit, rd); acc = acc * f.a + f.rgb * (1.0 - T); }
  }
  vec2 uv = gl_FragCoord.xy / uRes;
  vec4 prev = texture(uPrev, uv);
  float prevD = texture(uPrevD, uv).x;
  o = mix(prev, vec4(acc, T), uBlend);
  oD = vec4(mix(prevD, max(tHit, 0.0) * (1.0 - T), uBlend), 0.0, 0.0, 1.0);
}
`;

// ------------------------------------------------------------------ scene shading
const FS_SHADE = `#version 300 es
${COMMON}
${GBUF}
uniform sampler2D uSky, uSkyD;
uniform vec3 uGrassDisp;     // integrated (slow) wind displacement -> rolling grass waves, wrapped by its noise period on the CPU
uniform vec2 uVeilDir;       // apparent screen-space fall direction of distant snow
uniform float uVeilAmt;
uniform vec3 uSway;          // x: lateral wind (m/s), y: integrated sway phase (rad, CPU), z: focal length in px
uniform vec4 uVeilT;         // integrated scroll of the veil noise sheets (xy: the two streak layers, zw: the slow
                             // 'big' sheet), wrapped by the noise period (256) on the CPU so storms/wind never jump it
out vec4 o;

// tree sway: treetops lean/oscillate with the wind. The G-buffer is static, so we invert the
// displacement field with a 2-step fixed-point lookup (starting mid-tree so silhouettes move too).
float treeH(vec4 g) { return floor(g.y + 0.001) == 2.0 ? fract(g.y + 0.001) / 0.9 : 0.0; }
vec2 swayOff(float h, float t, vec2 frag) {
  float w = uSway.x;
  float osc = sin(uSway.y + frag.x * 0.013 + frag.y * 0.007) * (0.25 + 0.05 * abs(w));
  float disp = (0.012 * w + osc * 0.12) * h * h * 18.0;          // metres at the top of an ~18 m spruce
  return vec2(disp / max(t, 1.0) * uSway.z, 0.0);
}

// distant falling snow seen as a translucent, streaky veil (two parallax layers)
float veil(vec2 frag) {
  vec2 uv = frag / uRes.y;
  vec2 d = normalize(uVeilDir);
  mat2 R = mat2(d.y, d.x, -d.x, d.y);
  vec2 q = R * uv;
  float s1 = tnoise(vec2(q.x * 210.0, q.y * 9.0 + uVeilT.x));
  float s2 = tnoise(vec2(q.x * 120.0 + 31.0, q.y * 5.0 + uVeilT.y));
  float big = tnoise(uv * 3.0 + uVeilT.zw);
  return (smoothstep(0.5, 1.0, s1) * 0.6 + smoothstep(0.45, 1.0, s2) * 0.6) * (0.55 + 0.9 * big);
}

// wind-packed snow surface: dunes elongated along the prevailing (+x) wind, big drifts on the far slopes
// and sastrugi ripples near the camera. Its xz gradient tilts the shading normal so full cover shows form
// instead of a flat white fill; each scale fades out before it would alias
float driftH(vec2 p, float t) {
  // dune axis ~30 deg off the sun azimuth (which is also the wind line), so the flanks catch the low sun
  vec2 d = vec2(p.x * 0.866 - p.y * 0.5, p.x * 0.5 + p.y * 0.866);
  vec2 q = vec2(d.x * 0.06, d.y * 0.15);                                                        // dunes ~17 x 7 m
  float h = (tnoise(q + 3.0) + 0.5 * tnoise(q * 2.2 + 9.0)) * 6.0 * smoothstep(7000.0, 400.0, t);
  h += tnoise(vec2(p.x * 0.012, p.y * 0.02) + 1.0) * 16.0 * smoothstep(16000.0, 1500.0, t);       // drifts ~80 x 50 m
  h += tnoise(vec2(d.x * 0.45, d.y * 1.2) + 5.0) * 0.45 * smoothstep(1400.0, 120.0, t);          // sastrugi ~2 m
  return h;
}

void main() {
  vec2 uv = gl_FragCoord.xy / uRes;
  vec4 g0 = G0(uv);
  {
    vec2 oMax = swayOff(1.0, g0.x, gl_FragCoord.xy);
    if (abs(oMax.x) > 0.15 && g0.x < 6000.0) {
      vec2 x = gl_FragCoord.xy - 0.5 * oMax;
      for (int i = 0; i < 2; i++) { vec4 gi = G0(x / uRes); x = gl_FragCoord.xy - swayOff(treeH(gi), gi.x, gl_FragCoord.xy); }
      vec4 gs = G0(x / uRes);
      if (treeH(gs) > 0.0 || treeH(g0) > 0.0) { uv = x / uRes; g0 = gs; }
    }
  }
  vec3 rd = camRay(uv * uRes);
  float t = g0.x;
  vec3 col;
  vec4 cl = texture(uSky, uv);            // clouds: premultiplied radiance + transmittance
  float cOp = 1.0 - cl.a;
  float cT = cOp > 0.003 ? texture(uSkyD, uv).x / cOp : 0.0;   // opacity-weighted mean cloud distance (0 = none)
  if (t > 60000.0) {
    // sky: analytic radiance seen through ~30 km of haze, then the cloud slab composited in front
    col = skyColor(rd);
    vec4 fs = fogAtM(30000.0, rd, 0.6);
    col = col * fs.a + fs.rgb;
    col = col * cl.a + cl.rgb;
    vec4 f = fogAt(30000.0, rd);
    col = mix(col, f.rgb / max(1.0 - f.a, 1e-3), clamp(uFogP.z * 900.0, 0.0, 1.0) * smoothstep(0.35, -0.02, rd.y) * 0.95);
    col *= 1.0 + stratus(rd) * uStormSky;      // deck structure, before the veil so the veil does not flatten it
    col = mix(col, uFogCol * 1.35 + uSunCol * 0.05, sat(uVeilAmt * veil(gl_FragCoord.xy)));   // distant snow veil
    o = vec4(col, 1.0);
    return;
  } else {
    vec4 g1 = G1(uv), g2 = G2(uv);
    vec3 pos = uCamPos + rd * t;
    vec3 nD = octDec(g2.xy), nS = octDec(g2.zw);
    float mat = floor(g0.y + 0.001);
    float grass = mat == 1.0 ? fract(g0.y + 0.001) / 0.9 : 0.0;
    vec3 alb = g1.rgb;
    float snowT = g1.w;
    // cover ramp: tight (+-0.025) on the resolved meadow so margins break at the tuft scale of the threshold
    // field, wide (+-0.07) only where the far canopy / summit thresholds are unresolved means
    float cw = mix(0.025, 0.07, smoothstep(1200.0, 2600.0, t));
    float snow = smoothstep(snowT - cw, snowT + cw, uCover);
    float ao = g0.w;
    float cs = cloudShadow(pos);
    float sh = g0.z * cs;
    // wind waves rolling over the grass (brightness sheen travelling with the wind)
    vec2 gq = (pos.xz - uGrassDisp.xz * 1.0) * 0.045;
    float wave = tnoise(gq) * 0.65 + tnoise(gq * 2.7 + 5.0) * 0.35;
    alb *= 1.0 + grass * (1.0 - snow) * (wave - 0.5) * (0.22 + 0.25 * uStormSky) * smoothstep(3000.0, 300.0, t);
    // winter turf: as the snow line closes in on a patch (cover nearing its threshold), with cover in
    // general and under a storm sky, the grass dies back to a dull straw-olive instead of summer lime
    float kill = smoothstep(snowT - 0.5, snowT, uCover);
    float dull = grass * clamp(0.5 * kill + 0.5 * uStormSky + 0.3 * uCover, 0.0, 0.85);
    alb = mix(alb, vec3(dot(alb, vec3(0.3, 0.5, 0.2))) * vec3(1.08, 0.97, 0.72) * 0.8, dull);
    vec3 n = normalize(mix(nD, nS, snow * 0.3));
    if (mat == 1.0 && snow > 0.001) {
      float e = max(0.4, t * 0.0015);
      float h0 = driftH(pos.xz, t);
      vec2 gr = vec2(driftH(pos.xz + vec2(e, 0.0), t) - h0, driftH(pos.xz + vec2(0.0, e), t) - h0) / e;
      n = normalize(n + vec3(-gr.x, 0.0, -gr.y) * snow);
    }
    vec3 snowAlb = vec3(0.84, 0.88, 0.94) * (mat == 2.0 ? 0.9 : 1.0);
    vec2 rq = pos.xz * vec2(0.09, 0.3);
    snowAlb *= 0.93 + 0.07 * tnoise(rq + vec2(rq.y * 0.4, 0.0)) * smoothstep(1500.0, 200.0, t);  // wind-packed ripples
    vec3 a = mix(alb, snowAlb, snow);
    float ndl = dot(n, uSunDir);
    float wrap = 0.18 * snow;
    float diff = clamp((ndl + wrap) / (1.0 + wrap), 0.0, 1.0);
    vec3 skyL = uSkyAmb * (0.62 + 0.38 * n.y);
    vec3 bounce = vec3(0.2, 0.22, 0.12) * dot(uSunCol, vec3(0.1)) * (0.5 - 0.5 * n.y) * mix(1.0, 3.0, uCover);
    if (mat == 2.0) diff = diff * 0.75 + 0.1 * clamp(-ndl, 0.0, 1.0);       // needle canopy translucency
    col = a * (uSunCol * diff * sh + (skyL + bounce) * ao);
    // snow: blue-tinted subsurface glow in shade, soft sheen (the sparkles are added in the composite, after FXAA)
    col += snow * a * uSkyAmb * vec3(0.12, 0.26, 0.58) * (1.0 - sh) * ao;    // blue sky-lit shade
    vec3 hv = normalize(uSunDir - rd);
    float nh = max(dot(n, hv), 0.0);
    col += snow * uSunCol * sh * (0.05 * pow(nh, 18.0) + 0.04 * pow(1.0 - max(dot(n, -rd), 0.0), 5.0));
  }
  // aerial perspective + storm whiteout (+ drifting mist banks in the valley)
  vec4 f = fogAtM(t, rd, mistBanks(rd, t));
  col = col * f.a + f.rgb;
  col *= 1.0 + stratus(rd) * uStormSky * (1.0 - f.a);     // deck structure in the whiteout (continuous with the sky)
  // clouds drifting in front of the far ranges (soft depth test: no hard rows where the two distances cross)
  if (cT > 0.0) col = mix(col, col * cl.a + cl.rgb, smoothstep(-2500.0, 2500.0, t - cT));
  // distant snow veil (strong in blizzards)
  float vamt = uVeilAmt * (1.0 - exp(-t / 900.0));
  col = mix(col, uFogCol * 1.35 + uSunCol * 0.05, sat(vamt * veil(gl_FragCoord.xy)));
  o = vec4(col, 1.0);
}
`;

// ------------------------------------------------------------------ FXAA (scene only, before flakes)
const FS_FXAA = `#version 300 es
precision highp float;
uniform sampler2D uTex; uniform vec2 uInv;
out vec4 o;
float L(vec3 c) { c = c / (1.0 + c); return dot(c, vec3(0.299, 0.587, 0.114)); }
void main() {
  vec2 uv = gl_FragCoord.xy * uInv;
  vec3 m = texture(uTex, uv).rgb;
  float lNW = L(texture(uTex, uv + vec2(-1.0, -1.0) * uInv).rgb), lNE = L(texture(uTex, uv + vec2(1.0, -1.0) * uInv).rgb);
  float lSW = L(texture(uTex, uv + vec2(-1.0, 1.0) * uInv).rgb), lSE = L(texture(uTex, uv + vec2(1.0, 1.0) * uInv).rgb);
  float lM = L(m);
  float lMin = min(lM, min(min(lNW, lNE), min(lSW, lSE))), lMax = max(lM, max(max(lNW, lNE), max(lSW, lSE)));
  if (lMax - lMin < max(0.03, lMax * 0.1)) { o = vec4(m, 1.0); return; }
  vec2 dir = vec2(-((lNW + lNE) - (lSW + lSE)), ((lNW + lSW) - (lNE + lSE)));
  float red = max((lNW + lNE + lSW + lSE) * 0.03125, 1.0 / 128.0);
  dir = clamp(dir / (min(abs(dir.x), abs(dir.y)) + red), -6.0, 6.0) * uInv;
  vec3 A = 0.5 * (texture(uTex, uv + dir * (1.0 / 3.0 - 0.5)).rgb + texture(uTex, uv + dir * (2.0 / 3.0 - 0.5)).rgb);
  vec3 B = A * 0.5 + 0.25 * (texture(uTex, uv - dir * 0.5).rgb + texture(uTex, uv + dir * 0.5).rgb);
  float lB = L(B);
  o = vec4((lB < lMin || lB > lMax) ? A : B, 1.0);
}
`;

// ------------------------------------------------------------------ snowflakes
const VS_FLAKE = `#version 300 es
${COMMON}
uniform float uAspect, uFocalPx, uExpo, uCocK, uFocus;
uniform vec3 uDispA, uDispB, uWindA, uWindB;
// Time never reaches this shader as a raw, growing number: every term is either a CPU-integrated displacement
// that the CPU lattice-wraps exactly (wind, fall) or a phase whose rate is a multiple of 2*pi/TW, so the CPU
// can wrap its clock by TW with no discontinuity. Flakes therefore never jump, however long the page runs.
uniform vec3 uFallQ[40];  // per fall-speed bin: (0,-k*F,0) reduced by the slice-box lattice (F = integral of the storm fall factor)
uniform float uFallV;     // current fall factor 1 + 0.9 storm (for the velocity / streaks)
uniform float uFlakeT;    // oscillation clock, wrapped by TW on the CPU
uniform float uTumT;      // tumble clock: integral of 1 + 0.8 storm, wrapped by TW
uniform int uLayer;
uniform vec3 uSlice;      // z0, z1, fade length
uniform vec2 uHalfXY;
uniform float uCount;
uniform uint uSeed;
uniform vec4 uMs[32];     // mouse segments: ndc position, ndc displacement
uniform float uMa[32];    // segment ages (s)
uniform int uMn;
out vec2 vP;
flat out vec4 vSeed;
flat out vec4 vPar;       // drawn radius px (incl. defocus), blur px, type, aa
flat out vec4 vRot;       // cos, sin (shape vs streak frame), squash, true radius px
out vec4 vCol;
out float vDist;

// envelope of one mouse-wake segment over its age: fast attack, ~2.5 s release (the curl stays readable after a sweep)
float pushProf(float a) { return (1.0 - exp(-a * 9.0)) * exp(-a * 0.4) * smoothstep(3.6, 2.6, a); }

uvec4 pcg4d(uvec4 v) {
  v = v * 1664525u + 1013904223u;
  v.x += v.y * v.w; v.y += v.z * v.x; v.z += v.x * v.y; v.w += v.y * v.z;
  v ^= v >> 16u;
  v.x += v.y * v.w; v.y += v.z * v.x; v.z += v.x * v.y; v.w += v.y * v.z;
  return v;
}
const vec2 CORNERS[4] = vec2[4](vec2(-1.0, -1.0), vec2(1.0, -1.0), vec2(-1.0, 1.0), vec2(1.0, 1.0));
const float TW = 120.0;                    // wrap period of the oscillation clocks
const float W0 = 6.2831853 / TW;           // the rate quantum: every oscillation rate is an integer multiple of it
const float FK_LO = 0.4675, FK_HI = 1.5525; // fall-speed range (m/s at calm): 0.55*0.85 .. 1.35*1.15

void main() {
  vec2 corner = CORNERS[gl_VertexID];
  uint id = uint(gl_InstanceID);
  // fixed per-flake randoms (stateless, reproducible)
  uvec4 hA = pcg4d(uvec4(id, uint(uLayer) * 7919u + 17u, uSeed, 0x51ed27u));
  uvec4 hB = pcg4d(hA ^ uvec4(0x9e3779b9u));
  uvec4 hC = pcg4d(hB + uvec4(0x632be5abu));
  vec4 r0 = vec4(hA >> 8u) * (1.0 / 16777216.0);
  vec4 r1 = vec4(hB >> 8u) * (1.0 / 16777216.0);
  vec4 r2 = vec4(hC >> 8u) * (1.0 / 16777216.0);

  float z0 = uSlice.x, z1 = uSlice.y;
  vec3 halfB = vec3(uHalfXY, 0.5 * (z1 - z0));
  vec3 cen = vec3(0.0, 0.0, 0.5 * (z0 + z1));
  vec3 bc = (r0.xyz * 2.0 - 1.0) * halfB;
  vec3 bw = uCamR * bc.x + uCamU * bc.y + uCamF * bc.z;

  float light = r0.w;                 // 0 = heavy clumped aggregate ... 1 = light crystal
  float t = uFlakeT;
  // fall speed: heavy clumps 1.35 m/s ... light crystals 0.55, x0.85-1.15 per flake, quantised to 40 bins (2.7%
  // steps) so the CPU can integrate and lattice-wrap each bin's fall exactly; the storm factor is in the integral
  float fk = (mix(1.35, 0.55, light) * mix(0.85, 1.15, r1.x) - FK_LO) / (FK_HI - FK_LO);
  int fbin = int(clamp(fk * 40.0, 0.0, 39.0));
  float fall = mix(FK_LO, FK_HI, (float(fbin) + 0.5) / 40.0) * uFallV;
  // per-flake inertia: blend of a sluggish and a quick wind response (light flakes respond more)
  float resp = clamp(light * 0.8 + 0.2 * r1.y, 0.0, 1.0);
  // NB: only affine mixes of the two integrals are allowed (weights sum to 1), otherwise the
  // CPU-side lattice wrap of uDispA/uDispB would make flakes jump.
  vec3 wdisp = mix(uDispA, uDispB, resp);
  vec3 wvel = mix(uWindA, uWindB, resp);
  // turbulence: travelling sine eddies over (base position, time) -> coherent yet never lockstep
  // (rates 16, 25, 11 x W0 = 0.84, 1.31, 0.58 rad/s; the 2.08 / 1.6875 harmonics keep integer multiples)
  float ta = mix(0.16, 1.7, uStorm);
  vec3 ph = bw * vec3(0.37, 0.29, 0.33);
  float a1 = ph.x + ph.y * 0.7 + 16.0 * W0 * t, a2 = ph.z - ph.x * 0.6 + 25.0 * W0 * t + 2.0, a3 = ph.y + ph.z * 0.5 + 11.0 * W0 * t + 4.0;
  float tv = mix(0.6, 1.3, uStorm);   // updrafts / downdrafts in gusts
  vec3 turb = ta * vec3(sin(a1) + 0.5 * sin(2.08 * a2), tv * sin(a3), sin(a2) + 0.5 * sin(1.6875 * a1 + 1.0));
  vec3 turbV = ta * W0 * vec3(16.0 * cos(a1) + 26.0 * cos(2.08 * a2), tv * 11.0 * cos(a3), 25.0 * cos(a2) + 13.5 * cos(1.6875 * a1 + 1.0));
  // flutter: per-flake helical wobble 0.5-2 Hz (60..240 cycles per TW)
  float fw = floor(mix(60.0, 240.0, r1.z) + 0.5) * W0;
  float fr = mix(0.012, 0.1, light) * (1.0 + 0.8 * uStorm);
  float fph = fw * t + r1.w * 6.2831853;
  vec3 flut = fr * vec3(cos(fph), 0.4 * sin(2.0 * fph), sin(fph));
  vec3 flutV = fr * fw * vec3(-sin(fph), 0.8 * cos(2.0 * fph), cos(fph));

  vec3 pw = bw + wdisp + uFallQ[fbin] + turb + flut;
  // wrap inside the camera-aligned slice box -> constant density, no CPU work
  vec3 qc = vec3(dot(pw, uCamR), dot(pw, uCamU), dot(pw, uCamF));
  qc = mod(qc + halfB, 2.0 * halfB) - halfB;
  vec3 cs = qc + cen;
  vec3 vel = wvel + vec3(0.0, -fall, 0.0) + turbV + flutV;
  vec3 vc = vec3(dot(vel, uCamR), dot(vel, uCamU), dot(vel, uCamF));

  float zc = cs.z;
  float wz = smoothstep(z0, z0 + uSlice.z, zc) * (1.0 - smoothstep(z1 - uSlice.z, z1, zc));
  vec2 ndc = vec2(cs.x / (zc * uTanH * uAspect), cs.y / (zc * uTanH));
  vec2 sv = vec2((vc.x * zc - cs.x * vc.z) / (zc * zc * uTanH * uAspect), (vc.y * zc - cs.y * vc.z) / (zc * zc * uTanH)) * 0.5 * uRes;

  // local push / swirl around the cursor (screen space): each recent mouse segment drags nearby
  // flakes along its motion and adds a counter-rotating vortex pair (a wake), easing out over ~3 s.
  // The time derivative of the same field (d/dt of each segment's envelope) is added to the screen
  // velocity, so a sweep streaks the flakes it moves (motion blur along the wake) instead of only
  // displacing them.
  if (uMn > 0) {
    vec2 asp = vec2(uAspect, 1.0);
    vec2 push = vec2(0.0), pushV = vec2(0.0);
    for (int i = 0; i < 32; i++) {
      if (i >= uMn) break;
      vec4 m = uMs[i];
      float age = uMa[i];
      vec2 d = (ndc - m.xy) * asp;
      float fo = exp(-dot(d, d) * 12.0);
      vec2 mv = m.zw * asp;
      float side = sign(d.x * mv.y - d.y * mv.x);
      vec2 f = (mv * 1.25 + vec2(-d.y, d.x) * side * length(mv) * 3.6) * fo;
      push += f * pushProf(age);
      pushV += f * (pushProf(age) - pushProf(max(age - 0.04, 0.0))) * 25.0;   // ndc / s
    }
    float pwgt = mix(1.0, 0.3, smoothstep(3.0, 60.0, zc));
    ndc += push / asp * pwgt;
    // streak: the envelope's rate (x5, a hand-sweep gust streaks more than the bare displacement rate)
    // plus the wake itself read as a local wind, so flakes inside it stay streaked while it fades
    sv += (pushV * 5.0 + push * 14.0) / asp * pwgt * 0.5 * uRes;
  }

  // size / type per layer
  float type, size, baseA;
  if (uLayer == 0) { size = mix(0.006, 0.014, r2.x); type = 0.0; baseA = 0.9; }
  else if (uLayer == 1 || uLayer == 4) {
    // 1 dendrite, 2 plate, 3 aggregate. Most big real flakes are clumps: ~40% single crystals, 60% aggregates
    type = light > 0.6 ? (r2.y > 0.38 ? 1.0 : 2.0) : 3.0;
    size = type == 3.0 ? mix(0.032, 0.078, r2.x * r2.x) : mix(0.03, 0.068, r2.x);   // crystals: 15-35 px over 2.3-4.5 m
    // hero tier (0.9-2.4 m, inside the depth of field): 10-50 px radius, sharp
    if (uLayer == 4) size = type == 3.0 ? mix(0.04, 0.075, r2.x) : mix(0.035, 0.07, r2.x);
    baseA = 0.92;
  } else if (uLayer == 2) { size = mix(0.014, 0.036, r2.x); type = 4.0; baseA = 0.85; }
  else { size = mix(0.012, 0.028, r2.x); type = 5.0; baseA = 0.85; }
  float rTrue = 0.5 * size / max(zc, 0.05) * uFocalPx;
  float speed = length(sv);
  float blur = speed * uExpo;
  vec2 dir = speed > 1e-3 ? sv / speed : vec2(0.0, -1.0);
  float coc = uCocK * max(0.0, 1.0 / max(zc, 0.05) - 1.0 / uFocus);
  float rD, aa, a = baseA;
  float blurMix = 0.0;
  if (uLayer == 0) {
    // near bokeh tier: soft discs (capped so the nearest never become lens dirt), faint but readable;
    // the streak is capped too: a near smear longer than this is invisible and only costs fill rate
    coc = min(coc, 60.0 * uRes.y / 1080.0);
    blur = min(blur, 100.0 * uRes.y / 1080.0);
    rD = max(rTrue, coc) + 0.5; aa = 0.45; blurMix = 1.0;
    a *= clamp(sq(rTrue / rD) * 5.0, 0.25, 0.45);    // the few near discs read as bright flakes, not smudges
  } else if (uLayer == 1 || uLayer == 4) {
    // defocus: the crystal keeps its true radius and its edge ramp widens by the circle of confusion
    // (energy is spread, not removed); the quad grows by coc to hold the blurred outline
    rD = rTrue + coc;
    aa = (0.9 + 0.6 * coc) / max(rTrue, 0.5);
    blurMix = sat(coc / max(rTrue, 0.5));
    a *= mix(1.0, 0.45, smoothstep(0.0, 0.8, blurMix));     // out-of-focus ice reads ghostly
  }
  else { rD = max(rTrue, 1.2); aa = 0.0; a *= min(1.0, sq(rTrue / rD) * 1.6); }   // 1.2 px floor: no 1-px film scratches
  if (uLayer != 1 && uLayer != 4) a *= max((2.0 * rD) / (2.0 * rD + blur), uLayer == 0 ? 0.25 : 0.0);
  if (uLayer == 3) a *= 1.0 - 0.6 * uStorm;
  if (uLayer == 2) a *= 1.0 - 0.35 * uStorm;
  // blizzard: thin the uniform fine streaks over the sky (upper third) so it is not a flat scratched field
  if (uLayer == 2 || uLayer == 3) a *= 1.0 - 0.45 * uStorm * smoothstep(0.1, 0.6, ndc.y);
  if (uLayer == 4 || uLayer == 0) a *= 1.0 - 0.3 * uStorm;       // keep a few big flakes whipping past the lens
  // blizzard gust sheets: a slow screen-space noise modulates the density of the streak tiers, so the curtain has
  // banks and gaps drifting with the gale instead of a uniform hatch. The scroll rate is 256/TW units/s, one full
  // noise period per clock wrap, so the sheet never jumps (the 2nd octave scrolls at an integer multiple)
  if (uLayer != 0 && uLayer != 4) {
    vec2 gq = vec2(ndc.x * uAspect, ndc.y) * 2.2 + vec2(2.1333333, 0.0) * t;
    float gs = tnoise(gq) * 0.6 + tnoise(gq * 2.0 + 7.0) * 0.4;
    a *= mix(1.0, 0.3 + 1.4 * smoothstep(0.3, 0.7, gs), uStorm);
  }
  a *= wz * clamp(uCount - float(id), 0.0, 1.0);

  // rotation, tumble (squash) and sparkle: rates snapped to the W0 grid (steps of 0.05 rad/s); the tumble
  // speeds up in a storm, so it runs on the storm-weighted clock uTumT
  float ang = r2.z * 6.2831853 + floor((r1.y - 0.5) * 2.2 * (0.3 + light) / W0 + 0.5) * W0 * t;
  float tum = r2.w * 6.2831853 + floor(mix(0.5, 2.6, r1.z) / W0 + 0.5) * W0 * uTumT;
  // tumble as a rocking wobble: crystals swing from face-on down to 0.3 (a perfect face-on star is a moment,
  // not the norm); clumps stay roundish; defocus rounds everything back to a disc
  float squash = mix(1.0 - (type == 3.0 ? 0.35 : 0.7) * sq(0.5 - 0.5 * cos(tum)), 1.0, blurMix);
  float rel = atan(dir.y, dir.x) - ang;

  vec3 pW = uCamPos + uCamR * cs.x + uCamU * cs.y + uCamF * cs.z;
  float dist = length(cs);
  vec3 V = (pW - uCamPos) / dist;
  float mu = dot(V, uSunDir);
  float g = 0.62;
  float hg = (1.0 - g * g) / pow(1.0 + g * g - 2.0 * g * mu, 1.5) * 0.08;       // forward scattering
  float facing = abs(cos(tum));
  // sunlit ice: bright white front-lit body (cloud shadow only partly dims it: flakes are lit by the
  // whole sky), plus tumble glints when a facet swings through the mirror direction
  // (in a whiteout a flake is lit from the whole sphere, the ground only from above: streaks sit above the snow)
  vec3 col = uSunCol * (0.36 + 0.28 * facing + hg) * mix(1.0, cloudShadow(pW), 0.6) + uSkyAmb * mix(1.0, 2.5, uStorm);
  if (uLayer == 1 || uLayer == 4) {
    float glint = pow(max(cos(tum * 2.0 + r0.x * 6.2831853), 0.0), 160.0) * step(0.5, r2.y);
    col += uSunCol * glint * (type == 3.0 ? 0.9 : (uLayer == 4 ? 1.2 : 1.6)) * (1.0 - uStorm * 0.85);
  } else if (uLayer == 2) {
    // mid-distance twinkles: a quarter of the tier flashes briefly as it tumbles through the sun -> a field of
    // small sparkles rather than one clipped flare
    float tw = pow(max(cos(tum * 2.0 + r0.x * 6.2831853), 0.0), 90.0) * step(0.75, r2.y);
    col += uSunCol * tw * 2.2 * (1.0 - uStorm * 0.85);
  }
  // per-flake brightness: real flakes are not all the same white. The crystal tiers spread 0.55-1.1, skewed
  // dim (and thin light crystals are the most translucent), so a bright one stands out as a hero; the far end
  // of the mid tier is dimmer than its near end, a depth cue the fog alone is too weak to give at 2-9 m
  float bri = (uLayer == 1 || uLayer == 4) ? mix(0.55, 1.1, r1.w * r1.w) * mix(1.0, 0.8, light) : mix(0.7, 1.1, r1.w);
  if (uLayer == 1) bri *= mix(1.0, 0.72, smoothstep(2.5, 9.0, zc));
  bri = mix(bri, 0.5 + 0.5 * bri, uStorm);      // a dim streak is lost in the whiteout: narrower spread in a blizzard
  col *= bri;
  vec4 fg = fogAt(dist, V);
  col = col * fg.a + fg.rgb;

  if (zc < 0.08 || abs(ndc.x) > 1.12 || abs(ndc.y) > 1.12 || a < 0.0015) { gl_Position = vec4(2.0, 2.0, 2.0, 1.0); return; }

  float hl = rD + 0.5 * blur + 1.2, hw = rD + 1.2;
  vec2 perp = vec2(-dir.y, dir.x);
  vec2 offPx = dir * corner.x * hl + perp * corner.y * hw;
  gl_Position = vec4(ndc + offPx / (0.5 * uRes), 0.0, 1.0);
  vP = vec2(corner.x * hl, corner.y * hw);
  vSeed = r1.wzyx * 0.7 + r2.yxwz * 0.3;
  vPar = vec4(rD, blur, type, aa);
  vRot = vec4(cos(rel), sin(rel), squash, rTrue);
  vCol = vec4(col, a);
  vDist = dist;
}
`;

const FS_FLAKE = `#version 300 es
precision highp float; precision highp int;
${GBUF}
uniform vec2 uRes;
uniform int uLayer;
uniform float uCover, uStorm;
in vec2 vP;
flat in vec4 vSeed;
flat in vec4 vPar;
flat in vec4 vRot;
in vec4 vCol;
in float vDist;
out vec4 o;

float sq(float x) { return x * x; }
float sdSeg(vec2 p, vec2 a, vec2 b) { vec2 pa = p - a, ba = b - a; float h = clamp(dot(pa, ba) / dot(ba, ba), 0.0, 1.0); return length(pa - ba * h); }
// fold the plane into one 30-degree wedge: 6-fold rotational + mirror symmetry of ice crystals
vec2 foldD6(vec2 q) {
  float r = length(q);
  float a = atan(q.y, q.x);
  a = abs(mod(a + 0.5235988, 1.0471976) - 0.5235988);
  return r * vec2(cos(a), sin(a));
}
// stellar dendrite: tapered main arm with side branches at 60 degrees, hexagonal core with an inner
// ring. Two seed-driven variants: A keeps its branches inside the wedge (neighbouring arms never
// touch) and adds one branchlet per branch on big sharp flakes; B is fern-like with five tapered
// branches whose mirrored copies meet between the arms (the textbook 'Christmas star').
float dendrite(vec2 q, vec4 s, float aa) {
  if (dot(q, q) > sq(1.06 + aa)) return 0.0;
  vec2 p = foldD6(q);
  bool fern = s.z > 0.5 && aa < 0.06;                        // fern only when its branches resolve (r > ~15 px)
  float w = max(mix(0.04, 0.075, s.x), 0.9 * aa);          // never thinner than ~1 px (no aliasing)
  float d = sdSeg(p, vec2(0.0), vec2(0.92, 0.0)) - w * (1.0 - 0.45 * p.x);
  bool fine = !fern && aa < 0.045;                           // branchlets only on big, sharp flakes (r > ~20 px)
  vec2 bd = vec2(0.5, 0.8660254);
  float sz = fract(s.z * 2.0);
  float b0 = mix(0.2, 0.32, s.y), bs = fern ? mix(0.13, 0.21, sz) : mix(0.13, 0.17, sz);
  bs = max(bs, 3.5 * aa);                                    // side branches need ~3.5 px of spacing to read
  float bl = mix(0.4, 0.7, fract(s.w * 5.3));
  for (int k = 0; k < 5; k++) {
    float fk = float(k);
    float x = b0 + fk * bs;
    if (x > (fern ? 0.9 : 0.86) || (!fern && k == 4)) break;
    float L = fern ? (0.97 - x) * bl : min((0.97 - x) * mix(0.55, 0.95, fract(s.w * 3.7 + fk * 0.31)), x * 0.9);
    vec2 a0 = vec2(x, 0.0), a1 = a0 + bd * L;
    float tt = clamp(dot(p - a0, bd) / max(L, 1e-3), 0.0, 1.0);                       // taper along the branch
    d = min(d, sdSeg(p, a0, a1) - max(w * (fern ? 0.72 * (1.0 - 0.55 * tt) : 0.62), 0.8 * aa));
    if (fine) {   // one branchlet parallel to the main arm, sprouting from the branch midpoint
      vec2 m = a0 + bd * (L * 0.5);
      d = min(d, sdSeg(p, m, m + vec2(L * 0.3, 0.0)) - max(w * 0.5, 0.8 * aa));
    }
  }
  float hexd = dot(p, vec2(0.8660254, 0.5));
  float core = mix(0.09, 0.2, s.w);
  d = min(d, hexd - core);
  float c = 1.0 - smoothstep(-aa, aa, d);
  float rim = smoothstep(-min(w * 0.9, 0.035) - aa, 0.0, d);               // edges catch the light (a thin line on wide arms)
  float ridge = 1.0 - smoothstep(0.0, 0.025 + aa, p.y);
  float ring = 1.0 - smoothstep(0.0, 0.02 + aa, abs(hexd - core * 0.6));
  // translucent body (0.42) under bright rims / ridges / ring, so the interior structure survives tone mapping
  return c * (0.42 + 0.5 * rim + 0.3 * ridge + 0.2 * ring);
}
// hexagonal / stellar plate with ridges, an inner hexagon line and bright rims
float plate(vec2 q, vec4 s, float aa) {
  if (dot(q, q) > sq(1.06 + aa)) return 0.0;
  vec2 p = foldD6(q);
  float R = mix(0.62, 0.92, s.x);
  float hexd = dot(p, vec2(0.8660254, 0.5));
  float d;
  if (s.y > 0.45) {   // stellar plate: broad arms widening toward the tip
    float wArm = 0.07 + 0.2 * smoothstep(0.3, 0.95, p.x / R);
    d = min(max(p.y - wArm * R, p.x - R), hexd - 0.3 * R);
  } else d = hexd - R * 0.8660254;
  float c = 1.0 - smoothstep(-aa, aa, d);
  float ridge = 1.0 - smoothstep(0.0, 0.025 + aa, p.y);
  float inner = 1.0 - smoothstep(0.0, 0.025 + aa, abs(hexd - 0.4 * R));
  float rim = smoothstep(-0.07 - aa, 0.0, d);
  return c * (0.38 + 0.28 * ridge + 0.22 * inner + 0.5 * rim);      // translucent body, bright rim and ridges
}
// one small six-armed crystal used inside aggregates
float miniStar(vec2 q, float aa) {
  vec2 p = foldD6(q);
  float d = sdSeg(p, vec2(0.0), vec2(0.92, 0.0)) - 0.1 * (1.0 - 0.4 * p.x);
  d = min(d, sdSeg(p, vec2(0.5, 0.0), vec2(0.5, 0.0) + vec2(0.5, 0.866) * 0.36) - 0.07);
  d = min(d, dot(p, vec2(0.866, 0.5)) - 0.2);
  return 1.0 - smoothstep(-aa, aa, d);
}
// clumped aggregate (most large real flakes): a soft translucent lumpy core with a few
// tumbled crystals fused into it, their arms poking out of the outline
float aggregate(vec2 q, vec4 s, float aa) {
  if (dot(q, q) > sq(1.06 + aa)) return 0.0;
  uint h = floatBitsToUint(s.x * 9.71 + s.y) ^ 0x9e3779b9u;
  float rr = length(q);
  float ang0 = atan(q.y, q.x);
  float lump = 0.5 + 0.09 * sin(3.0 * ang0 + s.z * 6.0) + 0.06 * sin(5.0 * ang0 + s.w * 6.0) + 0.04 * sin(8.0 * ang0 + s.x * 6.0);
  float core = 1.0 - smoothstep(lump - 0.3 - aa, lump + aa, rr);
  float tex = 0.75 + 0.25 * sin(q.x * 9.0 + s.z * 6.0) * sin(q.y * 8.0 + s.w * 6.0);
  float c = core * core * 0.42 * tex;                                    // translucent, denser centre
  for (int k = 0; k < 3; k++) {
    h = h * 747796405u + 2891336453u;
    uint h2 = (h >> 5u) * 2654435761u;
    vec4 r = vec4(float(h >> 8u), float(h2 >> 8u), float((h2 * 1103515245u) >> 8u), float((h * 22695477u) >> 8u)) / 16777216.0;
    vec2 off = (r.xy - 0.5) * 0.45;
    float sc = mix(0.45, 0.62, r.z);
    float an = r.w * 6.2831853;
    vec2 qq = q - off;
    qq = vec2(cos(an) * qq.x - sin(an) * qq.y, sin(an) * qq.x + cos(an) * qq.y) / sc;
    qq.y /= mix(0.5, 1.0, fract(r.w * 7.3));                                 // tilted crystal
    if (dot(qq, qq) < 1.1) c = max(c, miniStar(qq, aa / sc) * mix(0.8, 1.0, r.z));
  }
  return c;
}
float shapeAt(vec2 sp) {
  // shape in units of the true radius; defocus widens the edge ramp (aa) and the quad (vPar.x) instead
  vec2 q = vec2(vRot.x * sp.x - vRot.y * sp.y, vRot.y * sp.x + vRot.x * sp.y) / vRot.w;
  q.y /= vRot.z;
  // the tumble squash shrinks the pixel footprint along y: widen the edge ramp by the geometric mean of the
  // two axes' scales, so an edge-on crystal softens instead of aliasing (and its fine detail switches off)
  float aa = vPar.w * inversesqrt(max(vRot.z, 0.2));
  if (vPar.z < 1.5) return dendrite(q, vSeed, aa);
  if (vPar.z < 2.5) return plate(q, vSeed, aa);
  return aggregate(q, vSeed, aa);
}
void main() {
  float rPx = vPar.x, blur = vPar.y;
  float cov;
  if ((uLayer == 1 || uLayer == 4) && blur < min(3.5 * rPx, 28.0)) {
    // true motion blur of the crystal shape: a box of taps along the streak at <= 1 px spacing (up to 29),
    // so a short calm blur keeps the crystal crisp with no tap structure (coarser stratified taps with
    // per-pixel jitter left a diagonal hatch across the big sharp flakes)
    int taps = int(ceil(blur)) + 1;
    float acc = 0.0;
    for (int k = 0; k < 29; k++) {
      if (k >= taps) break;
      float off = ((float(k) + 0.5) / float(taps) - 0.5) * blur;
      acc += shapeAt(vP - vec2(off, 0.0));
    }
    cov = acc / float(taps);
  } else if (uLayer == 1 || uLayer == 4) {
    // long streak: the crystal detail is smeared out anyway -> analytic soft capsule,
    // energy-normalised against the streak length, slightly brighter core.
    // Per-flake character so the blizzard is not a parallel hatch: width x0.6-1.4, brightness x0.6-1.2,
    // and a ~12% subset of thin, bright, crisp streaks (small dense flakes whipping past)
    float wv = mix(0.6, 1.4, vSeed.z), bv = mix(0.6, 1.2, vSeed.w);
    if (fract(vSeed.y * 5.3) > 0.88) { wv *= 0.4; bv *= 1.6; }
    vec2 q = vec2(max(abs(vP.x) - 0.5 * blur, 0.0), vP.y);
    float d = length(q) / (rPx * 0.55 * wv);
    float along = 1.0 - smoothstep(0.3, 0.5, abs(vP.x) / (blur + 2.0 * rPx));       // soft streak ends

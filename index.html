//   b larch: 1 on a resolved larch crown; on the unresolved far forest its canopy cover x the stand's larch share
//   a moist: moisture order from the baked curvature, slope and pasture mottle (0 dry rib / sunny steep, 1 moist hollow)
// The larch summer reference (resolved crowns; SURFACE recolours by the ratio larchSeason / LARCH_REF, keep in sync)
const vec3 LARCH_REF = vec3(0.075, 0.10, 0.034);
// larch share of the conifer stands at xz (ground altitude alt): ~400 m stands with a ~100 m fringe, commoner toward
// the treeline and on the far valley flanks: 0.04 .. ~0.8, mean ~0.25 (mixed stands: spruce always stays
// among the larches). The same field picks the resolved larch crowns and tints the unresolved far canopy, so a golden
// stand stays one stand across the tree-SDF / forest-albedo hand-over
float larchShare(vec2 xz, float alt) {
  float n = 0.5 + 0.5 * (0.8 * vn(xz * 0.0024 + vec2(2.7, 8.1)) + 0.2 * vn(xz * 0.009 + vec2(5.3, 1.9)));
  return sat(0.5 * smoothstep(0.45, 0.75, n) + 0.18 * smoothstep(60.0, 300.0, alt) + 0.22 * smoothstep(2500.0, 4500.0, length(xz)) + 0.04);
}
void gbMaterials(float t, float mat, vec3 pos, vec3 nD, vec3 nS, float fp, float hT, float hfr, float tid,
                 float sh, float ao, float canopy, float curvS, float curvLS) {
  vec3 alb; float snowT; float grass = 0.0;
  vec4 mp = vec4(0.0);
  vec2 xz = pos.xz;
  if (mat == 1.0) {
    vec2 w = xz + 180.0 * vec2(vn(xz * 0.00033 + vec2(4.1, 0.3)), vn(xz * 0.00033 + vec2(-2.3, 6.1)));
    float mtnW, valW, wallW, across, along, footD; layoutW(w, mtnW, valW, wallW, across, along, footD);
    float steep = 1.0 - smoothstep(0.42, 0.86, nS.y);
    float alt = pos.y;
    float lodD = clamp(log2(5.5 / max(fp, 0.01)), 0.0, 6.0);   // n3's 11 m base octave at Nyquist: no shimmer on the far slopes
    float wAlong = smoothstep(-3800.0, -2200.0, along) * smoothstep(14500.0, 11000.0, along);   // the wall's extent along its foot
    float faceM = smoothstep(0.02, 0.25, wallW);
    // the same ridged buttress field the height uses (terrainH): crests ~1, gullies ~0
    float butt = ridgedFbm(vec2(along / 260.0, across / 900.0) + vec2(5.0, 2.0), clamp(log2(300.0 / max(2.2 * fp, 0.5)), 0.0, 6.0));
    // local curvature (height vs. the mean of 4 neighbours) at two scales: hummocks near the camera,
    // ribs/gullies on the far slopes. + on crests, - in hollows
    float ce = max(10.0, fp * 6.0), cl = max(45.0, fp * 14.0);
    float curv = (hT - 0.25 * curvS) / ce;      // neighbour sums from phase 7
    float curvL = (hT - 0.25 * curvLS) / cl;
    // grass: yellow-olive alpine pasture; pale/dry on ribs and sunny slopes, lush in hollows, scrub patches
    float n1 = vn(xz * 0.0027 + 1.7), n3 = fbmF(xz * 0.09, lodD);
    vec3 gA = vec3(0.125, 0.140, 0.042), gB = vec3(0.185, 0.175, 0.062), gC = vec3(0.075, 0.098, 0.032);
    vec3 grassC = mix(gA, gB, smoothstep(-0.3, 0.7, n1));
    grassC = mix(grassC, gC, 0.9 * max(smoothstep(0.03, 0.14, -curv), smoothstep(0.02, 0.1, -curvL)));
    grassC = mix(grassC, gB * vec3(1.05, 1.0, 0.9), 0.8 * max(smoothstep(0.03, 0.14, curv), smoothstep(0.02, 0.1, curvL)));
    float scrub = smoothstep(0.38, 0.65, vn(xz * 0.03 + 9.1) * 0.6 + vn(xz * 0.09 + 2.2) * 0.4);   // dwarf pine / alder patches
    grassC = mix(grassC, vec3(0.05, 0.075, 0.03), 0.6 * scrub * (1.0 - steep));
    grassC = mix(grassC, vec3(0.24, 0.21, 0.08), 0.3 * smoothstep(0.5, 0.9, vn(xz * 0.012 + 5.5)) * smoothstep(0.1, 0.5, steep + 0.3 * n1));  // straw
    // 40-80 m lush / bleached patches (grazing, drainage): the macro mottle of a real pasture, +-25%
    float pch = vn(xz * 0.015 + 6.3) * 0.7 + vn(xz * 0.045 + 1.9) * 0.3;
    grassC *= 1.0 + 0.25 * pch;
    grassC = mix(grassC, grassC * vec3(0.88, 1.0, 0.75), 0.5 * smoothstep(0.1, 0.6, pch));          // bleached = yellower
    grassC = mix(grassC, grassC * vec3(0.9, 1.0, 1.1), 0.5 * smoothstep(-0.1, -0.6, pch));          // lush = deeper green
    grassC *= 0.85 + 0.3 * n3;
    grassC = mix(grassC, grassC * vec3(1.0, 0.96, 0.85), smoothstep(0.1, 0.45, steep));   // drier on slopes (never brighter than flat turf)
    grassC = mix(grassC, grassC * vec3(0.72, 0.74, 0.7), 0.7 * mtnW);                    // muted alpine turf
    // rock: grey-blue limestone, strata bands (altitude-keyed, so they stay horizontal on the faces),
    // mottling from 3D noise (2D xz noise would smear vertically on a cliff), darker water streaks
    // bedding dips ~20 deg along the strike (alt + 0.36 * along), as on the reference's wall
    float strat = vn(vec2(alt * 0.011 + along * 0.004 + 0.5 * vn(xz * 0.0015), along * 0.0013)) * 0.6 + vn3(pos * 0.006) * 0.4;
    float stk = vn3(pos * 0.012 + 3.0);
    vec3 rockC = vec3(0.155, 0.16, 0.172) * max(0.68 + 0.5 * strat, 0.12) * (0.8 + 0.3 * stk);
    rockC = mix(rockC, vec3(0.16, 0.14, 0.11), 0.3 * smoothstep(0.2, 0.8, vn3(pos * 0.004)));
    // water-stain streaks run down the fall line: noise elongated 8:1 along altitude, in the wall frame
    vec2 sq2 = vec2(along * 0.05, alt * 0.006);
    float streaks = vn(sq2) * 0.6 + vn(sq2 * vec2(2.1, 1.9) + 5.0) * 0.4 * smoothstep(8.0, 2.0, fp);
    rockC *= 0.85 + 0.3 * smoothstep(-0.5, 0.6, streaks);
    // gully cavity: the sun azimuth is only ~11 deg off the near face's normal, so the real shadow test
    // leaves its gullies as bright as the ribs. Fake the cavity shading from the baked concavity (curvL,
    // phase 7: gullies, couloirs, ledge undersides) plus the broad (2-octave) buttress field, and give each
    // rib a lit and a shaded flank from that field's along-gradient (the sun has a small +along component)
    vec2 bq = vec2(along / 260.0, across / 900.0) + vec2(5.0, 2.0);
    float bA = ridgedFbm(bq + vec2(0.17, 0.0), 2.0), bB = ridgedFbm(bq - vec2(0.17, 0.0), 2.0);
    float cav = sat(smoothstep(0.03, 0.45, -curvL) + 0.8 * (1.0 - smoothstep(0.12, 0.5, 0.5 * (bA + bB))) * faceM);
    float ribLit = clamp((bB - bA) * 3.0, -1.0, 1.0);
    rockC *= mix(1.0, 0.45, cav * mix(0.6, 1.0, faceM)) * (1.0 + 0.25 * ribLit * faceM) * (1.0 + 0.18 * smoothstep(0.03, 0.4, curvL));
    rockC = mix(rockC, rockC * vec3(0.9, 1.0, 0.85), 0.35 * smoothstep(0.0, 0.6, vn3(pos * 0.013)));  // lichen tint
    // rock/turf boundary: a noisy threshold on steepness so outcrops break through the grass instead of a smooth smear
    float rn = vn(w * 0.012 + 3.0) * 0.6 + vn(w * 0.04) * 0.4;
    float rockW = smoothstep(0.3, 0.66, steep * 1.15 + 0.22 * rn);
    rockW = max(rockW, smoothstep(1150.0, 1900.0, alt + 350.0 * vn(xz * 0.0021)) * mix(0.6, 1.0, steep));
    rockW *= smoothstep(0.0, 0.25, mtnW + valW * 0.8 + steep * 0.5);
    // the wall's foot: broken rock and turf within ~120 m below the face instead of a sunlit grass lip
    rockW = max(rockW, 0.8 * smoothstep(-130.0, 20.0, footD + 60.0 * rn) * wAlong * smoothstep(0.2, 0.7, 0.5 + 0.5 * vn(w * 0.02 + 7.0) + 0.4 * steep));
    // rock albedo from 3D noise as well (no vertical stretching on cliffs)
    float r3 = fbm3(pos / 45.0, clamp(log2(45.0 / max(1.5 * fp, 0.2)), 0.0, 6.0));
    rockC *= 0.78 + 0.5 * r3;
    alb = mix(grassC, rockC, rockW);
    // scree fans spilling from the gullies at the wall's foot: each fan is a tongue that is narrow at
    // its apex (the gully mouth) and spreads downslope, so the foot is broken up rather than banded
    float fanN = vn(vec2(along * 0.0055, 0.3)) * 0.7 + vn(vec2(along * 0.016, 0.7)) * 0.3;    // which gullies shed scree
    float fanW = smoothstep(0.0, 0.55, fanN) * (0.45 + 0.55 * smoothstep(0.0, -300.0, footD));   // widens downslope
    float scree = fanW * smoothstep(-520.0, -180.0, footD + 80.0 * vn(w * 0.01)) * smoothstep(190.0, 70.0, footD) * (1.0 - 0.6 * steep)
                * smoothstep(-3800.0, -2200.0, along) * smoothstep(5000.0, 1500.0, along) * (1.0 - rockW);
    scree *= smoothstep(0.15, 0.55, scree + 0.3 * vn(w * 0.03 + 1.0));                           // ragged edges
    alb = mix(alb, vec3(0.21, 0.19, 0.16) * (0.7 + 0.6 * r3) * (0.85 + 0.3 * n3), scree * 0.5);
    nD = normalize(mix(nD, rockBump(pos, nD, fp, 0.7), rockW * smoothstep(0.1, 0.5, steep)));
    // distant forest (beyond the tree-SDF range): dark mottled canopy with stand-scale hue variation
    float fcov = 0.0, fthr = 0.0, lsh = 0.0;
    if (fp >= TREE_FP0) {
      float fd = forestDensity(xz, alt) * (1.0 - rockW);
      float fn = 0.5 + 0.5 * vn(xz * 0.08);
      float fn2 = 0.5 + 0.5 * vn(xz * 0.35);                                    // individual crowns as speckle
      float fn3 = vn(xz * 0.02 + 4.0);
      float cov = smoothstep(0.25, 0.7, fd + 0.3 * (fn - 0.5)) * smoothstep(TREE_FP0, TREE_FP1, fp);
      // darker than the resolved trees' albedo: a canopy seen from above is mostly its own shadow. The stand's larch
      // share is in its summer colour (LARCH_REF x the same canopy factor), recoloured per frame through G3.b
      lsh = larchShare(xz, alt);
      vec3 fc = mix(mix(vec3(0.028, 0.05, 0.026), vec3(0.05, 0.066, 0.028), smoothstep(-0.3, 0.5, fn3)), LARCH_REF * 0.75, lsh) * 0.7 * (0.3 + 1.4 * fn2);
      alb = mix(alb, fc, cov * 0.9);
      ao *= 1.0 - 0.4 * cov;
      fcov = cov;
      // unresolved far canopy: stands whiten together in ~250 m drifts (low-frequency stand noise) with a small
      // per-crown jitter, lagging the meadow; a per-crown threshold alone read as salt-and-pepper
      fthr = 0.5 + 0.35 * (0.5 + 0.5 * vn(xz * 0.004 + 1.0)) + 0.1 * fn2;
    }
    // paths
    float pd = pathDist(xz);
    float pm = (1.0 - smoothstep(1.5, 2.6 + fp * 0.4, pd)) * (1.0 - mtnW);
    alb = mix(alb, vec3(0.33, 0.29, 0.22) * (0.85 + 0.2 * n3), pm);
    grass = (1.0 - rockW) * (1.0 - pm) * (1.0 - fcov) * (1.0 - 0.8 * scree);
    // ---- snow threshold: flat, high, lee-side areas get snow first; steep cliffs stay rocky
    float altF = smoothstep(1150.0, 2300.0, alt + 280.0 * vn(xz * 0.0031));
    float drift = vn(vec2(xz.x * 0.0022 + xz.y * 0.0011, xz.y * 0.0065));   // wind-elongated drifts
    float patchN = vn(xz * 0.006 + 8.1) * 0.6 + vn(xz * 0.025) * 0.4;
    float tuft = fbmF(xz * 0.7, clamp(log2(1.4 / max(fp, 0.01)), 0.0, 4.0)) * 0.6 + vn(xz * 0.09 + 3.3) * 0.4;  // grass tufts poke through (4 octaves near the camera: ~9 cm)
    // far peaks (fp > ~3 m/px): the per-pixel patch / tuft / drift thresholds would split the summit snow into
    // salt noise, so they collapse to their means and the ledge test uses the smooth normal -> continuous fields
    float farM = smoothstep(2.5, 5.0, fp);
    float ledge = smoothstep(0.55, 0.92, mix(nD.y, nS.y, farM));
    float gentle = 1.0 - smoothstep(0.78, 0.99, nS.y);
    float patchT = mix(smoothstep(-0.6, 0.6, patchN), 0.5, farM), driftT = mix(drift, 0.0, farM), tuftT = mix(tuft, 0.0, farM);
    // flat meadow thresholds are spread over ~0.12..0.95 so cover grows patch by patch for minutes.
    // Per-material order (matte's table): high/flat first, trodden path +0.16 later, bare rock +0.12 later,
    // lee faces of the prevailing (+x) wind drift in first while windward faces are scoured (-0.10 n.x),
    // and the ground under a canopy stays bare longest (+0.1..0.4 interception, varied per stand so the sheltered
    // ground becomes islands rather than one hole at the forest edge). The tuft term (0.25) is what breaks a
    // patch margin into tuft-scale fringes instead of a smooth ramp
    snowT = 0.05 + 0.62 * patchT + 0.10 * (0.5 + 0.5 * driftT) + 0.25 * (0.5 + 0.5 * tuftT) * grass
          + 0.10 * gentle + 0.16 * pm + 0.12 * rockW + steep * (0.45 + 1.0 * rockW) - 0.55 * ledge * steep * rockW
          - mix(0.95, 1.2, smoothstep(2000.0, 2600.0, alt)) * altF * (1.0 - 0.55 * steep);
    snowT -= 0.10 * nS.x * (1.0 - 0.5 * rockW);
    snowT += canopy * (0.25 + 0.15 * vn(xz * 0.01 + 5.0));
    snowT = mix(snowT, fthr, fcov);
    snowT -= 0.75 * smoothstep(2500.0, 3500.0, alt + 200.0 * driftT) * (1.0 - 0.7 * steep);   // steep far faces keep their rock
    snowT -= 0.9 * smoothstep(1500.0, 2200.0, alt) * ledge * rockW;          // old snow lying on high ledges
    // old snow in the wall's upper couloirs (concave + low buttress value), as in the reference's upper right;
    // scaled with steep so it cancels the cliff penalty, gated per gully so only some of them hold snow
    float coul = sat(smoothstep(0.03, 0.35, -curvL) + 0.7 * (1.0 - smoothstep(0.06, 0.35, butt))) * smoothstep(-0.25, 0.3, vn(vec2(along * 0.0025, alt * 0.002) + 3.0));
    snowT -= (0.6 + 1.3 * steep) * smoothstep(1100.0, 1700.0, alt) * coul * rockW * faceM;
    snowT = max(snowT, mix(0.09, -1.0, altF));
    snowT = min(snowT, mix(0.95, 3.0, rockW));     // every turf band whitens by full cover; only rock can stay bare
    // ---- G3 material parameters (the same curvature / slope / mottle terms the grass albedo uses above)
    float hollowW = max(smoothstep(0.03, 0.14, -curv), smoothstep(0.02, 0.1, -curvL));
    float ribW = max(smoothstep(0.03, 0.14, curv), smoothstep(0.02, 0.1, curvL));
    float moist = 0.5 + 0.45 * hollowW - 0.45 * ribW - 0.3 * smoothstep(0.1, 0.45, steep) - 0.2 * pch;
    mp = vec4(sat(rockW + scree), sat(pm), sat(fcov * lsh), sat(moist));
  } else if (mat == 2.0) {
    // conifer needles: dark green, per-tree hue variation (some bluish firs, larch stands), lighter toward the sunlit
    // top, darker inside / at the bottom. A crown is a larch when its random tv falls under the stand's larch share,
    // read at the crown's axis (the hit minus the outward normal x the crown radius here; the tree height follows tid
    // as in treesSDF) so a crown practically never straddles the share threshold
    float H = mix(9.0, 24.0, tid);
    vec2 ax = pos.xz - normalize(nD.xz + 1e-4) * 0.22 * H * (1.0 - hfr);
    float larch = step(1.0 - larchShare(ax, hT), fract(tid * 7.3));
    vec3 tc = mix(vec3(0.018, 0.040, 0.020), vec3(0.060, 0.080, 0.030), tid * tid);
    tc = mix(tc, vec3(0.025, 0.045, 0.042), step(0.84, fract(tid * 13.7)));
    // sun-facing needles read warm yellow-green (the lit side of a spruce is never the same hue as its shade side)
    tc = mix(tc, vec3(0.05, 0.075, 0.028), 0.6 * smoothstep(0.0, 0.6, dot(nD, uSunDir)));
    // larch: its summer reference, +-10% warmer / cooler per tree (recoloured per frame by ratio, so each crown keeps its
    // own shade of gold in autumn)
    tc = mix(tc, LARCH_REF * mix(vec3(1.1, 1.0, 0.9), vec3(0.9, 1.0, 1.1), fract(tid * 3.1)), larch);
    alb = tc * (0.75 + 0.5 * hash2(floor(pos.xz * 3.0) + floor(pos.y * 3.0))) * (0.72 + 0.5 * hfr);
    mp.b = larch;
    ao *= mix(0.35, 1.0, sqrt(hfr));
    // laden spruce (matte's clump rule on this SDF's whorl geometry): snow clumps collect on the whorl tops
    // (thr 0.10-0.55, so tops read white above C~0.6), the steep rims and undersides stay dark (thr > 1).
    // Where the whorls are not resolved (far stands) the per-pixel split would be noise, so the whole
    // crowns whiten stand by stand over C 0.5-0.95 instead (the same ~250 m stand noise as the far-canopy
    // albedo, plus a per-tree jitter): distant forest lags the meadow, then goes laden in drifts
    float up = smoothstep(0.3, 0.85, nD.y);
    float tn = 0.5 + 0.5 * vn(pos.xz * 1.7 + pos.y * 0.9 + tid * 50.0);
    float tn2 = 0.5 + 0.5 * vn(pos.xz * 4.3 + pos.y * 2.1 + tid * 20.0);
    float stand = 0.5 + 0.5 * vn(pos.xz * 0.004 + 1.0);
    float res = sat(1.7 - fp * 2.2);
    snowT = mix(0.5 + 0.35 * stand + 0.1 * tid, mix(1.05 + 0.5 * tn2, 0.10 + 0.45 * tn + 0.12 * (1.0 - hfr), up), res);
  } else if (mat == 3.0) {
    // sun-bleached timber walls (planked), darker under the eaves where the overhang shades them
    alb = vec3(0.26, 0.20, 0.13) * (0.8 + 0.3 * vn(vec2(pos.y * 4.0, pos.x + pos.z))) * (0.85 + 0.3 * hash2(floor(pos.xz * 0.03) + 0.5));
    ao *= mix(1.0, 0.55, smoothstep(2.4, 4.2, pos.y - hT));
    snowT = 3.0;
  } else {
    // dark-brown shingle roofs, weathered per chalet (33 m cells ~ one chalet) and per shingle row
    alb = vec3(0.09, 0.06, 0.04) * (0.6 + 0.8 * hash2(floor(pos.xz * 0.03))) * (0.85 + 0.3 * hash2(floor(pos.xz * 1.3)));
    snowT = 0.02 + 0.5 * (1.0 - nD.y);
  }
  o0 = vec4(t, mat + (mat == 2.0 ? hfr : grass) * 0.9, sh, ao);
  o1 = vec4(alb, snowT);
  o2 = vec4(octEnc(nD), octEnc(nS));
  mp = floor(clamp(mp, 0.0, 1.0) * 255.0 + 0.5) / 255.0;    // 8-bit steps, so the RGBA16F fallback stores (and shades) the same values
  o3 = mp;
}
`;
})(window.SNOW);

<script>/* js/glsl/gbuf-main.js */
// =====================================================================================
//  GLSL: the G-buffer bake program (frozen during the stage-1 lanes).
//   GBUF_HEAD   bake uniforms, the MRT outputs, march limits
//   GBUF_MAIN   sceneQ, the single scene-query call site, and the phase state machine in main()
//  Program 'gbuf' = COMMON + GBUF_HEAD + GBUF_NOISE + GBUF_TERRAIN + GBUF_OBJECTS + GBUF_MATERIALS + GBUF_MAIN.
// =====================================================================================
(function (S) {
  'use strict';
  const C = S.glsl.chunks;
  C.GBUF_HEAD = `
uniform float uPixAng;
uniform int uIter;                  // state-machine iteration cap (a uniform bound: the driver cannot unroll the loop)
layout(location = 0) out vec4 o0;   // t, material(+grass frac), sun shadow, AO
layout(location = 1) out vec4 o1;   // albedo, snow threshold
layout(location = 2) out vec4 o2;   // oct(detail normal), oct(smooth normal)
layout(location = 3) out vec4 o3;   // season-neutral material params, 0..1: rock, soil / path, larch, moisture (RGBA8)

const float TMAX = 42000.0;
const float HMAX = 4400.0;
`;
  C.GBUF_MAIN = `
// Every terrain / scene distance query of main() goes through this ONE call site (a phase state machine
// drives it, matte-style), so the big height function and the tree / chalet SDFs are inlined exactly once:
// the shader stays small and compiles quickly on ANGLE/Metal (Safari) instead of inlining terrainH ~25x.
//   mode 0: heightfield only (returns p.y - h)
//   mode 1: full scene for the march / SDF normals: trees (with a bounding slab above them) + chalets
//   mode 2: sun-shadow ray: trees only where the ray is near the ground, no slab, no chalets
// mat: 1 terrain, 2 tree, 3 wall, 4 roof. fpO is the footprint used for the objects (the shadow ray keeps
// the surface's footprint for the trees while the terrain LOD coarsens along the ray).
float sceneQ(vec3 p, float fp, float fpO, int mode, out float mat, out float hb, out float dTree, out float hfr, out float tid) {
  hb = terrainH(p.xz, fp);
  float dy = p.y - hb;
  mat = 1.0; dTree = 1e5; hfr = 0.0; tid = 0.0;
  if (mode == 0) return dy;
  bool near = fpO < TREE_FP1 && dy < 36.0;
  if (near) dTree = treesSDF(p, hb, fpO, hfr, tid);
  if (mode == 2) return min(dy, dTree);
  float d = dy * 0.42;
  if (fpO < TREE_FP1 && !near) d = min(d, dy - 35.5);
  if (dTree < d) { d = dTree; mat = 2.0; }
  if (nearChalets(p.xz) > 0.5 && dy < 14.0) { float cm; float dc = chaletsSDF(p, hb, cm); if (dc < d) { d = dc; mat = cm; } }
  return d;
}

void main() {
  vec3 rd = camRay(gl_FragCoord.xy);
  vec3 ro = uCamPos;
  float t = 2.0, tPrev = t, mat = 0.0;
  float bA = 0.0, bB = 0.0;                                   // bisection bracket
  vec3 pos = vec3(0.0), nD = vec3(0.0, 1.0, 0.0), nS = nD, so = vec3(0.0);
  float fp = 0.0, hT = 0.0, hfr = 0.0, tid = 0.0, sh = 1.0, ts = 0.0, ao = 1.0, canopy = 0.0;
  float hN[8]; vec4 tet = vec4(0.0);
  float occ = 0.0, wsum = 0.0, curvS = 0.0, curvLS = 0.0;
  bool hit = false;
  int phase = 0, j = 0, mi = 0;
  const vec2 k2 = vec2(1.0, -1.0);
  // phases: 0 march -> 1 bisection refine (heightfield, steep cliffs) -> 2 height at the hit -> 3 normal probes
  //         -> 4 soft sun shadow -> 5 AO horizon probes along the normal -> 6 canopy proximity -> 7 curvature -> 8 done
  for (int it = 0; it < uIter; it++) {
    vec3 q; float qf, qfo; int mode;
    if (phase == 0) { q = ro + rd * t; qf = t * uPixAng; qfo = qf; mode = 1; }
    else if (phase == 1) { float mt = 0.5 * (bA + bB); q = ro + rd * mt; qf = mt * uPixAng; qfo = qf; mode = 0; }
    else if (phase == 2) { q = pos; qf = fp; qfo = fp; mode = 0; }
    else if (phase == 3) {
      if (mat == 1.0) {

        float e = j < 4 ? max(0.05, fp * 0.6) : max(1.5, fp * 5.0);
        int jj = j & 3;
        vec2 o = jj == 0 ? vec2(e, 0.0) : jj == 1 ? vec2(-e, 0.0) : jj == 2 ? vec2(0.0, e) : vec2(0.0, -e);
        q = vec3(pos.x + o.x, pos.y, pos.z + o.y); qf = j < 4 ? fp * 0.45 : fp * 5.0; qfo = qf; mode = 0;
      } else {
        // tetrahedral gradient of the scene SDF
        float e = max(0.03, fp * 0.5);

    }

    else if (phase == 5) { float hh = max(1.5, fp * 2.0) * pow(3.0, float(j)); q = pos + nS * hh; qf = max(fp, hh * 0.2); qfo = qf; mode = 0; }
    else if (phase == 6) { q = pos + vec3(0.0, 1.5, 0.0); qf = fp; qfo = fp; mode = 1; }
    else if (phase == 7) {

      float e = j < 4 ? max(10.0, fp * 6.0) : max(45.0, fp * 14.0);
      int jj = j & 3;
      vec2 o = jj == 0 ? vec2(e, 0.0) : jj == 1 ? vec2(-e, 0.0) : jj == 2 ? vec2(0.0, e) : vec2(0.0, -e);

        else { pos = ro + rd * t; fp = qf; phase = 2; }
      }

      else { tPrev = t; t += max(d, 0.25 * qf); }
    } else if (phase == 1) {
      float mt = 0.5 * (bA + bB); if (d < 0.0) bB = mt; else bA = mt;
      if (++j >= 6) { t = bB; pos = ro + rd * t; fp = t * uPixAng; phase = 2; }
    } else if (phase == 2) { hT = hb_; phase = 3; j = 0; }
    else if (phase == 3) {
      bool done;
      if (mat == 1.0) {
        hN[j] = hb_; done = ++j >= 8;
        if (done) { nD = normalize(vec3(hN[1] - hN[0], 2.0 * max(0.05, fp * 0.6), hN[3] - hN[2])); nS = normalize(vec3(hN[5] - hN[4], 2.0 * max(1.5, fp * 5.0), hN[7] - hN[6])); }
      } else {
        tet[j] = d; done = ++j >= 4;
        if (done) { nD = normalize(k2.xyy * tet.x + k2.yyx * tet.y + k2.yxy * tet.z + k2.xxx * tet.w); nS = nD; }
      }
      if (done) {
        if (dot(nD, uSunDir) > -0.2) { so = pos + nD * max(0.15, fp * 2.0); ts = 0.4; phase = 4; j = 0; }
        else { sh = 0.0; phase = 5; j = 0; }
      }
    } else if (phase == 4) {
      sh = min(sh, 10.0 * d / ts);
      ts += clamp(d * 0.55, 0.25 + ts * 0.012, 60.0 + ts * 0.06);
      if (sh < 0.002 || ++j >= 110 || ts > 22000.0 || so.y + uSunDir.y * ts > HMAX) { phase = 5; j = 0; }
    } else if (phase == 5) {
      float hh = max(1.5, fp * 2.0) * pow(3.0, float(j));
      occ += clamp((hh - d) / hh, 0.0, 1.0) * (1.0 / float(j + 1)); wsum += 1.0 / float(j + 1);
      if (++j >= 5) { ao = clamp(1.0 - 1.5 * occ / wsum, 0.0, 1.0); phase = mat == 1.0 ? (fp < TREE_FP1 ? 6 : 7) : 8; j = 0; }
    } else if (phase == 6) {
      // ground darkening under / near trees (needle litter + occlusion); the same proximity is the canopy
      // interception term below (the ground beneath a spruce stays bare longest)
      canopy = 1.0 - smoothstep(-0.5, 4.5, dT_); ao *= mix(1.0, 0.45, canopy); phase = 7; j = 0;
    }
    else { if (j < 4) curvS += hb_; else curvLS += hb_; if (++j >= 8) phase = 8; }
  }
  if (!hit) { o0 = vec4(65000.0, 0.0, 1.0, 1.0); o1 = vec4(0.0); o2 = vec4(0.0); o3 = vec4(0.0); return; }
  sh = smoothstep(0.0, 1.0, clamp(sh, 0.0, 1.0));
  // ---- materials
  gbMaterials(t, mat, pos, nD, nS, fp, hT, hfr, tid, sh, ao, canopy, curvS, curvLS);
}
`;
  S.glsl.progs.gbuf = { vs: ['VS_FULL'], fs: ['COMMON', 'GBUF_HEAD', 'GBUF_NOISE', 'GBUF_TERRAIN', 'GBUF_OBJECTS', 'GBUF_MATERIALS', 'GBUF_MAIN'] };

<script>/* js/glsl/surface.js */
// =====================================================================================
//  GLSL: SURFACE chunk (stage-1 owner: lane D). The per-frame ground: the snow cover model (effectiveCover and
//  snowCover: the ONE place the cover level and the altitude snowline become a per-pixel snow fraction), the
//  seasons of the season-neutral bake (grass, wildflowers, larch, spruce), thaw and wet snow, wet ground and
//  puddles, the wind-packed snow relief, and shadeSurface, the lit surface colour of a G-buffer hit that the shading
//  pass calls. Also surfaceDebug for the ?view= channels. Needs COMMON + ENV + ATMOS (cloudShadow) + GBUF. Included
//  by the shading pass only: the composite sparkle and the flake colour-over-snow read the snow fraction that
//  FS_SHADE writes to the scene alpha (snow x sun visibility), so they never recompute cover.
// =====================================================================================
(function (S) {
  'use strict';
  const C = S.glsl.chunks;
  // The snowline offset model, shared by the GLSL effectiveCover below and its JS twin S.snowlineOffset (used by
  // derive/surface.js for visCover / coverAt and through it by derive/atmos.js for the exposure): both are built from
  // these constants, so the CPU estimate of the visible snow cannot drift from what the shader draws. The JS twin
  // omits only the per-pixel aspect / noise shift of the altitude.
  //   offset(a) = K (1 - smooth(line - w, line + w, a)) + K2 (1 - smooth(line - LO, line - HI, a))
  const SL = { K: 0.9, K2: 1.3, LO: 1600, HI: 500 };
  const f = v => (Number.isInteger(v) ? v.toFixed(1) : String(v));
  S.snowlineOffset = (a, line, w) => SL.K * (1 - S.smooth(line - w, line + w, a)) + SL.K2 * (1 - S.smooth(line - SL.LO, line - SL.HI, a));
  S.SNOWLINE = SL;            // Phase 3: the house's cover model (glsl/house/surface-house.js, loaded after this file) uses the same constants
  C.SURFACE = `
uniform vec3 uGrassDisp;     // integrated (slow) wind displacement -> rolling grass waves, wrapped by its noise period on the CPU
uniform float uYearPhase;    // year phase 0..1 (0 = 1 March): the vegetation clock
uniform float uMelt;         // 0..1: 1 while no snow is falling (then thaw order and wet snow follow the local air temperature)

// ---- snow cover model
// The per-frame altitude snowline: below uSnowline.x (+- uSnowline.y) the cover level drops by SNOWLINE_K, so the lower
// slopes go bare while the high ground (the lowest snowT: summit flats, ledges, couloirs) keeps its snow; a further
// SNOWLINE_K2 0.5-1.6 km below the line clears even those. The altitude is shifted by the sun exposure (the line sits up
// to ~300 m higher on sunny slopes than on shaded ones) and a ~1.5 km undulation, so it follows the relief and the
// threshold patches instead of a contour. The neutral default (a snowline far below the scene) gives an offset of
// exactly 0: the Phase-1 cover. snowT itself stays the baked, season-neutral order.
const float SNOWLINE_K = ${f(SL.K)}, SNOWLINE_K2 = ${f(SL.K2)};   // = SL in JS (S.snowlineOffset)
const float LAPSE = 0.0065;  // deg C per m; uTemp is the meadow's (at ~0 m)
float effectiveCover(float alt, float sunExp, vec2 xz) {
  float a = alt - 320.0 * (sunExp - 0.45) + 260.0 * (tnoise(xz * 0.0006 + 3.7) - 0.5);
  return uCover - SNOWLINE_K * (1.0 - smoothstep(uSnowline.x - uSnowline.y, uSnowline.x + uSnowline.y, a))
                - SNOWLINE_K2 * (1.0 - smoothstep(uSnowline.x - ${f(SL.LO)}, uSnowline.x - ${f(SL.HI)}, a));
}
// snow fraction of a pixel with threshold snowT at distance t for the effective cover cEff. The ramp is tight
// (+-0.025) on the resolved meadow so margins break at the tuft scale of the threshold field, wide (+-0.07) only
// where the far canopy / summit thresholds are unresolved means
float snowCover(float snowT, float cEff, float t) {
  float cw = mix(0.025, 0.07, smoothstep(1200.0, 2600.0, t));
  return smoothstep(snowT - cw, snowT + cw, cEff);
}

// wind-packed snow surface: dunes elongated along the prevailing (+x) wind, big drifts on the far slopes
// and sastrugi ripples near the camera. Its xz gradient tilts the shading normal so full cover shows form
// instead of a flat white fill; each scale fades out before it would alias
float driftH(vec2 p, float t) {
  // dune axis ~30 deg off the sun azimuth (which is also the wind line), so the flanks catch the low sun
  vec2 d = vec2(p.x * 0.866 - p.y * 0.5, p.x * 0.5 + p.y * 0.866);
  vec2 q = vec2(d.x * 0.06, d.y * 0.15);                                                        // dunes ~17 x 7 m
  float h = (tnoise(q + 3.0) + 0.5 * tnoise(q * 2.2 + 9.0)) * 6.0 * smoothstep(7000.0, 400.0, t);
  h += tnoise(vec2(p.x * 0.012, p.y * 0.02) + 1.0) * 16.0 * smoothstep(16000.0, 1500.0, t);       // drifts ~80 x 50 m
  h += tnoise(vec2(d.x * 0.45, d.y * 1.2) + 5.0) * 0.45 * smoothstep(1400.0, 120.0, t);          // sastrugi ~2 m
  return h;
}

// ---- seasons. pS / pA: the year phase as the vegetation at this altitude lives it, for the spring and the autumn
// events (spring arrives later and autumn earlier with height). Every recolour keeps the bake's texture (mottle, tufts,
// crowns, shading): the larch is a ratio to its baked summer reference, the grass keeps the baked luminance.
// Grass through the year, from the baked summer pasture b (G1) and its moisture m (G3.a: 0 dry rib .. 1 lush hollow).
// The baked luminance relative to the mean pasture (0.097) carries the texture; the season sets the colour of a mean
// pixel: dormant straw / grey-brown -> spring flush (light fresh green; moist ground first, where the snow lay longest,
// i.e. low snowT, later) -> high-summer deep green -> late summer: the baked (Phase-1) pasture, olive with pale ribs, the dry
// ribs turning gold -> autumn tawny / amber / ochre (olive-russet in the hollows, ~250 m drifts of hue) -> dormant
// again. hv: the hue-drift noise 0..1
vec3 grassSeason(vec3 b, float m, float pS, float pA, float hv) {
  float L = dot(b, vec3(0.3, 0.6, 0.1)) / 0.097;
  float dry = 1.0 - m;
  vec3 dorm = mix(vec3(0.074, 0.062, 0.042), vec3(0.13, 0.102, 0.06), dry);
  // the natural alpine palette (stage 2b, after the reference photo): yellow-olive, never lime. Spring is a light,
  // fresh yellow-green (moist ground a touch greener); summer is deeper: lush, darker olive-green hollows against
  // sun-bleached yellow-olive ribs; hv drifts the hue over ~250 m (greener / yellower swathes)
  vec3 spM = vec3(0.086, 0.11, 0.032), spD = vec3(0.124, 0.134, 0.042);
  vec3 suM = vec3(0.047, 0.071, 0.018), suD = vec3(0.134, 0.128, 0.027);
  vec3 drift = mix(vec3(0.95, 1.0, 1.05), vec3(1.07, 1.0, 0.9), hv);
  // the flush is quick at each spot (moist ground first): patches of new green among last year's straw, not a muddy blend
  vec3 c = mix(dorm, mix(spM, spD, dry) * drift, smoothstep(0.07, 0.15, pS + 0.06 * (m - 0.5)));
  c = mix(c, mix(suM, suD, smoothstep(0.1, 0.9, dry)) * drift, smoothstep(0.23, 0.35, pS));
  c = mix(c, b / max(L, 0.05), smoothstep(0.38, 0.47, pA));
  c = mix(c, vec3(0.17, 0.128, 0.042), smoothstep(0.4, 0.52, pA) * smoothstep(0.25, 0.75, dry));
  vec3 tawny = mix(vec3(0.16, 0.1, 0.034), vec3(0.17, 0.084, 0.032), hv);     // ochre-tawny .. rust-amber drifts
  c = mix(c, mix(vec3(0.075, 0.072, 0.032), tawny, smoothstep(0.2, 0.7, dry)), smoothstep(0.48, 0.6, pA));
  c = mix(c, dorm, smoothstep(0.64, 0.8, pA));
  return c * L;
}
// larch through the year (absolute albedo; LARCH_REF is the baked summer crown, = gbuf-materials): bare grey-brown
// twigs -> bright lime flush -> soft summer green -> autumn gold deepening to orange -> needles drop
const vec3 LARCH_REF = vec3(0.075, 0.10, 0.034);
vec3 larchSeason(float pS, float pA) {
  vec3 bare = vec3(0.09, 0.08, 0.062);
  vec3 c = mix(bare, vec3(0.13, 0.2, 0.033), smoothstep(0.07, 0.16, pS));
  c = mix(c, LARCH_REF, smoothstep(0.17, 0.3, pS));
  c = mix(c, vec3(0.36, 0.17, 0.018), smoothstep(0.52, 0.6, pA));
  c = mix(c, vec3(0.34, 0.11, 0.014), 0.6 * smoothstep(0.61, 0.69, pA));
  return mix(c, bare, smoothstep(0.69, 0.77, pA));
}
float larchLeaf(float pS, float pA) { return smoothstep(0.07, 0.16, pS) * (1.0 - smoothstep(0.69, 0.77, pA)); }
// two independent value noises from one fetch of uNoise (G = A(x, y), R = A(x + 37, y + 17); COMMON's tnoise reads G)
vec2 tnoise2(vec2 x) { vec2 p = floor(x), f = fract(x); f = f * f * (3.0 - 2.0 * f); return textureLod(uNoise, (p + f + 0.5) / 256.0, 0.0).gr; }
// wildflowers on the grass: crocus at the fresh melt margin in early spring, then the meadow bloom of late spring /
// early summer (buttercup yellow, daisy / umbellifer white, salvia purple, bellflower / gentian blue) in drifts.
// Every noise is >= 3 m (the half-float position error is <= 0.25 m on the meadow), and beyond ~1.2 km the 3 m tufts
// average into a colour wash: a tint of the pasture, never confetti
vec3 flowers(vec3 alb, vec2 q, float t, float pS, float m, float flat_, float margin) {
  float crocus = smoothstep(0.0, 0.05, pS) * (1.0 - smoothstep(0.12, 0.19, pS)) * (0.25 + 0.75 * margin);
  float bloom = smoothstep(0.12, 0.2, pS) * (1.0 - smoothstep(0.33, 0.43, pS));
  float b = max(crocus, bloom), bf = b * flat_;
  if (bf < 0.004) return alb;
  vec2 dr = tnoise2(q * 0.017 + 3.0);                                                    // ~60 m drifts: x species, y density
  float sp = dr.x, patchN = tnoise(q * 0.06 + 13.0) * 0.6 + dr.y * 0.4;                  // ~17 m tufts in the drifts
  float speck = t < 1500.0 ? mix(0.5, tnoise(q * 0.33 + 7.0), smoothstep(1500.0, 900.0, t)) : 0.5;   // 3 m clumps (mean far away)
  float vio = smoothstep(0.56, 0.64, sp), wht = smoothstep(0.38, 0.5, sp) * (1.0 - vio);
  vec3 fc = mix(vec3(0.6, 0.44, 0.03), vec3(0.5, 0.48, 0.4), wht);
  fc = mix(fc, mix(vec3(0.24, 0.06, 0.36), vec3(0.13, 0.08, 0.42), smoothstep(0.68, 0.8, sp)), vio);   // salvia .. bellflower
  float cw = crocus / b;
  fc = mix(fc, mix(vec3(0.36, 0.22, 0.56), vec3(0.55, 0.52, 0.56), smoothstep(0.4, 0.6, sp)), cw);   // violet / white crocus
  // a soft stipple, not paint: the clumps modulate the drift's cover instead of cutting it out (violets: looser)
  float f = bf * smoothstep(0.38, 0.8, patchN) * mix(0.25, 1.0, smoothstep(mix(0.2, 0.4, vio), mix(0.8, 0.9, vio), speck)) * (0.55 + 0.45 * m);
  return mix(alb, fc, 0.3 * f * mix(1.0 - 0.3 * wht, 1.0, cw));
}

// The lit surface of a G-buffer hit (before aerial perspective): seasons, snow coverage, cloud shadows, grass sheen and
// the matted turf at the melt margin, wet ground, snow relief, sun / sky / bounce lighting, the snow's shade glow and
// sheen, and the wet gloss / puddles. uv is the (sway-remapped) G-buffer coordinate, g0 its G0, rd the view ray, t the
// hit distance. snowMask: the snow fraction x the sun visibility (baked shadow x cloud shadow), 0 on wet / thawing
// snow; written to the scene alpha for the composite sparkle and the flake tint
vec3 shadeSurface(vec2 uv, vec4 g0, vec3 rd, float t, out float snowMask) {
  vec4 g1 = G1(uv), g2 = G2(uv);
  vec4 g3 = floor(G3(uv) * 255.0 + 0.5) / 255.0;    // the 8-bit values, so the RGBA16F fallback shades identically
  vec3 pos = uCamPos + rd * t;
  vec3 nD = octDec(g2.xy), nS = octDec(g2.zw);
  float mat = floor(g0.y + 0.001);
  float grass = mat == 1.0 ? fract(g0.y + 0.001) / 0.9 : 0.0;
  vec3 alb = g1.rgb;
  float snowT = g1.w;
  float ao = g0.w;
  float cs = cloudShadow(pos);
  float sh = g0.z * cs;
  // the vegetation clock here: ~0.1 yr (5 weeks) per km of height above the meadow
  float dly = 1e-4 * pos.y, pS = uYearPhase - dly, pA = uYearPhase + dly;
  float leaf = 1.0;                                // larch foliage (0 = bare twigs)
  if (mat == 2.0) {
    if (g3.b > 0.5) {
      alb *= larchSeason(pS, pA) / LARCH_REF;
      leaf = larchLeaf(pS, pA);
      snowT += 0.12 * (1.0 - leaf);                // bare twigs hold less snow
    } else alb *= 1.0 - 0.15 * uSeasonW.w;         // spruce / fir: a shade darker in winter
  } else if (mat == 1.0) {
    float hv = tnoise(pos.xz * 0.004 + 1.3);
    alb = mix(alb, grassSeason(alb, g3.a, pS - 0.1 * (0.55 - clamp(snowT, -0.5, 1.2)), pA, hv), grass);
    if (g3.b > 0.004) alb *= 1.0 + g3.b * (larchSeason(pS, pA) / LARCH_REF - 1.0);   // the larch share of the far canopy
  }
  // snow: the sun exposure lifts the snowline on sunny slopes (trees: their crown aspect only weakly); while it thaws
  // (no snowfall, air above 0 deg C at this altitude) sunny patches melt out first and shaded ones linger, and the
  // dark roofs and the trees shed theirs early. The exposure is the slope's aspect with the cast shadow only in part: the sun
  // moves over the day, so a tree's crisp afternoon shadow must not print a snow strip of its own shape
  float sunExp = max(dot(nS, uSunDir), 0.0) * (0.8 + 0.2 * g0.z);
  float cEff = effectiveCover(pos.y, mat == 2.0 ? mix(0.45, sunExp, 0.3) : sunExp, pos.xz);
  float thaw = uMelt * smoothstep(0.0, 3.0, uTemp - LAPSE * pos.y);
  snowT += thaw * (mat == 4.0 ? 0.35 : mat == 2.0 ? 0.4 : 0.22 * (sunExp - 0.45));
  float snow = snowCover(snowT, cEff, t);
  float wetSnow = max(thaw, uWet);
  // wind waves rolling over the grass (brightness sheen travelling with the wind); short dormant turf barely moves
  vec2 gq = (pos.xz - uGrassDisp.xz * 1.0) * 0.045;
  float wave = tnoise(gq) * 0.65 + tnoise(gq * 2.7 + 5.0) * 0.35;
  float tall = mix(0.4, 1.0, smoothstep(0.1, 0.25, pS) * (1.0 - smoothstep(0.66, 0.8, pA)));
  alb *= 1.0 + grass * (1.0 - snow) * (wave - 0.5) * (0.22 + 0.25 * uGale) * tall * smoothstep(3000.0, 300.0, t);   // stronger in a gale
  // the melt margin: as the snow edge closes in on a patch (or has just left it) the turf is matted, flattened
  // straw-olive; further out the season's colour (green-up) takes over. Crocus bloom right along it
  // (stage 2b: a narrower margin, so the first snowfall on a tawny meadow leaves the meadow tawny between the patches
  // instead of greying all of it long before the snow arrives)
  float kill = smoothstep(snowT - 0.3, snowT, cEff);
  alb = mix(alb, vec3(dot(alb, vec3(0.3, 0.5, 0.2))) * vec3(1.08, 0.97, 0.72) * 0.8, grass * 0.7 * kill);
  if (mat == 1.0) alb = flowers(alb, pos.xz, t, pS, g3.a, grass * smoothstep(0.85, 0.97, nS.y), kill * (1.0 - snow));
  // wet ground darkens by porosity: path / bare soil most, rock, then turf; trees and walls a little, roofs more
  float por = mat == 1.0 ? min(0.62 * g3.g + 0.3 * g3.r + 0.18 * grass, 0.62) : mat == 4.0 ? 0.4 : 0.1;
  alb *= 1.0 - uWet * por;
  // wet turf is deeper and richer (water fills the gaps between the blades: less grey scatter)
  alb = mix(vec3(dot(alb, vec3(0.3, 0.6, 0.1))), alb, 1.0 + 0.4 * uWet * grass);
  vec3 n = normalize(mix(nD, nS, snow * 0.3));
  if (mat == 1.0 && snow > 0.001) {
    float e = max(0.4, t * 0.0015);
    float h0 = driftH(pos.xz, t);
    vec2 gr = vec2(driftH(pos.xz + vec2(e, 0.0), t) - h0, driftH(pos.xz + vec2(0.0, e), t) - h0) / e;
    n = normalize(n + vec3(-gr.x, 0.0, -gr.y) * snow);
  }
  // snow albedo: wet / thawing snow is greyer (melt water fills the pores) and smoother, its thinning rim slushy grey
  float slush = thaw * smoothstep(0.22, 0.0, cEff - snowT);
  vec3 snowAlb = vec3(0.84, 0.88, 0.94) * (mat == 2.0 ? 0.9 : 1.0) * mix(vec3(1.0), vec3(0.8, 0.82, 0.83), wetSnow) * (1.0 - 0.22 * slush);
  vec2 rq = pos.xz * vec2(0.09, 0.3);
  snowAlb *= 0.93 + 0.07 * tnoise(rq + vec2(rq.y * 0.4, 0.0)) * smoothstep(1500.0, 200.0, t) * (1.0 - 0.6 * wetSnow);  // wind-packed ripples
  vec3 a = mix(alb, snowAlb, snow);
  float ndl = dot(n, uSunDir);
  float wrap = 0.18 * snow;
  float diff = clamp((ndl + wrap) / (1.0 + wrap), 0.0, 1.0);
  vec3 skyL = uSkyAmb * (0.62 + 0.38 * n.y);
  vec3 bounce = vec3(0.2, 0.22, 0.12) * dot(uSunCol, vec3(0.1)) * (0.5 - 0.5 * n.y) * mix(1.0, 3.0, sat(cEff));
  // needle canopy translucency; thin golden / lime larch needles glow on their shaded side
  if (mat == 2.0) diff = diff * 0.75 + (0.1 + 0.4 * g3.b * leaf * (1.0 - snow)) * clamp(-ndl, 0.0, 1.0);
  vec3 col = a * (uSunCol * diff * sh + (skyL + bounce) * ao);
  // snow: blue-tinted subsurface glow in shade, soft sheen (the sparkles are added in the composite, after FXAA)
  col += snow * a * uSkyAmb * vec3(0.12, 0.26, 0.58) * (1.0 - sh) * ao * (1.0 - 0.5 * wetSnow);   // blue sky-lit shade (dry snow)
  vec3 hv = normalize(uSunDir - rd);
  float nh = max(dot(n, hv), 0.0);
  col += snow * uSunCol * sh * (0.05 * pow(nh, 18.0) + 0.04 * pow(1.0 - max(dot(n, -rd), 0.0), 5.0) + 0.12 * wetSnow * pow(nh, 60.0));
  // wet gloss: a water film on the path, rock and roofs reflects the sky (Fresnel, a cheap sky gradient; rays that
  // leave low see the dark slopes instead). Puddles collect in the flat stretches of the path: flat mirrors that
  // spread as the ground gets wetter, and dry back as uWet falls
  // (from wetness .03, faded in to .08: a barely damp meadow pays nothing for the gloss)
  if (uWet > 0.03) {
    float gloss = mat == 1.0 ? 0.95 * g3.g + 0.5 * g3.r + 0.05 * grass : mat == 4.0 ? 0.6 : 0.04;
    float pud = 0.0;
    if (g3.g > 0.02) {
      // ~2.2 m pools in ~7 m ruts, gathered on ~20 m wet stretches of the track
      vec2 pq = pos.xz;
      float pn = tnoise(pq * 0.45 + 2.0) * 0.45 + tnoise(pq * 0.15 + 9.0) * 0.3 + tnoise(pq * 0.05 + 4.0) * 0.25;
      pud = g3.g * smoothstep(0.955, 0.985, nS.y) * smoothstep(0.0, 0.06, pn - 1.0 + 0.5 * uWet);
    }
    vec3 nw = normalize(mix(nD, nS, 0.5 + 0.5 * pud));
    vec3 r = reflect(rd, nw);
    float F = 0.02 + 0.98 * pow(1.0 - max(dot(nw, -rd), 0.0), 5.0);
    // (the sky seen in the water: the luminous deck is brighter than its zenith colour suggests, so the wet path,
    // the rocks, the roofs and the puddles glisten)
    vec3 skyR = mix(uSkyHor, uSkyZen, sqrt(sat(r.y))) * mix(0.35, 1.35, smoothstep(0.0, 0.25, r.y));
    // (a puddle is a mirror of the bright deck even at this grazing view: at least ~35% of the sky, so it reads light
    // against the dark wet ground)
    float k = uWet * smoothstep(0.03, 0.08, uWet) * (1.0 - snow) * max(gloss * F, pud * (0.35 + 0.65 * F));
    col = mix(col * (1.0 - 0.5 * pud * uWet), skyR, k);       // a puddle hides the mud under dark water
  }
  // sun visibility for the sparkle: the baked sun shadow and the drifting cloud shadows; wet snow does not glint
  snowMask = snow * g0.z * smoothstep(0.5, 0.95, cs) * (1.0 - wetSnow);
  return col;
}

// ?view= debug channels (uView, S.VIEWS): display-ready colour (the composite passes it through ungraded). Scalars
// are grey; snowT and cEff show 0..1 as grey, below 0 red (snowy at no cover), above 1 blue (bare at full cover)
vec3 dbgSigned(float v) { return v < 0.0 ? vec3(1.0, 0.25, 0.2) * min(-v, 1.0) + vec3(0.15) : v > 1.0 ? vec3(0.2, 0.35, 1.0) * min(v - 1.0, 1.0) + vec3(0.3) : vec3(v); }
vec3 surfaceDebug(int view, vec2 uv, vec4 g0, vec3 rd, float t) {
  vec4 g1 = G1(uv), g3 = G3(uv);
  if (view == 1) return pow(clamp(g1.rgb, 0.0, 1.0), vec3(1.0 / 2.2));
  if (view == 2) return dbgSigned(g1.w);
  if (view == 3) return vec3(g3.r);
  if (view == 4) return vec3(g3.g);
  if (view == 5) return vec3(g3.b);
  if (view == 6) return vec3(g3.a);
  vec3 pos = uCamPos + rd * t;
  if (view == 7) return dbgSigned(effectiveCover(pos.y, max(dot(octDec(G2(uv).zw), uSunDir), 0.0) * (0.8 + 0.2 * g0.z), pos.xz));
  return vec3(sat(uWet)) * (0.4 + 0.6 * min(0.75 * g3.g + 0.4 * g3.r, 1.0));   // wetness x gloss potential
}
`;
})(window.SNOW);

<script>/* js/glsl/house/house-sdf.js */
// =====================================================================================
//  GLSL: the house scene's geometry (Phase-3 owner: lane H), for its G-buffer bake (gbuf-house.js).
//   HOUSE_IDS    the house's material ids, the house-space mirror hsp() and the light positions (shared by the bake and
//                SURFACE_HOUSE; the table is ARCHITECTURE.md §14 and the comment below)
//   HOUSE_SDF    primitives, the lot (ground heightfield, curbs), the house, the neighbours / fence / street lamp, the
//                cozy props, the vegetation (fruit trees, shrubs, palms, cypresses, broadleaf trees; the bare winter
//                skeletons of the variant bake), the far backdrop cards. Queried only through sceneQ (HOUSE_MAIN).
//  A 3D interpretation of the style of the user's California ranch house (never the photo; no car, no street-sign
//  text, no house number), ported from the feasibility spike (work/phase3/spike/house-glsl.js) and improved: open,
//  irregular broadleaf crowns, a shaggy palm skirt with hanging dead fronds, frond tips that never get thinner than a
//  pixel, door planters, a bench and wheelie bins. Step 2 (the look) added a bed of flowering perennials along the
//  foundation (I_FLOWER: low clumps in the gravel strip between the shrubs; material 4 with G3.r >= .75, see HOUSE_IDS).
//
//  HOUSE SPACE (metres, y up): the street runs along x, the house faces +z, its front wall at z = 0, the camera stands
//  on the street (z ~ 22.5) looking toward -z with +x on the right. The engine's yaw-0 camera looks toward +z with +x on
//  the right, so WORLD = house space mirrored in z: hsp(p) maps either way (an involution). The bake marches in house
//  space and flips its normals back (houseMaterials); the shading works in world space and uses hsp() for the lights.
//  Main body x -2.5 .. 11, z -9 .. 0 (side gable, ridge 4.84 m along x), garage wing x -9.4 .. -2.5 protruding to z 2.4
//  (front gable, ridge along z), eaves 2.72 m; lawn to z 11, sidewalk 11 .. 12.5, parkway, curb 14.275, street to 25.65.
//
//  Rules: one query (sceneQ, HOUSE_MAIN); a group far from p returns its TRUE 3D bound only when that bound exceeds
//  gMargin (0.35 while marching, max(0.35, 0.12 ts) along a shadow ray, the probe length for AO taps): a bound is only
//  a lower bound of the distance, and the soft shadow reads d / ts as a penumbra (slab / 1D bounds printed contour
//  bands on the walls in the spike). gFp is the pixel footprint (m) of the current query: thin parts (frond blades,
//  their finger gaps, twigs) are widened to it, so they cover whole pixels instead of stippling.
// =====================================================================================
(function (S) {
  'use strict';
  const C = S.glsl.chunks;
  // Material ids (G0.y = id + 0.9 x the sway weight; vegetation 2..5 only). G3 (RGBA8): r variation, g water / leaf,
  // b object random / light mask, a = 0.5 x shelter + 0.5 x twig haze (bare variant). Full table: ARCHITECTURE.md §14.
  //   1 lawn, 2 fruit tree, 3 palm, 4 evergreen (cypress, live oak, shrubs, planter balls, the backdrop canopy; G3.r:
  //   < .45 plain, .45 .. .7 a lavender-flowering shrub, >= .75 a flowering perennial of the foundation bed, its colour by G3.b),
  //   5 deciduous tree, 6 roof shingles, 7 cedar siding, 8 painted trim / stucco, 9 window glass (G1 = the lit room as
  //   an emission colour), 10 garage door (b: its arched panes, G1 = their emission), 11 concrete, 12 asphalt,
  //   13 brick / terracotta, 14 gravel, 15 wood (fence, bench), 16 lamp (b: lantern glass), 17 soil / mulch / doormat,
  //   18 fixtures (roof vents, flue, wheelie bins: painted metal and plastic)
  C.HOUSE_IDS = `
const float M_LAWN = 1.0, M_FRUIT = 2.0, M_PALM = 3.0, M_CYPRESS = 4.0, M_TREE = 5.0, M_ROOF = 6.0, M_SIDING = 7.0,
            M_TRIM = 8.0, M_GLASS = 9.0, M_GARAGE = 10.0, M_CONCRETE = 11.0, M_ASPHALT = 12.0, M_BRICK = 13.0,
            M_GRAVEL = 14.0, M_FENCE = 15.0, M_LAMP = 16.0, M_SOIL = 17.0, M_METAL = 18.0;
// house space <-> world (the mirror in z; see the file header)
vec3 hsp(vec3 p) { return vec3(p.x, p.y, -p.z); }
// lights (house space): the porch lantern, the street lamp's lantern, the two front windows' spill
const vec3 L_PORCH = vec3(-0.78, 1.86, 0.10);
const vec3 L_POST = vec3(6.8, 3.86, 13.4);
const vec3 L_WIN0 = vec3(2.7, 1.45, 0.45), L_WIN1 = vec3(7.7, 1.45, 0.45);
`;
  C.HOUSE_SDF = `
// ---------------------------------------------------------------- SDF primitives
float sdBox(vec3 p, vec3 b) { vec3 q = abs(p) - b; return length(max(q, 0.0)) + min(max(q.x, max(q.y, q.z)), 0.0); }
float sdBox2(vec2 p, vec2 b) { vec2 q = abs(p) - b; return length(max(q, 0.0)) + min(max(q.x, q.y), 0.0); }
float sdSeg(vec3 p, vec3 a, vec3 b, float r) { vec3 pa = p - a, ba = b - a; float h = clamp(dot(pa, ba) / dot(ba, ba), 0.0, 1.0); return length(pa - ba * h) - r; }
float sdSegT(vec3 p, vec3 a, vec3 b, float r0, float r1) { vec3 pa = p - a, ba = b - a; float h = clamp(dot(pa, ba) / dot(ba, ba), 0.0, 1.0); return length(pa - ba * h) - mix(r0, r1, h); }
float rectSDF(vec2 p, vec4 r) { return sdBox2(p - 0.5 * vec2(r.x + r.y, r.z + r.w), 0.5 * vec2(r.y - r.x, r.w - r.z)); }
float smin(float a, float b, float k) { float h = max(k - abs(a - b), 0.0) / k; return min(a, b) - h * h * k * 0.25; }
// leafy clump noise: two octaves of 3D value noise, ~[-1, 1]
float leafN(vec3 p) { return 0.65 * vn3(p) + 0.35 * vn3(p * 2.3 + 7.1); }
// (stage 2b) leaf clumps: a broadleaf crown is its leaf masses (the envelope, d) rebuilt as clumps of leaves: rounded
// clumps (spheres jittered on a cs-metre lattice, radius .38-.5 cs; the 2 x 2 x 2 nearest cells are exact for these
// jitters and radii) filling a shell ~half a clump deep under the envelope, cut a little outside it, plus a fine leaf texture
// that fades below ~3 px (fp). Each clump catches the low sun on its own top and falls into shade underneath, and the
// silhouette breaks into clumps against the sky, instead of one smooth, wormy 'broccoli' skin
float leafClumps(float d, vec3 p, float cs, float fp) {
  if (d > 0.75 * cs) return d;
  float w = vn3(p * (0.56 / cs) + 4.1);
  vec3 q = p / cs + vec3(0.45, -0.3, 0.38) * w, b = floor(q - 0.5);      // (a warp: no lattice rows)
  float dc = 1e5;
  for (int k = 0; k < 8; k++) {
    vec3 c = b + vec3(float(k & 1), float((k >> 1) & 1), float(k >> 2));
    vec3 cc = c + 0.25 + 0.5 * vec3(hash3(c), hash3(c + 17.0), hash3(c + 31.0));
    dc = smin(dc, length(q - cc) - (0.3 + 0.2 * hash3(c + 53.0)), 0.22);
  }
  float f1 = smoothstep(1.5 * fp, 3.0 * fp, 0.18 * cs), f2 = smoothstep(1.5 * fp, 3.0 * fp, 0.08 * cs);
  dc = dc * cs + 0.075 * cs * f1 * vn3(p * (5.6 / cs) + 2.3) + 0.04 * cs * f2 * vn3(p * (12.0 / cs) + 8.1);
  return max(d - 0.15 * cs, min(dc, d + 0.5 * cs));
}

// ---------------------------------------------------------------- query state (out-of-band, set by main / the query)
float gRad = 1.0;       // crown radial position of the last foliage hit (0 core .. 1 rim): the materials darken the interior
float gMargin = 0.35;   // bounding-volume early-out margin (see the header)
float gFp = 0.01;       // pixel footprint (m) of the current query (see the header)
bool bareV() { return uVariant > 0.5; }
// the sway weight scale: FS_SHADE's reference sways an 18 m tree top ~2-3 m in a gale (fine for the valley's far
// forest); from 25-45 m away that tears thin trunks off their crowns, so the house's plants sway ~0.3 of it
const float SWAYK = 0.3;    // the bare winter variant bake (deciduous / fruit crowns -> skeletons + haze)

// ---------------------------------------------------------------- layout (house space, metres)
const float Z_SW0 = 11.0, Z_SW1 = 12.5, Z_CURB = 14.275, Z_GUT = 14.8;
const float DRV0 = -9.8, DRV1 = -2.6;                  // driveway x range (in front of the garage)
const float PITCH = 0.42, PCOS = 0.92164, PSIN = 0.38709, YE = 2.72, RT = 0.2;   // 5:12 roof, eave top, slab
const vec4 MB = vec4(-2.5, 11.0, -9.0, 0.0);            // main body walls x0 x1 z0 z1
const vec4 MR = vec4(-2.85, 11.35, -9.55, 0.55);        // main roof (side gable, ridge along x at z = -4.5)
const vec4 GB = vec4(-9.4, -2.5, -7.0, 2.4);            // garage wing walls (protrudes 2.4 m)
const vec4 GR = vec4(-9.85, -2.05, -7.2, 2.85);         // garage roof (front gable, ridge along z at x = -5.95)
const vec2 WIN0 = vec2(2.7, 1.62), WIN1 = vec2(7.7, 1.62), WINH = vec2(0.8, 0.675);
const vec3 DOOR = vec3(-1.52, 1.03, 0.0); const vec2 DOORH = vec2(0.47, 1.03);
const vec3 GDOOR = vec3(-5.95, 1.08, 2.4); const vec2 GDOORH = vec2(2.45, 1.08);

// detailed ids returned by the query (houseMaterials maps them to the M_* table)
const float I_GROUND = 10.0, I_CURB = 11.0, I_WALL = 20.0, I_TRIM = 21.0, I_ROOF = 22.0, I_GLASS = 23.0, I_DOOR = 24.0,
            I_GDOOR = 25.0, I_VENT = 27.0, I_LANTERN = 28.0, I_FRUIT = 30.0, I_TWIG = 31.0, I_PTRUNK = 32.0,
            I_FROND = 33.0, I_SKIRT = 34.0, I_CYP = 35.0, I_DECI = 36.0, I_DTRUNK = 37.0, I_SHRUB = 38.0, I_OAK = 39.0,
            I_FENCE = 40.0, I_NWALL = 41.0, I_NROOF = 42.0, I_NWALL2 = 43.0, I_POST = 44.0, I_LAMPG = 45.0,
            I_POT = 46.0, I_BENCH = 47.0, I_BIN = 48.0, I_BALL = 49.0,
            I_CARD = 50.0, I_CARDROOF = 51.0, I_CARDPALM = 52.0, I_FLOWER = 53.0;

float lawnEdge(float z) { return -0.45 - 2.15 * smoothstep(1.2, 6.8, z); }   // front lawn is x > lawnEdge(z)
float inDrive(float x) { return smoothstep(DRV0 - 0.15, DRV0 + 0.15, x) * smoothstep(DRV1 + 0.15, DRV1 - 0.15, x); }
float frontLawn(float x, float z) {
  return smoothstep(0.06, 0.2, x - lawnEdge(z)) * smoothstep(0.78, 0.92, z) * smoothstep(11.0, 10.85, z) * smoothstep(23.0, 22.8, x);
}

// ---------------------------------------------------------------- ground: a gentle heightfield (slope <= ~0.1 outside
// short ramps); every vertical face (street curb, the curved mow curb, the stoop) is an SDF object, so the march can
// step the ground along the ray (main): a grazing ray over the yard costs ~10 steps instead of ~100
float groundH(vec2 q) {
  float x = q.x, z = q.y;
  if (z > 14.3) return -0.15 + 0.07 * (1.0 - sq(clamp((z - 20.2) / 5.5, -1.0, 1.0)));   // crowned street
  float y = -0.12 * inDrive(x) * smoothstep(12.6, 14.25, z);                           // driveway apron
  float lawn = frontLawn(x, z);
  y += lawn * (0.05 + 0.1 * smoothstep(10.9, 4.0, z) * smoothstep(-1.0, 3.0, x) * smoothstep(21.0, 14.0, x));
  y += 0.04 * smoothstep(0.85, 0.7, z) * step(-0.45, x) * step(x, 11.0) * step(-0.1, z); // gravel strip
  return y;
}

float curbsSDF(vec3 p) {
  float top = -0.115 * inDrive(p.x);
  float d = sdBox2(vec2(p.z - Z_CURB, p.y - (top - 0.16)), vec2(0.062, 0.145)) - 0.014;
  // the curved mow curb between the lawn and the walkway / driveway
  float cb = sdBox(p - vec3(-1.55, 0.04, 5.89), vec3(1.4, 0.1, 5.12));
  if (cb > gMargin) d = min(d, cb);
  else {
    float e = lawnEdge(p.z), de = (lawnEdge(p.z + 0.05) - lawnEdge(p.z - 0.05)) * 10.0;
    float dx = (p.x - e) / sqrt(1.0 + de * de);
    float c = sdBox2(vec2(dx, p.y - 0.035), vec2(0.065, 0.075)) - 0.01;
    d = min(d, max(c, max(0.78 - p.z, p.z - 11.0)));
  }
  // the front stoop (concrete step at the door)
  d = min(d, sdBox(p - vec3(-1.47, 0.055, 0.62), vec3(1.0, 0.055, 0.62)) - 0.01);
  return d;
}

// ---------------------------------------------------------------- the house
float gableX(vec2 xz, vec4 r) { return YE + PITCH * min(xz.y - r.z, r.w - xz.y); }   // ridge along x (main)
float gableZ(vec2 xz, vec4 r) { return YE + PITCH * min(xz.x - r.x, r.y - xz.x); }   // ridge along z (garage)
// a roof is a slab RT thick under the slope planes, clipped to its footprint: shingles on top, fascia / rake boards
// on its edges, soffit underneath; the walls rise to its underside, so the gable triangles form by themselves
float roofSlab(vec3 p, float h, vec4 r) { return max((abs(p.y - h + 0.5 * RT) - 0.5 * RT) * PCOS, rectSDF(p.xz, r)); }

float windowFill(vec3 p, vec2 c, out float id) {
  vec3 q = p - vec3(c, 0.0);
  float g = sdBox(q - vec3(0.0, 0.0, -0.105), vec3(WINH, 0.008));
  float fr = max(sdBox(q - vec3(0.0, 0.0, -0.075), vec3(WINH, 0.026)), -sdBox(q - vec3(0.0, 0.0, -0.075), vec3(WINH - 0.055, 0.1)));
  fr = min(fr, sdBox(q - vec3(0.0, 0.0, -0.068), vec3(0.03, WINH.y, 0.03)));             // slider meeting rail
  float mun = min(abs(abs(q.x) - 0.4), abs(abs(q.y) - 0.225)) - 0.011;                    // 3 x 2 lites per sash
  mun = max(max(mun, abs(q.z + 0.088) - 0.011), sdBox2(q.xy, WINH));
  float cas = max(sdBox(q, vec3(WINH + 0.09, 0.028)), -sdBox(q, vec3(WINH, 0.5)));
  float sill = sdBox(q - vec3(0.0, -WINH.y - 0.06, 0.05), vec3(WINH.x + 0.13, 0.035, 0.06));
  float tr = min(min(fr, mun), min(cas, sill));
  id = tr < g ? I_TRIM : I_GLASS;
  return min(tr, g);
}

float houseSDF(vec3 p, out float id) {
  id = I_WALL;
  float bb = sdBox(p - vec3(0.75, 2.6, -3.35), vec3(11.0, 2.75, 6.7));
  if (bb > gMargin) return bb;
  vec2 xz = p.xz;
  float hM = gableX(xz, MR), hG = gableZ(xz, GR);
  float d = min(roofSlab(p, hM, MR), roofSlab(p, hG, GR)); id = I_ROOF;
  float wM = max(sdBox(p - vec3(4.25, 2.5, -4.5), vec3(6.75, 2.5, 4.5)), p.y - hM + RT);
  float wG = max(sdBox(p - vec3(-5.95, 2.5, -2.3), vec3(3.45, 2.5, 4.7)), p.y - hG + RT);
  float w = min(wM, wG);
  float op = min(min(sdBox(p - vec3(WIN0, 0.0), vec3(WINH, 0.12)), sdBox(p - vec3(WIN1, 0.0), vec3(WINH, 0.12))),
                 min(sdBox(p - DOOR, vec3(DOORH, 0.09)), sdBox(p - GDOOR, vec3(GDOORH, 0.13))));
  w = max(w, -op);
  if (w < d) { d = w; id = I_WALL; }
  float tid, dd;
  // front details (windows, door, garage door, trims, lantern, gutters, downspouts) behind one cheap region test
  if (p.z > -0.3 && p.y < 3.0) {
    if (abs(p.x - 5.2) < 3.4 && p.y > 0.7) {
      dd = windowFill(p, WIN0, tid); if (dd < d) { d = dd; id = tid; }
      dd = windowFill(p, WIN1, tid); if (dd < d) { d = dd; id = tid; }
    }
    vec3 q = p - DOOR;
    dd = sdBox(q - vec3(0.0, 0.0, -0.065), vec3(DOORH, 0.022)); if (dd < d) { d = dd; id = I_DOOR; }
    dd = max(sdBox(q - vec3(0.0, 0.03, 0.0), vec3(DOORH + vec2(0.1, 0.03), 0.026)), -sdBox(q, vec3(DOORH, 0.5)));
    if (dd < d) { d = dd; id = I_TRIM; }
    q = p - GDOOR;
    dd = sdBox(q - vec3(0.0, 0.0, -0.1), vec3(GDOORH, 0.02)); if (dd < d) { d = dd; id = I_GDOOR; }
    dd = max(sdBox(q - vec3(0.0, 0.04, 0.0), vec3(GDOORH + vec2(0.12, 0.04), 0.03)), -sdBox(q, vec3(GDOORH, 0.5)));
    dd = min(dd, sdBox(p - vec3(-5.95, 2.56, 2.43), vec3(3.47, 0.06, 0.035)));                // band under the gable
    dd = min(dd, sdBox(vec3(abs(p.x + 5.95) - 3.42, p.y - 1.28, p.z - 2.41), vec3(0.06, 1.28, 0.04)));   // corner boards
    dd = min(dd, sdBox(p - vec3(4.25, 2.565, 0.63), vec3(7.1, 0.065, 0.075)));                // main front gutter
    dd = min(dd, sdBox(vec3(abs(p.x + 5.95) - 3.98, p.y - 2.565, p.z + 2.175), vec3(0.065, 0.065, 5.025)));  // garage gutters
    dd = min(dd, sdBox(vec3(abs(p.x + 5.95) - 3.52, p.y - 1.3, p.z - 2.47), vec3(0.04, 1.3, 0.04)));       // downspouts
    dd = min(dd, sdBox(p - vec3(10.93, 1.3, 0.07), vec3(0.04, 1.3, 0.04)));
    if (dd < d) { d = dd; id = I_TRIM; }
    dd = sdBox(p - L_PORCH, vec3(0.07, 0.13, 0.07)); if (dd < d) { d = dd; id = I_LANTERN; }
    dd = min(sdBox(p - L_PORCH - vec3(0.0, 0.15, 0.0), vec3(0.1, 0.022, 0.1)), sdBox(p - L_PORCH - vec3(0.0, 0.0, -0.06), vec3(0.03, 0.03, 0.06)));
    if (dd < d) { d = dd; id = I_POST; }
  }
  // roof vents (on the front slope) and a flue on the garage roof
  if (p.y > 3.0) {
    vec3 q = vec3(p.x - (p.x < 3.0 ? 0.8 : p.x < 6.6 ? 4.6 : 8.4), p.y - 4.27, p.z + 3.0);
    dd = sdBox(q, vec3(0.24, 0.11, 0.22)) - 0.01;
    q = p - vec3(-3.3, 3.55, -1.0);
    dd = min(dd, max(length(q.xz) - 0.075, abs(q.y) - 0.45));
    dd = min(dd, max(length(q.xz) - 0.14, abs(q.y - 0.5) - 0.06));
    if (dd < d) { d = dd; id = I_VENT; }
  }
  return d;
}

// ---------------------------------------------------------------- vegetation
// young fruit trees (x, z, crown radius, seed): one by the driveway, three in the bed along the facade, one in the lawn
const vec4 FT[5] = vec4[5](vec4(-3.2, 3.55, 0.52, 0.11), vec4(0.85, 1.3, 0.6, 0.37), vec4(5.2, 1.35, 0.64, 0.59), vec4(10.15, 1.4, 0.58, 0.83), vec4(13.2, 5.6, 0.72, 0.21));
// low shrubs along the foundation (x, z, radius, seed)
const vec4 SH[7] = vec4[7](vec4(1.85, 0.42, 0.36, 0.2), vec4(3.6, 0.45, 0.34, 0.5), vec4(6.75, 0.42, 0.37, 0.7), vec4(8.6, 0.45, 0.35, 0.9), vec4(-0.2, 0.42, 0.3, 0.4), vec4(11.6, 0.2, 0.5, 0.6), vec4(-12.7, 2.3, 0.85, 0.3));
vec3 fruitC(vec4 T) { return vec3(T.x + 0.1 * (T.w - 0.5), 1.62 + 0.25 * T.w, T.y); }
// A crown as leaf masses: n clumps on a flattened shell, each a flattened sphere, smooth-unioned over a core. open (0..1)
// breaks the regularity that reads as 'broccoli': the core shrinks so gaps open between the masses, clump sizes and
// positions scatter, some clumps are missing (see-through holes), the blend gets tighter. rad: 0 core .. 1 rim
float clumpCrown(vec3 q, float R, float seed, int n, float open, out float rad) {
  float d = length(q * vec3(1.0, 1.35, 1.0)) - (0.55 - 0.27 * open) * R;
  float fn = float(n);
  for (int k = 0; k < 20; k++) {
    if (k >= n) break;
    float fk = float(k) + 0.5;
    float h1 = fract(seed * 13.7 + fk * 0.618), h2 = fract(seed * 7.1 + fk * 0.382), h3 = fract(seed * 3.3 + fk * 0.7548);
    if (h3 < 0.2 * open) continue;                       // a missing mass: a gap / a hole through the crown
    float y = 1.0 - 1.6 * fk / fn + 0.25 * open * (h3 - 0.5);
    float r = sqrt(max(1.0 - y * y, 0.0));
    float ph = fk * 2.39996 + seed * 6.283 + 0.9 * open * (h1 - 0.5);
    vec3 c = vec3(r * cos(ph), y * 0.7, r * sin(ph)) * (R * (0.56 + (0.18 + 0.22 * open) * h2));
    float cr = R * (0.26 + (0.17 + 0.12 * open) * h1 - 0.06 * open);
    vec3 e = q - c; e.y *= 1.0 + 0.25 * open;           // leaf masses are wider than tall
    d = smin(d, length(e) / (1.0 + 0.25 * open) - cr, (0.1 - 0.045 * open) * R);
  }
  rad = sat(length(q * vec3(1.0, 1.25, 1.0)) / R);
  return d;
}
// bare winter skeleton: limbs from the fork, three branches on each, a pair of twigs on each branch (tapered segments,
// never thinner than ~0.4 px: gFp); the finest twigs are the per-pixel twig haze of the bare bake (G3.a), not geometry
float skeleton(vec3 p, vec3 c, float R, float seed, int nl) {
  vec3 f = c - vec3(0.0, 0.5 * R, 0.0);
  float d = 1e5, w = 0.4 * gFp;
  for (int k = 0; k < 6; k++) {
    if (k >= nl) break;
    float fk = float(k);
    float ph = fk * 2.39996 + seed * 6.283;
    float el = 0.5 + 0.45 * fract(seed * 3.7 + fk * 0.618);
    vec3 dir = vec3(cos(ph) * cos(el), sin(el), sin(ph) * cos(el));
    vec3 e = f + dir * 0.8 * R;
    if (sdSegT(p, f, e, 0.0, 0.0) > 0.55 * R) continue;
    d = min(d, sdSegT(p, f, e, max(0.036 * R, w), max(0.012 * R, w)));
    for (int m = 0; m < 3; m++) {
      float fm = float(m);
      vec3 s0 = mix(f, e, 0.4 + 0.25 * fm);
      float a2 = ph + (fm - 1.0) * 1.1;
      vec3 d2 = normalize(vec3(cos(a2), 1.0 + 0.4 * fm, sin(a2)));
      vec3 e2 = s0 + d2 * (0.5 - 0.08 * fm) * R;
      d = min(d, sdSegT(p, s0, e2, max(0.011 * R, w), max(0.004 * R, w)));
      vec3 m2 = mix(s0, e2, 0.6);
      d = min(d, sdSegT(p, m2, m2 + normalize(d2 + vec3(0.6 * cos(a2 + 1.5), 0.2, 0.6 * sin(a2 + 1.5))) * 0.22 * R, max(0.006 * R, w), max(0.003 * R, w)));
      d = min(d, sdSegT(p, m2, m2 + normalize(d2 + vec3(0.6 * cos(a2 - 1.5), 0.3, 0.6 * sin(a2 - 1.5))) * 0.2 * R, max(0.006 * R, w), max(0.003 * R, w)));
      d = min(d, sdSegT(p, e2, e2 + normalize(d2 + vec3(0.3 * cos(a2 + 0.4), 0.6, 0.3 * sin(a2 + 0.4))) * 0.16 * R, max(0.004 * R, w), max(0.0025 * R, w)));   // the leader twig
    }
  }
  return d;
}
// fruit trees + foundation shrubs. aux (every plant): its sway weight (height fraction x sqrt(plant height / 18 m),
// FS_SHADE's reference; the shrubs rigid) + 2 x its index (houseMaterials: the per-plant random)
float fruitSDF(vec3 p, out float id, out float aux) {
  float best = 1e5; id = I_FRUIT; aux = 0.0;
  for (int i = 0; i < 5; i++) {
    vec4 T = FT[i];
    float r = T.z;
    float bnd = max(length(p.xz - T.xy) - r - 0.4, p.y - 2.75);
    if (bnd > gMargin) { best = min(best, bnd); continue; }
    vec3 c = fruitC(T);
    vec3 q = p - c;
    float rad;
    float dc = 1e5;
    if (!bareV()) {
      dc = clumpCrown(q, r, T.w, 8, 0.35, rad);
      if (dc < 0.3) dc = leafClumps(dc + 0.03 * leafN(p * 9.0 + T.w * 31.0), p + T.w * 7.0, 0.22, gFp) * 0.72;
    }
    float tr = sdSeg(p, vec3(T.x, -0.1, T.y), c - vec3(0.0, 0.3, 0.0), 0.045);
    vec3 b0 = c - vec3(0.0, 0.42, 0.0);
    float wb = max(0.022, 0.4 * gFp);
    tr = min(tr, sdSeg(p, b0, c + vec3(0.32, 0.1, 0.05), wb));
    tr = min(tr, sdSeg(p, b0, c + vec3(-0.25, 0.15, 0.2), wb));
    tr = min(tr, sdSeg(p, b0, c + vec3(0.0, 0.12, -0.3), wb));
    if (bareV()) tr = min(tr, skeleton(p, c + vec3(0.0, 0.1, 0.0), r * 1.1, T.w, 4));
    float sw = SWAYK * 0.38 * sat(p.y / (c.y + r));
    if (dc < best) { best = dc; id = I_FRUIT; aux = sw + 2.0 * float(i); gRad = rad; }
    if (tr < best) { best = tr; id = I_TWIG; aux = sw + 2.0 * float(i); }
  }
  // a bed of flowering perennials along the foundation, in the gravel strip between the shrubs (low mounds every
  // ~0.62 m, the two nearest evaluated; none at the fruit trunks and the bench)
  {
    float bb = sdBox(p - vec3(5.3, 0.25, 0.45), vec3(5.8, 0.35, 0.42));
    if (bb > gMargin) best = min(best, bb);
    else {
      float c0 = floor((p.x + 0.1) / 0.62 - 0.5);
      for (int k = 0; k < 2; k++) {
        float c = c0 + float(k), h = hash2(vec2(c, 17.0)), h2 = hash2(vec2(c, 29.0));
        float cx = (c + 0.5) * 0.62 - 0.1 + 0.16 * (h - 0.5);
        if (cx < -0.25 || cx > 10.95 || abs(cx - 0.85) < 0.3 || abs(cx - 5.2) < 0.3 || abs(cx - 10.15) < 0.3 || abs(cx - 7.68) < 0.75) continue;
        float r = 0.21 + 0.08 * h2;
        vec3 q = p - vec3(cx, 0.08 + 0.45 * r, 0.42 + 0.12 * (h2 - 0.5)); q.y *= 1.3;
        float dc = length(q) - r;
        if (dc * 0.66 > gMargin) { best = min(best, dc * 0.66); continue; }
        dc = (dc + 0.05 * leafN(p * 11.0 + c * 7.0)) * 0.6;
        if (dc < best) { best = dc; id = I_FLOWER; aux = 2.0 * (12.0 + c); }
      }
    }
  }
  for (int i = 0; i < 7; i++) {
    vec4 T = SH[i];
    vec3 q = p - vec3(T.x, T.z * 0.55, T.y); q.y *= 1.5;
    float dc = length(q) - T.z;
    if (dc * 0.66 > gMargin) { best = min(best, dc * 0.66); continue; }
    dc = (dc + 0.09 * leafN(p * 7.0 + T.w * 13.0)) * 0.6;
    if (dc < best) { best = dc; id = I_SHRUB; aux = 2.0 * float(i); }
  }
  return best;
}

// ---- palms (Mexican fan palm): a curved slender ringed trunk, a ball of fan leaves on petioles, a shaggy skirt of
// dead fronds and a few hanging dead fronds
const vec4 PALM[2] = vec4[2](vec4(2.4, -23.5, 18.0, 0.31), vec4(12.6, -29.5, 15.6, 0.72));   // x, z, height, seed
vec3 palmAxis(vec4 P, float y) { float s = clamp(y / P.z, 0.0, 1.0); return vec3(P.x + (P.w - 0.5) * 2.2 * s * s, y, P.y + 0.5 * s * s); }
// one fan leaf: a petiole along u from the crown centre, then a pleated, segmented fan (half-angle 'open', ~1.3 rad)
// that droops toward its tip. The blade, its outline and the finger gaps are widened to the pixel footprint (gFp):
// beyond a few pixels per finger the fan reads as one solid fan instead of a stipple of sub-pixel strips
float palmLeaf(vec3 q, float az, float el, float len, float R, float open, float droop, float tw) {
  float ce = cos(el);
  vec3 u = vec3(ce * cos(az), sin(el), ce * sin(az));
  vec3 w = vec3(-sin(az), 0.0, cos(az));
  w = cos(tw) * w + sin(tw) * cross(u, w);      // (stage 2b) the fan twisted about its petiole: fans at every angle, not stacked discs
  vec3 v = cross(u, w);
  float s0 = dot(q, u);
  vec3 qq = q + vec3(0.0, droop * sq(max(s0 - 0.3, 0.0)), 0.0);   // gravity: the leaf bends down toward its tip
  float s = dot(qq, u);
  float pet = length(qq - u * clamp(s, 0.0, len)) - max(0.03, 0.4 * gFp);
  float lx = s - len, ly = dot(qq, w), lz = dot(qq, v);
  float rho = length(vec2(lx, ly)), phi = atan(ly, lx + 1e-4);
  float seg = abs(fract(phi * 6.5 + 0.5) - 0.5);               // ~19 segments over the fan
  // the fingers never get narrower than ~0.75 px (their half-width fl in segment units grows with the footprint), the
  // gaps between them fade out below ~1 px; dead fronds are folded (no fingers)
  float fl = max(0.12, 4.9 * gFp / max(rho, 0.05));
  float fing = smoothstep(0.6, 1.4, max(0.5 - fl, 0.0) * 0.31 * rho / max(gFp, 1e-4)) * step(0.5, open);
  float split = smoothstep(fl, min(fl + 0.25, 0.5), seg) * smoothstep(0.3 * R, 0.85 * R, rho) * fing;
  float Rk = R * (1.0 - 0.16 * phi * phi) * (1.0 - 0.5 * split);
  lz -= 0.06 * (seg - 0.25) * min(rho, 0.7) * fing;          // pleats
  float pw = 0.5 * gFp;
  float d2 = max(rho - Rk - pw, (abs(phi) - open) * rho - pw);
  float blade = max(d2, abs(lz) - max(0.016, pw));
  return min(pet, blade);
}
float palmCrownSDF(vec3 q, float seed, out float id) {
  id = I_FROND;
  float best = 1e5;
  float a0 = atan(q.z, q.x);
  for (int k = 0; k < 3; k++) {
    float el = k == 0 ? 1.32 : k == 1 ? 0.62 : -0.15;           // young upright fronds, the spreading ones, the drooping ones (stage 2b: .42 / -.25 -> .62 / -.15, a rounder head)
    float n = k == 0 ? 5.0 : k == 1 ? 11.0 : 12.0;
    float len = k == 0 ? 0.42 : k == 1 ? 0.95 : 1.15;
    float sec = 6.2831853 / n, off = seed * 6.28 + float(k) * 0.9;
    float a = a0 - off;
    float i0 = floor(a / sec + 0.5);
    float i1 = i0 + (a / sec > i0 ? 1.0 : -1.0);
    float lr = k == 0 ? 0.62 : 0.82, op = k == 0 ? 0.62 : 1.3;
    // (stage 2b) each leaf its own elevation (+-.32 rad) and twist (+-.3 rad): a rounded head, not stacked tiers
    // (the leaf's randoms by its index mod n: the same leaf on both sides of the azimuth seam)
    float tk = k == 0 ? 0.3 : 1.0, m0 = mod(i0, n), m1 = mod(i1, n);
    best = min(best, palmLeaf(q, i0 * sec + off, el + 0.32 * tk * sin(m0 * 2.3 + seed * 9.0), len, lr, op, 0.3, 0.3 * tk * sin(m0 * 4.1 + seed * 5.0)));
    best = min(best, palmLeaf(q, i1 * sec + off, el + 0.32 * tk * sin(m1 * 2.3 + seed * 9.0), len, lr, op, 0.3, 0.3 * tk * sin(m1 * 4.1 + seed * 5.0)));
  }
  best *= 0.6;
  // hanging dead fronds: a few closed brown fans pointing down from under the crown (only some sectors have one)
  {
    float sec = 6.2831853 / 7.0, off = seed * 4.1 + 0.4;
    float a = a0 - off;
    float i0 = floor(a / sec + 0.5);
    float i1 = i0 + (a / sec > i0 ? 1.0 : -1.0);
    float dd = 1e5;
    float sd = 11.0 + floor(seed * 50.0);
    if (hash2(vec2(mod(i0, 7.0), sd)) > 0.45) dd = palmLeaf(q - vec3(0.0, -0.3, 0.0), i0 * sec + off, -1.0 - 0.25 * hash2(vec2(mod(i0, 7.0), sd + 3.0)), 0.5, 0.8, 0.4, 0.05, 0.0);

<script>/* js/glsl/house/gbuf-house.js */
// =====================================================================================
//  GLSL: the house scene's G-buffer bake (Phase-3 owner: lane H): the single-story California ranch house of
//  house-sdf.js (HOUSE_SDF) at golden hour, ported from the feasibility spike (work/phase3/spike/house-glsl.js HG.BAKE).
//  Pure SDF, one scene query (sceneQ, compile-time single call site) driven by a phase state machine:
//    0 march (objects by sphere tracing, the ground heightfield stepped along the ray) -> 1 ground bisection (7) ->
//    2 normal (heightfield taps for the ground, tetrahedral for objects) -> 3 soft sun shadow (k 14, <= 110 steps,
//    stops above y = 24 m) -> 4 AO (5 taps at .04 x 3^j m) -> houseMaterials,
//  which writes the SAME G0..G3 layout as the valley with the house's material ids and G3 semantics (HOUSE_IDS in
//  house-sdf.js; the table in ARCHITECTURE.md §14). Season-neutral: seasons, snow, wetness, window light are per frame
//  (glsl/house/surface-house.js). The march runs in house space (hsp: the world mirrored in z); the normals are
//  flipped back to world space on output.
//  Two modes of the same program (so the house scene still builds exactly two programs of its own):
//   - bake (uDissolve.x = 0): uVariant 0 = leafy, 1 = the bare winter variant (deciduous and fruit crowns become
//     skeletons; the finest twigs are a per-pixel twig haze in G3.a; where that haze lies over the sky the pixel
//     becomes a haze surface at the crown, except one 'keeper' pixel per 2x2 block that stays sky so the half-res
//     cloud pass still draws the clouds behind it: SURFACE_HOUSE draws the haze over them);
//   - copy (uDissolve.x = 1): the variant dissolve (render.js): the freshly baked variant (uN0..uN3) is copied into the
//     shown buffer where a smooth screen noise lies in [uDissolve.y, uDissolve.z): leaves fall / come out in clusters.
//  Step 2 (the look) added: the perennials' G3 (r .8 .. 1, b their colour), a shallow dip in the sidewalk in front of
//  the windows (puddle potential: its puddle mirrors their light after rain), a snow lip on the fence's cap rail.
//   HOUSE_HEAD   bake uniforms, the MRT outputs
//   HOUSE_MAT    cedar(), interior(), houseMaterials(...) (called once, no scene query), cardMaterials(...)
//   HOUSE_MAIN   sceneQ (the ONE scene-query call site), the twig haze, the copy mode, the state machine
//  Program 'gbuf@house' = COMMON + HOUSE_HEAD + GBUF_NOISE + HOUSE_IDS + HOUSE_SDF + HOUSE_MAT + HOUSE_MAIN.

uniform float uPixAng;
uniform int uIter;                  // state-machine iteration cap (a uniform bound: the driver cannot unroll the loop)

// stained cedar / redwood lap siding: 15.2 cm courses, random board lengths per course, a deep red-brown stain with a
// subtle per-board tone (a little redder or more honey, rarely a darker board), grain along the boards, the drip-edge

vec3 cedar(float s, float y, float fp, inout vec3 n, out float tone) {

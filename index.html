<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>눈 내리는 들판</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 24 24%27%3E%3Crect width=%2724%27 height=%2724%27 rx=%276%27 fill=%27%235d7fa6%27/%3E%3Cg stroke=%27white%27 stroke-width=%271.6%27 stroke-linecap=%27round%27 fill=%27none%27%3E%3Cpath d=%27M12 4v16M5.1 8l13.8 8M5.1 16l13.8-8%27/%3E%3C/g%3E%3C/svg%3E">
<style>/* css/ui.css */
/* Chrome of the snow simulation (stage-1 owner: lane B): one icon, a glass pop-over, a hint, the error card. */
:root { --ink: rgba(255,255,255,0.97); --ink2: rgba(255,255,255,0.80); --ink3: rgba(255,255,255,0.74);
        --line: rgba(255,255,255,0.22); --hair: rgba(255,255,255,0.13); --groove: rgba(0,12,30,0.24);
        --fill: rgba(255,255,255,0.21); --hov: rgba(255,255,255,0.08); --ease: cubic-bezier(0.3, 0.7, 0.2, 1); }
/* body colour = the composite's fade base (0.80, 0.85, 0.90), so the pre-script page, the first GL frame and the reveal all start from one colour */
html, body { margin: 0; height: 100%; overflow: hidden; background: rgb(204,217,230); user-select: none; -webkit-user-select: none;
             font: 500 12.5px/1.35 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
             letter-spacing: 0; word-break: keep-all; -webkit-font-smoothing: antialiased;
             /* phones: no rubber-band / pull-to-refresh, no long-press callout, no landscape text inflation */
             overscroll-behavior: none; -webkit-touch-callout: none; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
/* the canvas fills the current layout viewport: 100% of its fixed box, not 100vw x 100vh (on phones vh is the largest
   viewport and can disagree with the visible one); gl.js reads its pixel size back from this box. It owns every touch
   gesture (a drag is wind: no page pan or zoom over the scene); the hand closes only while dragging */
canvas { display: block; position: fixed; inset: 0; width: 100%; height: 100%; cursor: default; touch-action: none; }
canvas.drag { cursor: grabbing; }
.sprite { position: absolute; width: 0; height: 0; overflow: hidden; }

/* The only chrome: a soft line glyph in the corner that follows the season (blossom, sun, leaf, snowflake). A dark
   halo keeps it readable over snow; it dims once the pointer rests (never below 0.25), brightens on hover / open,
   and lifts once for two seconds when the hint fades so a first-time viewer notices the corner.
   The glyph is 28 px; its padding makes a 44 px tap target. The corner clears the phone safe areas (viewport-fit=cover). */
#icon { position: fixed; right: calc(22px + env(safe-area-inset-right)); bottom: calc(20px + env(safe-area-inset-bottom)); width: 28px; height: 28px; padding: 8px; margin: -8px; cursor: pointer;
        opacity: 0.5; transition: opacity 0.9s ease; -webkit-tap-highlight-color: transparent; outline: none; touch-action: none; }
#icon svg { display: block; width: 100%; height: 100%; overflow: visible;
            filter: drop-shadow(0 0 2.5px rgba(0,25,50,0.75)) drop-shadow(0 1px 2px rgba(0,20,40,0.5)); }
#icon .glyph { opacity: 0; transition: opacity 0.25s ease; }
#icon .glyph.on { opacity: 1; }
#icon.idle { opacity: 0.25; }
#icon.lift { opacity: 0.9; transition-duration: 0.6s; }
#icon.open, #icon:focus-visible { opacity: 0.8; transition-duration: 0.25s; }
/* hover styles only where there is a hover (a tap on a phone would leave them stuck) */
@media (hover: hover) { #icon:hover { opacity: 0.8; transition-duration: 0.25s; } }

/* glass pop-over anchored above the icon: a cool dark frosted glass, so white ink keeps >= 4.5:1 over snow. It clears
   the safe areas and scrolls only in a window too short for it (a landscape phone gets the compact layout below);
   --th is the slider thumb (bigger for fingers) */
#pop { --th: 14px; position: fixed; right: calc(22px + env(safe-area-inset-right)); bottom: calc(62px + env(safe-area-inset-bottom)); width: 272px;
       max-width: calc(100% - 44px - env(safe-area-inset-left) - env(safe-area-inset-right));
       max-height: calc(100% - 76px - env(safe-area-inset-top) - env(safe-area-inset-bottom)); overflow-y: auto; overscroll-behavior: contain;
       touch-action: pan-y; scrollbar-width: thin; box-sizing: border-box; padding: 13px 16px 15px; border-radius: 18px;
       background: linear-gradient(160deg, rgba(16,32,58,0.76), rgba(16,32,58,0.68));
       border: 1px solid var(--line); box-shadow: 0 12px 36px rgba(20,40,70,0.30), inset 0 1px 0 rgba(255,255,255,0.14);
       -webkit-backdrop-filter: blur(18px) saturate(1.3); backdrop-filter: blur(18px) saturate(1.3);
       color: var(--ink); text-shadow: 0 1px 2px rgba(0,20,40,0.35);
       opacity: 0; transform: translateY(6px) scale(0.98); transform-origin: 100% 100%; pointer-events: none; visibility: hidden;
       transition: opacity 0.22s ease, transform 0.22s ease, visibility 0s linear 0.22s; }
#pop.open { opacity: 1; transform: none; pointer-events: auto; visibility: visible; transition-delay: 0s; }
:where(#pop button) { font: inherit; color: inherit; text-shadow: inherit; letter-spacing: 0; margin: 0; padding: 0; border: 0; background: none;
              cursor: pointer; -webkit-tap-highlight-color: transparent; }
/* one focus ring that belongs to the glass, instead of Chrome's black outline */
#pop :focus { outline: none; }
#pop :focus-visible { outline: 1.5px solid rgba(255,255,255,0.85); outline-offset: 1px; }
#icon:focus-visible { outline: 1.5px solid rgba(255,255,255,0.85); outline-offset: -4px; border-radius: 50%; }

/* 1) status: season, weather; the hairline under it doubles as the weather-transition progress */
.status { display: flex; align-items: center; gap: 6px; height: 20px; font-size: 13.5px; white-space: nowrap; }
#stSeason { font-weight: 600; }
.sep { color: var(--ink3); }
#stWx { color: var(--ink); font-variant-numeric: tabular-nums; }
.rule { position: relative; height: 1px; margin: 12px -16px 11px; background: var(--hair); }
#stProg { position: absolute; left: 0; top: 0; height: 1px; width: 100%; background: rgba(255,255,255,0.75); transform-origin: 0 0;
          transform: scaleX(var(--p, 0)); opacity: 0; transition: opacity 0.25s ease, transform 0.25s linear; }
#stProg.on { opacity: 1; }

/* section captions */
.cap, .hd { display: flex; justify-content: space-between; align-items: baseline; font-size: 11.5px; line-height: 15px; color: var(--ink2); margin: 0 0 6px; }
.hd i { font-style: normal; color: var(--ink); font-variant-numeric: tabular-nums; }

/* 2) season: one segmented control; the glass thumb slides under the checked segment (--i set from JS) */
.seg { position: relative; display: grid; grid-template-columns: repeat(5, 1fr); padding: 2px; margin: 0; border-radius: 10px;
       background: var(--groove); box-shadow: inset 0 0 0 0.5px rgba(255,255,255,0.07); }
.seg .thumb { position: absolute; top: 2px; bottom: 2px; left: 2px; width: calc((100% - 4px) / 5); border-radius: 8px; background: var(--fill);
              box-shadow: 0 1px 3px rgba(0,10,30,0.22), inset 0 0.5px 0 rgba(255,255,255,0.24);
              transform: translateX(calc(var(--i, 0) * 100%)); transition: transform 0.24s var(--ease); }
.seg button { position: relative; height: 26px; border-radius: 8px; font-size: 12.5px; color: var(--ink2); transition: color 0.2s ease; }
@media (hover: hover) { .seg button:hover { color: var(--ink); } }
.seg button[aria-checked="true"] { color: var(--ink); }

/* the year under the four season segments (phase 0 = 1 March at the left edge of 봄): a hairline, the part of the
   year already gone a shade brighter, a small dot for today; --y set from JS */
.yr { position: relative; height: 5px; margin: 6px 2px 13px calc(2px + (100% - 4px) / 5); }
.yr::before { content: ""; position: absolute; left: 0; right: 0; top: 2px; height: 1px; background: rgba(255,255,255,0.14); }
.yr .done { position: absolute; left: 0; top: 2px; height: 1px; width: calc(var(--y, 0) * 100%); background: rgba(255,255,255,0.42); }
.yr .dot { position: absolute; top: 0; left: calc(var(--y, 0) * 100%); width: 4px; height: 4px; margin: 0.5px 0 0 -2px; border-radius: 50%;
           background: #fff; box-shadow: 0 0 0 1.5px rgba(16,32,58,0.5), 0 1px 2px rgba(0,20,40,0.4); }

/* 3) weather: a 4 x 2 grid of line icons with a small label; the checked one is soft filled glass */
.wx { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px 3px; margin: 0 0 14px; }
.wx button { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 7px 0 5px; border-radius: 10px; color: var(--ink2);
             transition: background-color 0.2s ease, color 0.2s ease, box-shadow 0.2s ease; }
@media (hover: hover) { .wx button:hover { background: var(--hov); color: var(--ink); } }
.wx button[aria-checked="true"] { background: var(--fill); color: var(--ink); box-shadow: 0 1px 3px rgba(0,10,30,0.2), inset 0 0.5px 0 rgba(255,255,255,0.24); }
.wx svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.35; stroke-linecap: round; stroke-linejoin: round;
          filter: drop-shadow(0 1px 1.5px rgba(0,20,40,0.35)); }
.wx span { font-size: 11px; line-height: 13px; }

/* 4) / 5) sliders: two-tone track (filled part white, the rest a dark groove) so the range reads on snow and on meadow;
   --p is set from JS. The time slider is stepped: its six stops are labelled under the track */
.slider { display: block; margin: 0 0 12px; cursor: default; }
.slider.last { margin-bottom: 0; }
#pop input[type=range] { -webkit-appearance: none; appearance: none; display: block; width: 100%; height: 14px; margin: 0; background: none; cursor: pointer;
                         -webkit-tap-highlight-color: transparent; }
#pop input[type=range]::-webkit-slider-runnable-track { height: 3px; border-radius: 2px;
  background: linear-gradient(90deg, rgba(255,255,255,0.88) var(--p, 50%), rgba(0,12,30,0.42) var(--p, 50%)); box-shadow: inset 0 0.5px 0 rgba(255,255,255,0.12); }
#pop input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: var(--th); height: var(--th); margin-top: calc((3px - var(--th)) / 2); border-radius: 50%; background: #fff;
  box-shadow: 0 1px 4px rgba(0,30,60,0.38), 0 0 0 0.5px rgba(0,20,40,0.12); cursor: pointer; transition: transform 0.15s ease; }
#pop input[type=range]:active::-webkit-slider-thumb { transform: scale(1.1); }
#pop input[type=range]::-moz-range-track { height: 3px; border-radius: 2px;
  background: linear-gradient(90deg, rgba(255,255,255,0.88) var(--p, 50%), rgba(0,12,30,0.42) var(--p, 50%)); }
#pop input[type=range]::-moz-range-thumb { width: var(--th); height: var(--th); border: 0; border-radius: 50%; background: #fff; box-shadow: 0 1px 4px rgba(0,30,60,0.38); }
/* keyboard focus on a slider rings its thumb, not the whole track */
#pop input[type=range]:focus-visible { outline: none; }
#pop input[type=range]:focus-visible::-webkit-slider-thumb { box-shadow: 0 0 0 2px rgba(16,32,58,0.7), 0 0 0 3.5px rgba(255,255,255,0.9); }
#pop input[type=range]:focus-visible::-moz-range-thumb { box-shadow: 0 0 0 2px rgba(16,32,58,0.7), 0 0 0 3.5px rgba(255,255,255,0.9); }
/* tick labels centred on the thumb's stops: the thumb centre runs from th/2 to (width - th/2) */
.ticks { position: relative; display: block; height: 13px; margin-top: 4px; }
.ticks b { position: absolute; top: 0; font-weight: 500; font-size: 10px; line-height: 13px; color: var(--ink3); transform: translateX(-50%);
           font-variant-numeric: tabular-nums; transition: color 0.2s ease; }
.ticks b:nth-child(1) { left: calc(var(--th) / 2); } .ticks b:nth-child(2) { left: calc(var(--th) / 2 + (100% - var(--th)) * 0.2); }
.ticks b:nth-child(3) { left: calc(var(--th) / 2 + (100% - var(--th)) * 0.4); } .ticks b:nth-child(4) { left: calc(var(--th) / 2 + (100% - var(--th)) * 0.6); }
.ticks b:nth-child(5) { left: calc(var(--th) / 2 + (100% - var(--th)) * 0.8); } .ticks b:nth-child(6) { left: calc(100% - var(--th) / 2); }
.ticks b.on { color: var(--ink); font-weight: 600; }

/* the start hint: the same dark glass as the pop-over, so it reads over the brightest snow */
#hint { position: fixed; left: 50%; bottom: calc(9% + env(safe-area-inset-bottom)); transform: translateX(-50%); padding: 9px 18px; border-radius: 20px;
        background: linear-gradient(160deg, rgba(16,32,58,0.72), rgba(16,32,58,0.64)); border: 1px solid var(--line);
        box-shadow: 0 8px 24px rgba(20,40,70,0.22), inset 0 1px 0 rgba(255,255,255,0.12);
        -webkit-backdrop-filter: blur(18px) saturate(1.3); backdrop-filter: blur(18px) saturate(1.3);
        color: rgba(255,255,255,0.97); font-size: 14px; line-height: 1.2; letter-spacing: 0; text-shadow: 0 1px 3px rgba(0,20,40,0.4);
        pointer-events: none; opacity: 0; transition: opacity 1.4s ease; white-space: nowrap; }
#hint.on { opacity: 1; }
#err { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; padding: 20px; pointer-events: none; }
#err span { padding: 12px 20px; border-radius: 14px; background: rgba(255,255,255,0.75); color: #234; font-size: 15px; line-height: 1.6; text-align: center;
            -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); box-shadow: 0 6px 24px rgba(20,40,70,0.2); }
/* fingers (phones, tablets): segments, chips and sliders get >= 36-44 px hit areas; the look stays the same */
@media (pointer: coarse) {
  #pop { --th: 22px; }
  .seg button { height: 36px; }
  .wx button { padding: 9px 0 7px; }
  #pop input[type=range] { height: 32px; }
  .ticks { margin-top: 0; }
}
/* a landscape phone (or any short window): two columns, opening beside the glyph instead of above it, so everything
   fits without scrolling. Season and the time slider on the left, weather and its amount on the right; the DOM order
   (season, weather, speed, amount) still reads left to right, top to bottom */
@media (max-height: 500px) and (min-width: 600px) {
  #pop { width: 528px; bottom: calc(20px + env(safe-area-inset-bottom)); right: calc(64px + env(safe-area-inset-right));
         max-width: calc(100% - 86px - env(safe-area-inset-left) - env(safe-area-inset-right));
         max-height: calc(100% - 34px - env(safe-area-inset-top) - env(safe-area-inset-bottom));
         display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: auto auto auto auto auto 1fr auto; column-gap: 24px;
         padding: 12px 16px 14px; }
  #pop > .status, #pop > .rule { grid-column: 1 / -1; }
  #pop > .rule { margin: 10px -16px 10px; }
  #capSeason { grid-area: 3 / 1; } #seasons { grid-area: 4 / 1; } #pop > .yr { grid-area: 5 / 1; margin-bottom: 12px; }
  #capWx { grid-area: 3 / 2; } #weathers { grid-area: 4 / 2 / 7 / 3; margin-bottom: 12px; }
  #speedRow { grid-area: 6 / 1 / 8 / 2; margin: 0; } #pop > .slider.last { grid-area: 7 / 2; }
}
@media (prefers-reduced-motion: reduce) { #icon, #icon .glyph, #pop, #pop *, #hint { transition-duration: 0s !important; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<!-- #ui block (stage-1 owner: lane B): the icon, the pop-over and the hint -->
<svg class="sprite" aria-hidden="true">
  <defs>
    <path id="g-arm" d="M12 2.6v18.8M9.9 4.7 12 6.8l2.1-2.1M9.9 19.3 12 17.2l2.1 2.1M10.4 8.5 12 10.1l1.6-1.6M10.4 15.5 12 13.9l1.6 1.6"/>
    <path id="g-petal" d="M12 9.9C10 8.9 9.3 6.3 10.4 3.8L12 5.1l1.6-1.3c1.1 2.5.4 5.1-1.6 6.1z"/>
    <path id="g-dot" d="M8 16.3v3.4M6.53 17.15l2.94 1.7M6.53 18.85l2.94-1.7"/>
    <!-- the cloud: three circles (r 3.5, 4.8, 3.2) on a flat base, traced along their outer arcs -->
    <path id="g-cloud" d="M7.5 17A3.5 3.5 0 1 1 7.8 10.02 4.8 4.8 0 0 1 17.28 10.61 3.2 3.2 0 0 1 17 17z"/>
    <mask id="m-cumulus" maskUnits="userSpaceOnUse" x="0" y="0" width="24" height="24">
      <rect width="24" height="24" fill="#fff"/>
      <use href="#g-cloud" transform="translate(3 3.6) scale(.9)" fill="#000" stroke="#000" stroke-width="3.6"/>
    </mask>
  </defs>
  <!-- line-art glyphs on a 24 grid, stroked by the <svg> that uses them (round caps / joins, currentColor) -->
  <symbol id="g-flake" viewBox="0 0 24 24">
    <use href="#g-arm"/><use href="#g-arm" transform="rotate(60 12 12)"/><use href="#g-arm" transform="rotate(120 12 12)"/>
  </symbol>
  <symbol id="g-sun" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="4.4"/>
    <path d="M12 2.6v2.5M12 18.9v2.5M2.6 12h2.5M18.9 12h2.5M5.35 5.35l1.77 1.77M16.88 16.88l1.77 1.77M5.35 18.65l1.77-1.77M16.88 7.12l1.77-1.77"/>
  </symbol>
  <symbol id="g-leaf" viewBox="0 0 24 24">
    <path d="M5.4 18.6C4.7 11.2 9.4 5.3 19.4 4.6c.3 9.6-5.6 14.9-14 14z"/>
    <path d="M3.4 20.6 15.6 8.4M9 15V11.6M9 15h3.4M12.3 11.7V8.6M12.3 11.7h3.1"/>
  </symbol>
  <symbol id="g-blossom" viewBox="0 0 24 24">
    <use href="#g-petal" transform="rotate(0 12 12)"/><use href="#g-petal" transform="rotate(72 12 12)"/><use href="#g-petal" transform="rotate(144 12 12)"/>
    <use href="#g-petal" transform="rotate(216 12 12)"/><use href="#g-petal" transform="rotate(288 12 12)"/>
    <circle cx="12" cy="12" r=".55"/>
  </symbol>
  <symbol id="w-auto" viewBox="0 0 24 24">
    <path d="M18.06 8.5A7 7 0 0 0 5.11 10.78M7.1 9.11 5.11 10.78 3.81 8.53M5.94 15.5A7 7 0 0 0 18.89 13.22M16.9 14.89l1.99-1.67 1.3 2.25"/>
  </symbol>
  <symbol id="w-cumulus" viewBox="0 0 24 24">
    <g mask="url(#m-cumulus)">
      <circle cx="8.8" cy="8.8" r="3.4"/>
      <path d="M8.8 2v1.6M8.8 14v1.6M2 8.8h1.6M14 8.8h1.6M3.99 3.99l1.13 1.13M12.48 12.48l1.13 1.13M3.99 13.61l1.13-1.13M12.48 5.12l1.13-1.13"/>
    </g>
    <path d="M9.75 18.9A3.15 3.15 0 1 1 10.02 12.62 4.32 4.32 0 0 1 18.55 13.15 2.88 2.88 0 0 1 18.3 18.9z"/>
  </symbol>
  <symbol id="w-cloud" viewBox="0 0 24 24"><use href="#g-cloud" transform="translate(0 .4)"/></symbol>
  <symbol id="w-fog" viewBox="0 0 24 24"><use href="#g-cloud" transform="translate(0 -3.4)"/><path d="M5 17.2h14M7.5 20.6h9"/></symbol>
  <symbol id="w-rain" viewBox="0 0 24 24"><use href="#g-cloud" transform="translate(0 -3.4)"/><path d="M8.7 16.2l-1.5 4M12.7 17.2l-1.5 4M16.7 16.2l-1.5 4"/></symbol>
  <symbol id="w-snow" viewBox="0 0 24 24">
    <use href="#g-cloud" transform="translate(0 -3.4)"/>
    <use href="#g-dot"/><use href="#g-dot" transform="translate(4 1.6)"/><use href="#g-dot" transform="translate(8 0)"/>
  </symbol>
  <symbol id="w-blizzard" viewBox="0 0 24 24">
    <!-- a snowflake driven by the wind: six arms (tip Vs) and three motion lines -->
    <path d="M15 5v14M8.94 8.5l12.12 7M8.94 15.5l12.12-7M13.4 6.3 15 7.6l1.6-1.3M13.4 17.7l1.6-1.3 1.6 1.3M2.2 8.8h4.6M1.4 12h5.6M2.2 15.2h4.6"/>
  </symbol>
</svg>
<div id="icon" role="button" aria-label="계절과 날씨 설정" tabindex="0" aria-haspopup="dialog" aria-expanded="false" aria-controls="pop">
  <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
    <use class="glyph" data-s="0" href="#g-blossom"/><use class="glyph" data-s="1" href="#g-sun"/>
    <use class="glyph" data-s="2" href="#g-leaf"/><use class="glyph" data-s="3" href="#g-flake"/>
  </svg>
</div>
<div id="pop" role="dialog" aria-label="계절과 날씨">
  <div class="status">
    <span id="stSeason"></span><span class="sep" aria-hidden="true">·</span><span id="stWx"></span>
  </div>
  <div class="rule"><i id="stProg"></i></div>
  <div class="cap" id="capSeason">계절</div>
  <div class="seg" id="seasons" role="radiogroup" aria-labelledby="capSeason">
    <i class="thumb"></i>
    <button role="radio" data-v="auto" aria-label="자동, 계절이 흐름">자동</button><button role="radio" data-v="spring">봄</button><button role="radio" data-v="summer">여름</button><button role="radio" data-v="autumn">가을</button><button role="radio" data-v="winter">겨울</button>
  </div>
  <div class="yr" aria-hidden="true"><i class="done"></i><i class="dot"></i></div>
  <div class="cap" id="capWx">날씨</div>
  <div class="wx" id="weathers" role="radiogroup" aria-labelledby="capWx">
    <button role="radio" data-v="auto"><svg><use href="#w-auto"/></svg><span>자동</span></button>
    <button role="radio" data-v="clear"><svg><use href="#g-sun"/></svg><span>맑음</span></button>
    <button role="radio" data-v="cumulus"><svg><use href="#w-cumulus"/></svg><span>구름</span></button>
    <button role="radio" data-v="overcast"><svg><use href="#w-cloud"/></svg><span>흐림</span></button>
    <button role="radio" data-v="fog"><svg><use href="#w-fog"/></svg><span>안개</span></button>
    <button role="radio" data-v="rain"><svg><use href="#w-rain"/></svg><span>비</span></button>
    <button role="radio" data-v="snow"><svg><use href="#w-snow"/></svg><span>눈</span></button>
    <button role="radio" data-v="blizzard"><svg><use href="#w-blizzard"/></svg><span>폭설</span></button>
  </div>

<!-- Classic scripts in a fixed order (works from file://: no modules, no fetch). Each file is one IIFE on window.SNOW;
     only main.js has load-time side effects (boot). The js/glsl files only register chunks and program recipes,
     assembled lazily by buildPrograms() in gl.js, so their order among themselves does not matter. This list is
     frozen during the stage-1 lanes: every file a lane owns already exists (see ARCHITECTURE.md). -->
<script>/* js/core.js */
// =====================================================================================
//  Snow over an alpine meadow — raw WebGL2, split into classic scripts under one namespace (see ARCHITECTURE.md).
//  Pipeline (static camera):
//   1. G-buffer: a one-time, progressive (striped) iq-style raymarch of the heightfield
//      terrain + SDF conifers + chalets. Stores distance, material, sun shadow, AO,
//      albedo, snow-threshold, two normals and season-neutral material parameters (G3). Because the camera never
//      moves this is the ultimate temporal reuse: geometry is marched once, shading runs every frame.
//   2. Cloud pass (half res, temporally accumulated volumetric cumulus slab). Stores premultiplied
//      cloud light + transmittance and an opacity-weighted cloud distance; the analytic sky is
//      evaluated in the shading pass so clouds can be composited over the sky or the far peaks.
//   3. Scene shading: snow coverage, storm lighting, cloud shadows, fog, veil.
//   4. FXAA on the scene, 5. instanced stateless snowflakes (4 depth layers, soft
//      occlusion against the G-buffer distance), 6. bloom, 7. ACES composite + grade.
//   Steps 2-6 run at an adaptive render scale (frame-time controller, down to 0.6 and back up); the G-buffer
//   stays at canvas size (DPR capped at 1.25, ~8.4 Mpx) and the composite upsamples.
//   A resize bakes a second G-buffer in time-budgeted stripes while the old one is still shown (aspect-corrected),
//   and the new rows wipe in from the bottom; the first load uses the same wipe as its progress reveal.
//
//  core.js loads first and creates window.SNOW (the only global). It holds S.cfg (every URL hook, parsed once),
//  the math helpers, the camera and sun constants, the GLSL registry and the frame uniform bundle S.F with its
//  neutral defaults.
//  No load-time side effects beyond creating the namespace (it also loads in Node: pass { window: {}, URLSearchParams }).
//
//  S.F — the frame uniform bundle (frozen contract; full table with units in ARCHITECTURE.md). Keyed by exact GLSL
//  uniform name; numbers for float / int / uint, arrays or Float32Arrays for vectors, { unit, tex } for a sampler.
//  Uploaded generically by S.uploadF(prog) to every program that declares the name (the setter comes from the
//  getActiveUniform type, cached per program in gl.js). Filled once per frame by S.deriveF() (render.js): the static
//  camera / sun / clock / noise fields there, then js/derive/surface.js, precip.js and atmos.js in that order (a later
//  one may read what an earlier one set). Pass-local uniforms stay explicit in render.js / precip.js and are NOT here.
//    render.js:   uCamPos, uCamR, uCamU, uCamF (vec3), uTanH, uSunDir (fixed: baked into the G-buffer), uTime, uNoise
//    surface.js:  uCover, uSeasonW, uTemp, uSnowline, uWet, uGrassDisp, uYearPhase, uMelt
//    precip.js:   uSnowCurtain, uPrecipSnow, uPrecipRain, uSnowFrac, uGale, uHeavy, uWetSnow, the snow veil (uVeilDir,
//                 uVeilAmt, uVeilT), the rain veil / curtains (uRainDir, uRainVeil, uRainT, uRainShaft), the flake and rain
//                 clocks / shutters (uFallV, uExpo, uTumT, uRainV, uExpoRain, uRainGust, uWindA, uWindB, uFlakeT)
//    atmos.js:    uSunCol, uSkyAmb, uSkyZen, uSkyHor, uFogCol, uFogP, uCloudOff, uCloudCov, uOvercast, uCumulus,
//                 uFogDay, uMistP, uCirrus, uShadowAmp, uExposure, uBloomStr, uHorBand, uCloudP, uCloudQ, uMistQ,
//                 uSkyResp, uGrade, uGradeP
//  The initial object below holds the neutral defaults of the Phase-2 environment uniforms (the ENV chunk): with
//  these values every shader reproduces the Phase-1 look. uView is the ?view= debug channel.
// =====================================================================================
(function (S) {
  'use strict';
  const Q = new URLSearchParams((window.location && window.location.search) || '');
  const qNum = (k, d) => { const v = Q.get(k); if (v === null || v === '') return d; const n = parseFloat(v); return isFinite(n) ? n : d; };
  // 'a:1,b:.5' -> { a: 1, b: 0.5 } (entries without a finite number are ignored); null when the hook is absent
  const qKV = k => {
    const v = Q.get(k);
    if (!v) return null;
    const o = {};
    for (const p of v.split(',')) { const i = p.indexOf(':'), n = parseFloat(p.slice(i + 1)); if (i > 0 && isFinite(n)) o[p.slice(0, i).trim()] = n; }
    return o;
  };
  // ?view= debug channels, in uView order (1..8): baked albedo, snow threshold, the four G3 channels, effective cover, wetness
  const VIEWS = S.VIEWS = ['alb', 'snowT', 'g3r', 'g3g', 'g3b', 'g3a', 'cEff', 'wet'];
  const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
  const lerp = (a, b, t) => a + (b - a) * t;
  const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
  function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  S.clamp = clamp; S.lerp = lerp; S.smooth = smooth; S.mulberry32 = mulberry32;
  // counter-based randomness for the sim (no consumed stream, so UI actions never perturb a seeded sequence):
  // hash32 is the GLSL hu(); rand(seed, i, k) is uniform in [0,1); vn1(seed, x) is smooth 1D value noise in [-1,1]
  function hash32(x) { x |= 0; x ^= x >>> 16; x = Math.imul(x, 0x7feb352d); x ^= x >>> 15; x = Math.imul(x, 0x846ca68b); x ^= x >>> 16; return x >>> 0; }
  const rand = (seed, i, k) => hash32(hash32(hash32(seed) ^ (i | 0)) + Math.imul(k | 0, 0x9e3779b9)) / 4294967296;
  function vn1(seed, x) { const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f), a = rand(seed, i, 0); return 2 * (a + (rand(seed, i + 1, 0) - a) * u) - 1; }
  // debug-hook helper (?wx ?ground): copy the entries of kv onto the numeric keys obj already has (others are ignored)
  const override = (obj, kv) => { if (kv) for (const k of Object.keys(kv)) if (typeof obj[k] === 'number') obj[k] = kv[k]; return obj; };
  S.hash32 = hash32; S.rand = rand; S.vn1 = vn1; S.override = override;

  // ---- URL hooks, parsed once: ?seed ?t ?cover ?storm ?wind ?ui ?fixed (Phase 1), ?season ?weather ?speed (Phase 2),
  // the debug hooks ?yp ?wx ?ground ?view, and the test-only ?frames ?gb16
  S.cfg = {
    seed: Math.floor(qNum('seed', 1)) >>> 0,
    t0: Math.max(0, qNum('t', 0)),
    cover: Q.has('cover') ? clamp(qNum('cover', 0), 0, 1) : null,
    storm: Q.get('storm'),                                   // raw: '1' forced blizzard, '0' auto blizzards off
    wind: (Q.get('wind') || '').split(',').map(Number),      // ?wind=X,Z base wind (m/s)
    ui: Q.get('ui') !== '0',
    // ?fixed=1: a fixed 1/60 s simulation step (and a grain clock derived from it) instead of the wall clock, so
    // ?t&seed captures are reproducible frame for frame; the quality controller is off in this mode
    fixed: Q.get('fixed') === '1',
    // test-only (parity capture): ?frames=N renders exactly N frames with a fixed 1/60 s step, then stops the loop
    // and sets window.__done
    frames: Math.max(0, Math.floor(qNum('frames', 0))),
    // ---- Phase-2 hooks, read by js/sim/* in init(cfg)
    season: Q.get('season'),                                  // raw: spring|summer|autumn|winter or 0..1 (pins the season)
    weather: Q.get('weather'),                                // raw: clear|cumulus|overcast|fog|rain|snow|blizzard|auto
    speed: Q.has('speed') ? clamp(qNum('speed', 1), 0, 8) : 1,   // climate seconds per real second
    date: new Date(),                                         // the real date: initial year phase without ?season / ?yp
    // ---- debug hooks for the parallel lanes: they override the sim after its step (see ARCHITECTURE.md)
    yp: Q.has('yp') ? (v => v - Math.floor(v))(qNum('yp', 0)) : null,   // year phase in [0, 1), pinned
    wx: qKV('wx'),                                            // weather channels, e.g. overcast:.5,precip:.2
    ground: qKV('ground'),                                    // ground state, e.g. cover:.3,wet:.8
    view: VIEWS.indexOf(Q.get('view')) + 1,                   // debug view index (0 = off), names in S.VIEWS
    gb16: Q.get('gb16') === '1',                              // test-only: force the all-RGBA16F G-buffer fallback
  };

  // ---- camera & sun
  // high vantage over the meadow: ~230 m above the chalet basin, tilted 12 deg down (horizon sits at ~24% from the top)
  const CAM = { pos: [0, 132, 0], yaw: 0.0, pitch: -12 * Math.PI / 180, fovY: 44 * Math.PI / 180 };
  // camF / camR / camU are filled by frameCamera and only ever mutated in place: other files alias the arrays.
  // S.TANH (tan of half the vertical fov) changes with the framing too: read it at call time, never cache it.
  const camF = [0, 0, 1], camR = [1, 0, 0], camU = [0, 1, 0];
  S.CAM = CAM; S.camF = camF; S.camR = camR; S.camU = camU;
  // Framing per aspect ratio (w / h). Landscape (>= 1.25) is the composed 44 deg view, bit for bit the Phase-1
  // constants. Toward portrait (phones) the vertical fov widens so the horizontal fov never drops below 34 deg, the
  // camera tilts down 4 deg more (more meadow under a taller frame) and turns 9 deg left so the snowy peak and the
  // hazy valley stay in frame beside the wall. (The Phase-1 hotfix blended the fov term by t as well, which let the
  // horizontal fov dip to 33.85 deg around aspect 0.7, a portrait tablet; max() keeps the 34 deg floor and is the
  // same value for every phone and every landscape.) Returns true when the camera moved (a baked G-buffer is stale).
  const TAN0 = Math.tan(CAM.fovY / 2), FOV0 = CAM.fovY;
  S.frameCamera = function (asp) {
    const t = smooth(1.25, 0.6, asp);
    const tanV = Math.max(TAN0, Math.tan(17 * Math.PI / 180) / asp);
    const yaw = t > 0 ? -9 * t * Math.PI / 180 : 0, pitch = (-12 - 4 * t) * Math.PI / 180;
    const changed = tanV !== S.TANH || yaw !== CAM.yaw || pitch !== CAM.pitch;
    CAM.yaw = yaw; CAM.pitch = pitch; CAM.fovY = t > 0 ? 2 * Math.atan(tanV) : FOV0; S.TANH = tanV;
    camF[0] = Math.sin(yaw) * Math.cos(pitch); camF[1] = Math.sin(pitch); camF[2] = Math.cos(yaw) * Math.cos(pitch);
    const l = Math.hypot(camF[2], -camF[0]);
    camR[0] = camF[2] / l; camR[1] = 0; camR[2] = -camF[0] / l;
    camU[0] = camF[1] * camR[2] - camF[2] * camR[1]; camU[1] = camF[2] * camR[0] - camF[0] * camR[2]; camU[2] = camF[0] * camR[1] - camF[1] * camR[0];  // F x R = up
    return changed;
  };
  S.TANH = TAN0;
  S.frameCamera(16 / 9);
  S.SUN = (() => { const s = [-0.70, 0.47, -0.17]; const l = Math.hypot(...s); return s.map(v => v / l); })();

  // ---- GLSL registry: js/glsl/*.js register named chunks and program recipes; gl.js assembles them lazily
  S.glsl = { chunks: {}, progs: {} };
  // ---- the derive modules (js/derive/*.js register S.derive.surface / precip / atmos = { init, step, frame })
  S.derive = {};
  // ---- the frame uniform bundle (see the header). Neutral defaults of the Phase-2 environment uniforms (ENV chunk):
  S.F = {
    uSeasonW: [0, 0, 0, 1],          // season weights (spring, summer, autumn, winter), sum 1
    uTemp: -5,                       // meadow air temperature, deg C
    uSnowline: [-10000, 150],        // snowline altitude (m) and transition half-width (m); far below the scene = no effect
    uWet: 0,                         // ground wetness 0..1
    uCumulus: 0,                     // near cumulus / drifting cloud shadows 0..1
    uFogDay: 0,                      // fog weather 0..1
    uMistP: [650, 260, 0.3, 1.3],    // valley mist: reference depth (level -x m), scale height (m), bank floor, bank gain
    uPrecipSnow: 1,                  // snowfall rate 0..1 (1 = the Phase-1 constant snowfall)
    uPrecipRain: 0,                  // rainfall rate 0..1
    uSnowFrac: 1,                    // snow share of the precipitation 0..1
    uGale: 0,                        // gale 0..1
    uHeavy: 0,                       // heavy snowfall / blizzard intensity 0..1
    uCirrus: 1,                      // cirrus amount (1 = the Phase-1 veil)
    uShadowAmp: 0.65,                // cloud-shadow strength (the Phase-1 constant)
    uView: S.cfg.view,               // ?view= debug channel (0 = off)
  };
})(window.SNOW = {});

</script>
<script>/* js/glsl/common.js */
// =====================================================================================
//  GLSL: shared chunks (frozen during the stage-1 lanes)
//   COMMON        precision, the camera / sun / clock / lighting / cloud uniforms every scene pass shares (from S.F),
//                 camera ray, integer hashes, texture value noise (uNoise, 256-periodic), octahedral normal coding
//   ENV           the per-frame environment state (weather, ground, season, precipitation) shared across the lanes,
//                 plus the ?view= selector. Every per-frame program includes it right after its precision header
//                 (COMMON or PRECISION_*); the G-buffer bake does not, so environment state can never reach the bake
//   VS_FULL       full-screen triangle (gl_VertexID only, no vertex buffers)
//   GBUF          G-buffer reads for the per-frame passes (shown buffer, the one being baked, and their mix):
//                 G0..G3(uv), layout in ARCHITECTURE.md
//   PRECISION_*   precision headers of the passes that do not include COMMON (they must precede ENV and GBUF)
//  The atmosphere functions that Phase 1 kept inside COMMON (skyColor, stratus, the cloud weather map and
//  shadows, fog) live in the ATMOS chunk (atmos.js); every program that used them includes COMMON + ENV + ATMOS.
//  A uniform must be declared exactly once per program stage: never redeclare a COMMON or ENV uniform in a chunk.
// =====================================================================================
(function (S) {
  'use strict';
  const C = S.glsl.chunks;
  C.COMMON = `
precision highp float; precision highp int; precision highp sampler2D;
uniform vec2 uRes;
uniform vec3 uCamPos, uCamR, uCamU, uCamF;
uniform float uTanH;
uniform vec3 uSunDir;
uniform float uTime;
uniform vec3 uSunCol, uSkyAmb, uSkyZen, uSkyHor, uFogCol;
uniform vec4 uFogP;      // x haze density, y haze scale height, z storm extinction, w valley-mist density
uniform vec2 uCloudOff;
uniform float uCloudCov;
uniform sampler2D uNoise;

vec3 camRay(vec2 frag) {
  vec2 ndc = frag / uRes * 2.0 - 1.0;
  return normalize(uCamF + uCamR * (ndc.x * uTanH * uRes.x / uRes.y) + uCamU * (ndc.y * uTanH));
}
uint hu(uint x) { x ^= x >> 16; x *= 0x7feb352du; x ^= x >> 15; x *= 0x846ca68bu; x ^= x >> 16; return x; }
float hf(uint x) { return float(hu(x)) * (1.0 / 4294967296.0); }
float hash2(vec2 p) { ivec2 i = ivec2(floor(p)); return hf(uint(i.x) * 0x27d4eb2du ^ hu(uint(i.y) + 0x165667b1u)); }
float sat(float x) { return clamp(x, 0.0, 1.0); }
float sq(float x) { return x * x; }

// Texture value noise (cheap, per-frame use). Texel (x,y): G = A(x,y), R = A(x+37,y+17),
// which turns one bilinear fetch into a 3D noise lookup (iq's trick).
float tnoise(vec2 x) { vec2 p = floor(x), f = fract(x); f = f * f * (3.0 - 2.0 * f); return textureLod(uNoise, (p + f + 0.5) / 256.0, 0.0).g; }
float tnoise3(vec3 x) {
  vec3 p = floor(x), f = fract(x); f = f * f * (3.0 - 2.0 * f);
  vec2 uv = p.xy + vec2(37.0, 17.0) * p.z + f.xy;
  vec2 rg = textureLod(uNoise, (uv + 0.5) / 256.0, 0.0).gr;
  return mix(rg.x, rg.y, f.z);
}

vec2 octEnc(vec3 n) {
  vec3 v = n / (abs(n.x) + abs(n.y) + abs(n.z));
  vec2 e = v.xz;
  if (v.y < 0.0) e = (1.0 - abs(e.yx)) * vec2(e.x >= 0.0 ? 1.0 : -1.0, e.y >= 0.0 ? 1.0 : -1.0);
  return e;
}
vec3 octDec(vec2 e) {
  vec3 v = vec3(e.x, 1.0 - abs(e.x) - abs(e.y), e.y);
  float t = max(-v.y, 0.0);
  v.x += v.x >= 0.0 ? -t : t; v.z += v.z >= 0.0 ? -t : t;
  return normalize(v);
}
`;
  // The per-frame environment (values and neutral defaults in S.F, see core.js / ARCHITECTURE.md). The Phase-1
  // uniforms uStorm (snow curtain) and uStormSky (overcast front) are renamed uSnowCurtain and uOvercast.
  C.ENV = `
uniform float uSnowCurtain;  // 0..1 the snow curtain (Phase 1 sim.storm): flake turbulence / streaks / thinning, shutter
uniform float uOvercast;     // 0..1 the overcast / gale front that leads and outlasts the curtain (Phase 1 sim.sky)
uniform float uCover;        // snow cover level, compared against the baked snowT (per pixel: effectiveCover() in SURFACE)
uniform vec4 uSeasonW;       // season weights (spring, summer, autumn, winter), sum 1
uniform float uTemp;         // meadow air temperature (deg C)
uniform vec2 uSnowline;      // x: snowline altitude (m), y: half-width of its transition (m)
uniform float uWet;          // 0..1 ground wetness
uniform float uCumulus;      // 0..1 near cumulus (drifting cloud shadows over the meadow)
uniform float uFogDay;       // 0..1 fog weather (valley fog sea)
uniform vec4 uMistP;         // valley mist: x reference depth (level -x m), y scale height (m), z bank floor, w bank gain
uniform float uPrecipSnow;   // 0..1 snowfall rate (1 = the Phase-1 constant snowfall)
uniform float uPrecipRain;   // 0..1 rainfall rate
uniform float uSnowFrac;     // 0..1 snow share of the precipitation
uniform float uGale;         // 0..1 gale strength
uniform float uHeavy;        // 0..1 heavy snowfall / blizzard intensity
uniform float uCirrus;       // cirrus amount (1 = the Phase-1 veil)
uniform float uShadowAmp;    // cloud-shadow strength (Phase 1: 0.65)
uniform int uView;           // ?view= debug channel (0 = off; S.VIEWS)
`;
  C.VS_FULL = `void main() { vec2 p = vec2((gl_VertexID << 1) & 2, gl_VertexID & 2); gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0); }`;

  // G-buffer reads for the per-frame passes (layout: G0 = t, mat + frac, sun shadow, AO; G1 = summer albedo, snowT;
  // G2 = oct detail normal, oct smooth normal; G3 = rock, soil / path, larch, moisture, all 0..1). While a resize rebakes, two buffers exist: uG* (the current one, baked
  // for the previous canvas) and uN* (the next, striped in from the bottom row up). The vertical FOV is fixed, so a
  // pixel of the old buffer still holds the right ray once u is rescaled by the aspect ratio change (uGb.x; columns
  // beyond the old frame clamp to its edge); rows already baked read the new buffer, so the new frame wipes up over
  // the old one and the final swap changes nothing. On the first load (uGb.z = 2) there is no old buffer: unbaked rows
  // read as sky and the composite hides them behind the reveal edge.
  //   uGb: x = new/old aspect, y = baked fraction of the next buffer (from the bottom), z = 0 one buffer, 1 both, 2 next only
  // The no-bake case (almost every frame) is one textureLod behind a uniform branch: explicit LOD, so no implicit
  // derivatives force the compiler to flatten the bake-only branches into extra fetches
  C.GBUF = `
uniform sampler2D uG0, uG1, uG2, uG3, uN0, uN1, uN2, uN3;
uniform vec3 uGb;
vec4 gbMix(vec4 nxt, vec4 cur, vec4 none, vec2 uv) { return uv.y < uGb.y ? nxt : (uGb.z > 1.5 ? none : cur); }
vec2 gbUV(vec2 uv) { return vec2(0.5 + (uv.x - 0.5) * uGb.x, uv.y); }
vec4 G0(vec2 uv) { if (uGb.z < 0.5) return textureLod(uG0, uv, 0.0); return gbMix(textureLod(uN0, uv, 0.0), textureLod(uG0, gbUV(uv), 0.0), vec4(65000.0, 0.0, 1.0, 1.0), uv); }
vec4 G1(vec2 uv) { if (uGb.z < 0.5) return textureLod(uG1, uv, 0.0); return gbMix(textureLod(uN1, uv, 0.0), textureLod(uG1, gbUV(uv), 0.0), vec4(0.0), uv); }
vec4 G2(vec2 uv) { if (uGb.z < 0.5) return textureLod(uG2, uv, 0.0); return gbMix(textureLod(uN2, uv, 0.0), textureLod(uG2, gbUV(uv), 0.0), vec4(0.0), uv); }
vec4 G3(vec2 uv) { if (uGb.z < 0.5) return textureLod(uG3, uv, 0.0); return gbMix(textureLod(uN3, uv, 0.0), textureLod(uG3, gbUV(uv), 0.0), vec4(0.0), uv); }
`;
  C.PRECISION_F = 'precision highp float;';
  C.PRECISION_FI = 'precision highp float; precision highp int;';
})(window.SNOW);

</script>
<script>/* js/glsl/atmos.js */
// =====================================================================================
//  GLSL: ATMOS chunk (stage-1 owner: lane C). Analytic sky + cirrus, the stratus deck, the cloud slab and its 2D
//  coverage field (shared by the clouds and their ground shadows), cloudShadow, aerial perspective (haze, the valley
//  mist / fog sea, storm extinction), the drifting mist banks, and the two entry points the shading pass calls:
//  skyPixel (a sky pixel before the veil) and applyAtmos (fog, deck structure and clouds over a lit surface).
//  Needs COMMON + ENV. Included by sky, shade, comp (sparkle cloud shadow), the flake VS and the rain VS. Not included
//  by the G-buffer bake, so atmosphere edits never touch (or recompile) the bake shader.
//  Its own uniforms (set by derive/atmos.js): uHorBand, uCloudP, uCloudQ, uMistQ.
// =====================================================================================
(function (S) {
  'use strict';
  const C = S.glsl.chunks;
  C.ATMOS = `
uniform vec3 uHorBand;       // pale haze band at the horizon (season; the sky colour under a deck)
uniform vec4 uCloudP;        // cloud field: x near cut left (m), y near cut right (m), z cut fade (m), w base undulation (m p-p)
uniform vec4 uCloudQ;        // x slab base (m), y slab top (m), z near grey deck (ragged base), w left/right cut split (sin azimuth)
uniform vec4 uMistQ;         // fog sea: x top swell (m, +-), y sun glow, z fog-sea weight, w unused

// Sky radiance (analytic): Rayleigh-ish zenith/horizon gradient + Mie halo around the sun,
// plus a thin, streaky cirrus veil high up (a 2D noise sheet at ~9 km), its amount set by uCirrus.
vec3 skyColor(vec3 rd) {
  float mu = dot(rd, uSunDir);
  float y = clamp(rd.y, 0.0, 1.0);
  vec3 c = mix(uSkyHor, uSkyZen, pow(y + 0.015, 0.5));
  c = mix(c, mix(uSkyHor, uHorBand, 0.5), exp(-max(rd.y, 0.0) * 30.0) * 0.5);   // pale haze band at the horizon
  if (rd.y > 0.0 && uCirrus > 0.001) {
    // dome projection (rd.y + 0.35) instead of a flat 9 km sheet: the visible sky only spans rd.y 0.02-0.17,
    // where a plane is foreshortened ~50:1 into horizontal scanlines; the dome keeps the wisps ~2:1
    // uCirrus = 1 is the Phase-1 veil (thin, widespread); less cirrus is fewer but crisper, streakier wisps (fair-
    // weather cirrus fibratus): a higher, narrower threshold, a little more opacity, the pattern stretched sideways
    vec2 q = rd.xz / (rd.y + 0.35) * 2500.0 * mix(vec2(0.45, 1.5), vec2(1.0), uCirrus) + uCloudOff * 0.12;
    float v = tnoise(q * 0.0007 + 2.0) * 0.5 + tnoise(q * 0.0017 + 7.0) * 0.3 + tnoise(q * 0.0041 + 4.0) * 0.2;
    float cir = smoothstep(mix(0.66, 0.52, uCirrus), mix(0.76, 0.8, uCirrus), v) * mix(0.2, 0.1, uCirrus) * smoothstep(0.0, 0.15, uCirrus)
              * (1.0 - 0.5 * uOvercast) * smoothstep(0.015, 0.09, rd.y);
    c = mix(c, vec3(0.9, 0.93, 0.98) * dot(uSunCol, vec3(0.11)), cir);
  }
  float s = max(mu, 0.0);
  c += uSunCol * (0.018 * pow(s, 3.0) + 0.05 * pow(s, 24.0) + 0.9 * pow(s, 1200.0));
  return c;
}
// stratus deck: brightness modulation (about -0.45..+0.3) of the overcast underside, projected on a low
// dome: a slow ragged base sheet, a fast low scud layer racing under it (the deck visibly moves), and a
// zenith-to-horizon gradient (the deck is darkest overhead, the horizon is lit by the ground below). Applied to
// the whiteout itself too (the snow curtain is lit by the deck above it), so a storm sky keeps cloud
// structure instead of collapsing into one flat grey field. Both layers drift with the cloud wind (uCloudOff) on top
// of their Phase-1 clock scroll
float stratus(vec3 rd) {
  float y = max(rd.y, 0.0);
  vec2 q = rd.xz / (y + 0.15) * 2.0 + uCloudOff * 0.0004 + vec2(uTime * 0.01, 0.0);
  float st = tnoise(q) * 0.5 + tnoise(q * 2.3 + 3.0) * 0.3 + tnoise(q * 5.1 + 7.0) * 0.2;
  vec2 q2 = rd.xz / (y + 0.08) * 3.0 + uCloudOff * 0.0012 + vec2(uTime * 0.05, uTime * 0.01);
  float sc = tnoise(q2 + 11.0) * 0.6 + tnoise(q2 * 2.1 + 5.0) * 0.4;
  float m = 0.8 * (st - 0.5) + 0.4 * (sc - 0.5) - 0.18 * smoothstep(0.0, 0.25, y);
  return m * smoothstep(-0.03, 0.1, rd.y);
}

// Large-scale cloud placement ("weather map"): ~6 km and ~2 km cells.
float weather(vec2 q) { return tnoise(q * 0.00016 + vec2(3.1, 7.7)) * 0.62 + tnoise(q * 0.00047 + vec2(9.0, 1.3)) * 0.38; }
// The 2D cloud coverage of the slab (0..1 inside a cloud field, before the billow erosion), shared by the cloud pass
// and the ground shadows so the shadows belong to the clouds that are drawn. Cumulus (uCumulus) break the weather map
// into separate cells (lobes of ~670 / 310 / 150 m, still grouped by the weather map) with blue gaps between them: at
// cloudCov .55 about 45% of the ground lies in shadow, in patches of ~0.2-1 km (mean ~500 m)
float cloudCover(vec2 q) {
  float wm = weather(q);
  if (uCumulus > 0.001) {
    float cu = wm * 0.15 + tnoise(q * 0.0015 + vec2(5.3, 2.9)) * 0.4 + tnoise(q * 0.0032 + vec2(1.7, 8.1)) * 0.3 + tnoise(q * 0.0068 + vec2(4.4, 6.6)) * 0.15;
    wm = mix(wm, (cu - 0.5) * 1.5 + 0.5, uCumulus);         // x1.5: back to the weather map's spread
  }
  return sat((wm - (1.0 - uCloudCov)) / max(uCloudCov, 0.05));
}
// 2D stand-in of the cloud pass's billow erosion (its octaves at the cumulus scale), for the shadow footprint
float billow2(vec2 q) { return tnoise(q * 0.003) * 0.5 + tnoise(q * 0.0063 + 3.7) * 0.3 + tnoise(q * 0.013 + 1.1) * 0.2; }
// Cloud shadow on the ground at p: 1 = sunlit. The point is projected along the sun to the cloud layer. The Phase-1
// field (uCumulus = 0: smaller-celled than the far clouds, ~1 km lobes) cross-fades into the cumulus cells' own
// footprint: the coverage eroded by the 2D billow noise the clouds are eroded by, sharp-edged like real cumulus shadows.
// Strength uShadowAmp, fading under a deck (no direct sun to cast them)
float cloudShadow(vec3 p) {
  float hm = mix(0.5 * (uCloudQ.x + uCloudQ.y), uCloudQ.x + 450.0, uCumulus);
  vec2 q = p.xz + uSunDir.xz / uSunDir.y * (hm - p.y) + uCloudOff;
  float sh = 0.0;
  if (uCumulus < 0.999) {
    float w = weather(q) * 0.4 + tnoise(q * 0.0012 + 2.0) * 0.35 + tnoise(q * 0.0031 + 7.0) * 0.25;
    float shape = sat((w - (1.0 - uCloudCov)) / max(uCloudCov, 0.05));
    shape += 0.16 * (tnoise(q * 0.0075 + 5.0) - 0.5);          // ragged edges that follow the cloud detail
    sh = smoothstep(0.06, 0.28, shape);
  }
  if (uCumulus > 0.001) {
    float d = cloudCover(q) * 1.1 - (1.0 - billow2(q)) * 0.58 + 0.2;
    sh = mix(sh, smoothstep(0.02, 0.16, d), uCumulus);
  }
  return 1.0 - uShadowAmp * sh * (1.0 - 0.7 * uOvercast);
}

// fog-sea top undulation (m) around the ray's entry into the layer: slow ~800 m swells drifting with half the cloud
// wind (tongues of fog climb the slopes and fall back)
float mistSwell(vec2 xz) {
  vec2 q = (xz + uCloudOff * 0.5) * 0.0012;
  return uMistQ.x * ((tnoise(q + 3.3) * 0.65 + tnoise(q * 2.7 + 8.1) * 0.35) * 2.0 - 1.0);
}
// The fog sea's banks (fog days, stage 2b). Seen from the camera (132 m) the analytic sea (top ~-72 m) can only ever
// end in one straight line at the horizon. The banks give it a living top: in the mid field (1.5-8 km) low billows
// heave the sea surface by ~+-130 m (they stay under the line of sight to the far slopes); far out (beyond ~8-15 km,
// the left massif and the far valley) banks pile up against the mountains and climb them in tongues up to ~700 m where
// the ~6 km swells are high, with clear gaps between them where the ridges and the forest stand out. fogTopH: the top
// (absolute m) at xz, d the horizontal distance from the camera; drifts with a third of the cloud wind.
// fogBanks marches it (10 geometric steps from 1.2 km to the hit / 40 km / above the highest top, plus one sample at the
// hit itself so the fog hugs the slope it lies on) and returns its optical depth and the brightness of what it sees
// (sunlit tops brighter, the bank bodies a cooler grey)
float fogTopH(vec2 xz, float d, bool full) {
  vec2 q = (xz + uCloudOff * 0.35) * 0.00052;
  // the cheap version (bracketing the surface: 3 fetches: the swells, the ~6 km groups and the ~430 m billows riding
  // on the swells, whose crests are the silhouettes of the domes) leaves out the finer octaves of the swells (their mean)
  float n = tnoise(q + 4.7) * 0.64 + (full ? tnoise(q * 2.4 + 1.9) * 0.28 + tnoise(q * 6.1 + 7.3) * 0.08 : 0.18);
  float big = tnoise(q * 0.3 + 8.3);
  float mid = smoothstep(800.0, 2400.0, d), far = smoothstep(8000.0, 15000.0, d);
  float b2 = tnoise(q * 4.6 + 2.6);
  // far out: banks piling up against the mountains, up to ~1300 m, never a flat plateau (no saturating term: the swells
  // and the billows shape every top)
  return -uMistP.x - 40.0 * mid + mid * (220.0 * (n - 0.45) + 150.0 * (b2 - 0.5)) + far * 1000.0 * smoothstep(0.2, 0.9, big) * smoothstep(0.2, 0.95, n) * (0.6 + 0.7 * b2);
}
// the sunlit share of the bank top at xz: its slope toward the sun (a crest's sunward flank is lit, its lee lies in
// the shade of the crest)
float bankSun(vec2 xz, float d, float top) {
  vec2 sh = normalize(uSunDir.xz) * 220.0;
  float sl = (fogTopH(xz + sh, d, true) - top) / 220.0;
  return clamp((uSunDir.y + 0.88 * sl) / sqrt(1.0 + sl * sl), 0.0, 1.0);
}
vec2 fogBanks(float t, vec3 rd) {
  // where a bank can be: within 8 km its top stays under ~+90 m (the camera is at 132 m: an upward ray never meets
  // it), beyond it under ~1400 m. Rays that cannot reach one skip the march (the sky, the walls above the camera)
  float hl = length(rd.xz);
  float tA = rd.y > 0.0 ? max(700.0, 8000.0 / max(hl, 1e-3)) : 700.0, tB = min(t, 40000.0);
  if (rd.y > 0.0) tB = min(tB, (1400.0 - uCamPos.y) / rd.y);
  if (tB <= tA) return vec2(0.0, 1.0);
  // the lowest point of the ray segment (its end for a descending ray) above the highest top a bank can have at that
  // distance (fogTopH's bound): no bank on this ray (the slopes above the sea, the forest band's upper part)
  float tL = rd.y < 0.0 ? tB : tA, dL = tL * hl;
  if (uCamPos.y + rd.y * tL > -uMistP.x + 160.0 * smoothstep(800.0, 2400.0, dL) + 1300.0 * smoothstep(8000.0, 15000.0, dL) + 45.0) return vec2(0.0, 1.0);
  // march the bank top as a height field (cheap version): the depth of the ray below it (m) at geometric samples, as
  // many as the span needs (4 over a short one, 8 over the whole valley); the last one is the hit itself (the slope
  // a tongue of fog lies on)
  float lr = log(tB / tA), N = clamp(ceil(lr * 2.8) + 2.0, 4.0, 8.0);
  float dmax = -1e9, tMax = tA, tIn = -1.0, tOut = tA, tPrev = tA;
  for (int i = 0; i <= 8; i++) {
    if (float(i) > N) break;
    float tt = tA * exp(lr * float(i) / N);
    vec3 p = uCamPos + rd * tt;
    float dl = fogTopH(p.xz, tt * hl, false) - p.y;
    if (dl > 0.0 && tIn < 0.0) { tIn = tt; tOut = tPrev; }
    if (dl > dmax) { dmax = dl; tMax = tt; }
    tPrev = tt;
  }
  // the soft top: a few metres near by (the forest band's crowns stand out of it), ~12 m far out
  float soft = 4.0 + 8.0 * smoothstep(1500.0, 7000.0, tMax * hl);
  if (dmax < -6.0 * soft - 60.0) return vec2(0.0, 1.0);
  // the surface the ray meets (bisection between the last sample above and the first below), or where it grazes; the
  // depth there with the full detail
  float tc = tMax;
  if (tIn > 0.0) {
    for (int k = 0; k < 3; k++) {
      float tm = 0.5 * (tOut + tIn);
      vec3 p = uCamPos + rd * tm;
      if (fogTopH(p.xz, tm * hl, false) - p.y > 0.0) tIn = tm; else tOut = tm;
    }
    tc = 0.5 * (tOut + tIn);
  } else {
    vec3 pm = uCamPos + rd * tMax;
    dmax = fogTopH(pm.xz, tMax * hl, true) - pm.y;
    if (dmax < -5.0 * soft) return vec2(0.0, 1.0);
  }
  vec3 pc = uCamPos + rd * tc;

  // the sun on the billows (0..1); the far banks flatten toward a level top's light
  float lit = mix(bankSun(pc.xz, dc, top), uSunDir.y, 0.4 * smoothstep(6000.0, 20000.0, dc));
  // optical depth: the path below the (soft) top, i.e. the deepest point the ray reaches over its descent rate (a steep
  // near ray sees the crowns and the ground 15 m under the top through a veil, a grazing far ray is white within a
  // few metres; the slope is capped so a ray skimming a crest does not see kilometres of it), 1/120 m inside; patchy:
  // wisps thin it in ~300-500 m streaks
  float wisp = 0.55 + 0.9 * tnoise(pc.xz * 0.0023 + 6.2);
  float dEff = soft * log(1.0 + exp(clamp(dmax / soft, -20.0, 20.0)));
  return vec2(dEff / max(abs(rd.y), 0.04) / 120.0 * wisp, lit);
}
// Aerial perspective: analytic integral of an exponential-height haze, an exponential mist layer (the Phase-1 valley
// mist; on fog days a dense shallow fog sea, uMistP, with its far banks) and a uniform storm whiteout. Returns
// inscatter (rgb) and transmittance (a). Mist density at altitude y: uFogP.w * exp(-(y - level) / H), level =
// -uMistP.x (+ the swell).
// banks: whether the fog sea's banks are evaluated (the shading pass: terrain and sky); fogAt (the particles' vertex
// shaders within ~250 m, the cloud pass) leaves them out, so their code never reaches those shaders
vec4 fogAtMB(float t, vec3 rd, float mistMod, bool banks) {
  float y0 = uCamPos.y;
  float ry = abs(rd.y) < 1e-4 ? 1e-4 : rd.y;
  float k = 1.0 / uFogP.y;
  float odH = uFogP.x * exp(-y0 * k) * (1.0 - exp(clamp(-ry * t * k, -30.0, 30.0))) / (ry * k);
  float H = uMistP.y;
  float lvl = -uMistP.x, sw = 0.0;
  vec3 pe = uCamPos + rd * t;
  if (uMistQ.x > 0.0) {
    // where the ray meets the fog top (or its end): the swell lifts / lowers the whole layer for this ray, and the top
    // softens with distance (a crisp sea surface near by, a diffuse shoreline on the far slopes, not a lake edge)
    float te = rd.y < -1e-4 ? min(t, (y0 - lvl) / -rd.y) : t;
    pe = uCamPos + rd * te;
    sw = mistSwell(pe.xz);
    // far out the sea lies a little lower (its banks, fogBanks, rise above it): the troughs between them let the
    // ridges show
    lvl += sw - 60.0 * uMistQ.z * smoothstep(2500.0, 9000.0, te * length(rd.xz));
    if (rd.y < -1e-4) H *= 1.0 + 0.8 * uMistQ.z * smoothstep(800.0, 5000.0, te);   // only rays that come down onto it
  }
  float km = 1.0 / H;
  float odM = uFogP.w * exp(-(y0 - lvl) * km) * (1.0 - exp(clamp(-ry * t * km, -30.0, 30.0))) / (ry * km);
  // fog days: the analytic sea is the near layer only (the chalet basin, the forest band); beyond ~3 km the banks
  // (fogBanks) are the sea, with their billowy, sun-shaded top
  odM *= 1.0 - uMistQ.z * smoothstep(900.0, 1500.0, length((pe - uCamPos).xz));
  float odS = uFogP.z * t;
  odH = max(odH, 0.0); odM = max(odM, 0.0) * mistMod;
  // the fog sea's banks (fog days): their optical depth and the sun on their top
  float odB = 0.0, sunB = 0.0;
  if (banks && uMistQ.z > 0.0 && t > 700.0) { vec2 b = fogBanks(t, rd); odB = b.x * uMistQ.z; sunB = b.y; }
  float od = odH + odM + odB + odS;
  float T = exp(-od);
  float mu = max(dot(rd, uSunDir), 0.0);
  vec3 cH = uFogCol + uSunCol * (0.03 * pow(mu, 6.0));
  vec3 cFm = mix(uFogCol, vec3(dot(uFogCol, vec3(0.33))), 0.35);
  vec3 cM = cFm * 1.02 + uSunCol * 0.012;
  // a bank: a cool blue-grey body lit by the sun on its sunward flanks (crests glow white, the lee and the troughs
  // stay a soft grey); csB: the drifting cloud shadows on it
  float csB = uMistQ.z > 0.0 ? cloudShadow(vec3(pe.x, lvl, pe.z)) : 1.0;
  vec3 cB = cFm * vec3(0.42, 0.44, 0.5) + uSunCol * 0.78 * sunB * csB;
  vec3 cS = uFogCol;
  vec3 c = (cH * odH + cM * odM + cB * odB + cS * odS) / max(od, 1e-6);
  vec4 r = vec4(c * (1.0 - T), T);
  if (uMistQ.z > 0.0) {
    // the fog sea glows white where the sun reaches its top (cloud shadows drift over it); its crests catch more light
    // than the troughs and a finer billow rolls over it, so the opaque sea keeps a soft texture. The haze and the
    // storm extinction lie in front of the low layer: composited over it in order, so the far sea fades into the haze
    vec2 bq = (pe.xz + uCloudOff * 0.5) * 0.0045;
    float bil = tnoise(bq + 1.7) * 0.6 + tnoise(bq * 2.3 + 6.1) * 0.4;
    // (lit like a level bank, so the near sea and the banks beyond it are one surface)
    vec3 cMs = cFm * vec3(0.42, 0.44, 0.5) + uSunCol * 0.78 * uSunDir.y * csB;
    cM = mix(cM, cMs, uMistQ.z) * (1.0 + 0.3 * sw / uMistQ.x + 0.24 * (bil - 0.5));
    float odF = odH + odS, TF = exp(-odF), odMB = odM + odB, TM = exp(-odMB);
    vec3 cF = (cH * odH + cS * odS) / max(odF, 1e-6);
    vec3 cMB = (cM * odM + cB * odB) / max(odMB, 1e-6);
    r = mix(r, vec4(cF * (1.0 - TF) + TF * cMB * (1.0 - TM), T), uMistQ.z);
  }
  return r;
}
vec4 fogAtM(float t, vec3 rd, float mistMod) { return fogAtMB(t, rd, mistMod, true); }
vec4 fogAt(float t, vec3 rd) { return fogAtMB(t, rd, 1.0, false); }
// drifting mist banks: density modulation sampled at the hit (or 6 km out), continuous across the horizon. The
// banks drift with half the cloud wind (natural wind only); floor / gain from uMistP.zw
float mistBanks(vec3 rd, float t) {
  float tl = min(t, 6000.0);
  vec3 p = uCamPos + rd * tl;
  vec2 q = (p.xz + uCloudOff * 0.5) * 0.00045;
  float n = tnoise(q) * 0.55 + tnoise(q * 2.3 + 4.1) * 0.3 + tnoise(q * 4.7 + 9.0) * 0.15;   // 2.2 km / 1 km / 470 m bands
  return uMistP.z + uMistP.w * smoothstep(0.35, 0.8, n);
}

// ---- entry points of the shading pass (FS_SHADE). cl: the cloud pass (premultiplied radiance, transmittance),
// cT: its opacity-weighted mean distance in km (0 = no cloud)
// a sky pixel: analytic radiance seen through ~30 km of haze, then the cloud slab composited in front, the whiteout
// toward the horizon and the deck structure (the veil is applied after this, by the caller)
vec3 skyPixel(vec3 rd, vec4 cl) {
  vec3 col = skyColor(rd);
  vec4 fs = fogAtM(30000.0, rd, 0.6);
  col = col * fs.a + fs.rgb;
  col = col * cl.a + cl.rgb;
  if (uFogP.z > 0.0) {      // the storm whiteout toward the horizon (only under a storm extinction)
    vec4 f = fogAt(30000.0, rd);
    col = mix(col, f.rgb / max(1.0 - f.a, 1e-3), clamp(uFogP.z * 900.0, 0.0, 1.0) * smoothstep(0.35, -0.02, rd.y) * 0.95);
  }
  col *= 1.0 + stratus(rd) * uOvercast * (1.0 + 0.9 * uPrecipRain);   // deck structure (a rain deck: darker scud, luminous rifts), before the veil
  return col;
}
// a lit surface at distance t: aerial perspective + storm whiteout (+ drifting mist banks / the fog sea), the deck
// structure in the whiteout, and the clouds in front of the terrain. The cloud pass stops its march at the terrain,
// so a pixel's own clouds lie in front (cT <= t); what bleeds across a silhouette from the half-res cloud buffer of
// a sky neighbour lies behind the terrain and is rejected (a distance-proportional test: no halo at any range)
vec3 applyAtmos(vec3 col, float t, vec3 rd, vec4 cl, float cT) {
  vec4 f = fogAtM(t, rd, mistBanks(rd, t));
  col = col * f.a + f.rgb;
  col *= 1.0 + stratus(rd) * uOvercast * (1.0 - f.a);     // deck structure in the whiteout (continuous with the sky)
  if (cT > 0.0) col = mix(col, col * cl.a + cl.rgb, 1.0 - smoothstep(t, t * 1.08 + 250.0, cT * 1000.0));
  return col;
}
`;

<script>/* js/glsl/gbuf-noise.js */
// =====================================================================================
//  GLSL: GBUF_NOISE chunk (G-buffer bake only). ALU value noise with analytic derivatives, 3D value noise, the
//  rock bump, fractional-octave fbm, iq's eroded fbm, ridged multifractal, softplus. Too expensive per frame:
//  only the one-time bake uses them.
// =====================================================================================
(function (S) {
  'use strict';
  const C = S.glsl.chunks;
  C.GBUF_NOISE = `
const mat2 M2 = mat2(0.8, 0.6, -0.6, 0.8);

// value noise in [-1,1] (quintic) and with analytic derivatives
float vn(vec2 x) {
  vec2 i = floor(x), f = x - i;
  vec2 u = f * f * f * (f * (f * 6.0 - 15.0) + 10.0);
  float a = hash2(i), b = hash2(i + vec2(1, 0)), c = hash2(i + vec2(0, 1)), d = hash2(i + vec2(1, 1));
  return -1.0 + 2.0 * (a + (b - a) * u.x + (c - a) * u.y + (a - b - c + d) * u.x * u.y);
}
vec3 vnd(vec2 x) {
  vec2 i = floor(x), f = x - i;
  vec2 u = f * f * f * (f * (f * 6.0 - 15.0) + 10.0);
  vec2 du = 30.0 * f * f * (f * (f - 2.0) + 1.0);
  float a = hash2(i), b = hash2(i + vec2(1, 0)), c = hash2(i + vec2(0, 1)), d = hash2(i + vec2(1, 1));
  float k1 = b - a, k2 = c - a, k4 = a - b - c + d;
  return vec3(-1.0 + 2.0 * (a + k1 * u.x + k2 * u.y + k4 * u.x * u.y), 2.0 * du * vec2(k1 + k4 * u.y, k2 + k4 * u.x));
}
// 3D value noise (for rock detail on steep faces, where heightfield noise would be stretched)
float hash3(vec3 p) { ivec3 i = ivec3(floor(p)); return hf(uint(i.x) * 0x27d4eb2du ^ hu(uint(i.y) * 0x165667b1u ^ hu(uint(i.z) + 0x9e3779b9u))); }
float vn3(vec3 x) {
  vec3 i = floor(x), f = x - i;
  vec3 u = f * f * (3.0 - 2.0 * f);
  float a = mix(mix(hash3(i), hash3(i + vec3(1, 0, 0)), u.x), mix(hash3(i + vec3(0, 1, 0)), hash3(i + vec3(1, 1, 0)), u.x), u.y);
  float b = mix(mix(hash3(i + vec3(0, 0, 1)), hash3(i + vec3(1, 0, 1)), u.x), mix(hash3(i + vec3(0, 1, 1)), hash3(i + vec3(1, 1, 1)), u.x), u.y);
  return mix(a, b, u.z) * 2.0 - 1.0;
}
float fbm3(vec3 p, float oct) {
  float a = 0.0, b = 0.5;
  for (int i = 0; i < 7; i++) {

    a += b * vn3(p) * clamp(oct - fi, 0.0, 1.0);
    b *= 0.5; p = p * 2.03 + vec3(1.7, -3.1, 2.3);
  }

  return sat(0.5 * smoothstep(0.45, 0.75, n) + 0.18 * smoothstep(60.0, 300.0, alt) + 0.22 * smoothstep(2500.0, 4500.0, length(xz)) + 0.04);
}
void gbMaterials(float t, float mat, vec3 pos, vec3 nD, vec3 nS, float fp, float hT, float hfr, float tid,
                 float sh, float ao, float canopy, float curvS, float curvLS) {
  vec3 alb; float snowT; float grass = 0.0;
  vec4 mp = vec4(0.0);
  vec2 xz = pos.xz;
  if (mat == 1.0) {
    vec2 w = xz + 180.0 * vec2(vn(xz * 0.00033 + vec2(4.1, 0.3)), vn(xz * 0.00033 + vec2(-2.3, 6.1)));
    float mtnW, valW, wallW, across, along, footD; layoutW(w, mtnW, valW, wallW, across, along, footD);
    float steep = 1.0 - smoothstep(0.42, 0.86, nS.y);
    float alt = pos.y;
    float lodD = clamp(log2(5.5 / max(fp, 0.01)), 0.0, 6.0);   // n3's 11 m base octave at Nyquist: no shimmer on the far slopes
    float wAlong = smoothstep(-3800.0, -2200.0, along) * smoothstep(14500.0, 11000.0, along);   // the wall's extent along its foot
    float faceM = smoothstep(0.02, 0.25, wallW);
    // the same ridged buttress field the height uses (terrainH): crests ~1, gullies ~0
    float butt = ridgedFbm(vec2(along / 260.0, across / 900.0) + vec2(5.0, 2.0), clamp(log2(300.0 / max(2.2 * fp, 0.5)), 0.0, 6.0));
    // local curvature (height vs. the mean of 4 neighbours) at two scales: hummocks near the camera,
    // ribs/gullies on the far slopes. + on crests, - in hollows
    float ce = max(10.0, fp * 6.0), cl = max(45.0, fp * 14.0);
    float curv = (hT - 0.25 * curvS) / ce;      // neighbour sums from phase 7
    float curvL = (hT - 0.25 * curvLS) / cl;
    // grass: yellow-olive alpine pasture; pale/dry on ribs and sunny slopes, lush in hollows, scrub patches
    float n1 = vn(xz * 0.0027 + 1.7), n3 = fbmF(xz * 0.09, lodD);
    vec3 gA = vec3(0.125, 0.140, 0.042), gB = vec3(0.185, 0.175, 0.062), gC = vec3(0.075, 0.098, 0.032);
    vec3 grassC = mix(gA, gB, smoothstep(-0.3, 0.7, n1));
    grassC = mix(grassC, gC, 0.9 * max(smoothstep(0.03, 0.14, -curv), smoothstep(0.02, 0.1, -curvL)));
    grassC = mix(grassC, gB * vec3(1.05, 1.0, 0.9), 0.8 * max(smoothstep(0.03, 0.14, curv), smoothstep(0.02, 0.1, curvL)));
    float scrub = smoothstep(0.38, 0.65, vn(xz * 0.03 + 9.1) * 0.6 + vn(xz * 0.09 + 2.2) * 0.4);   // dwarf pine / alder patches
    grassC = mix(grassC, vec3(0.05, 0.075, 0.03), 0.6 * scrub * (1.0 - steep));
    grassC = mix(grassC, vec3(0.24, 0.21, 0.08), 0.3 * smoothstep(0.5, 0.9, vn(xz * 0.012 + 5.5)) * smoothstep(0.1, 0.5, steep + 0.3 * n1));  // straw
    // 40-80 m lush / bleached patches (grazing, drainage): the macro mottle of a real pasture, +-25%
    float pch = vn(xz * 0.015 + 6.3) * 0.7 + vn(xz * 0.045 + 1.9) * 0.3;
    grassC *= 1.0 + 0.25 * pch;
    grassC = mix(grassC, grassC * vec3(0.88, 1.0, 0.75), 0.5 * smoothstep(0.1, 0.6, pch));          // bleached = yellower
    grassC = mix(grassC, grassC * vec3(0.9, 1.0, 1.1), 0.5 * smoothstep(-0.1, -0.6, pch));          // lush = deeper green
    grassC *= 0.85 + 0.3 * n3;
    grassC = mix(grassC, grassC * vec3(1.0, 0.96, 0.85), smoothstep(0.1, 0.45, steep));   // drier on slopes (never brighter than flat turf)
    grassC = mix(grassC, grassC * vec3(0.72, 0.74, 0.7), 0.7 * mtnW);                    // muted alpine turf
    // rock: grey-blue limestone, strata bands (altitude-keyed, so they stay horizontal on the faces),
    // mottling from 3D noise (2D xz noise would smear vertically on a cliff), darker water streaks
    // bedding dips ~20 deg along the strike (alt + 0.36 * along), as on the reference's wall
    float strat = vn(vec2(alt * 0.011 + along * 0.004 + 0.5 * vn(xz * 0.0015), along * 0.0013)) * 0.6 + vn3(pos * 0.006) * 0.4;
    float stk = vn3(pos * 0.012 + 3.0);
    vec3 rockC = vec3(0.155, 0.16, 0.172) * max(0.68 + 0.5 * strat, 0.12) * (0.8 + 0.3 * stk);
    rockC = mix(rockC, vec3(0.16, 0.14, 0.11), 0.3 * smoothstep(0.2, 0.8, vn3(pos * 0.004)));
    // water-stain streaks run down the fall line: noise elongated 8:1 along altitude, in the wall frame
    vec2 sq2 = vec2(along * 0.05, alt * 0.006);
    float streaks = vn(sq2) * 0.6 + vn(sq2 * vec2(2.1, 1.9) + 5.0) * 0.4 * smoothstep(8.0, 2.0, fp);
    rockC *= 0.85 + 0.3 * smoothstep(-0.5, 0.6, streaks);
    // gully cavity: the sun azimuth is only ~11 deg off the near face's normal, so the real shadow test
    // leaves its gullies as bright as the ribs. Fake the cavity shading from the baked concavity (curvL,
    // phase 7: gullies, couloirs, ledge undersides) plus the broad (2-octave) buttress field, and give each
    // rib a lit and a shaded flank from that field's along-gradient (the sun has a small +along component)
    vec2 bq = vec2(along / 260.0, across / 900.0) + vec2(5.0, 2.0);
    float bA = ridgedFbm(bq + vec2(0.17, 0.0), 2.0), bB = ridgedFbm(bq - vec2(0.17, 0.0), 2.0);
    float cav = sat(smoothstep(0.03, 0.45, -curvL) + 0.8 * (1.0 - smoothstep(0.12, 0.5, 0.5 * (bA + bB))) * faceM);
    float ribLit = clamp((bB - bA) * 3.0, -1.0, 1.0);
    rockC *= mix(1.0, 0.45, cav * mix(0.6, 1.0, faceM)) * (1.0 + 0.25 * ribLit * faceM) * (1.0 + 0.18 * smoothstep(0.03, 0.4, curvL));
    rockC = mix(rockC, rockC * vec3(0.9, 1.0, 0.85), 0.35 * smoothstep(0.0, 0.6, vn3(pos * 0.013)));  // lichen tint
    // rock/turf boundary: a noisy threshold on steepness so outcrops break through the grass instead of a smooth smear
    float rn = vn(w * 0.012 + 3.0) * 0.6 + vn(w * 0.04) * 0.4;
    float rockW = smoothstep(0.3, 0.66, steep * 1.15 + 0.22 * rn);
    rockW = max(rockW, smoothstep(1150.0, 1900.0, alt + 350.0 * vn(xz * 0.0021)) * mix(0.6, 1.0, steep));
    rockW *= smoothstep(0.0, 0.25, mtnW + valW * 0.8 + steep * 0.5);
    // the wall's foot: broken rock and turf within ~120 m below the face instead of a sunlit grass lip
    rockW = max(rockW, 0.8 * smoothstep(-130.0, 20.0, footD + 60.0 * rn) * wAlong * smoothstep(0.2, 0.7, 0.5 + 0.5 * vn(w * 0.02 + 7.0) + 0.4 * steep));
    // rock albedo from 3D noise as well (no vertical stretching on cliffs)
    float r3 = fbm3(pos / 45.0, clamp(log2(45.0 / max(1.5 * fp, 0.2)), 0.0, 6.0));
    rockC *= 0.78 + 0.5 * r3;
    alb = mix(grassC, rockC, rockW);
    // scree fans spilling from the gullies at the wall's foot: each fan is a tongue that is narrow at
    // its apex (the gully mouth) and spreads downslope, so the foot is broken up rather than banded
    float fanN = vn(vec2(along * 0.0055, 0.3)) * 0.7 + vn(vec2(along * 0.016, 0.7)) * 0.3;    // which gullies shed scree
    float fanW = smoothstep(0.0, 0.55, fanN) * (0.45 + 0.55 * smoothstep(0.0, -300.0, footD));   // widens downslope
    float scree = fanW * smoothstep(-520.0, -180.0, footD + 80.0 * vn(w * 0.01)) * smoothstep(190.0, 70.0, footD) * (1.0 - 0.6 * steep)
                * smoothstep(-3800.0, -2200.0, along) * smoothstep(5000.0, 1500.0, along) * (1.0 - rockW);
    scree *= smoothstep(0.15, 0.55, scree + 0.3 * vn(w * 0.03 + 1.0));                           // ragged edges
    alb = mix(alb, vec3(0.21, 0.19, 0.16) * (0.7 + 0.6 * r3) * (0.85 + 0.3 * n3), scree * 0.5);
    nD = normalize(mix(nD, rockBump(pos, nD, fp, 0.7), rockW * smoothstep(0.1, 0.5, steep)));
    // distant forest (beyond the tree-SDF range): dark mottled canopy with stand-scale hue variation
    float fcov = 0.0, fthr = 0.0, lsh = 0.0;
    if (fp >= TREE_FP0) {
      float fd = forestDensity(xz, alt) * (1.0 - rockW);
      float fn = 0.5 + 0.5 * vn(xz * 0.08);
      float fn2 = 0.5 + 0.5 * vn(xz * 0.35);                                    // individual crowns as speckle
      float fn3 = vn(xz * 0.02 + 4.0);
      float cov = smoothstep(0.25, 0.7, fd + 0.3 * (fn - 0.5)) * smoothstep(TREE_FP0, TREE_FP1, fp);
      // darker than the resolved trees' albedo: a canopy seen from above is mostly its own shadow. The stand's larch
      // share is in its summer colour (LARCH_REF x the same canopy factor), recoloured per frame through G3.b
      lsh = larchShare(xz, alt);
      vec3 fc = mix(mix(vec3(0.028, 0.05, 0.026), vec3(0.05, 0.066, 0.028), smoothstep(-0.3, 0.5, fn3)), LARCH_REF * 0.75, lsh) * 0.7 * (0.3 + 1.4 * fn2);
      alb = mix(alb, fc, cov * 0.9);
      ao *= 1.0 - 0.4 * cov;
      fcov = cov;
      // unresolved far canopy: stands whiten together in ~250 m drifts (low-frequency stand noise) with a small
      // per-crown jitter, lagging the meadow; a per-crown threshold alone read as salt-and-pepper
      fthr = 0.5 + 0.35 * (0.5 + 0.5 * vn(xz * 0.004 + 1.0)) + 0.1 * fn2;
    }
    // paths
    float pd = pathDist(xz);
    float pm = (1.0 - smoothstep(1.5, 2.6 + fp * 0.4, pd)) * (1.0 - mtnW);
    alb = mix(alb, vec3(0.33, 0.29, 0.22) * (0.85 + 0.2 * n3), pm);
    grass = (1.0 - rockW) * (1.0 - pm) * (1.0 - fcov) * (1.0 - 0.8 * scree);
    // ---- snow threshold: flat, high, lee-side areas get snow first; steep cliffs stay rocky
    float altF = smoothstep(1150.0, 2300.0, alt + 280.0 * vn(xz * 0.0031));
    float drift = vn(vec2(xz.x * 0.0022 + xz.y * 0.0011, xz.y * 0.0065));   // wind-elongated drifts
    float patchN = vn(xz * 0.006 + 8.1) * 0.6 + vn(xz * 0.025) * 0.4;
    float tuft = fbmF(xz * 0.7, clamp(log2(1.4 / max(fp, 0.01)), 0.0, 4.0)) * 0.6 + vn(xz * 0.09 + 3.3) * 0.4;  // grass tufts poke through (4 octaves near the camera: ~9 cm)
    // far peaks (fp > ~3 m/px): the per-pixel patch / tuft / drift thresholds would split the summit snow into
    // salt noise, so they collapse to their means and the ledge test uses the smooth normal -> continuous fields
    float farM = smoothstep(2.5, 5.0, fp);
    float ledge = smoothstep(0.55, 0.92, mix(nD.y, nS.y, farM));
    float gentle = 1.0 - smoothstep(0.78, 0.99, nS.y);
    float patchT = mix(smoothstep(-0.6, 0.6, patchN), 0.5, farM), driftT = mix(drift, 0.0, farM), tuftT = mix(tuft, 0.0, farM);
    // flat meadow thresholds are spread over ~0.12..0.95 so cover grows patch by patch for minutes.
    // Per-material order (matte's table): high/flat first, trodden path +0.16 later, bare rock +0.12 later,
    // lee faces of the prevailing (+x) wind drift in first while windward faces are scoured (-0.10 n.x),
    // and the ground under a canopy stays bare longest (+0.1..0.4 interception, varied per stand so the sheltered
    // ground becomes islands rather than one hole at the forest edge). The tuft term (0.25) is what breaks a
    // patch margin into tuft-scale fringes instead of a smooth ramp
    snowT = 0.05 + 0.62 * patchT + 0.10 * (0.5 + 0.5 * driftT) + 0.25 * (0.5 + 0.5 * tuftT) * grass
          + 0.10 * gentle + 0.16 * pm + 0.12 * rockW + steep * (0.45 + 1.0 * rockW) - 0.55 * ledge * steep * rockW
          - mix(0.95, 1.2, smoothstep(2000.0, 2600.0, alt)) * altF * (1.0 - 0.55 * steep);
    snowT -= 0.10 * nS.x * (1.0 - 0.5 * rockW);
    snowT += canopy * (0.25 + 0.15 * vn(xz * 0.01 + 5.0));
    snowT = mix(snowT, fthr, fcov);
    snowT -= 0.75 * smoothstep(2500.0, 3500.0, alt + 200.0 * driftT) * (1.0 - 0.7 * steep);   // steep far faces keep their rock
    snowT -= 0.9 * smoothstep(1500.0, 2200.0, alt) * ledge * rockW;          // old snow lying on high ledges
    // old snow in the wall's upper couloirs (concave + low buttress value), as in the reference's upper right;
    // scaled with steep so it cancels the cliff penalty, gated per gully so only some of them hold snow
    float coul = sat(smoothstep(0.03, 0.35, -curvL) + 0.7 * (1.0 - smoothstep(0.06, 0.35, butt))) * smoothstep(-0.25, 0.3, vn(vec2(along * 0.0025, alt * 0.002) + 3.0));
    snowT -= (0.6 + 1.3 * steep) * smoothstep(1100.0, 1700.0, alt) * coul * rockW * faceM;
    snowT = max(snowT, mix(0.09, -1.0, altF));
    snowT = min(snowT, mix(0.95, 3.0, rockW));     // every turf band whitens by full cover; only rock can stay bare
    // ---- G3 material parameters (the same curvature / slope / mottle terms the grass albedo uses above)
    float hollowW = max(smoothstep(0.03, 0.14, -curv), smoothstep(0.02, 0.1, -curvL));
    float ribW = max(smoothstep(0.03, 0.14, curv), smoothstep(0.02, 0.1, curvL));
    float moist = 0.5 + 0.45 * hollowW - 0.45 * ribW - 0.3 * smoothstep(0.1, 0.45, steep) - 0.2 * pch;
    mp = vec4(sat(rockW + scree), sat(pm), sat(fcov * lsh), sat(moist));
  } else if (mat == 2.0) {
    // conifer needles: dark green, per-tree hue variation (some bluish firs, larch stands), lighter toward the sunlit
    // top, darker inside / at the bottom. A crown is a larch when its random tv falls under the stand's larch share,
    // read at the crown's axis (the hit minus the outward normal x the crown radius here; the tree height follows tid
    // as in treesSDF) so a crown practically never straddles the share threshold
    float H = mix(9.0, 24.0, tid);
    vec2 ax = pos.xz - normalize(nD.xz + 1e-4) * 0.22 * H * (1.0 - hfr);
    float larch = step(1.0 - larchShare(ax, hT), fract(tid * 7.3));
    vec3 tc = mix(vec3(0.018, 0.040, 0.020), vec3(0.060, 0.080, 0.030), tid * tid);
    tc = mix(tc, vec3(0.025, 0.045, 0.042), step(0.84, fract(tid * 13.7)));
    // sun-facing needles read warm yellow-green (the lit side of a spruce is never the same hue as its shade side)
    tc = mix(tc, vec3(0.05, 0.075, 0.028), 0.6 * smoothstep(0.0, 0.6, dot(nD, uSunDir)));
    // larch: its summer reference, +-10% warmer / cooler per tree (recoloured per frame by ratio, so each crown keeps its
    // own shade of gold in autumn)
    tc = mix(tc, LARCH_REF * mix(vec3(1.1, 1.0, 0.9), vec3(0.9, 1.0, 1.1), fract(tid * 3.1)), larch);
    alb = tc * (0.75 + 0.5 * hash2(floor(pos.xz * 3.0) + floor(pos.y * 3.0))) * (0.72 + 0.5 * hfr);
    mp.b = larch;
    ao *= mix(0.35, 1.0, sqrt(hfr));
    // laden spruce (matte's clump rule on this SDF's whorl geometry): snow clumps collect on the whorl tops
    // (thr 0.10-0.55, so tops read white above C~0.6), the steep rims and undersides stay dark (thr > 1).
    // Where the whorls are not resolved (far stands) the per-pixel split would be noise, so the whole
    // crowns whiten stand by stand over C 0.5-0.95 instead (the same ~250 m stand noise as the far-canopy
    // albedo, plus a per-tree jitter): distant forest lags the meadow, then goes laden in drifts
    float up = smoothstep(0.3, 0.85, nD.y);
    float tn = 0.5 + 0.5 * vn(pos.xz * 1.7 + pos.y * 0.9 + tid * 50.0);
    float tn2 = 0.5 + 0.5 * vn(pos.xz * 4.3 + pos.y * 2.1 + tid * 20.0);
    float stand = 0.5 + 0.5 * vn(pos.xz * 0.004 + 1.0);
    float res = sat(1.7 - fp * 2.2);
    snowT = mix(0.5 + 0.35 * stand + 0.1 * tid, mix(1.05 + 0.5 * tn2, 0.10 + 0.45 * tn + 0.12 * (1.0 - hfr), up), res);
  } else if (mat == 3.0) {
    // sun-bleached timber walls (planked), darker under the eaves where the overhang shades them
    alb = vec3(0.26, 0.20, 0.13) * (0.8 + 0.3 * vn(vec2(pos.y * 4.0, pos.x + pos.z))) * (0.85 + 0.3 * hash2(floor(pos.xz * 0.03) + 0.5));
    ao *= mix(1.0, 0.55, smoothstep(2.4, 4.2, pos.y - hT));
    snowT = 3.0;
  } else {
    // dark-brown shingle roofs, weathered per chalet (33 m cells ~ one chalet) and per shingle row
    alb = vec3(0.09, 0.06, 0.04) * (0.6 + 0.8 * hash2(floor(pos.xz * 0.03))) * (0.85 + 0.3 * hash2(floor(pos.xz * 1.3)));
    snowT = 0.02 + 0.5 * (1.0 - nD.y);
  }
  o0 = vec4(t, mat + (mat == 2.0 ? hfr : grass) * 0.9, sh, ao);
  o1 = vec4(alb, snowT);
  o2 = vec4(octEnc(nD), octEnc(nS));
  mp = floor(clamp(mp, 0.0, 1.0) * 255.0 + 0.5) / 255.0;    // 8-bit steps, so the RGBA16F fallback stores (and shades) the same values
  o3 = mp;
}
`;
})(window.SNOW);

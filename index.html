<script>/* js/glsl/gbuf-main.js */
// =====================================================================================
//  GLSL: the G-buffer bake program (frozen during the stage-1 lanes).
//   GBUF_HEAD   bake uniforms, the MRT outputs, march limits
//   GBUF_MAIN   sceneQ, the single scene-query call site, and the phase state machine in main()
//  Program 'gbuf' = COMMON + GBUF_HEAD + GBUF_NOISE + GBUF_TERRAIN + GBUF_OBJECTS + GBUF_MATERIALS + GBUF_MAIN.
// =====================================================================================
(function (S) {
  'use strict';
  const C = S.glsl.chunks;
  C.GBUF_HEAD = `
uniform float uPixAng;
uniform int uIter;                  // state-machine iteration cap (a uniform bound: the driver cannot unroll the loop)
layout(location = 0) out vec4 o0;   // t, material(+grass frac), sun shadow, AO
layout(location = 1) out vec4 o1;   // albedo, snow threshold
layout(location = 2) out vec4 o2;   // oct(detail normal), oct(smooth normal)
layout(location = 3) out vec4 o3;   // season-neutral material params, 0..1: rock, soil / path, larch, moisture (RGBA8)

const float TMAX = 42000.0;
const float HMAX = 4400.0;
`;
  C.GBUF_MAIN = `
// Every terrain / scene distance query of main() goes through this ONE call site (a phase state machine
// drives it, matte-style), so the big height function and the tree / chalet SDFs are inlined exactly once:
// the shader stays small and compiles quickly on ANGLE/Metal (Safari) instead of inlining terrainH ~25x.
//   mode 0: heightfield only (returns p.y - h)
//   mode 1: full scene for the march / SDF normals: trees (with a bounding slab above them) + chalets
//   mode 2: sun-shadow ray: trees only where the ray is near the ground, no slab, no chalets
// mat: 1 terrain, 2 tree, 3 wall, 4 roof. fpO is the footprint used for the objects (the shadow ray keeps
// the surface's footprint for the trees while the terrain LOD coarsens along the ray).
float sceneQ(vec3 p, float fp, float fpO, int mode, out float mat, out float hb, out float dTree, out float hfr, out float tid) {
  hb = terrainH(p.xz, fp);
  float dy = p.y - hb;
  mat = 1.0; dTree = 1e5; hfr = 0.0; tid = 0.0;
  if (mode == 0) return dy;
  bool near = fpO < TREE_FP1 && dy < 36.0;
  if (near) dTree = treesSDF(p, hb, fpO, hfr, tid);
  if (mode == 2) return min(dy, dTree);
  float d = dy * 0.42;
  if (fpO < TREE_FP1 && !near) d = min(d, dy - 35.5);
  if (dTree < d) { d = dTree; mat = 2.0; }
  if (nearChalets(p.xz) > 0.5 && dy < 14.0) { float cm; float dc = chaletsSDF(p, hb, cm); if (dc < d) { d = dc; mat = cm; } }
  return d;
}

void main() {
  vec3 rd = camRay(gl_FragCoord.xy);
  vec3 ro = uCamPos;
  float t = 2.0, tPrev = t, mat = 0.0;
  float bA = 0.0, bB = 0.0;                                   // bisection bracket
  vec3 pos = vec3(0.0), nD = vec3(0.0, 1.0, 0.0), nS = nD, so = vec3(0.0);
  float fp = 0.0, hT = 0.0, hfr = 0.0, tid = 0.0, sh = 1.0, ts = 0.0, ao = 1.0, canopy = 0.0;
  float hN[8]; vec4 tet = vec4(0.0);
  float occ = 0.0, wsum = 0.0, curvS = 0.0, curvLS = 0.0;
  bool hit = false;
  int phase = 0, j = 0, mi = 0;
  const vec2 k2 = vec2(1.0, -1.0);
  // phases: 0 march -> 1 bisection refine (heightfield, steep cliffs) -> 2 height at the hit -> 3 normal probes
  //         -> 4 soft sun shadow -> 5 AO horizon probes along the normal -> 6 canopy proximity -> 7 curvature -> 8 done
  for (int it = 0; it < uIter; it++) {
    vec3 q; float qf, qfo; int mode;
    if (phase == 0) { q = ro + rd * t; qf = t * uPixAng; qfo = qf; mode = 1; }
    else if (phase == 1) { float mt = 0.5 * (bA + bB); q = ro + rd * mt; qf = mt * uPixAng; qfo = qf; mode = 0; }
    else if (phase == 2) { q = pos; qf = fp; qfo = fp; mode = 0; }
    else if (phase == 3) {
      if (mat == 1.0) {
        // central differences at two scales: j<4 detail normal (fine footprint), j<8 smooth normal
        float e = j < 4 ? max(0.05, fp * 0.6) : max(1.5, fp * 5.0);
        int jj = j & 3;
        vec2 o = jj == 0 ? vec2(e, 0.0) : jj == 1 ? vec2(-e, 0.0) : jj == 2 ? vec2(0.0, e) : vec2(0.0, -e);
        q = vec3(pos.x + o.x, pos.y, pos.z + o.y); qf = j < 4 ? fp * 0.45 : fp * 5.0; qfo = qf; mode = 0;
      } else {
        // tetrahedral gradient of the scene SDF
        float e = max(0.03, fp * 0.5);
        vec3 kk = j == 0 ? k2.xyy : j == 1 ? k2.yyx : j == 2 ? k2.yxy : k2.xxx;

    }
    else if (phase == 4) { q = so + uSunDir * ts; qf = max(fp, ts * 0.004); qfo = fp; mode = (fp < TREE_FP1 && ts < 450.0) ? 2 : 0; }
    else if (phase == 5) { float hh = max(1.5, fp * 2.0) * pow(3.0, float(j)); q = pos + nS * hh; qf = max(fp, hh * 0.2); qfo = qf; mode = 0; }
    else if (phase == 6) { q = pos + vec3(0.0, 1.5, 0.0); qf = fp; qfo = fp; mode = 1; }
    else if (phase == 7) {

      float e = j < 4 ? max(10.0, fp * 6.0) : max(45.0, fp * 14.0);
      int jj = j & 3;

      else { tPrev = t; t += max(d, 0.25 * qf); }
    } else if (phase == 1) {
      float mt = 0.5 * (bA + bB); if (d < 0.0) bB = mt; else bA = mt;
      if (++j >= 6) { t = bB; pos = ro + rd * t; fp = t * uPixAng; phase = 2; }
    } else if (phase == 2) { hT = hb_; phase = 3; j = 0; }
    else if (phase == 3) {
      bool done;

        hN[j] = hb_; done = ++j >= 8;

      } else {
        tet[j] = d; done = ++j >= 4;

      }
      if (done) {
        if (dot(nD, uSunDir) > -0.2) { so = pos + nD * max(0.15, fp * 2.0); ts = 0.4; phase = 4; j = 0; }
        else { sh = 0.0; phase = 5; j = 0; }
      }
    } else if (phase == 4) {
      sh = min(sh, 10.0 * d / ts);
      ts += clamp(d * 0.55, 0.25 + ts * 0.012, 60.0 + ts * 0.06);
      if (sh < 0.002 || ++j >= 110 || ts > 22000.0 || so.y + uSunDir.y * ts > HMAX) { phase = 5; j = 0; }
    } else if (phase == 5) {
      float hh = max(1.5, fp * 2.0) * pow(3.0, float(j));
      occ += clamp((hh - d) / hh, 0.0, 1.0) * (1.0 / float(j + 1)); wsum += 1.0 / float(j + 1);
      if (++j >= 5) { ao = clamp(1.0 - 1.5 * occ / wsum, 0.0, 1.0); phase = mat == 1.0 ? (fp < TREE_FP1 ? 6 : 7) : 8; j = 0; }
    } else if (phase == 6) {

      // interception term below (the ground beneath a spruce stays bare longest)
      canopy = 1.0 - smoothstep(-0.5, 4.5, dT_); ao *= mix(1.0, 0.45, canopy); phase = 7; j = 0;
    }

  if (!hit) { o0 = vec4(65000.0, 0.0, 1.0, 1.0); o1 = vec4(0.0); o2 = vec4(0.0); o3 = vec4(0.0); return; }
  sh = smoothstep(0.0, 1.0, clamp(sh, 0.0, 1.0));
  // ---- materials
  gbMaterials(t, mat, pos, nD, nS, fp, hT, hfr, tid, sh, ao, canopy, curvS, curvLS);
}
`;
  S.glsl.progs.gbuf = { vs: ['VS_FULL'], fs: ['COMMON', 'GBUF_HEAD', 'GBUF_NOISE', 'GBUF_TERRAIN', 'GBUF_OBJECTS', 'GBUF_MATERIALS', 'GBUF_MAIN'] };

<script>/* js/glsl/surface.js */
// =====================================================================================
//  GLSL: SURFACE chunk (stage-1 owner: lane D). The per-frame ground: the snow cover model (effectiveCover and
//  snowCover: the ONE place the cover level and the altitude snowline become a per-pixel snow fraction), the
//  seasons of the season-neutral bake (grass, wildflowers, larch, spruce), thaw and wet snow, wet ground and
//  puddles, the wind-packed snow relief, and shadeSurface, the lit surface colour of a G-buffer hit that the shading
//  pass calls. Also surfaceDebug for the ?view= channels. Needs COMMON + ENV + ATMOS (cloudShadow) + GBUF. Included
//  by the shading pass only: the composite sparkle and the flake colour-over-snow read the snow fraction that
//  FS_SHADE writes to the scene alpha (snow x sun visibility), so they never recompute cover.
// =====================================================================================
(function (S) {
  'use strict';
  const C = S.glsl.chunks;
  // The snowline offset model, shared by the GLSL effectiveCover below and its JS twin S.snowlineOffset (used by
  // derive/surface.js for visCover / coverAt and through it by derive/atmos.js for the exposure): both are built from
  // these constants, so the CPU estimate of the visible snow cannot drift from what the shader draws. The JS twin
  // omits only the per-pixel aspect / noise shift of the altitude.
  //   offset(a) = K (1 - smooth(line - w, line + w, a)) + K2 (1 - smooth(line - LO, line - HI, a))
  const SL = { K: 0.9, K2: 1.3, LO: 1600, HI: 500 };
  const f = v => (Number.isInteger(v) ? v.toFixed(1) : String(v));
  S.snowlineOffset = (a, line, w) => SL.K * (1 - S.smooth(line - w, line + w, a)) + SL.K2 * (1 - S.smooth(line - SL.LO, line - SL.HI, a));
  C.SURFACE = `
uniform vec3 uGrassDisp;     // integrated (slow) wind displacement -> rolling grass waves, wrapped by its noise period on the CPU
uniform float uYearPhase;    // year phase 0..1 (0 = 1 March): the vegetation clock
uniform float uMelt;         // 0..1: 1 while no snow is falling (then thaw order and wet snow follow the local air temperature)

// ---- snow cover model
// The per-frame altitude snowline: below uSnowline.x (+- uSnowline.y) the cover level drops by SNOWLINE_K, so the lower
// slopes go bare while the high ground (the lowest snowT: summit flats, ledges, couloirs) keeps its snow; a further
// SNOWLINE_K2 0.5-1.6 km below the line clears even those. The altitude is shifted by the sun exposure (the line sits up
// to ~300 m higher on sunny slopes than on shaded ones) and a ~1.5 km undulation, so it follows the relief and the
// threshold patches instead of a contour. The neutral default (a snowline far below the scene) gives an offset of
// exactly 0: the Phase-1 cover. snowT itself stays the baked, season-neutral order.
const float SNOWLINE_K = ${f(SL.K)}, SNOWLINE_K2 = ${f(SL.K2)};   // = SL in JS (S.snowlineOffset)
const float LAPSE = 0.0065;  // deg C per m; uTemp is the meadow's (at ~0 m)
float effectiveCover(float alt, float sunExp, vec2 xz) {
  float a = alt - 320.0 * (sunExp - 0.45) + 260.0 * (tnoise(xz * 0.0006 + 3.7) - 0.5);
  return uCover - SNOWLINE_K * (1.0 - smoothstep(uSnowline.x - uSnowline.y, uSnowline.x + uSnowline.y, a))
                - SNOWLINE_K2 * (1.0 - smoothstep(uSnowline.x - ${f(SL.LO)}, uSnowline.x - ${f(SL.HI)}, a));
}
// snow fraction of a pixel with threshold snowT at distance t for the effective cover cEff. The ramp is tight
// (+-0.025) on the resolved meadow so margins break at the tuft scale of the threshold field, wide (+-0.07) only
// where the far canopy / summit thresholds are unresolved means
float snowCover(float snowT, float cEff, float t) {
  float cw = mix(0.025, 0.07, smoothstep(1200.0, 2600.0, t));
  return smoothstep(snowT - cw, snowT + cw, cEff);
}

// wind-packed snow surface: dunes elongated along the prevailing (+x) wind, big drifts on the far slopes
// and sastrugi ripples near the camera. Its xz gradient tilts the shading normal so full cover shows form
// instead of a flat white fill; each scale fades out before it would alias
float driftH(vec2 p, float t) {
  // dune axis ~30 deg off the sun azimuth (which is also the wind line), so the flanks catch the low sun
  vec2 d = vec2(p.x * 0.866 - p.y * 0.5, p.x * 0.5 + p.y * 0.866);
  vec2 q = vec2(d.x * 0.06, d.y * 0.15);                                                        // dunes ~17 x 7 m
  float h = (tnoise(q + 3.0) + 0.5 * tnoise(q * 2.2 + 9.0)) * 6.0 * smoothstep(7000.0, 400.0, t);
  h += tnoise(vec2(p.x * 0.012, p.y * 0.02) + 1.0) * 16.0 * smoothstep(16000.0, 1500.0, t);       // drifts ~80 x 50 m
  h += tnoise(vec2(d.x * 0.45, d.y * 1.2) + 5.0) * 0.45 * smoothstep(1400.0, 120.0, t);          // sastrugi ~2 m
  return h;
}

// ---- seasons. pS / pA: the year phase as the vegetation at this altitude lives it, for the spring and the autumn
// events (spring arrives later and autumn earlier with height). Every recolour keeps the bake's texture (mottle, tufts,
// crowns, shading): the larch is a ratio to its baked summer reference, the grass keeps the baked luminance.
// Grass through the year, from the baked summer pasture b (G1) and its moisture m (G3.a: 0 dry rib .. 1 lush hollow).
// The baked luminance relative to the mean pasture (0.097) carries the texture; the season sets the colour of a mean
// pixel: dormant straw / grey-brown -> spring flush (light fresh green; moist ground first, where the snow lay longest,
// i.e. low snowT, later) -> high-summer deep green -> late summer: the baked (Phase-1) pasture, olive with pale ribs, the dry
// ribs turning gold -> autumn tawny / amber / ochre (olive-russet in the hollows, ~250 m drifts of hue) -> dormant
// again. hv: the hue-drift noise 0..1
vec3 grassSeason(vec3 b, float m, float pS, float pA, float hv) {
  float L = dot(b, vec3(0.3, 0.6, 0.1)) / 0.097;
  float dry = 1.0 - m;
  vec3 dorm = mix(vec3(0.074, 0.062, 0.042), vec3(0.13, 0.102, 0.06), dry);
  // the natural alpine palette (stage 2b, after the reference photo): yellow-olive, never lime. Spring is a light,
  // fresh yellow-green (moist ground a touch greener); summer is deeper: lush, darker olive-green hollows against
  // sun-bleached yellow-olive ribs; hv drifts the hue over ~250 m (greener / yellower swathes)
  vec3 spM = vec3(0.086, 0.11, 0.032), spD = vec3(0.124, 0.134, 0.042);
  vec3 suM = vec3(0.047, 0.071, 0.018), suD = vec3(0.134, 0.128, 0.027);
  vec3 drift = mix(vec3(0.95, 1.0, 1.05), vec3(1.07, 1.0, 0.9), hv);
  // the flush is quick at each spot (moist ground first): patches of new green among last year's straw, not a muddy blend
  vec3 c = mix(dorm, mix(spM, spD, dry) * drift, smoothstep(0.07, 0.15, pS + 0.06 * (m - 0.5)));
  c = mix(c, mix(suM, suD, smoothstep(0.1, 0.9, dry)) * drift, smoothstep(0.23, 0.35, pS));
  c = mix(c, b / max(L, 0.05), smoothstep(0.38, 0.47, pA));
  c = mix(c, vec3(0.17, 0.128, 0.042), smoothstep(0.4, 0.52, pA) * smoothstep(0.25, 0.75, dry));
  vec3 tawny = mix(vec3(0.16, 0.1, 0.034), vec3(0.17, 0.084, 0.032), hv);     // ochre-tawny .. rust-amber drifts
  c = mix(c, mix(vec3(0.075, 0.072, 0.032), tawny, smoothstep(0.2, 0.7, dry)), smoothstep(0.48, 0.6, pA));
  c = mix(c, dorm, smoothstep(0.64, 0.8, pA));
  return c * L;
}
// larch through the year (absolute albedo; LARCH_REF is the baked summer crown, = gbuf-materials): bare grey-brown
// twigs -> bright lime flush -> soft summer green -> autumn gold deepening to orange -> needles drop
const vec3 LARCH_REF = vec3(0.075, 0.10, 0.034);
vec3 larchSeason(float pS, float pA) {
  vec3 bare = vec3(0.09, 0.08, 0.062);
  vec3 c = mix(bare, vec3(0.13, 0.2, 0.033), smoothstep(0.07, 0.16, pS));
  c = mix(c, LARCH_REF, smoothstep(0.17, 0.3, pS));
  c = mix(c, vec3(0.36, 0.17, 0.018), smoothstep(0.52, 0.6, pA));
  c = mix(c, vec3(0.34, 0.11, 0.014), 0.6 * smoothstep(0.61, 0.69, pA));
  return mix(c, bare, smoothstep(0.69, 0.77, pA));
}
float larchLeaf(float pS, float pA) { return smoothstep(0.07, 0.16, pS) * (1.0 - smoothstep(0.69, 0.77, pA)); }
// two independent value noises from one fetch of uNoise (G = A(x, y), R = A(x + 37, y + 17); COMMON's tnoise reads G)
vec2 tnoise2(vec2 x) { vec2 p = floor(x), f = fract(x); f = f * f * (3.0 - 2.0 * f); return textureLod(uNoise, (p + f + 0.5) / 256.0, 0.0).gr; }
// wildflowers on the grass: crocus at the fresh melt margin in early spring, then the meadow bloom of late spring /
// early summer (buttercup yellow, daisy / umbellifer white, salvia purple, bellflower / gentian blue) in drifts.
// Every noise is >= 3 m (the half-float position error is <= 0.25 m on the meadow), and beyond ~1.2 km the 3 m tufts
// average into a colour wash: a tint of the pasture, never confetti
vec3 flowers(vec3 alb, vec2 q, float t, float pS, float m, float flat_, float margin) {
  float crocus = smoothstep(0.0, 0.05, pS) * (1.0 - smoothstep(0.12, 0.19, pS)) * (0.25 + 0.75 * margin);
  float bloom = smoothstep(0.12, 0.2, pS) * (1.0 - smoothstep(0.33, 0.43, pS));
  float b = max(crocus, bloom), bf = b * flat_;
  if (bf < 0.004) return alb;
  vec2 dr = tnoise2(q * 0.017 + 3.0);                                                    // ~60 m drifts: x species, y density
  float sp = dr.x, patchN = tnoise(q * 0.06 + 13.0) * 0.6 + dr.y * 0.4;                  // ~17 m tufts in the drifts
  float speck = t < 1500.0 ? mix(0.5, tnoise(q * 0.33 + 7.0), smoothstep(1500.0, 900.0, t)) : 0.5;   // 3 m clumps (mean far away)
  float vio = smoothstep(0.56, 0.64, sp), wht = smoothstep(0.38, 0.5, sp) * (1.0 - vio);
  vec3 fc = mix(vec3(0.6, 0.44, 0.03), vec3(0.5, 0.48, 0.4), wht);
  fc = mix(fc, mix(vec3(0.24, 0.06, 0.36), vec3(0.13, 0.08, 0.42), smoothstep(0.68, 0.8, sp)), vio);   // salvia .. bellflower
  float cw = crocus / b;
  fc = mix(fc, mix(vec3(0.36, 0.22, 0.56), vec3(0.55, 0.52, 0.56), smoothstep(0.4, 0.6, sp)), cw);   // violet / white crocus
  // a soft stipple, not paint: the clumps modulate the drift's cover instead of cutting it out (violets: looser)
  float f = bf * smoothstep(0.38, 0.8, patchN) * mix(0.25, 1.0, smoothstep(mix(0.2, 0.4, vio), mix(0.8, 0.9, vio), speck)) * (0.55 + 0.45 * m);
  return mix(alb, fc, 0.3 * f * mix(1.0 - 0.3 * wht, 1.0, cw));
}

// The lit surface of a G-buffer hit (before aerial perspective): seasons, snow coverage, cloud shadows, grass sheen and
// the matted turf at the melt margin, wet ground, snow relief, sun / sky / bounce lighting, the snow's shade glow and
// sheen, and the wet gloss / puddles. uv is the (sway-remapped) G-buffer coordinate, g0 its G0, rd the view ray, t the
// hit distance. snowMask: the snow fraction x the sun visibility (baked shadow x cloud shadow), 0 on wet / thawing
// snow; written to the scene alpha for the composite sparkle and the flake tint
vec3 shadeSurface(vec2 uv, vec4 g0, vec3 rd, float t, out float snowMask) {
  vec4 g1 = G1(uv), g2 = G2(uv);
  vec4 g3 = floor(G3(uv) * 255.0 + 0.5) / 255.0;    // the 8-bit values, so the RGBA16F fallback shades identically
  vec3 pos = uCamPos + rd * t;
  vec3 nD = octDec(g2.xy), nS = octDec(g2.zw);
  float mat = floor(g0.y + 0.001);
  float grass = mat == 1.0 ? fract(g0.y + 0.001) / 0.9 : 0.0;
  vec3 alb = g1.rgb;
  float snowT = g1.w;
  float ao = g0.w;
  float cs = cloudShadow(pos);
  float sh = g0.z * cs;
  // the vegetation clock here: ~0.1 yr (5 weeks) per km of height above the meadow
  float dly = 1e-4 * pos.y, pS = uYearPhase - dly, pA = uYearPhase + dly;
  float leaf = 1.0;                                // larch foliage (0 = bare twigs)
  if (mat == 2.0) {
    if (g3.b > 0.5) {
      alb *= larchSeason(pS, pA) / LARCH_REF;
      leaf = larchLeaf(pS, pA);
      snowT += 0.12 * (1.0 - leaf);                // bare twigs hold less snow
    } else alb *= 1.0 - 0.15 * uSeasonW.w;         // spruce / fir: a shade darker in winter
  } else if (mat == 1.0) {
    float hv = tnoise(pos.xz * 0.004 + 1.3);
    alb = mix(alb, grassSeason(alb, g3.a, pS - 0.1 * (0.55 - clamp(snowT, -0.5, 1.2)), pA, hv), grass);
    if (g3.b > 0.004) alb *= 1.0 + g3.b * (larchSeason(pS, pA) / LARCH_REF - 1.0);   // the larch share of the far canopy
  }
  // snow: the sun exposure lifts the snowline on sunny slopes (trees: their crown aspect only weakly); while it thaws
  // (no snowfall, air above 0 deg C at this altitude) sunny patches melt out first and shaded ones linger, and the
  // dark roofs and the trees shed theirs early. The exposure is the slope's aspect with the cast shadow only in part: the sun
  // moves over the day, so a tree's crisp afternoon shadow must not print a snow strip of its own shape
  float sunExp = max(dot(nS, uSunDir), 0.0) * (0.8 + 0.2 * g0.z);
  float cEff = effectiveCover(pos.y, mat == 2.0 ? mix(0.45, sunExp, 0.3) : sunExp, pos.xz);
  float thaw = uMelt * smoothstep(0.0, 3.0, uTemp - LAPSE * pos.y);
  snowT += thaw * (mat == 4.0 ? 0.35 : mat == 2.0 ? 0.4 : 0.22 * (sunExp - 0.45));
  float snow = snowCover(snowT, cEff, t);
  float wetSnow = max(thaw, uWet);
  // wind waves rolling over the grass (brightness sheen travelling with the wind); short dormant turf barely moves
  vec2 gq = (pos.xz - uGrassDisp.xz * 1.0) * 0.045;
  float wave = tnoise(gq) * 0.65 + tnoise(gq * 2.7 + 5.0) * 0.35;
  float tall = mix(0.4, 1.0, smoothstep(0.1, 0.25, pS) * (1.0 - smoothstep(0.66, 0.8, pA)));
  alb *= 1.0 + grass * (1.0 - snow) * (wave - 0.5) * (0.22 + 0.25 * uGale) * tall * smoothstep(3000.0, 300.0, t);   // stronger in a gale
  // the melt margin: as the snow edge closes in on a patch (or has just left it) the turf is matted, flattened
  // straw-olive; further out the season's colour (green-up) takes over. Crocus bloom right along it
  // (stage 2b: a narrower margin, so the first snowfall on a tawny meadow leaves the meadow tawny between the patches
  // instead of greying all of it long before the snow arrives)
  float kill = smoothstep(snowT - 0.3, snowT, cEff);
  alb = mix(alb, vec3(dot(alb, vec3(0.3, 0.5, 0.2))) * vec3(1.08, 0.97, 0.72) * 0.8, grass * 0.7 * kill);
  if (mat == 1.0) alb = flowers(alb, pos.xz, t, pS, g3.a, grass * smoothstep(0.85, 0.97, nS.y), kill * (1.0 - snow));
  // wet ground darkens by porosity: path / bare soil most, rock, then turf; trees and walls a little, roofs more
  float por = mat == 1.0 ? min(0.62 * g3.g + 0.3 * g3.r + 0.18 * grass, 0.62) : mat == 4.0 ? 0.4 : 0.1;
  alb *= 1.0 - uWet * por;
  // wet turf is deeper and richer (water fills the gaps between the blades: less grey scatter)
  alb = mix(vec3(dot(alb, vec3(0.3, 0.6, 0.1))), alb, 1.0 + 0.4 * uWet * grass);
  vec3 n = normalize(mix(nD, nS, snow * 0.3));
  if (mat == 1.0 && snow > 0.001) {
    float e = max(0.4, t * 0.0015);
    float h0 = driftH(pos.xz, t);
    vec2 gr = vec2(driftH(pos.xz + vec2(e, 0.0), t) - h0, driftH(pos.xz + vec2(0.0, e), t) - h0) / e;
    n = normalize(n + vec3(-gr.x, 0.0, -gr.y) * snow);
  }
  // snow albedo: wet / thawing snow is greyer (melt water fills the pores) and smoother, its thinning rim slushy grey
  float slush = thaw * smoothstep(0.22, 0.0, cEff - snowT);
  vec3 snowAlb = vec3(0.84, 0.88, 0.94) * (mat == 2.0 ? 0.9 : 1.0) * mix(vec3(1.0), vec3(0.8, 0.82, 0.83), wetSnow) * (1.0 - 0.22 * slush);
  vec2 rq = pos.xz * vec2(0.09, 0.3);
  snowAlb *= 0.93 + 0.07 * tnoise(rq + vec2(rq.y * 0.4, 0.0)) * smoothstep(1500.0, 200.0, t) * (1.0 - 0.6 * wetSnow);  // wind-packed ripples
  vec3 a = mix(alb, snowAlb, snow);
  float ndl = dot(n, uSunDir);
  float wrap = 0.18 * snow;
  float diff = clamp((ndl + wrap) / (1.0 + wrap), 0.0, 1.0);
  vec3 skyL = uSkyAmb * (0.62 + 0.38 * n.y);
  vec3 bounce = vec3(0.2, 0.22, 0.12) * dot(uSunCol, vec3(0.1)) * (0.5 - 0.5 * n.y) * mix(1.0, 3.0, sat(cEff));
  // needle canopy translucency; thin golden / lime larch needles glow on their shaded side
  if (mat == 2.0) diff = diff * 0.75 + (0.1 + 0.4 * g3.b * leaf * (1.0 - snow)) * clamp(-ndl, 0.0, 1.0);
  vec3 col = a * (uSunCol * diff * sh + (skyL + bounce) * ao);
  // snow: blue-tinted subsurface glow in shade, soft sheen (the sparkles are added in the composite, after FXAA)
  col += snow * a * uSkyAmb * vec3(0.12, 0.26, 0.58) * (1.0 - sh) * ao * (1.0 - 0.5 * wetSnow);   // blue sky-lit shade (dry snow)
  vec3 hv = normalize(uSunDir - rd);
  float nh = max(dot(n, hv), 0.0);
  col += snow * uSunCol * sh * (0.05 * pow(nh, 18.0) + 0.04 * pow(1.0 - max(dot(n, -rd), 0.0), 5.0) + 0.12 * wetSnow * pow(nh, 60.0));
  // wet gloss: a water film on the path, rock and roofs reflects the sky (Fresnel, a cheap sky gradient; rays that
  // leave low see the dark slopes instead). Puddles collect in the flat stretches of the path: flat mirrors that
  // spread as the ground gets wetter, and dry back as uWet falls
  // (from wetness .03, faded in to .08: a barely damp meadow pays nothing for the gloss)
  if (uWet > 0.03) {
    float gloss = mat == 1.0 ? 0.95 * g3.g + 0.5 * g3.r + 0.05 * grass : mat == 4.0 ? 0.6 : 0.04;
    float pud = 0.0;
    if (g3.g > 0.02) {
      // ~2.2 m pools in ~7 m ruts, gathered on ~20 m wet stretches of the track
      vec2 pq = pos.xz;
      float pn = tnoise(pq * 0.45 + 2.0) * 0.45 + tnoise(pq * 0.15 + 9.0) * 0.3 + tnoise(pq * 0.05 + 4.0) * 0.25;
      pud = g3.g * smoothstep(0.955, 0.985, nS.y) * smoothstep(0.0, 0.06, pn - 1.0 + 0.5 * uWet);
    }
    vec3 nw = normalize(mix(nD, nS, 0.5 + 0.5 * pud));
    vec3 r = reflect(rd, nw);
    float F = 0.02 + 0.98 * pow(1.0 - max(dot(nw, -rd), 0.0), 5.0);
    // (the sky seen in the water: the luminous deck is brighter than its zenith colour suggests, so the wet path,
    // the rocks, the roofs and the puddles glisten)
    vec3 skyR = mix(uSkyHor, uSkyZen, sqrt(sat(r.y))) * mix(0.35, 1.35, smoothstep(0.0, 0.25, r.y));
    // (a puddle is a mirror of the bright deck even at this grazing view: at least ~35% of the sky, so it reads light
    // against the dark wet ground)
    float k = uWet * smoothstep(0.03, 0.08, uWet) * (1.0 - snow) * max(gloss * F, pud * (0.35 + 0.65 * F));
    col = mix(col * (1.0 - 0.5 * pud * uWet), skyR, k);       // a puddle hides the mud under dark water
  }
  // sun visibility for the sparkle: the baked sun shadow and the drifting cloud shadows; wet snow does not glint
  snowMask = snow * g0.z * smoothstep(0.5, 0.95, cs) * (1.0 - wetSnow);
  return col;
}

// ?view= debug channels (uView, S.VIEWS): display-ready colour (the composite passes it through ungraded). Scalars
// are grey; snowT and cEff show 0..1 as grey, below 0 red (snowy at no cover), above 1 blue (bare at full cover)
vec3 dbgSigned(float v) { return v < 0.0 ? vec3(1.0, 0.25, 0.2) * min(-v, 1.0) + vec3(0.15) : v > 1.0 ? vec3(0.2, 0.35, 1.0) * min(v - 1.0, 1.0) + vec3(0.3) : vec3(v); }
vec3 surfaceDebug(int view, vec2 uv, vec4 g0, vec3 rd, float t) {
  vec4 g1 = G1(uv), g3 = G3(uv);
  if (view == 1) return pow(clamp(g1.rgb, 0.0, 1.0), vec3(1.0 / 2.2));
  if (view == 2) return dbgSigned(g1.w);
  if (view == 3) return vec3(g3.r);
  if (view == 4) return vec3(g3.g);
  if (view == 5) return vec3(g3.b);
  if (view == 6) return vec3(g3.a);
  vec3 pos = uCamPos + rd * t;
  if (view == 7) return dbgSigned(effectiveCover(pos.y, max(dot(octDec(G2(uv).zw), uSunDir), 0.0) * (0.8 + 0.2 * g0.z), pos.xz));
  return vec3(sat(uWet)) * (0.4 + 0.6 * min(0.75 * g3.g + 0.4 * g3.r, 1.0));   // wetness x gloss potential
}
`;

<script>/* js/glsl/sky.js */
// =====================================================================================
//  GLSL: the cloud pass (stage-1 owner: lane C). Half resolution, temporally accumulated volumetric cloud slab.
//  Stores premultiplied cloud light + transmittance and an opacity-weighted cloud distance (km); the analytic sky is
//  evaluated in the shading pass so clouds can be composited over the sky or the far peaks. The march stops at the
//  terrain (G0's hit distance through the GBUF chunk, bound by render.js like every other pass: during a resize rebake
//  the baked rows read the new buffer and the rest the old one, aspect-remapped), so only cloud in front of a ridge is
//  accumulated: near cumulus can drift in front of the massif without a halo of the cloud behind it, and pixels whose
//  terrain is nearer than the slab (the right wall, the mid ridge) skip the march altogether.
// =====================================================================================
(function (S) {
  'use strict';
  const C = S.glsl.chunks;
  C.FS_SKY = `
uniform sampler2D uPrev, uPrevD;
uniform float uBlend, uFrame, uSteps;
uniform float uSkyResp;      // 1 on a jump of the cloud inputs: restart the temporal accumulation this frame
layout(location = 0) out vec4 o;    // premultiplied cloud radiance (with aerial perspective), transmittance
layout(location = 1) out vec4 oD;   // x: mean cloud distance (km) * cloud opacity (premultiplied so bilinear/temporal
                                    // filtering stays consistent; km keeps the >65 km far field inside half-float range)
float cloudD(vec3 p, bool hi) {
  vec2 q = p.xz + uCloudOff;
  float shape = cloudCover(q);                                      // 0..1 inside cloud fields
  // Phase 1 renders only the far cumulus field: behind the left massif (19 km+, so its summit stays clear) and, to
  // the right of centre, from ~13 km so a bank floats over the mid-wall ridge. Cumulus weather opens the cut to the
  // whole sky band (uCloudP)
  vec2 dv = p.xz - uCamPos.xz;
  float dn = length(dv);
  float cut = mix(uCloudP.x, uCloudP.y, smoothstep(uCloudQ.w, uCloudQ.w + mix(0.3, 0.1, uCumulus), dv.x / max(dn, 1.0)));
  shape *= smoothstep(cut, cut + uCloudP.z, dn);
  // cumulus thin out beyond ~16 km, so the near towers stand apart against blue sky instead of a stacked white wall
  shape *= 1.0 - 0.6 * uCumulus * smoothstep(16000.0, 32000.0, dn);
  // undulating base height; the near grey deck (uCloudQ.z: overcast / rain, not a snow curtain) also gets a ragged
  // ~800 m base (it hangs on the slopes in tatters instead of slicing the summits along one straight line)
  float deck = uCloudQ.z * (1.0 - uCumulus);
  float cb = uCloudQ.x + uCloudP.w * (tnoise(q * 0.00025 + 1.0) - 0.5) + 420.0 * deck * (tnoise(q * 0.0012 + 4.2) - 0.5);
  float h = (p.y - cb) / (uCloudQ.y - cb);
  vec3 r = vec3(q.x, p.y * 1.2, q.y) * mix(0.0011, 0.0023, uCumulus);     // cumulus: billows finer than the cells
  // billowy detail: |2n-1| octaves give rounded cauliflower bulges with creases between them (Phase 1). Cumulus
  // (stage 2b): softer heaps: the second octave is half a smooth bulge, and the ~36 m creases fade with distance
  // (beyond ~8 km they are below the half-res pixel and only speckle the cloud)
  float o2 = tnoise3(r * 2.1 + 3.7);
  float n = tnoise3(r) * 0.5 + mix(abs(o2 * 2.0 - 1.0), o2, 0.5 * uCumulus) * 0.28;
  float fine = 1.0 - uCumulus * smoothstep(5000.0, 14000.0, dn);
  n += hi ? abs(tnoise3(r * 4.4 + 1.1) * 2.0 - 1.0) * 0.14 + abs(tnoise3(r * 9.3 + 5.3) * 2.0 - 1.0) * 0.08 * fine + 0.04 * (1.0 - fine)
          : 0.11;
  // towers: Phase 1 tall cores (0.18 + 0.82 sqrt(shape) of the slab); cumulus: flat-based domes ~300-900 m tall.
  // (stage 2b) Inside a cumulus cell the coverage saturates, so a top set by the 2D cell alone is one flat plateau over
  // vertical walls (pillars, seen from the side): a smooth ~800 m noise heaps the cell into several domes, and the 3D
  // detail sets the top too (the cloud's surface is an iso-surface of the billows: cauliflower tops and bulging flanks)
  float heap = uCumulus > 0.001 ? 0.5 + 0.5 * tnoise(q * 0.0012 + vec2(2.2, 7.9)) : 0.8;
  float topC = (0.07 + 0.42 * sqrt(shape)) * heap * 1.25 * clamp(0.4 + 1.05 * (n - 0.3), 0.3, 1.0);
  float top = mix(0.18 + 0.82 * sqrt(shape), topC, uCumulus);
  float prof = smoothstep(0.0, mix(0.04, 0.012, uCumulus) + 0.14 * deck, h) * smoothstep(top, top * mix(0.3, 0.6, uCumulus), h);
  float d = shape * prof * (1.0 + 0.6 * uOvercast) - (1.0 - n) * mix(0.58, 0.8, uCumulus) + mix(0.06, 0.17, uCumulus);
  // cumulus: a soft outline (x6) around a dense core (up to x2.4 inside), so the edges are wispy and the body solid
  return sat(d * mix(4.5, 6.0, uCumulus)) * (1.0 + 1.4 * uCumulus * smoothstep(0.12, 0.4, d));
}
// terrain distance under this half-res pixel: the farthest of its canvas texels, so at a silhouette the sky wins
// (the cloud behind the ridge is kept for the sky texels; the shading pass rejects it on the terrain texels). On the
// first load the unbaked rows read as sky (hidden behind the reveal edge)
float terrainT(vec2 uv) {
  vec2 e = 0.25 / uRes;
  float t = 0.0;
  for (int i = 0; i < 4; i++) t = max(t, G0(uv + e * vec2(i == 1 || i == 3 ? 1.0 : -1.0, i >= 2 ? 1.0 : -1.0)).x);
  return t > 60000.0 ? 1e9 : t;
}
void main() {
  vec3 rd = camRay(gl_FragCoord.xy);
  vec2 uv = gl_FragCoord.xy / uRes;
  float T = 1.0; vec3 acc = vec3(0.0);
  float tHit = -1.0, tSum = 0.0, wSum = 0.0;   // opacity-weighted mean cloud distance (stable under temporal blending)
  float CB = uCloudQ.x, CT = uCloudQ.y;
  float t0 = (CB - uCamPos.y) / max(rd.y, 1e-4);
  float tTer = terrainT(uv);
  if (rd.y > 0.02 && t0 < min(45000.0, tTer)) {
    float t1 = min(min((CT - uCamPos.y) / rd.y, t0 + mix(28000.0, 20000.0, uCumulus)), tTer);
    float jit = fract(52.9829189 * fract(dot(gl_FragCoord.xy, vec2(0.06711056, 0.00583715))) + uFrame * 0.6180339);
    float steps = uSteps;
    float span = t1 - t0;
    // cumulus: steps grow along the ray (t = t0 + span (u + k u^2) / (1 + k), u = (i + jit) / steps), so the near,
    // large clouds get ~2x the samples of the hazy far field
    float kq = 0.8 * uCumulus;
    float mu = dot(rd, uSunDir);
    // dual-lobe Henyey-Greenstein: forward silver lining + soft back scatter
    float g1 = 0.7, g2 = -0.25;
    float ph = 0.75 * (1.0 - g1 * g1) / pow(1.0 + g1 * g1 - 2.0 * g1 * mu, 1.5) + 0.25 * (1.0 - g2 * g2) / pow(1.0 + g2 * g2 - 2.0 * g2 * mu, 1.5);
    ph = ph / 12.566 * 3.0 + 0.6;
    for (int i = 0; i < 48; i++) {
      if (float(i) >= steps || T < 0.02) break;
      float u = (float(i) + jit) / steps;
      float tt = t0 + span * (u + kq * u * u) / (1.0 + kq);
      float dt = span * (1.0 + 2.0 * kq * u) / ((1.0 + kq) * steps);
      vec3 p = uCamPos + rd * tt;
      float d = cloudD(p, true);
      if (d > 0.001) {
        if (tHit < 0.0) tHit = tt;
        // light march toward the sun (3 taps)
        float ls = mix(1.0, 0.6, uCumulus);       // cumulus are smaller: shorter taps resolve their self-shadowing
        float ld = (cloudD(p + uSunDir * 160.0 * ls, false) * 160.0 + cloudD(p + uSunDir * 480.0 * ls, false) * 320.0 + cloudD(p + uSunDir * 1100.0 * ls, false) * 600.0) * ls;
        float sig = 0.0045;
        float Tl = exp(-ld * sig * mix(0.9, 1.5, uCumulus));   // cumulus: deeper self-shadowing, sculpted flanks
        float powder = 1.0 - exp(-d * 4.0);
        float h = (p.y - CB) / (CT - CB);
        // darker, bluer bases against bright lit tops: cumulus, not a flat cotton bank (cumulus fill only the lower
        // half of the slab, so their ambient gradient is compressed into it)
        vec3 amb = mix(uSkyAmb * vec3(0.55, 0.62, 0.78) * mix(0.6, 0.42, uCumulus), uSkyAmb * 1.3 + vec3(0.05), smoothstep(0.0, mix(0.6, 0.4, uCumulus), h));
        vec3 L = uSunCol * Tl * ph * mix(mix(0.5, 0.78, uCumulus), 1.0, powder) * 1.35 + amb;
        float a = 1.0 - exp(-d * sig * dt);
        acc += T * a * L;
        tSum += T * a * tt; wSum += T * a;
        T *= 1.0 - a;
      }
    }
    if (wSum > 1e-4) tHit = tSum / wSum;
    // aerial perspective on the clouds (haze in front of the cloud only; the sky behind gets its own)
    if (tHit > 0.0) { vec4 f = fogAt(tHit, rd); acc = acc * f.a + f.rgb * (1.0 - T); }
  }
  vec4 prev = texture(uPrev, uv);
  float prevD = texture(uPrevD, uv).x;
  // cumulus accumulate a little longer (their soft volumes need more samples; the camera is fixed and they drift
  // slowly); a reset (uBlend 1) and a jump (uSkyResp) still restart at once
  float b = uBlend >= 1.0 ? 1.0 : max(uBlend * (1.0 - 0.4 * uCumulus), uSkyResp);
  o = mix(prev, vec4(acc, T), b);
  oD = vec4(mix(prevD, max(tHit, 0.0) * 0.001 * (1.0 - T), b), 0.0, 0.0, 1.0);
}
`;
  S.glsl.progs.sky = { vs: ['VS_FULL'], fs: ['COMMON', 'ENV', 'ATMOS', 'GBUF', 'FS_SKY'] };
})(window.SNOW);

</script>
<script>/* js/glsl/veil.js */
// =====================================================================================
//  GLSL: VEIL chunk (stage-1 owner: lane E). What the particles cannot show, seen from afar:
//   - the distant falling-snow veil: two screen-space streak sheets along the apparent fall direction plus a slow
//     'big' sheet (Phase 1), scaled by the snowfall rate;
//   - the rain veil: the rain beyond the particle slices (~70 m - 1 km), a faint haze with a fine falling grain;
//   - the rain curtains: grey shafts hanging from the cloud base over the far valley (patchy showers under broken
//     cloud, wide sheets under a deck), slanted by the wind, with fibrous striations, drifting with the clouds
//     (uCloudOff).
//  applyVeil is the entry point the shading pass calls last on every pixel (sky and terrain). Each part sits behind
//  a uniform branch, so dry weather costs nothing. Needs COMMON + ENV + ATMOS (the cloud base uCloudQ.x, so the
//  curtains hang from the clouds lane C draws). Its uniforms come from S.F (js/derive/precip.js).
// =====================================================================================
(function (S) {
  'use strict';
  const C = S.glsl.chunks;
  C.VEIL = `
uniform vec2 uVeilDir;       // apparent screen-space fall direction of distant snow
uniform float uVeilAmt;      // snow veil amount (0 = off)
uniform vec4 uVeilT;         // integrated scroll of the veil noise sheets (xy: the two streak layers, zw: the slow
                             // 'big' sheet), wrapped by the noise period (256) on the CPU so storms/wind never jump it
uniform vec2 uRainDir;       // apparent screen-space fall direction of distant rain
uniform float uRainVeil;     // rain veil amount (0 = off)
uniform vec4 uRainT;         // rain veil scroll (xy: the two grain sheets, zw: the slow density), wrapped by 256
uniform vec4 uRainShaft;     // x: rain-curtain optical depth per km (0 = off), y: sunlit share (broken cloud),
                             // zw: the fall slant (world x / z metres across per metre down: the wind over the drop speed)

// distant falling snow seen as a translucent, streaky veil (two parallax layers)
float veil(vec2 frag) {
  vec2 uv = frag / uRes.y;
  vec2 d = normalize(uVeilDir);
  mat2 R = mat2(d.y, d.x, -d.x, d.y);
  vec2 q = R * uv;
  float s1 = tnoise(vec2(q.x * 210.0, q.y * 9.0 + uVeilT.x));
  float s2 = tnoise(vec2(q.x * 120.0 + 31.0, q.y * 5.0 + uVeilT.y));
  float big = tnoise(uv * 3.0 + uVeilT.zw);
  return (smoothstep(0.5, 1.0, s1) * 0.6 + smoothstep(0.45, 1.0, s2) * 0.6) * (0.55 + 0.9 * big);
}
// rain beyond the particle slices (~70 m - 1 km): no single drop resolves there, so it is a faint haze carrying a
// fine, short, fast-falling grain (two parallax sheets) in drifting denser and lighter patches. Low contrast on
// purpose: long thresholded lines would read as a scratched pane in front of the scene
float rainVeil(vec2 frag) {
  vec2 uv = frag / uRes.y;
  vec2 d = normalize(uRainDir);
  mat2 R = mat2(d.y, d.x, -d.x, d.y);
  vec2 q = R * uv;
  float s1 = tnoise(vec2(q.x * 520.0, q.y * 11.0 + uRainT.x));
  float s2 = tnoise(vec2(q.x * 300.0 + 31.0, q.y * 7.0 + uRainT.y));
  float big = tnoise(uv * 2.2 + uRainT.zw);
  float grain = smoothstep(0.55, 0.95, s1) * 0.5 + smoothstep(0.5, 0.95, s2) * 0.4;
  return (0.35 + grain) * (0.4 + 0.9 * big);
}
// optical depth of the far rain curtains along the view ray: 3 samples at fixed distances (4, 9, 16 km, each
// standing for its segment), so the pattern never follows the terrain's depth contours; a sample behind the hit
// fades out over its segment. The rain hangs below the cloud base; following each sample up the fall line to the
// cloud that drops it (q), a function of q is constant along the fall: the cells give the shafts, a finer noise the
// striations, and a noise that also moves with the height ('wisp') breaks the striations into fibres
float rainCurtains(vec3 rd, float t) {
  if (t <= 2000.0) return 0.0;
  float od = 0.0;
  for (int i = 0; i < 3; i++) {
    float s = i == 0 ? 4000.0 : (i == 1 ? 9000.0 : 16000.0);
    float ds = i == 0 ? 4000.0 : (i == 1 ? 6000.0 : 8000.0);
    vec3 p = uCamPos + rd * s;
    float below = uCloudQ.x - p.y;                 // the curtains hang from the cloud slab's base (ATMOS: ~1500 m, lower under a rain deck)
    if (below <= 0.0) break;                       // the ray only climbs from here: above the base, no rain
    vec2 q = p.xz - uRainShaft.zw * below + uCloudOff;  // a drop drifts downwind as it falls
    float cell = tnoise(q * 0.00026 + vec2(5.3, 1.9));
    float stri = tnoise(q * 0.0062 + 3.0) * 0.6 + tnoise(q * 0.017 + 9.0) * 0.4;
    float wisp = tnoise(q * 0.0011 + vec2(0.0, below * 0.0021) + 7.0);
    // shafts: rain cells (patchy showers under broken cloud, wide sheets under a full deck), soft fibres inside
    float lo = mix(0.66, 0.5, uCloudCov);
    // (stage 2b: soft fibres, not striations: a strongly striped shaft over a dark cliff reads as a sunbeam)
    float dens = 0.02 + smoothstep(lo, lo + 0.22, cell) * (0.7 + 0.45 * smoothstep(0.3, 0.9, stri)) * (0.55 + 0.7 * wisp);
    // the curtain emerges from under the base; only the part of the segment in front of the hit counts
    od += dens * smoothstep(0.0, 300.0, below) * ds * sat((t - s) / ds + 0.5);
  }
  return od * 0.001 * uRainShaft.x;
}
// the distant precipitation over a pixel at distance t (the sky's t = 65000 gives the full amount)
vec3 applyVeil(vec3 col, float t, vec2 frag) {
  if (uRainShaft.x > 0.0) {
    // rain curtains: overcast light scattered by the rain, a little darker and greyer than the haze
    float od = rainCurtains(camRay(frag), t);
    vec3 cc = mix(uFogCol, vec3(dot(uFogCol, vec3(0.333))), 0.35) * 0.78 + uSunCol * (0.01 + 0.025 * uRainShaft.y);
    col = mix(col, cc, 1.0 - exp(-od));
  }
  if (uRainVeil > 0.0) {
    float ramt = uRainVeil * (1.0 - exp(-t / 160.0));
    col = mix(col, uFogCol * 1.15 + uSkyZen * 0.1, sat(ramt * rainVeil(frag)));
  }
  if (uVeilAmt > 0.0) {
    // the distant snow veil (strong in blizzards)
    float vamt = uVeilAmt * (1.0 - exp(-t / 900.0));
    col = mix(col, uFogCol * 1.35 + uSunCol * 0.05, sat(vamt * veil(frag)));
  }
  return col;
}
`;
})(window.SNOW);

</script>
<script>/* js/glsl/shade.js */
// =====================================================================================
//  GLSL: the scene shading pass (frozen glue). It owns only the tree-sway remap of the G-buffer lookup, the cloud
//  pass fetch and the order of the calls into the lane chunks:
//    sky pixel:     skyPixel (ATMOS, lane C) -> applyVeil (VEIL, lane E)
//    surface pixel: shadeSurface (SURFACE, lane D) -> applyAtmos (ATMOS, lane C) -> applyVeil (VEIL, lane E)
//    ?view=:        surfaceDebug (SURFACE)
//  Output: rgb = scene radiance, a = snow fraction x sun visibility (0 on the sky), read by the composite sparkle and
//  the flake colour-over-snow. Program 'shade' = COMMON + ENV + ATMOS + GBUF + SURFACE + VEIL + FS_SHADE.
// =====================================================================================
(function (S) {
  'use strict';
  const C = S.glsl.chunks;
  C.FS_SHADE = `
uniform sampler2D uSky, uSkyD;
uniform vec3 uSway;          // x: lateral wind (m/s), y: integrated sway phase (rad, CPU), z: focal length in px
out vec4 o;

// tree sway: treetops lean/oscillate with the wind. The G-buffer is static, so we invert the
// displacement field with a 2-step fixed-point lookup (starting mid-tree so silhouettes move too).
float treeH(vec4 g) { return floor(g.y + 0.001) == 2.0 ? fract(g.y + 0.001) / 0.9 : 0.0; }
vec2 swayOff(float h, float t, vec2 frag) {
  float w = uSway.x;
  float osc = sin(uSway.y + frag.x * 0.013 + frag.y * 0.007) * (0.25 + 0.05 * abs(w));
  float disp = (0.012 * w + osc * 0.12) * h * h * 18.0;          // metres at the top of an ~18 m spruce
  return vec2(disp / max(t, 1.0) * uSway.z, 0.0);
}

void main() {
  vec2 uv = gl_FragCoord.xy / uRes;
  vec4 g0 = G0(uv);
  {
    vec2 oMax = swayOff(1.0, g0.x, gl_FragCoord.xy);
    if (abs(oMax.x) > 0.15 && g0.x < 6000.0) {
      vec2 x = gl_FragCoord.xy - 0.5 * oMax;
      for (int i = 0; i < 2; i++) { vec4 gi = G0(x / uRes); x = gl_FragCoord.xy - swayOff(treeH(gi), gi.x, gl_FragCoord.xy); }
      vec4 gs = G0(x / uRes);
      if (treeH(gs) > 0.0 || treeH(g0) > 0.0) { uv = x / uRes; g0 = gs; }
    }
  }
  vec3 rd = camRay(uv * uRes);
  float t = g0.x;
  vec4 cl = texture(uSky, uv);            // clouds: premultiplied radiance + transmittance
  float cOp = 1.0 - cl.a;
  float cT = cOp > 0.003 ? texture(uSkyD, uv).x / cOp : 0.0;   // opacity-weighted mean cloud distance (0 = none)
  if (uView > 0) { o = vec4(t > 60000.0 ? vec3(0.04, 0.06, 0.1) : surfaceDebug(uView, uv, g0, rd, t), 0.0); return; }
  if (t > 60000.0) {
    o = vec4(applyVeil(skyPixel(rd, cl), t, gl_FragCoord.xy), 0.0);
    return;
  }
  float snowMask;
  vec3 col = shadeSurface(uv, g0, rd, t, snowMask);

//  GLSL: snowflakes (stage-1 owner: lane E). Instanced, stateless particles in camera-aligned depth slices:
//  the vertex shader places, wraps, streaks and lights each flake; the fragment shader draws the crystal shapes
//  and capsules with soft occlusion against the G-buffer and a cool tint over snow (read from the scene alpha).
//  PRECIP_VS is the stateless core both precipitation vertex shaders share (VS_FLAKE here, VS_RAIN in rain.js): the
//  per-layer uniforms, the per-instance hashes, the slice-box wrap, the projection and the drag wake.
//  Constants NB = 40 bins and TW = 120 must match precip.js (wrapLayer) and derive/precip.js (the % 120 clocks);

// that the CPU lattice-wraps exactly (wind, fall) or a phase whose rate is a multiple of 2*pi/TW, so the CPU
// can wrap its clock by TW with no discontinuity. Particles therefore never jump, however long the page runs.

    if (fine) {   // one branchlet parallel to the main arm, sprouting from the branch midpoint
      vec2 m = a0 + bd * (L * 0.5);
      d = min(d, sdSeg(p, m, m + vec2(L * 0.3, 0.0)) - max(w * 0.5, 0.8 * aa));
    }
  }
  float hexd = dot(p, vec2(0.8660254, 0.5));
  float core = mix(0.09, 0.2, s.w);
  d = min(d, hexd - core);
  float c = 1.0 - smoothstep(-aa, aa, d);
  float rim = smoothstep(-min(w * 0.9, 0.035) - aa, 0.0, d);               // edges catch the light (a thin line on wide arms)
  float ridge = 1.0 - smoothstep(0.0, 0.025 + aa, p.y);
  float ring = 1.0 - smoothstep(0.0, 0.02 + aa, abs(hexd - core * 0.6));
  // translucent body (0.42) under bright rims / ridges / ring, so the interior structure survives tone mapping
  return c * (0.42 + 0.5 * rim + 0.3 * ridge + 0.2 * ring);
}
// hexagonal / stellar plate with ridges, an inner hexagon line and bright rims
float plate(vec2 q, vec4 s, float aa) {
  if (dot(q, q) > sq(1.06 + aa)) return 0.0;
  vec2 p = foldD6(q);
  float R = mix(0.62, 0.92, s.x);
  float hexd = dot(p, vec2(0.8660254, 0.5));
  float d;
  if (s.y > 0.45) {   // stellar plate: broad arms widening toward the tip
    float wArm = 0.07 + 0.2 * smoothstep(0.3, 0.95, p.x / R);
    d = min(max(p.y - wArm * R, p.x - R), hexd - 0.3 * R);
  } else d = hexd - R * 0.8660254;
  float c = 1.0 - smoothstep(-aa, aa, d);
  float ridge = 1.0 - smoothstep(0.0, 0.025 + aa, p.y);
  float inner = 1.0 - smoothstep(0.0, 0.025 + aa, abs(hexd - 0.4 * R));
  float rim = smoothstep(-0.07 - aa, 0.0, d);
  return c * (0.38 + 0.28 * ridge + 0.22 * inner + 0.5 * rim);      // translucent body, bright rim and ridges
}
// one small six-armed crystal used inside aggregates
float miniStar(vec2 q, float aa) {
  vec2 p = foldD6(q);
  float d = sdSeg(p, vec2(0.0), vec2(0.92, 0.0)) - 0.1 * (1.0 - 0.4 * p.x);
  d = min(d, sdSeg(p, vec2(0.5, 0.0), vec2(0.5, 0.0) + vec2(0.5, 0.866) * 0.36) - 0.07);
  d = min(d, dot(p, vec2(0.866, 0.5)) - 0.2);
  return 1.0 - smoothstep(-aa, aa, d);
}
// clumped aggregate (most large real flakes): a soft translucent lumpy core with a few
// tumbled crystals fused into it, their arms poking out of the outline. Wet snow near 0 deg C (uWetSnow): the
// crystals have melted into the clump, which grows into a bigger, lobed, denser cotton-like ball
float aggregate(vec2 q, vec4 s, float aa) {
  if (dot(q, q) > sq(1.06 + aa)) return 0.0;
  uint h = floatBitsToUint(s.x * 9.71 + s.y) ^ 0x9e3779b9u;
  float rr = length(q);
  float ang0 = atan(q.y, q.x);
  float wet = uWetSnow;
  float lump = 0.5 + 0.09 * sin(3.0 * ang0 + s.z * 6.0) + 0.06 * sin(5.0 * ang0 + s.w * 6.0) + 0.04 * (1.0 - wet) * sin(8.0 * ang0 + s.x * 6.0);
  lump += wet * (0.16 + 0.05 * sin(2.0 * ang0 + s.y * 6.0) + 0.03 * sin(4.0 * ang0 + s.z * 9.0));   // a lopsided round tuft
  float core = 1.0 - smoothstep(lump - 0.3 - 0.12 * wet - aa, lump + aa, rr);
  float tex = 0.75 + 0.25 * sin(q.x * 9.0 + s.z * 6.0) * sin(q.y * 8.0 + s.w * 6.0);
  float c = core * mix(core, 1.0, 0.35 * wet) * (0.42 + 0.3 * wet) * tex;   // translucent, denser centre (wet: a dense ball)
  float arms = 1.0 - 0.85 * wet;
  for (int k = 0; k < 3; k++) {
    h = h * 747796405u + 2891336453u;
    uint h2 = (h >> 5u) * 2654435761u;
    vec4 r = vec4(float(h >> 8u), float(h2 >> 8u), float((h2 * 1103515245u) >> 8u), float((h * 22695477u) >> 8u)) / 16777216.0;
    vec2 off = (r.xy - 0.5) * 0.45;
    float sc = mix(0.45, 0.62, r.z);
    float an = r.w * 6.2831853;
    vec2 qq = q - off;
    qq = vec2(cos(an) * qq.x - sin(an) * qq.y, sin(an) * qq.x + cos(an) * qq.y) / sc;
    qq.y /= mix(0.5, 1.0, fract(r.w * 7.3));                                 // tilted crystal
    if (dot(qq, qq) < 1.1) c = max(c, miniStar(qq, aa / sc) * mix(0.8, 1.0, r.z) * arms);
  }
  return c;
}
float shapeAt(vec2 sp) {
  // shape in units of the true radius; defocus widens the edge ramp (aa) and the quad (vPar.x) instead
  vec2 q = vec2(vRot.x * sp.x - vRot.y * sp.y, vRot.y * sp.x + vRot.x * sp.y) / vRot.w;
  q.y /= vRot.z;
  // the tumble squash shrinks the pixel footprint along y: widen the edge ramp by the geometric mean of the
  // two axes' scales, so an edge-on crystal softens instead of aliasing (and its fine detail switches off)
  float aa = vPar.w * inversesqrt(max(vRot.z, 0.2));
  if (vPar.z < 1.5) return dendrite(q, vSeed, aa);
  if (vPar.z < 2.5) return plate(q, vSeed, aa);
  return aggregate(q, vSeed, aa);
}
void main() {
  float rPx = vPar.x, blur = vPar.y;
  float cov;
  if ((uLayer == 1 || uLayer == 4) && blur < min(3.5 * rPx, 28.0)) {
    // true motion blur of the crystal shape: a box of taps along the streak at <= 1 px spacing (up to 29),
    // so a short calm blur keeps the crystal crisp with no tap structure (coarser stratified taps with
    // per-pixel jitter left a diagonal hatch across the big sharp flakes). A wet clump has only soft edges:
    // up to 2.5 px between taps is enough there
    int taps = int(ceil(blur / (vPar.z > 2.5 ? 1.0 + 1.5 * uWetSnow : 1.0))) + 1;
    float acc = 0.0;
    for (int k = 0; k < 29; k++) {
      if (k >= taps) break;
      float off = ((float(k) + 0.5) / float(taps) - 0.5) * blur;
      acc += shapeAt(vP - vec2(off, 0.0));
    }
    cov = acc / float(taps);
  } else if (uLayer == 1 || uLayer == 4) {
    // long streak: the crystal detail is smeared out anyway -> analytic soft capsule,
    // energy-normalised against the streak length, slightly brighter core.
    // Per-flake character so the blizzard is not a parallel hatch: width x0.6-1.4, brightness x0.6-1.2,
    // and a ~12% subset of thin, bright, crisp streaks (small dense flakes whipping past)
    float wv = mix(0.6, 1.4, vSeed.z), bv = mix(0.6, 1.2, vSeed.w);
    if (fract(vSeed.y * 5.3) > 0.88) { wv *= 0.4; bv *= 1.6; }
    vec2 q = vec2(max(abs(vP.x) - 0.5 * blur, 0.0), vP.y);
    float d = length(q) / (rPx * 0.55 * wv);
    float along = 1.0 - smoothstep(0.3, 0.5, abs(vP.x) / (blur + 2.0 * rPx));       // soft streak ends
    // a flake sweeping 'blur' px covers each pixel for ~2r/blur of the exposure
    cov = exp(-d * d * 2.0) * (0.55 + 0.45 * along) * min(1.0, 2.0 * rPx / (blur + 2.0 * rPx)) * 1.5 * bv;
    cov *= 0.65 + 0.35 * sin(vP.x / max(rPx, 1.0) * 1.3 + vSeed.x * 40.0);        // tumbling flicker along the streak
  } else {
    // capsule = analytically motion-blurred disc
    vec2 q = vec2(max(abs(vP.x) - 0.5 * blur, 0.0), vP.y);
    float d = length(q) / rPx;
    // near tier: a soft flat disc (no bright rim: a rimmed disc reads as a soap bubble / lens dirt)
    if (uLayer == 0) cov = (1.0 - smoothstep(1.0 - vPar.w, 1.0, d)) * 0.85;
    else cov = exp(-d * d * 2.3);
  }
  // soft occlusion against the scene (G-buffer ray distance)
  vec2 suv = gl_FragCoord.xy / uRes;
  float st = G0(suv).x;
  float occ = clamp((st - vDist) / max(0.4, 0.05 * vDist), 0.0, 1.0);
  float a = clamp(cov * vCol.a * occ, 0.0, 1.0);
  if (a < 0.0015) discard;
  // over snow-covered ground a thin ice crystal reads as a faint, slightly bluer translucent shadow (it transmits
  // the sky, the sunlit snow behind it does not), otherwise white on white vanishes. Scaled by the flake's own
  // alpha so faint flakes stay translucent rather than turning into grey stickers; in a blizzard the whiteout is
  // grey, so only a weak cool shadow side is kept on the streaks
  vec3 col = vCol.rgb;
  if (st < 60000.0) {
    float snowBG = textureLod(uScene, suv, 0.0).a;
    col *= mix(vec3(1.0), vec3(0.5, 0.56, 0.68), snowBG * mix(0.55, 0.3, uSnowCurtain) * clamp(a * 2.0, 0.0, 1.0));   // over half the tint is kept in a blizzard: the streaks stay legible over snow
  }
  o = vec4(col * a, a);    // premultiplied alpha
}
`;
  S.glsl.progs.flake = { vs: ['COMMON', 'ENV', 'ATMOS', 'PRECIP_VS', 'VS_FLAKE'], fs: ['PRECISION_FI', 'ENV', 'GBUF', 'FS_FLAKE'] };
})(window.SNOW);

</script>
<script>/* js/glsl/rain.js */
// =====================================================================================
//  GLSL: rain (stage-1 owner: lane E). Instanced, stateless raindrops in camera-aligned depth slices, drawn with the
//  same per-layer contract as the flakes and the shared PRECIP_VS core (flake.js): base point, wind integrals, the
//  40 fall bins (uFallQ over uFallLH, wrapped from S.anim.rainI), the slice-box wrap and the drag wake.
//  Each drop has a fixed diameter (1.6-4.4 mm, mostly small) and the matching terminal speed (5.7-8.9 m/s); the
//  streak is the drop's path during the rain shutter uExpoRain, so its length follows speed and depth. A drop is a
//  tiny lens: it shows the wide environment (mostly the bright sky) refracted, so it reads as a bright line over
//  dark forest and almost vanishes against the sky; sunlit drops add a forward glow and glints along the streak.
//  Near drops (0.3-1.5 m) are defocused by the same one-sided circle of confusion as the flakes.
//  Program 'rain' = COMMON + ENV + ATMOS + PRECIP_VS + VS_RAIN | PRECISION_FI + ENV + GBUF + FS_RAIN.
// =====================================================================================
(function (S) {
  'use strict';
  const C = S.glsl.chunks;
  C.VS_RAIN = `
uniform float uRainV;     // rain fall factor (= d rainI / dt)
uniform float uExpoRain;  // rain shutter (s): the streak is the drop's path while it is open
uniform float uPushK;     // the layer's drag-wake weight
uniform vec2 uRainGust;   // scroll of the gust bands (integrated wind, wrapped by the 256 noise period on the CPU)
out vec2 vP;              // quad position in px: x along the streak, y across
flat out vec4 vPar;       // half width px (incl. defocus), streak length px, bead frequency, bead phase
flat out vec3 vSun;       // sun glint colour along the streak (premultiplied by the drop's alpha later)
flat out float vDef;      // defocus share of the half width (0 sharp .. 1 a soft out-of-focus blur)
out vec4 vCol;
out float vDist;

void main() {
  vec2 corner = CORNERS[gl_VertexID];
  uint id = uint(gl_InstanceID);
  vec4 r0, r1, r2;
  precipRand(r0, r1, r2);
  vec3 bw = sliceBase(r0);
  float t = uFlakeT;

  // drop diameter (mm), skewed to small drops; terminal speed from the Atlas fit v = 9.65 - 10.3 exp(-0.6 D).
  // The distribution is fixed: heavier rain means more drops, never faster ones (speed only via the integral)
  float D = mix(1.6, 4.4, r0.w * r0.w);
  int fbin = fallBin((9.65 - 10.3 * exp(-0.6 * D) - uFallLH.x) / (uFallLH.y - uFallLH.x));
  float fall = binSpeed(fbin) * uRainV;
  // dense drops answer the wind sluggishly (an affine mix of the two integrals: the lattice wrap stays exact)
  float resp = 0.12 + 0.25 * r1.y;
  vec3 wdisp = mix(uDispA, uDispB, resp);
  vec3 wvel = mix(uWindA, uWindB, resp);
  // a little horizontal turbulence (the snow eddies at a tenth of their amplitude; rates on the W0 grid)
  float ta = 0.03 + 0.12 * uGale;
  vec3 ph = bw * vec3(0.37, 0.29, 0.33);
  float a1 = ph.x + ph.y * 0.7 + 16.0 * W0 * t, a2 = ph.z - ph.x * 0.6 + 25.0 * W0 * t + 2.0;
  vec3 turb = ta * vec3(sin(a1), 0.0, sin(a2));
  vec3 turbV = ta * W0 * vec3(16.0 * cos(a1), 0.0, 25.0 * cos(a2));

  vec3 cs = sliceWrap(bw + wdisp + uFallQ[fbin] + turb);
  vec2 ndc, sv;
  project(cs, wvel + vec3(0.0, -fall, 0.0) + turbV, ndc, sv);
  float zc = cs.z;
  precipWake(ndc, sv, zc, uPushK);
  if (offScreen(zc, ndc)) { gl_Position = vec4(2.0, 2.0, 2.0, 1.0); return; }
  float a = sliceFade(zc) * clamp(uCount - float(id), 0.0, 1.0);
  // gusts sweep the rain in bands: a screen-space density noise drifting with the integrated wind (far layers)
  if (uGale > 0.0 && uLayer >= 7) {
    vec2 gq = vec2(ndc.x * uAspect, ndc.y) * 1.6 + uRainGust;
    float gs = tnoise(gq) * 0.65 + tnoise(gq * 2.3 + 5.0) * 0.35;
    a *= mix(1.0, 0.25 + 1.5 * smoothstep(0.3, 0.72, gs), 0.85 * uGale);
  }
  if (a < 0.002) { gl_Position = vec4(2.0, 2.0, 2.0, 1.0); return; }

  float rTrue = 0.5 * D * 0.001 / max(zc, 0.05) * uFocalPx;
  float speed = length(sv);
  vec2 dir = speed > 1e-3 ? sv / speed : vec2(0.0, -1.0);
  // streak length: the path while the shutter is open (a drop crossing the lens is capped: longer is invisible)
  float blur = min(speed * uExpoRain, (uLayer == 5 ? 170.0 : 320.0) * uRes.y / 1080.0);
  float coc = min(uCocK * max(0.0, 1.0 / max(zc, 0.05) - 1.0 / uFocus), 40.0 * uRes.y / 1080.0);
  float rD = max(rTrue + coc, 0.6);
  // visibility: the true optical cover of a sub-pixel drop is ~0.5% (invisible), so it is boosted, but kept linear
  // in the drop size (a line's width cover, not a disc's area) and divided over the streak (the time share)
  float kVis = uLayer == 5 ? 3.5 : (uLayer == 6 ? 7.0 : (uLayer == 7 ? 8.0 : 9.0));
  a *= kVis * min(1.0, rTrue / rD) * (2.0 * rD + 1.0) / (blur + 2.0 * rD + 1.0);
  // per drop: most are faint, a few catch the light (brightness and visibility spread, so no even 'scratched film')
  float bri = mix(0.45, 1.25, r1.w * r1.w);
  a *= mix(0.55, 1.15, r2.x);
  a = min(a, 0.42);

  vec3 pW = uCamPos + uCamR * cs.x + uCamU * cs.y + uCamF * cs.z;
  float dist = length(cs);
  vec3 V = (pW - uCamPos) / dist;
  // the refracted environment: mostly sky (horizon-weighted), a little of the lit ground; slightly below the sky's
  // own radiance, so a drop is a faint grey line against the sky and a bright one against forest
  vec3 env = mix(uSkyHor, uSkyZen, 0.3) * 0.86 + uSkyAmb * 0.1;
  // sunlit drops (broken cloud): a forward-scattering glow toward the sun and glints along the streak
  float sunVis = (1.0 - uOvercast) * mix(1.0, cloudShadow(pW), 0.85);
  float mu = dot(V, uSunDir);
  float hg = (1.0 - 0.64) / pow(1.64 - 1.6 * mu, 1.5);         // Henyey-Greenstein, g = 0.8
  vec3 col = (env + uSunCol * sunVis * (0.03 + 0.02 * hg)) * bri;
  vec4 fg = fogAt(dist, V);
  col = col * fg.a + fg.rgb;

  float hl = rD + 0.5 * blur + 0.8, hw = rD + 0.8;
  vec2 perp = vec2(-dir.y, dir.x);
  vec2 offPx = dir * corner.x * hl + perp * corner.y * hw;
  gl_Position = vec4(ndc + offPx / (0.5 * uRes), 0.0, 1.0);
  vP = vec2(corner.x * hl, corner.y * hw);
  // the oscillating drop flashes the refracted sun a few times along its path (bead spacing ~ the drop's
  // oscillation period x its screen speed; at most ~1 bead per 6 px)
  vPar = vec4(rD, blur, 6.2831853 / max(speed * mix(0.008, 0.014, r2.y), 6.0), r2.z * 6.2831853);
  vDef = sat(coc / rD);
  vSun = uSunCol * sunVis * fg.a * bri * (0.35 + 0.25 * hg) * step(0.55, r1.z) * (1.0 - vDef);
  vCol = vec4(col, a);
  vDist = dist;
}
`;
  C.FS_RAIN = `
uniform vec2 uRes;
in vec2 vP;
flat in vec4 vPar;
flat in vec3 vSun;
flat in float vDef;
in vec4 vCol;
in float vDist;
out vec4 o;

void main() {
  float rD = vPar.x, hx = 0.5 * vPar.y;
  // capsule: a soft Gaussian line across (a defocused drop: a flatter, wider blur, like the near snow discs), the
  // exposure window along (the drop enters and leaves it: soft ends)
  float ax = max(abs(vP.x) - hx, 0.0);
  float d = length(vec2(ax, vP.y)) / rD;
  float cov = mix(exp(-d * d * 2.0), 0.75 * (1.0 - smoothstep(0.35, 1.0, d)), vDef);
  cov *= 1.0 - 0.55 * smoothstep(0.55, 1.0, abs(vP.x) / (hx + rD));
  // soft occlusion against the scene (G-buffer ray distance)
  vec2 suv = gl_FragCoord.xy / uRes;
  float occ = clamp((G0(suv).x - vDist) / max(0.4, 0.05 * vDist), 0.0, 1.0);
  float a = clamp(cov * vCol.a * occ, 0.0, 1.0);
  if (a < 0.0015) discard;
  float bead = pow(0.5 + 0.5 * sin(vP.x * vPar.z + vPar.w), 6.0);
  vec3 col = vCol.rgb + vSun * bead;
  // premultiplied; water transmits most of what is behind it, so the background is dimmed less than the
  // refracted light is added
  o = vec4(col * a, a * 0.8);
}
`;
  S.glsl.progs.rain = { vs: ['COMMON', 'ENV', 'ATMOS', 'PRECIP_VS', 'VS_RAIN'], fs: ['PRECISION_FI', 'ENV', 'GBUF', 'FS_RAIN'] };
})(window.SNOW);

</script>
<script>/* js/glsl/post.js */
// =====================================================================================
//  GLSL: post (stage-1 owner: lane C). FXAA on the scene (before the flakes), the bloom down / up chain, and the
//  composite: snow sparkle at canvas resolution (gated by the scene alpha: snow fraction x sun visibility, by the deck
//  and by the drifting cloud shadow), exposure, white balance, ACES, grade (S-curve, desaturation: derive/atmos.js),
//  vignette, grain and the first-load reveal. With ?view= the composite shows the debug channel ungraded.
// =====================================================================================
(function (S) {
  'use strict';
  const C = S.glsl.chunks;
  C.FS_FXAA = `precision highp float;
uniform sampler2D uTex; uniform vec2 uInv;
out vec4 o;
float L(vec3 c) { c = c / (1.0 + c); return dot(c, vec3(0.299, 0.587, 0.114)); }
void main() {
  vec2 uv = gl_FragCoord.xy * uInv;
  vec3 m = texture(uTex, uv).rgb;
  float lNW = L(texture(uTex, uv + vec2(-1.0, -1.0) * uInv).rgb), lNE = L(texture(uTex, uv + vec2(1.0, -1.0) * uInv).rgb);
  float lSW = L(texture(uTex, uv + vec2(-1.0, 1.0) * uInv).rgb), lSE = L(texture(uTex, uv + vec2(1.0, 1.0) * uInv).rgb);
  float lM = L(m);
  float lMin = min(lM, min(min(lNW, lNE), min(lSW, lSE))), lMax = max(lM, max(max(lNW, lNE), max(lSW, lSE)));
  if (lMax - lMin < max(0.03, lMax * 0.1)) { o = vec4(m, 1.0); return; }
  vec2 dir = vec2(-((lNW + lNE) - (lSW + lSE)), ((lNW + lSW) - (lNE + lSE)));
  float red = max((lNW + lNE + lSW + lSE) * 0.03125, 1.0 / 128.0);
  dir = clamp(dir / (min(abs(dir.x), abs(dir.y)) + red), -6.0, 6.0) * uInv;
  vec3 A = 0.5 * (texture(uTex, uv + dir * (1.0 / 3.0 - 0.5)).rgb + texture(uTex, uv + dir * (2.0 / 3.0 - 0.5)).rgb);
  vec3 B = A * 0.5 + 0.25 * (texture(uTex, uv - dir * 0.5).rgb + texture(uTex, uv + dir * 0.5).rgb);
  float lB = L(B);
  o = vec4((lB < lMin || lB > lMax) ? A : B, 1.0);
}`;
  C.FS_DOWN = `precision highp float;
uniform sampler2D uSrc; uniform vec2 uSrcInv; uniform vec2 uDstRes; uniform float uThresh;
out vec4 o;
void main() {
  vec2 uv = gl_FragCoord.xy / uDstRes;
  vec3 c = texture(uSrc, uv + uSrcInv * vec2(-1.0, -1.0)).rgb + texture(uSrc, uv + uSrcInv * vec2(1.0, -1.0)).rgb
         + texture(uSrc, uv + uSrcInv * vec2(-1.0, 1.0)).rgb + texture(uSrc, uv + uSrcInv * vec2(1.0, 1.0)).rgb;
  c *= 0.25;
  if (uThresh > 0.0) { float l = max(c.r, max(c.g, c.b)); c *= max(l - uThresh, 0.0) / max(l, 1e-4); c = min(c, vec3(30.0)); }
  o = vec4(c, 1.0);
}`;
  C.FS_UP = `precision highp float;
uniform sampler2D uSrc; uniform vec2 uSrcInv; uniform vec2 uDstRes;
out vec4 o;
void main() {
  vec2 uv = gl_FragCoord.xy / uDstRes;
  vec3 c = texture(uSrc, uv).rgb * 4.0;
  c += (texture(uSrc, uv + vec2(uSrcInv.x, 0.0)).rgb + texture(uSrc, uv - vec2(uSrcInv.x, 0.0)).rgb + texture(uSrc, uv + vec2(0.0, uSrcInv.y)).rgb + texture(uSrc, uv - vec2(0.0, uSrcInv.y)).rgb) * 2.0;
  c += texture(uSrc, uv + uSrcInv).rgb + texture(uSrc, uv - uSrcInv).rgb + texture(uSrc, uv + vec2(uSrcInv.x, -uSrcInv.y)).rgb + texture(uSrc, uv + vec2(-uSrcInv.x, uSrcInv.y)).rgb;
  o = vec4(c / 16.0, 1.0);
}`;
  C.FS_COMP = `uniform sampler2D uHdr, uBloom, uScene;
uniform float uExposure, uBloomStr, uFrame, uTwinkleT;
uniform vec3 uGrade;         // white balance (season; rain cools it)
uniform vec3 uGradeP;        // x desaturation, y S-curve strength, z sparkle gate (direct sun: overcast, fog; > 1: denser, brighter glints)

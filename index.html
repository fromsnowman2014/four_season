    const veer = veers ? 0.75 * S.vn1(seed * 31 + 7, t / 90) + 0.2 * S.vn1(seed * 31 + 8, t / 25) : 0;
    const ang = baseAng + veer;
    // speed: the season, the Phase-1 gust beat, and slower seeded lulls / freshening
    const g1 = Math.sin(t * 0.37) * 0.5 + Math.sin(t * 0.91 + 1.3) * 0.3 + Math.sin(t * 2.3 + 0.4) * 0.2;
    const sp = baseMag * (w[0] * SEASON_SPEED[0] + w[1] * SEASON_SPEED[1] + w[2] * SEASON_SPEED[2] + w[3] * SEASON_SPEED[3])
      * (1 + 0.45 * g1) * (1 + 0.3 * S.vn1(seed * 31 + 9, t / 40));
    const cx = Math.cos(ang) * sp, cz = Math.sin(ang) * sp;
    // gale: slow swell (g2) times a phase-modulated gust train (1.3 / 2.9 / 6.1 rad/s beat), along the Phase-1 gale
    // line (mostly screen-right, a little away from the camera) turned by the event heading and 40% of the veer
    const g2 = Math.sin(t * 0.53 + 2.0) * 0.45 + Math.sin(t * 1.37 + 0.7) * 0.35 + Math.sin(t * 3.1) * 0.2;
    const gustTrain = 1 + 0.22 * Math.sin(t * 1.3 + 0.9) + 0.14 * Math.sin(t * 2.9 + 1.8) + 0.08 * Math.sin(t * 6.1);
    const mag = (10.5 + 3.0 * g2) * gustTrain;
    const gx = camR[0] * 0.88 + camF[0] * 0.3, gz = camR[2] * 0.88 + camF[2] * 0.3;
    const h = wx.heading + 0.4 * veer, c = Math.cos(h), sn = Math.sin(h);
    let sx = gx * c - gz * sn, sz = gx * sn + gz * c;
    const l = Math.hypot(sx, sz); sx /= l; sz /= l;
    const ss = smooth(0, 1, wx.ch.gale);
    s.natural[0] = lerp(cx, sx * mag, ss); s.natural[1] = 0; s.natural[2] = lerp(cz, sz * mag, ss);
  }
  // the drag steer: follows the drag velocity while the button is held, decays after release
  function steer(dt, ff) {
    const m = S.mouse, st = s.steer;
    if (!ff && m && m.drag) {
      let tx = (m.vxn || 0) * STEER_K * camR[0] + (m.vyn || 0) * STEER_K * fwd[0];
      let tz = (m.vxn || 0) * STEER_K * camR[2] + (m.vyn || 0) * STEER_K * fwd[2];
      const tl = Math.hypot(tx, tz);
      if (tl > STEER_MAX) { tx *= STEER_MAX / tl; tz *= STEER_MAX / tl; }
      const k = 1 - Math.exp(-dt / (Math.hypot(tx, tz) > Math.hypot(st[0], st[2]) ? 0.12 : 1.5));
      st[0] += (tx - st[0]) * k; st[2] += (tz - st[2]) * k;
    } else {
      const k = Math.pow(0.5, dt / STEER_HALF);
      st[0] *= k; st[2] *= k;
    }
    s.bias = st[0] * camR[0] + st[2] * camR[2];
    s.gust = st[0] * fwd[0] + st[2] * fwd[2];
  }

  S.wind = {
    s,
    init(cfg) {
      const w = cfg.wind;
      veers = !(w.length === 2 && w.every(isFinite));
      s.baseWind = veers ? [0.9, 0, 0.35] : [w[0], 0, w[1]];
      baseAng = Math.atan2(s.baseWind[2], s.baseWind[0]); baseMag = Math.hypot(s.baseWind[0], s.baseWind[2]);
      seed = cfg.seed >>> 0;
      s.steer = [0, 0, 0]; s.bias = 0; s.gust = 0;
      natural(S.anim.time);
      s.target = [...s.natural]; s.windA = [...s.natural]; s.windB = [...s.natural];
    },
    step(dt, ff) {
      setFwd();
      natural(S.anim.time);
      steer(dt, ff);
      const kA = 1 - Math.exp(-dt / 1.1), kB = 1 - Math.exp(-dt / 0.4);
      for (let i = 0; i < 3; i++) {
        s.target[i] = s.natural[i] + s.steer[i];
        s.windA[i] += (s.target[i] - s.windA[i]) * kA;
        s.windB[i] += (s.target[i] - s.windB[i]) * kB;
      }
    },
    snapshot: () => ({ wind: { x: +((s.windA[0] + s.windB[0]) / 2).toFixed(3), z: +((s.windA[2] + s.windB[2]) / 2).toFixed(3), steer: +Math.hypot(s.steer[0], s.steer[2]).toFixed(3) } }),
    api: {},
  };
})(window.SNOW);

</script>
<script>/* js/derive/surface.js */
// =====================================================================================
//  derive/surface.js (stage-1 owner: lane D) — the ground surface: the sim state -> S.F for the SURFACE chunk.
//  Pure JS (no GL, no DOM). Climate: the year phase (vegetation clock) and the season weights; weather: the meadow
//  temperature and whether snow is falling (thaw gate); ground: cover, wetness and the snowline (scene metres; a
//  snowline far below the scene, e.g. the core default -10000 or winter's -1600, leaves effectiveCover() the Phase-1
//  cover).
//
//  S.derive.surface = { init(), step(dt, ff), frame(F), visCover, coverAt(alt) }   frame runs first of the three
//    frame(F)     uCover uWet uSnowline uSeasonW uTemp uGrassDisp uYearPhase uMelt
//    coverAt(alt) the cover level left at altitude alt (m) after this frame's snowline: SURFACE's effectiveCover through
//                 its JS twin S.snowlineOffset (glsl/surface.js, the same constants), without the per-pixel aspect /
//                 noise shift; 0..1. derive/atmos.js keys the exposure to it (it runs after this frame)
//    visCover     coverAt(the chalet meadow, -50 m): the snow the meadow shows
// =====================================================================================
(function (S) {
  'use strict';
  const SNOWLINE_W = 300;                   // m: half-width of the snowline transition (uSnowline.y)
  const MEADOW_ALT = -50;                   // m: the chalet meadow's altitude (visCover)
  const GRASS_PERIOD = 2560000 / 45;        // m: 10 periods of the 0.045 grass-wave octave = 27 of the 0.1215 one (SURFACE)
  const snowline = new Float32Array(2), grassDisp = new Float32Array(3);
  const { clamp } = S;

  let cover = 0, line = -10000;            // this frame's cover level and snowline (coverAt)
  S.derive.surface = {
    visCover: 0,
    coverAt: alt => clamp(cover - S.snowlineOffset(alt, line, SNOWLINE_W), 0, 1),
    init() {},
    step() {},
    frame(F) {
      const g = S.ground.s, w = S.weather.s;
      F.uCover = g.cover;
      F.uWet = g.wet;
      snowline[0] = g.snowline; snowline[1] = SNOWLINE_W; F.uSnowline = snowline;
      F.uSeasonW = S.climate.s.seasonW;
      F.uYearPhase = S.climate.s.phase;
      F.uTemp = w.temp;
      // thaw gate: fresh snow keeps falling on top -> no melt look and no melt order while it snows
      F.uMelt = 1 - clamp(3 * w.ch.precip * w.ch.snowFrac, 0, 1);
      // the snow the meadow shows after the snowline (the shared offset model, see coverAt)
      cover = g.cover; line = g.snowline;
      S.derive.surface.visCover = S.derive.surface.coverAt(MEADOW_ALT);
      // grass-wave displacement, wrapped at the common period of its two noise octaves (0.045 and 0.1215 = 2.7 x 0.045
      // per metre on a 256-periodic texture: 10 and 27 periods respectively), so the sheen never jumps
      for (let i = 0; i < 3; i++) grassDisp[i] = S.anim.dispA[i] % GRASS_PERIOD;
      F.uGrassDisp = grassDisp;
    },
  };
})(window.SNOW);

</script>
<script>/* js/derive/precip.js */
// =====================================================================================
//  derive/precip.js (stage-1 owner: lane E) — precipitation: the sim state -> S.F (rates, curtain, wet snow, the
//  distant veils and rain curtains, the flake / rain shutters, fall factors, wind and clocks), and the
//  precipitation clocks. Pure JS (no GL, no DOM). Reads S.weather.s (ch.precip, ch.snowFrac, ch.heavy, ch.gale,
//  temp, curtain, white, tail) and S.wind.s; the counts (precip.js) scale the rates with S.amountMul().
//
//  S.derive.precip = { init(), step(dt, ff), frame(F) }       frame runs second (after surface, before atmos)
//    init / step   the clocks, all integrals over PHYSICAL time (a rate change never jumps a phase or a particle):
//                  S.anim.fallI  snow fall integral (fall factor kS; uFallV = kS = d fallI / dt)
//                  S.anim.tumI   tumble integral (uTumT, wrapped by TW = 120)
//                  S.anim.rainI  rain fall integral (fall factor kR; uRainV = kR = d rainI / dt)
//                  S.anim.veilI[4] snow veil scroll, veilR[4] rain veil scroll, gustR[2] rain gust bands: wrapped by the
//                  256 noise period; like Phase 1's veil they hold during fastForward
//                  The wet-snow factor is slewed in physical time (tau 4 s): it scales non-integrated amplitudes
//                  (flutter, size), so a jump in temperature (a pick at 8x, a test hook) cannot jerk the flakes.
//    frame(F)      uSnowCurtain uPrecipSnow uPrecipRain uSnowFrac uGale uHeavy uWetSnow
//                  uVeilDir uVeilAmt uVeilT (snow veil), uRainDir uRainVeil uRainT uRainShaft (rain veil + curtains)
//                  uExpo uFallV uTumT (flakes), uExpoRain uRainV uRainGust (rain), uWindA uWindB uFlakeT
// =====================================================================================
(function (S) {
  'use strict';
  const { lerp, smooth, camR } = S;
  const veilDir = new Float32Array(2), veilT = new Float32Array(4);
  const rainDir = new Float32Array(2), rainT = new Float32Array(4), rainShaft = new Float32Array(4), rainGust = new Float32Array(2);
  // wet snow (big heavy aggregates) from the meadow temperature: only in the thaw band above the freezing point,
  // where the flakes partly melt and stick together (the sleet zone: snowFrac ramps out over 1..3 deg C), and only
  // partially (at most WET_MAX of the crystals turn into clumps, so crisp six-armed crystals keep falling between the
  // aggregates). Below +0.4 deg C the snow is the dry Phase-1 snowfall (the late-autumn opening at about -2.5 deg C);
  // above ~2.6 deg C the last few flakes stay dry
  const WET_MAX = 0.6;
  const wetOf = T => WET_MAX * smooth(0.4, 1.5, T) * (1 - smooth(2.1, 2.6, T));
  // fall factors (one source of truth for the integrals and the shaders' velocities): the blizzard curtain and wet
  // clumps fall faster (wet snow ~1.5-2.4 m/s); heavy rain has slightly bigger, faster drops
  const snowK = (c, w) => 1 + 0.9 * c + 0.8 * w;
  const rainK = r => 1 + 0.06 * r;
  const RAIN_V = 7.2;                         // m/s: typical drop speed, for the apparent slant of the distant rain
  const st = { wet: 0, kS: 1, kR: 1 };
  const rainRate = ch => ch.precip * (1 - ch.snowFrac);

  S.derive.precip = {
    init() {
      const a = S.anim, wx = S.weather.s;
      a.fallI = 0; a.tumI = 0; a.rainI = 0; a.veilI = [0, 0, 0, 0]; a.veilR = [0, 0, 0, 0]; a.gustR = [0, 0];
      st.wet = wetOf(wx.temp); st.kS = snowK(wx.curtain, st.wet); st.kR = rainK(rainRate(wx.ch));
    },
    step(dt, ff) {
      const a = S.anim, wx = S.weather.s, c = wx.curtain;
      st.wet += (wetOf(wx.temp) - st.wet) * (1 - Math.exp(-dt / 4));
      st.kS = snowK(c, st.wet); st.kR = rainK(rainRate(wx.ch));
      // shader clocks as integrals (so storm ramps / wind changes never jump a phase): fall, tumble, rain
      a.fallI += st.kS * dt;
      a.tumI += (1 + 0.8 * c) * (1 - 0.5 * st.wet) * dt;
      a.rainI += st.kR * dt;
      if (ff) return;
      const w = S.wind.s.windA, wl = w[0] * camR[0] + w[2] * camR[2];
      const vdx = wl / (1.2 + 1.5 * c), vl = Math.hypot(vdx, 1);             // apparent fall direction of the distant veil
      const vI = a.veilI;
      vI[0] = (vI[0] + (2.2 + 4.0 * c) * dt) % 256; vI[1] = (vI[1] + (1.4 + 2.6 * c) * dt) % 256;
      vI[2] = (vI[2] + (0.05 - 0.25 * vdx / vl) * dt) % 256; vI[3] = (vI[3] + 0.25 / vl * dt) % 256;
      // rain veil: the grain sheets fall fast along the rain's apparent direction, the density drifts with the wind
      const rdx = wl / (RAIN_V * st.kR), rl = Math.hypot(rdx, 1), vR = a.veilR;
      vR[0] = (vR[0] + 2.6 * st.kR * dt) % 256; vR[1] = (vR[1] + 1.2 * st.kR * dt) % 256;
      vR[2] = (vR[2] + (0.02 - 0.12 * rdx / rl) * dt) % 256; vR[3] = (vR[3] + 0.05 / rl * dt) % 256;
      // rain gust bands sweep downwind (screen x) and drift down a little
      const g = a.gustR;
      g[0] = (g[0] - (0.05 * wl) * dt) % 256; g[1] = (g[1] + 0.06 * dt) % 256;
    },
    frame(F) {
      const wx = S.weather.s, ch = wx.ch, c = wx.curtain, a = S.anim, w = S.wind.s;
      const pr = ch.precip * (1 - ch.snowFrac);
      F.uSnowCurtain = c;
      F.uPrecipSnow = ch.precip * ch.snowFrac;
      F.uPrecipRain = pr;
      F.uSnowFrac = ch.snowFrac; F.uGale = ch.gale; F.uHeavy = ch.heavy;
      F.uWetSnow = st.wet;
      const wl = w.windA[0] * camR[0] + w.windA[2] * camR[2];
      // the distant snow veil (VEIL): apparent fall direction, amount (Phase 1's faint floor scaled by the snowfall
      // rate, + the whiteout, + the residual veil while a storm clears, gated by the snowfall like the atmosphere's
      // tail extinction (derive/atmos.js): 0 in dry weather), scroll
      veilDir[0] = wl / (1.2 + 1.5 * c); veilDir[1] = -1.0; F.uVeilDir = veilDir;
      F.uVeilAmt = 0.012 * Math.min(1, F.uPrecipSnow) + 0.18 * smooth(0, 1, wx.white) + 0.04 * wx.tail * smooth(0, 0.3, F.uPrecipSnow);
      for (let i = 0; i < 4; i++) veilT[i] = a.veilI[i];
      F.uVeilT = veilT;
      // the rain veil and the far rain curtains (VEIL): the faint mid-distance grain, and grey shafts hanging under
      // the cloud base (optical depth per km from the rain rate; slant = the wind over the drop speed)
      rainDir[0] = wl / (RAIN_V * st.kR); rainDir[1] = -1.0; F.uRainDir = rainDir;
      const ra = 0.6 + 0.4 * S.amountMul();             // the user's amount thins / thickens the distant rain too
      F.uRainVeil = 0.05 * smooth(0, 0.8, pr) * (1 + 0.5 * ch.gale) * ra;
      for (let i = 0; i < 4; i++) rainT[i] = a.veilR[i];
      F.uRainT = rainT;
      rainShaft[0] = 0.24 * smooth(0, 1, pr) * (0.7 + 0.6 * pr) * ra;   // (stage 2b: the far curtains read over the valley)
      rainShaft[1] = 1 - ch.overcast;                   // sunlit share: shafts under broken cloud catch the sun
      // the slant of the distant curtains (clamped: a gale lays them over by at most ~40 deg)
      const sl = Math.min(1, 0.85 / Math.max(1e-6, Math.hypot(w.windA[0], w.windA[2]) / RAIN_V));
      rainShaft[2] = w.windA[0] / RAIN_V * sl; rainShaft[3] = w.windA[2] / RAIN_V * sl;
      F.uRainShaft = rainShaft;
      // flakes: calm = fast shutter, crisp hero crystals; rain: a slow shutter, so a drop is the streak of its path
      // (~1.3 frames of motion at 60 fps: consecutive frames join into continuous rain)
      F.uExpo = lerp(1 / 220, 1 / 55, smooth(0, 1, c));
      F.uFallV = st.kS;
      F.uExpoRain = 1 / 45;
      F.uRainV = st.kR;
      rainGust[0] = a.gustR[0]; rainGust[1] = a.gustR[1]; F.uRainGust = rainGust;
      F.uWindA = w.windA; F.uWindB = w.windB;
      F.uFlakeT = a.time % 120; F.uTumT = a.tumI % 120;
    },
  };
})(window.SNOW);

</script>
<script>/* js/derive/atmos.js */
// =====================================================================================
//  derive/atmos.js (stage-1 owner: lane C) — sky, light and atmosphere: the sim state -> S.F, and the cloud drift
//  integral. Pure JS (no GL calls, no DOM). The single place that maps the weather channels, the season and the ground
//  to the light: sun / ambient / sky / fog colours, haze and extinction, the valley mist and the fog sea, the cloud
//  slab, cloud-shadow strength, exposure, white balance and grade.
//
//  Palette model: four season keys of the clear-day palette (winter = the Phase-1 palette exactly), blended by the
//  season weights. Falling snow pulls the keys toward winter (snow air is cold and clean), which keeps the Phase-1
//  anchor (?wx= Phase-1 channels) on the Phase-1 palette whatever the date. Weather then moves the clear palette:
//  `od` (smoothed overcast) toward an overcast palette keyed by the ground / precipitation (snow-lit grey = Phase-1
//  storm, wet-meadow grey for rain, bright soft grey for fog days), haze and mist densities follow fog / rain / storm.
//
//  S.derive.atmos = { init(), step(dt, ff), frame(F) }
//    init / step   S.anim.cloud: the integrated cloud drift (m, never wrapped). It follows the NATURAL wind only
//                  (S.wind.s.natural, low-passed over ~25 s so gusts do not jerk the sky), never the pointer steer.
//                  Clouds and their ground shadows move WITH the wind: the shaders sample q = p.xz + uCloudOff, so the
//                  offset integrates minus the cloud velocity.
//    frame(F)      runs last of the three derive frames (after surface and precip), so it may read F.uCover / F.uWet
//                  and F.uSnowCurtain:
//                  uSunCol uSkyAmb uSkyZen uSkyHor uFogCol uFogP uCloudOff uCloudCov uOvercast uCumulus uFogDay uMistP
//                  uCirrus uShadowAmp uExposure uBloomStr, and lane C's own: uHorBand uCloudP uCloudQ uMistQ, uSkyResp
//                  (sky pass), uGrade / uGradeP (composite)
// =====================================================================================
(function (S) {
  'use strict';
  const { lerp, smooth, clamp } = S;

  const lighting = S.lighting = { sun: new Float32Array(3), amb: new Float32Array(3), zen: new Float32Array(3), hor: new Float32Array(3), fog: new Float32Array(3), fogP: new Float32Array(4) };
  // storm: the horizon sky is snow-lit and brighter than the whiteout inscatter (fog), so fogged rock reads as a
  // grey silhouette against it instead of merging with the sky. LIT[0] = the Phase-1 clear palette (the winter key),
  // LIT[1] = the Phase-1 storm palette (snow-lit grey: snow falling or lying)
  const LIT = { amb: [[0.30, 0.40, 0.60], [0.46, 0.50, 0.57]], zen: [[0.10, 0.25, 0.64], [0.40, 0.44, 0.50]], hor: [[0.36, 0.50, 0.78], [0.56, 0.60, 0.66]], fog: [[0.44, 0.56, 0.80], [0.44, 0.48, 0.54]] };
  function mix3(o, a, b, t) { o[0] = lerp(a[0], b[0], t); o[1] = lerp(a[1], b[1], t); o[2] = lerp(a[2], b[2], t); }
  // Storm extinction (Phase 1): plateaus at ~0.00011 (with the storm haze: T ~0.5 at the 3 km wall, ~0.65 at the
  // 1.5 km forest band), only the gust peaks (wd -> 1) push it x5 to a true whiteout; the tail keeps a faint floor
  function stormExt(wd, tail) { return 0.00012 * Math.pow(wd, 1.5) * (1 + 4.0 * smooth(0.95, 1.0, wd)) + 0.00008 * tail; }

  // ---- season keys: [spring, summer, autumn, winter], linear radiance. Winter is the Phase-1 clear day.
  //   spring: fresh, clean blue light, a little valley mist; summer: strong warm sun, milky haze, a pale horizon;
  //   autumn: golden low light (warm sun, warm haze band) under a deep clear sky; winter: crisp blue, cold balance
  const SEASON = {
    sunI: [3.15, 3.35, 2.95, 3.1],
    sun: [[1.0, 0.965, 0.91], [1.0, 0.958, 0.87], [1.0, 0.87, 0.68], [1.0, 0.955, 0.89]],
    amb: [[0.30, 0.41, 0.60], [0.33, 0.41, 0.55], [0.32, 0.36, 0.48], LIT.amb[0]],
    zen: [[0.10, 0.27, 0.66], [0.13, 0.29, 0.62], [0.08, 0.22, 0.62], LIT.zen[0]],
    // (stage 2b: deeper clear-day skies: the summer milk is a light veil over blue, not grey; autumn air is clear)
    hor: [[0.38, 0.53, 0.80], [0.42, 0.56, 0.80], [0.36, 0.48, 0.76], LIT.hor[0]],
    fog: [[0.43, 0.57, 0.82], [0.50, 0.60, 0.77], [0.44, 0.54, 0.74], LIT.fog[0]],
    band: [[0.72, 0.78, 0.87], [0.82, 0.83, 0.84], [0.86, 0.80, 0.70], [0.70, 0.76, 0.86]],   // pale haze band at the horizon
    haze: [1 / 36000, 1 / 24000, 1 / 36000, 1 / 42000],      // haze density at y = 0 (1/m)
    hazeH: [2300, 2700, 2300, 2200],                          // haze scale height (m): summer convective, winter inversion
    mist: [1 / 26000, 1 / 34000, 1 / 28000, 1 / 30000],     // valley mist at its reference level (1/m)
    wb: [[0.985, 1.0, 1.015], [1.01, 1.0, 0.985], [1.02, 1.0, 0.97], [0.97, 1.0, 1.035]],  // white balance (composite)
  };
  // overcast palettes (amb, zen, hor, fog): a wet green meadow under a low grey deck (cool, not murky), a dry
  // overcast, and a bright soft fog day; the snow-lit grey is LIT[1]. The deck stays darker than the Phase-1
  // snow-lit sky so its structure reads after the exposure lift
  const RAINP = { amb: [0.30, 0.34, 0.40], zen: [0.24, 0.27, 0.31], hor: [0.36, 0.39, 0.44], fog: [0.36, 0.39, 0.44] };
  const DULLP = { amb: [0.36, 0.39, 0.45], zen: [0.34, 0.37, 0.42], hor: [0.50, 0.52, 0.56], fog: [0.48, 0.51, 0.56] };
  const FOGP = { amb: [0.42, 0.45, 0.51], zen: [0.46, 0.50, 0.57], hor: [0.66, 0.69, 0.74], fog: [0.64, 0.67, 0.72] };

  const tmp = { a: [0, 0, 0], b: [0, 0, 0], c: [0, 0, 0] };
  // season blend of a key table into o
  function seasonMix(o, keys, w) {
    for (let i = 0; i < 3; i++) o[i] = keys[0][i] * w[0] + keys[1][i] * w[1] + keys[2][i] * w[2] + keys[3][i] * w[3];
    return o;
  }
  const sMix1 = (keys, w) => keys[0] * w[0] + keys[1] * w[1] + keys[2] * w[2] + keys[3] * w[3];
  const lum = c => 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2];

  // frame outputs (lane C's own uniforms are declared in ATMOS / FS_SKY / FS_COMP)
  const horBand = new Float32Array(3), mistP = new Float32Array(4), mistQ = new Float32Array(4);
  const cloudP = new Float32Array(4), cloudQ = new Float32Array(4), cloudOff = new Float32Array(2);
  const grade = new Float32Array(3), gradeP = new Float32Array(3);
  const sw = new Float32Array(4);
  // the exposure reference: horizontal irradiance proxy of the Phase-1 clear day (sun x 0.5 + ambient)
  const E_REF = 0.5 * 3.1 * lum([1.0, 0.955, 0.89]) + lum(LIT.amb[0]);
  const last = new Float32Array(6);        // previous frame's cloud inputs (EMA reset on a jump)
  let haveLast = false;
  let cv = null;                           // low-passed cloud velocity (m/s, xz)

  S.derive.atmos = {
    init() { S.anim.cloud = [0, 0]; cv = null; haveLast = false; },
    step(dt) {
      // cloud velocity: 3x the natural (no pointer) wind plus 10 m/s along it, low-passed over ~25 s
      const n = S.wind.s.natural, nl = Math.hypot(n[0], n[2]);
      const ux = nl > 1e-3 ? n[0] / nl : 1, uz = nl > 1e-3 ? n[2] / nl : 0;
      const tx = 3 * n[0] + 10 * ux, tz = 3 * n[2] + 10 * uz;
      if (!cv) cv = [tx, tz];
      const k = 1 - Math.exp(-dt / 25);
      cv[0] += (tx - cv[0]) * k; cv[1] += (tz - cv[1]) * k;
      const c = S.anim.cloud;
      c[0] -= cv[0] * dt; c[1] -= cv[1] * dt;     // q = p + off: the pattern moves by -off
    },
    frame(F) {
      const wx = S.weather.s, ch = wx.ch, cs = S.climate.s;
      // the snow the camera sees: the cover level after the per-frame snowline, through the shared offset model
      // (derive/surface.js coverAt = SURFACE's effectiveCover without its per-pixel shift; surface.frame ran first) at
      // the meadow (visCover, most of the frame), the slopes (~800 m) and the summits (~2000 m). With the neutral
      // snowline this is uCover itself (Phase 1)
      const surf = S.derive.surface;
      const cover = 0.7 * surf.visCover + 0.2 * surf.coverAt(800) + 0.1 * surf.coverAt(2000);
      const precip = ch.precip, snowFrac = ch.snowFrac;
      const snowFall = precip * snowFrac, rain = precip * (1 - snowFrac);
      // the deck's light response starts at overcast .15: thin cloud (the snow preset's .35) is broken sun, not grey;
      // 0 and 1 are Phase 1's ends (calm, storm)
      const od = smooth(0.15, 1, ch.overcast), wd = smooth(0, 1, wx.white);
      const fog = smooth(0, 1, ch.fog), cum = ch.cumulus;
      // season weights, pulled toward winter by falling snow (and a little by lying snow)
      // (stage 2b: at most 70% from falling snow, so a late-autumn first snow keeps some of the golden low sun on the
      // larches and the tawny meadow; mid-winter, the Phase-1 anchor, is the winter key anyway)
      const wk = clamp(Math.max(0.7 * smooth(0, 0.5, snowFall), 0.5 * cover), 0, 1);
      for (let i = 0; i < 4; i++) sw[i] = cs.seasonW[i] * (1 - wk) + (i === 3 ? wk : 0);
      // snow-lit grey (snow falling or lying) vs the green-meadow overcast palettes
      const snowy = clamp(Math.max(smooth(0, 0.3, snowFall), cover), 0, 1);
      // crisp air of fair weather (clear, cumulus): no deck, no fog, no precipitation (0 at the Phase-1 anchor)
      const crisp = (1 - od) * (1 - fog) * (1 - smooth(0, 0.3, precip));

      // ---- sun: season colour x intensity; overcast takes it down (the storm keeps ~20% for snow relief; a grey
      // deck over a green meadow keeps less: no hard shadows), fog days dim it a little more
      const sunK = (1 - 0.8 * od - 0.12 * od * (1 - snowy)) * (1 - 0.25 * fog * (1 - od));
      const sunI = sMix1(SEASON.sunI, sw) * sunK;
      seasonMix(tmp.a, SEASON.sun, sw);
      for (let i = 0; i < 3; i++) lighting.sun[i] = tmp.a[i] * sunI;
      // ---- ambient / sky / fog colours: clear season palette -> overcast palette by od
      const pal = (key, out) => {
        seasonMix(tmp.a, SEASON[key], sw);
        // clear days: a slightly deeper horizon (less milk) than the Phase-1 calm
        if (key === 'hor' || key === 'fog') { seasonMix(tmp.c, SEASON.zen, sw); mix3(tmp.a, tmp.a, tmp.c, 0.12 * crisp); }
        // the overcast palette for this ground: dull grey -> rain grey -> fog day, then snow-lit grey
        mix3(tmp.b, DULLP[key], RAINP[key], smooth(0, 0.5, rain));
        mix3(tmp.b, tmp.b, FOGP[key], fog);
        mix3(tmp.b, tmp.b, LIT[key][1], snowy);
        mix3(out, tmp.a, tmp.b, Math.max(od, 0.6 * fog));
      };
      pal('amb', lighting.amb); pal('zen', lighting.zen); pal('hor', lighting.hor); pal('fog', lighting.fog);
      seasonMix(horBand, SEASON.band, sw);
      mix3(horBand, horBand, lighting.hor, Math.max(od, fog));      // the band is a clear-air effect
      // ---- haze / extinction / mist
      // haze: the season's clear-day haze -> the deck's haze (dry 1.8x the winter haze, rain 3.8x, snowing 5.5x = Phase
      // 1's 1/42000 (1 + 4.5 od)); fog days thicken it a little more
      const rk = smooth(0, 0.6, rain);
      // heavier rain thickens the air: the rain's extinction and its share of the deck haze scale with the rain rate and
      // the user's amount (as the particles and the far curtains do, derive/precip.js), relative to the canonical rain
      // preset (rate .65) at the default amount (amountMul 1), where the factor is 1: x1.18 at amount 1, ~x1.5 at rate 1
      const heavyR = Math.pow(rain * (0.6 + 0.4 * S.amountMul()) / 0.65, 0.6);
      const fs = smooth(0.4, 1.0, ch.fog);           // the fog sea forms only on fog days (fog .2 under rain / storms: more valley mist)
      // (stage 2b: rain air is clearer than it was: the valley keeps its depth under the deck, the far ridges dissolve
      // into it layer by layer instead of the whole left half going flat grey)
      const hazeDeck = (1.8 + 1.0 * rk * heavyR + 3.7 * smooth(0, 0.6, snowFall)) / 42000;    // a snowing deck: Phase 1's 5.5x
      // a fog-sea day is an inversion: the air above the sea is clearer than a grey day's (the ridges stand out crisply
      // over the white sea)
      lighting.fogP[0] = lerp(sMix1(SEASON.haze, sw) * (1 - 0.3 * crisp), hazeDeck, od) * (1 - 0.45 * fs);
      lighting.fogP[1] = sMix1(SEASON.hazeH, sw);
      lighting.fogP[2] = stormExt(wd, wx.tail * smooth(0, 0.3, snowFall)) + 0.000008 * rk * heavyR;   // the tail is thinning snow
      // the mist layer: the Phase-1 valley mist (reference level -650 m, 260 m scale) rises into the fog sea on fog days:
      // a dense, shallow layer (12 m scale) whose top (~-72 m, swelling +-20 m) floods the valley and the chalet basin
      // while the near meadow, the crowns of the forest band and every ridge stand above it. uFogP.w: the density at
      // the reference level (1/m)
      // (a snowing deck: Phase 1's (1 + 4.7 od); a dry deck keeps the season's, rain fills the valley with low cloud)
      // (stage 2b: fair weather thins it to a light valley haze (crisp): in the sun of a clear day the dense floor
      // mist read as a lone glowing blob over the far valley)
      // calm: no snow falling and no fog sea (dry or rainy days): the valley mist stays an even haze there too
      const calm = (1 - smooth(0, 0.3, snowFall)) * (1 - fs);
      const mist = sMix1(SEASON.mist, sw) * (1 + 4.7 * smooth(0, 0.6, snowFall) * od) * (1 + 2 * ch.fog * (1 - 0.6 * rk)) * (1 - Math.max(0.6 * crisp, 0.45 * calm));
      lighting.fogP[3] = mist * Math.pow(180 * mist, -fs);   // geometric blend mist -> 1/180: the sea rises / drains smoothly
      const even = Math.max(crisp, 0.8 * calm);
      mistP[0] = lerp(650, 72, fs);           // reference level depth (level -x m)
      // scale height (m): on calm days a deeper, even layer (a valley haze over the whole valley, not a dense film
      // pooled on the valley floor, which glowed as one bright spot under a grey sky)
      mistP[1] = lerp(lerp(260, 560, even), 12, fs);
      // (stage 2b: fair weather keeps the mist an even valley haze: a dense bank at the valley floor ~5 km out read as
      // a lone glowing blob)
      mistP[2] = lerp(lerp(0.3, 0.55, even), 0.8, fs);        // bank floor
      mistP[3] = lerp(lerp(1.3, 0.35, even), 0.45, fs);       // bank gain
      mistQ[0] = 20 * fs;                     // fog-sea top swell (m, +-), drifting with half the cloud wind
      mistQ[1] = 0.22 * fs;                   // sun glow of the fog-sea top (x sun visibility)
      mistQ[2] = fs;                          // fog-sea weight (soft far shoreline, sea texture, haze in front)
      mistQ[3] = 0;
      F.uMistP = mistP; F.uMistQ = mistQ;
      F.uSunCol = lighting.sun; F.uSkyAmb = lighting.amb; F.uSkyZen = lighting.zen; F.uSkyHor = lighting.hor; F.uFogCol = lighting.fog;
      F.uFogP = lighting.fogP; F.uHorBand = horBand;

      // ---- clouds
      cloudOff[0] = S.anim.cloud[0]; cloudOff[1] = S.anim.cloud[1];
      F.uCloudOff = cloudOff;
      F.uCloudCov = ch.cloudCov;
      F.uOvercast = ch.overcast;
      F.uCumulus = cum; F.uFogDay = ch.fog; F.uCirrus = ch.cirrus;
      // the slab: Phase 1 renders only the far field (left of centre from 19 km, right from 13 km). Cumulus open it to
      // the whole sky band (the nearest slab the camera sees is ~8 km out at the top of the frame) but keep the far cut
      // in front of the left massif (its jagged summit, 17.5 km out, stays a clean silhouette: a flat cumulus base
      // across it reads as a mesa). A grey deck (overcast, rain) closes in everywhere, the massif's summit included,
      // and under rain it lowers to ~1150 m so the tops of the walls go into the cloud. Not under a snow curtain: the
      // blizzard keeps the Phase-1 storm sky
      const deck = smooth(0.3, 0.9, ch.overcast) * (1 - smooth(0, 0.3, F.uSnowCurtain));
      const near = Math.max(cum, deck);
      cloudP[0] = lerp(lerp(19000, 18000, cum), 9000, deck);   // cut distance, left of the side split
      cloudP[1] = lerp(13000, 3000, near);     // cut distance, right of it
      cloudP[2] = lerp(5000, 2500, near);      // cut fade (m)
      cloudP[3] = lerp(700, 160, cum);         // base undulation (m, peak to peak): cumulus share a flat condensation level
      // slab base (m): a dry grey deck is a high lid (~2900 m, the massif's summit just grazing it; a flat base across
      // the massif at 1500-2000 m read as a table mountain), a rain deck hangs low (~1150 m: the walls go into it)
      cloudQ[0] = lerp(lerp(1500, 1700, cum), lerp(2900, 1150, rk), deck);
      cloudQ[1] = lerp(3600, 4400, deck * (1 - rk));   // slab top (m)
      cloudQ[2] = deck;                        // the near grey deck (its ragged, soft base)
      cloudQ[3] = lerp(0, -0.3, near);         // side split: sin(azimuth) where the left cut starts to give way
      F.uCloudP = cloudP; F.uCloudQ = cloudQ;
      // cloud shadows: Phase 1 0.65, crisp deep shadows under fair-weather cumulus
      F.uShadowAmp = lerp(0.65, 0.85, cum);
      // sky-pass EMA (0.3 per frame in render.js): a jump of the cloud inputs (debug hooks, instant picks, setStorm)
      // restarts the accumulation for one frame instead of ghosting the old clouds for ~10 frames
      let jump = 0;
      [ch.cloudCov, cum, ch.overcast, ch.fog, lighting.sun[0], lighting.amb[2]].forEach((v, i) => {
        if (haveLast) jump = Math.max(jump, Math.abs(v - last[i]) / (i >= 4 ? Math.max(last[i], 0.05) : 1));   // light: relative
        last[i] = v;
      });
      haveLast = true;
      F.uSkyResp = jump > 0.08 ? 1 : 0;      // a 60 s transition at 8x on a 10 fps device moves ~0.013 per frame

      // ---- exposure: Phase 1 (full cover sits sunlit snow below the ACES shoulder) x a partial auto-exposure on
      // the light level (overcast / rain days on a green meadow are lifted ~1.3-1.55x so they read soft, not murky).
      // Snow in view or a snow curtain keeps the Phase-1 storm exposure (the storm stays moody)
      const E = 0.5 * lum(lighting.sun) + lum(lighting.amb);
      // (stage 2b: a rain day is lifted less: it stays a little darker and moodier than a dry grey day)
      const comp = Math.min(1.55 - 0.3 * rk, Math.pow(E_REF / E, 0.45));
      const keep = Math.max(cover, smooth(0, 0.5, F.uSnowCurtain), 0.6 * smooth(0, 0.3, snowFall));
      F.uExposure = lerp(1.0, 0.54, Math.pow(cover, 1.3)) * lerp(1.0, 1.05, F.uSnowCurtain) * lerp(comp, 1, keep) * (1 - 0.1 * fog);
      F.uBloomStr = 0.12 + 0.05 * fog;
      // ---- grade: season white balance (rain cools it), desaturation (overcast, rain), S-curve (flatter in rain / fog)
      seasonMix(grade, SEASON.wb, sw);
      const rg = rk * od;
      grade[0] *= 1 - 0.02 * rg; grade[2] *= 1 + 0.02 * rg;
      F.uGrade = grade;
      gradeP[0] = 0.1 * od + 0.02 * rg + 0.06 * fog;    // desaturation (rain: wet colours stay rich)
      gradeP[1] = 0.2 * (1 - 0.2 * rg - 0.35 * fog);    // S-curve strength
      // sparkle gate (direct sun); above 1 on crisp fair days (stage 2b): denser, brighter glints on clear winter snow
      gradeP[2] = (1 - od) * (1 - 0.7 * fog) * (1 + 0.9 * crisp);
      F.uGradeP = gradeP;
    },
  };
})(window.SNOW);

</script>
<script>/* js/precip.js */
// =====================================================================================
//  precip.js (stage-1 owner: lane E) — the precipitation layers and their draw: the layer descriptors, the
//  per-layer lattice wrap of the wind / fall integrals, and S.drawPrecip(ctx), which render.js calls between FXAA and
//  bloom (premultiplied alpha into R.hdr). Registers only.
//
//  Layer descriptor: { id, kind: 'snow' | 'rain', prog, z0, z1, fade, base, max, heavy, vlo, vhi, fallKey, rateKey,
//                      wet (snow) | push (rain) }
//    id        uLayer inside its program (VS_FLAKE: 0 near bokeh, 1 crystals, 2 mid, 3 far, 4 hero; VS_RAIN: 5 near
//              defocused drops, 6 near streaks, 7 mid, 8 far fine streaks). Distinct ids = independent hashes.
//    prog      the S.P program that draws it ('flake' | 'rain')
//    z0 z1 fade   camera-space depth slice (m) and its edge fade length
//    base max     instance count at density x1 / hard cap; heavy: count multiplier at full uHeavy
//    vlo vhi      fall-speed range (m/s at fall factor 1) of its 40 speed bins (uFallLH)
//    fallKey      the S.anim fall integral its bins wrap ('fallI' | 'rainI')
//    rateKey      the S.F rate its count scales with ('uPrecipSnow' | 'uPrecipRain')
//    wet          snow: count multiplier at full wet snow (x (1 + (wet - 1) x uWetSnow): fewer, bigger clumps)
//    push         rain: drag-wake weight (uPushK; VS_FLAKE keeps Phase 1's 1)
//  count = min(max x flakeMul, base x amountMul x flakeMul x F[rateKey] x (1 + (heavy - 1) x F.uHeavy) x the wet
//  multiplier); a layer with count 0 is skipped (no program switch, no cost). Layers draw far to near (sorted by z1),
//  switching program only when the kind changes, so rain and snow slices interleave by depth. Sleet is both
//  populations at once, their counts cross-fading with snowFrac (instances enable in id order and the last one
//  fades: no pops); a particle never changes kind, bin or speed range.
//  Budget at amount 0.5: calm snow ~60k, blizzard ~183k; rain .65 ~15k; heavy rain at the caps (precip 1, heavy 1,
//  amount 1) ~54k instances, about half the blizzard's GPU cost.
// =====================================================================================
(function (S) {
  'use strict';
  const { camR, camU, camF } = S;   // mutated in place by S.frameCamera; S.TANH is read per use
  const R = S.R;
  const NB = 40;                                   // fall-speed bins (must match PRECIP_VS)
  const SNOW = { kind: 'snow', prog: 'flake', vlo: 0.4675, vhi: 1.5525, fallKey: 'fallI', rateKey: 'uPrecipSnow' };
  // rain bins: the drop speeds of VS_RAIN (1.6-4.4 mm drops: 5.7-8.9 m/s)
  const RAIN = { kind: 'rain', prog: 'rain', vlo: 5.5, vhi: 9.0, fallKey: 'rainI', rateKey: 'uPrecipRain' };
  const LAYERS = S.LAYERS = [
    // heavy: per-layer density multiplier at full blizzard (total flake count ends up > x6)
    // wet: count multiplier for wet snow (fewer, bigger clumps: the near tiers gain, the far fine field thins)
    { ...SNOW, id: 3, z0: 26, z1: 240, fade: 22, base: 46000, max: 125000, heavy: 6.5, wet: 0.75 },
    { ...SNOW, id: 2, z0: 8, z1: 30, fade: 4, base: 12000, max: 50000, heavy: 4.5, wet: 0.9 },
    { ...SNOW, id: 1, z0: 2.3, z1: 9.0, fade: 0.9, base: 2500, max: 14000, heavy: 3.2, wet: 1.35 },
    { ...SNOW, id: 4, z0: 0.9, z1: 2.4, fade: 0.3, base: 36, max: 220, heavy: 1.7, wet: 1.5 },     // hero crystals (sparse, in focus)
    { ...SNOW, id: 0, z0: 0.25, z1: 0.8, fade: 0.15, base: 20, max: 140, heavy: 2.0, wet: 1.0 },   // near bokeh discs (~3 on screen)
    // rain: far fine streaks, mid streaks, near sharp streaks, a few big defocused drops at the lens
    { ...RAIN, id: 8, z0: 14, z1: 70, fade: 8, base: 14000, max: 34000, heavy: 2.5, push: 0.45 },
    { ...RAIN, id: 7, z0: 4.5, z1: 18, fade: 2, base: 8000, max: 17000, heavy: 2.2, push: 0.6 },
    { ...RAIN, id: 6, z0: 1.3, z1: 5.5, fade: 0.6, base: 1100, max: 2600, heavy: 2.0, push: 0.8 },
    { ...RAIN, id: 5, z0: 0.3, z1: 1.5, fade: 0.2, base: 30, max: 100, heavy: 1.6, push: 1.0 },
  ].sort((a, b) => b.z1 - a.z1);
  for (const L of LAYERS) { L.hx = 0; L.hy = 0; L.dA = new Float32Array(3); L.dB = new Float32Array(3); L.fall = new Float32Array(3 * NB); }
  S.layoutLayers = function () {
    const asp = R.W / R.H;
    const tanH = S.TANH;
    for (const L of LAYERS) { L.hx = L.z1 * tanH * asp * 1.1 + 0.3; L.hy = L.z1 * tanH * 1.1 + 0.3; }
  };
  const count = S.precipCount = { snow: 0, rain: 0 };   // instances drawn last frame, per kind

  // Lattice wrap of the per-layer displacement integrals (all CPU-side, in double precision). The shader folds
  // positions into the camera-aligned slice box with a mod, so shifting a displacement by any lattice vector of
  // that box is invisible: that keeps the uploaded floats small (no precision loss) with no discontinuity.
  const AXES = [camR, camU, camF];
  const boxS = [0, 0, 0], shift = [0, 0, 0], cq = [0, 0, 0];
  function latticeShift(cx, cy, cz) {   // camera-space coords -> the lattice vector to subtract (world space, in shift[])
    shift[0] = shift[1] = shift[2] = 0;
    cq[0] = cx; cq[1] = cy; cq[2] = cz;
    for (let j = 0; j < 3; j++) { const ax = AXES[j], n = Math.floor(cq[j] / boxS[j]) * boxS[j]; shift[0] += ax[0] * n; shift[1] += ax[1] * n; shift[2] += ax[2] * n; }
  }
  function wrapLayer(L) {
    const anim = S.anim;
    boxS[0] = 2 * L.hx; boxS[1] = 2 * L.hy; boxS[2] = L.z1 - L.z0;
    // wind: both integrals shifted by the same vector (the shader mixes them affinely)
    const a = anim.dispA, b = anim.dispB;
    latticeShift(a[0] * camR[0] + a[1] * camR[1] + a[2] * camR[2], a[0] * camU[0] + a[1] * camU[1] + a[2] * camU[2], a[0] * camF[0] + a[1] * camF[1] + a[2] * camF[2]);
    for (let i = 0; i < 3; i++) { L.dA[i] = a[i] - shift[i]; L.dB[i] = b[i] - shift[i]; }
    // fall: one reduced vector per speed bin, (0, -k*I, 0) with I the layer's fall integral
    const fallI = anim[L.fallKey];
    for (let j = 0; j < NB; j++) {
      const vy = -(L.vlo + (j + 0.5) / NB * (L.vhi - L.vlo)) * fallI;
      latticeShift(vy * camR[1], vy * camU[1], vy * camF[1]);
      L.fall[3 * j] = -shift[0]; L.fall[3 * j + 1] = vy - shift[1]; L.fall[3 * j + 2] = -shift[2];
    }
  }

  // per-program setup, once per frame when a program is first needed (S.F is uploaded by ctx.use); uniform values
  // persist per program and the texture units are shared, so a later switch back only rebinds the program
  const msArr = new Float32Array(32 * 4), maArr = new Float32Array(32);
  const ready = {};                                // this frame's uniform locations of each program once set up
  let nSeg = 0;
  function setup(u, ctx) {
    const gl = S.gl, Ws = R.Ws, Hs = R.Hs;
    gl.uniform2f(u.uRes, Ws, Hs);
    ctx.bindGB(u, 8);
    ctx.bindTex(2, R.scene.texs[0], u.uScene);       // scene alpha: snow fraction x sun visibility
    gl.uniform1f(u.uAspect, Ws / Hs);
    gl.uniform1f(u.uFocalPx, Hs * 0.5 / S.TANH);
    // focus at 1.3 m with a gentle circle of confusion: the hero tier (0.9-2.4 m) is sharp, only the near discs
    // (and the nearest raindrops) defocus
    gl.uniform1f(u.uCocK, 12 * Hs / 1080);
    gl.uniform1f(u.uFocus, 1.3);
    gl.uniform1ui(u.uSeed, S.cfg.seed);
    gl.uniform4fv(u.uMs, msArr); gl.uniform1fv(u.uMa, maArr); gl.uniform1i(u.uMn, nSeg);
  }

  // ctx (render.js): { use(prog) -> uniform locations (binds the program and uploads S.F), bindGB(u, unit0),
  // bindTex(unit, tex, loc) }. The target (R.hdr) is bound and the viewport set by the caller.
  S.drawPrecip = function (ctx) {
    const gl = S.gl, P = S.P, F = S.F, perf = S.perf, mouse = S.mouse;
    count.snow = count.rain = 0;
    nSeg = mouse.segs.length;
    for (let i = 0; i < nSeg; i++) { const m = mouse.segs[i]; msArr[i * 4] = m.x; msArr[i * 4 + 1] = m.y; msArr[i * 4 + 2] = m.dx; msArr[i * 4 + 3] = m.dy; maArr[i] = S.anim.wall - m.t; }
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
    const dens = S.amountMul() * perf.flakeMul;
    let cur = null, u = null;
    for (const k in ready) ready[k] = null;
    for (const L of LAYERS) {
      const wetK = L.wet ? 1 + (L.wet - 1) * F.uWetSnow : 1;
      const cnt = Math.min(L.max * perf.flakeMul, L.base * dens * F[L.rateKey] * (1 + (L.heavy - 1) * F.uHeavy) * wetK);   // the cap thins too, or the rung is a no-op in a blizzard
      const ni = Math.ceil(cnt);
      if (ni <= 0) continue;
      if (L.prog !== cur) {
        cur = L.prog;
        if (ready[cur]) { u = ready[cur]; gl.useProgram(P[cur].p); }
        else { u = ready[cur] = ctx.use(P[cur]); setup(u, ctx); }
      }
      wrapLayer(L);
      gl.uniform3fv(u.uDispA, L.dA); gl.uniform3fv(u.uDispB, L.dB); gl.uniform3fv(u.uFallQ, L.fall);
      gl.uniform2f(u.uFallLH, L.vlo, L.vhi);
      gl.uniform1i(u.uLayer, L.id);
      gl.uniform3f(u.uSlice, L.z0, L.z1, L.fade);
      gl.uniform2f(u.uHalfXY, L.hx, L.hy);
      gl.uniform1f(u.uCount, cnt);
      if (L.kind === 'rain') gl.uniform1f(u.uPushK, L.push);
      gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, ni);
      count[L.kind] += ni;
    }
    gl.disable(gl.BLEND);
  };
})(window.SNOW);

</script>
<script>/* js/render.js */
// =====================================================================================
//  render.js — the frame uniform bundle S.F (S.deriveF: the static fields, then the derive modules) and its generic
//  upload, the G-buffer binding, and render(): the seven passes of one frame. The precipitation pass is
//  S.drawPrecip (precip.js). Registers only.
//  Texture units (WebGL2 guarantees 16 per stage): 0, 1 pass inputs (uTex / uSrc / uPrev, uPrevD / uHdr, uBloom),
//  2 uScene (scene colour + snow alpha; flakes, rain, composite), 3, 4 uSky, uSkyD (shade), 5, 6 free, 7 uNoise (S.F),
//  8-11 uG0..uG3 (the shown G-buffer), 12-15 uN0..uN3 (the one being baked), bound by bindGB(u, 8) in every pass that
//  reads the G-buffer (sky, shade, precipitation, composite).
// =====================================================================================
(function (S) {
  'use strict';
  const { CAM, camR, camU, camF, SUN } = S;   // the camera arrays are mutated in place by S.frameCamera; S.TANH is read per use
  const R = S.R;

  // =====================================================================================
  //                                   frame uniform bundle
  // =====================================================================================
  // S.deriveF fills S.F (the contract is in core.js / ARCHITECTURE.md) once per frame, after the sim step: the static
  // camera / sun / clock / noise fields here, then the three derive modules in a fixed order (surface, precip, atmos).
  // S.uploadF(prog) uploads every S.F entry the program declares, with the setter cached for its getActiveUniform
  // type (gl.js).
  const NOISE = { unit: 7, tex: null };
  S.deriveF = function () {
    const F = S.F;
    F.uCamPos = CAM.pos; F.uCamR = camR; F.uCamU = camU; F.uCamF = camF;
    F.uTanH = S.TANH;
    F.uSunDir = SUN;
    // shading clock (stratus / mist drift): 512000 s is a common period of their noise scrolls (0.01, 0.004, 0.0015 x 256-periodic noise)
    F.uTime = S.anim.time % 512000;
    NOISE.tex = S.noiseTex; F.uNoise = NOISE;
    S.derive.surface.frame(F);
    S.derive.precip.frame(F);
    S.derive.atmos.frame(F);
  };
  S.uploadF = function (prog) {
    const F = S.F, list = prog.list;
    for (let i = 0; i < list.length; i++) { const e = list[i], v = F[e.name]; if (v !== undefined) e.set(e.loc, v); }
  };
  // bind a program and upload the bundle (pass-local uniforms follow explicitly)
  function use(prog) { S.gl.useProgram(prog.p); S.uploadF(prog); return prog.u; }
  function bindTex(unit, t, loc) { const gl = S.gl; gl.activeTexture(gl.TEXTURE0 + unit); gl.bindTexture(gl.TEXTURE_2D, t); gl.uniform1i(loc, unit); }
  function drawFull() { S.gl.drawArrays(S.gl.TRIANGLES, 0, 3); }

  // =====================================================================================
  //                                   G-buffer binding
  // =====================================================================================
  // G-buffer bake budget: the state machine in FS_GBUF visits each phase at most this often (see its main())
  const GB_MARCH = 900, GB_BISECT = 6, GB_HEIGHT = 1, GB_NORMAL = 8, GB_SHADOW = 110, GB_AO = 5, GB_CANOPY = 1, GB_CURV = 8;
  const GB_ITER = GB_MARCH + GB_BISECT + GB_HEIGHT + GB_NORMAL + GB_SHADOW + GB_AO + GB_CANOPY + GB_CURV;

  // bind the G-buffer(s) for a per-frame pass (see GBUF): uG* = shown buffer at unit0 + i, uN* = the one being baked
  // at unit0 + 4 + i (only the samplers the program uses), uGb = how to mix them
  const NGB = S.GB_LAYOUT.length;
  function bindGB(u, unit0) {
    const cur = R.gbCur || R.gbNext, nxt = R.gbNext || R.gbCur;
    const frac = !R.gbNext ? 0 : R.gbDone < 0 ? R.gbRow / R.gbNext.h : 1 + 0.08 * Math.min(1, (S.anim.wall - R.gbDone) / 0.3);
    for (let i = 0; i < NGB; i++) {
      if (u['uG' + i]) bindTex(unit0 + i, cur.texs[i], u['uG' + i]);
      if (u['uN' + i]) bindTex(unit0 + NGB + i, nxt.texs[i], u['uN' + i]);
    }
    S.gl.uniform3f(u.uGb, R.gbAsp, frac, !R.gbNext ? 0 : R.gbCur ? 1 : 2);
  }
  // what the precipitation pass gets from the renderer (precip.js)
  const ctx = S.passCtx = { use, bindGB, bindTex };

  // =====================================================================================
  //                                   render
  // =====================================================================================
  S.render = function () {
    const gl = S.gl, P = S.P, anim = S.anim, perf = S.perf, FIXED = S.cfg.fixed;
    const W = R.W, H = R.H, Ws = R.Ws, Hs = R.Hs;
    if (!R.gbCur && !R.gbNext) return;
    // ---- 1. progressive G-buffer: one stripe per frame, sized by adaptStripe() so the frame keeps its budget. When the
    // last stripe lands the buffers are kept 0.3 s longer (the reveal edge clears the top), then swapped
    if (R.gbNext) {
      const g = R.gbNext;
      if (R.gbDone < 0) {
        gl.bindFramebuffer(gl.FRAMEBUFFER, g.fbo);
        gl.viewport(0, 0, g.w, g.h);
        gl.enable(gl.SCISSOR_TEST);
        gl.scissor(0, R.gbRow, g.w, R.gbRows);
        const u = use(P.gbuf);
        gl.uniform2f(u.uRes, g.w, g.h);
        gl.uniform1f(u.uPixAng, 2 * S.TANH / g.h);
        gl.uniform1i(u.uIter, GB_ITER);
        drawFull();
        gl.disable(gl.SCISSOR_TEST);
        R.gbRow += R.gbRows; R.bakeFrame = true;
        if (R.gbRow >= g.h) R.gbDone = anim.wall;
      } else if (anim.wall - R.gbDone >= 0.3) {
        S.freeRT(R.gbCur); R.gbCur = g; R.gbNext = null; R.gbAsp = 1;
        R.buildMs = performance.now() - R.buildStart;  // wall time from allocate() to the swap: what the viewer waited
        perf.skip = 2;                                  // the next dt still carries the last stripe
        if (R.readyTime < 0) R.readyTime = anim.wall;
      }
    }

    // ---- 2. sky + clouds (half res, temporal accumulation)
    const sp = R.sky[R.skyI], sc = R.sky[1 - R.skyI];
    gl.bindFramebuffer(gl.FRAMEBUFFER, sc.fbo);
    gl.viewport(0, 0, sc.w, sc.h);
    {
      const u = use(P.sky);
      gl.uniform2f(u.uRes, sc.w, sc.h);
      bindTex(0, sp.texs[0], u.uPrev); bindTex(1, sp.texs[1], u.uPrevD);
      bindGB(u, 8);     // G0: the march stops at the terrain
      gl.uniform1f(u.uBlend, R.skyReset ? 1.0 : 0.3);
      gl.uniform1f(u.uFrame, (FIXED ? Math.round(anim.time * 60) : S.frameNo) % 64);
      gl.uniform1f(u.uSteps, perf.skySteps);
      drawFull();
    }
    R.skyReset = false; R.skyI = 1 - R.skyI;

    // ---- 3. scene shading (at the render scale; the G-buffer is sampled by normalised uv). Output alpha: snow fraction
    // x sun visibility (read by the flakes and the composite)
    gl.bindFramebuffer(gl.FRAMEBUFFER, R.scene.fbo);
    gl.viewport(0, 0, Ws, Hs);
    {
      const u = use(P.shade);
      gl.uniform2f(u.uRes, Ws, Hs);
      bindGB(u, 8);
      bindTex(3, sc.texs[0], u.uSky); bindTex(4, sc.texs[1], u.uSkyD);
      const wA = S.wind.s.windA, wl = wA[0] * camR[0] + wA[2] * camR[2];
      gl.uniform3f(u.uSway, wl, anim.swayPh, Hs * 0.5 / S.TANH);
      drawFull();
    }

    // ---- 4. FXAA -> hdr
    gl.bindFramebuffer(gl.FRAMEBUFFER, R.hdr.fbo);
    {
      const u = use(P.fxaa);
      bindTex(0, R.scene.texs[0], u.uTex);
      gl.uniform2f(u.uInv, 1 / Ws, 1 / Hs);
      drawFull();
    }

    // ---- 5. precipitation (precip.js) into hdr, premultiplied; not drawn over a ?view= debug channel
    if (!S.cfg.view) S.drawPrecip(ctx);
    else S.precipCount.snow = S.precipCount.rain = 0;

    // ---- 6. bloom
    {
      const u = use(P.down);
      let src = R.hdr;
      for (let i = 0; i < R.bloom.length; i++) {
        const d = R.bloom[i];
        gl.bindFramebuffer(gl.FRAMEBUFFER, d.fbo); gl.viewport(0, 0, d.w, d.h);
        bindTex(0, src.texs[0], u.uSrc);
        gl.uniform2f(u.uSrcInv, 1 / src.w, 1 / src.h); gl.uniform2f(u.uDstRes, d.w, d.h);
        gl.uniform1f(u.uThresh, i === 0 ? 1.15 : 0.0);
        drawFull(); src = d;
      }
    }
    {
      const u = use(P.up);
      gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE);
      for (let i = R.bloom.length - 1; i > 0; i--) {
        const s = R.bloom[i], d = R.bloom[i - 1];
        gl.bindFramebuffer(gl.FRAMEBUFFER, d.fbo); gl.viewport(0, 0, d.w, d.h);
        bindTex(0, s.texs[0], u.uSrc);
        gl.uniform2f(u.uSrcInv, 1 / s.w, 1 / s.h); gl.uniform2f(u.uDstRes, d.w, d.h);
        drawFull();
      }
      gl.disable(gl.BLEND);
    }

    // ---- 7. composite (canvas resolution; the hdr / bloom / scene textures are bilinearly upsampled). Exposure, bloom
    // strength, uOvercast and uSunCol come from S.F; the clocks and inputs here are pass-local
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.viewport(0, 0, W, H);
    {
      const u = use(P.comp);
      bindTex(0, R.hdr.texs[0], u.uHdr); bindTex(1, R.bloom[0].texs[0], u.uBloom); bindTex(2, R.scene.texs[0], u.uScene);
      bindGB(u, 8);     // sparkle distance; reveal edge
      gl.uniform2f(u.uRes, W, H);
      gl.uniform1f(u.uTwinkleT, anim.time % 3600);
      // grain clock: the frame index modulo 1024 (fract(x * 0.618) loses its 1-px randomness once x reaches ~2e6)
      gl.uniform1f(u.uFrame, FIXED ? Math.round(anim.time * 60) % 1024 : S.frameNo % 1024);
      drawFull();
    }
  };
})(window.SNOW);

</script>
<script>/* js/input.js */
// =====================================================================================
//  input.js — pointer input (stage-1 owner: lane B). Wind comes ONLY from a left-button drag on the canvas: the drag
//  velocity feeds the wind (sim/wind.js reads S.mouse) and the wake segments the flake VS pushes flakes with
//  (precip.js uploads them). Plain pointer movement changes nothing but `lastMove` (the chrome's idle timer).
//  Touch / pen: a one-finger drag is that drag. A primary touch or pen contact arrives as pointerdown with button 0 and
//  buttons 1, so it passes the same test; a lifted finger ends it (pointerup / pointercancel / lostpointercapture);
//  further fingers (isPrimary false) are ignored. The canvas has touch-action: none (no page pan / zoom over it).
//  Positions and velocities are taken against the canvas box (S.cssSize), the same box the canvas is sized from.
//  Registers only; main.js calls S.bindInput at boot and S.stepInput(dt) first in every live sim step.
//  S.mouse, the input -> wind contract (wind.js reads only these):
//    drag     the left button is held on the canvas (pointer captured)
//    inside   true only while dragging (Phase 2: hovering is not presence for the wind)
//    x, y     the drag position in ndc (-1..1); held at the last drag position after release
//    vxn      horizontal drag velocity in viewport widths per second (decayed by stepInput, ~0.09 s)
//    vyn      vertical drag velocity, viewport heights per second, up positive (same decay)
//    segs     wake segments { x, y, dx, dy (ndc), t (S.anim.wall) }, at most 32, pushed only while dragging
//    lastMove S.anim.wall of the last pointer movement of any kind (UI idle logic only)
// =====================================================================================
(function (S) {
  'use strict';
  const { lerp } = S;
  const mouse = S.mouse = { inside: false, x: 0, y: 0, lx: null, ly: null, lt: 0, vx: 0, vy: 0, vxn: 0, vyn: 0, drag: false, pid: -1,
                            accX: 0, accY: 0, segT: 0, segs: [], lastMove: 0 };
  let canvas = null;

  function endDrag() {
    if (!mouse.drag) return;
    mouse.drag = false; mouse.inside = false; mouse.lx = null;
    if (canvas) {
      canvas.classList.remove('drag');
      try { if (canvas.hasPointerCapture(mouse.pid)) canvas.releasePointerCapture(mouse.pid); } catch (e) { /* pointer already gone */ }
    }
    mouse.pid = -1;
  }
  // one drag sample: velocity (fast attack; stepInput releases it) and the accumulated wake segment
  function dragMove(e) {
    const now = performance.now() / 1000, [W, H] = S.cssSize();
    mouse.x = e.clientX / W * 2 - 1; mouse.y = 1 - e.clientY / H * 2;
    if (mouse.lx !== null) {
      const dx = e.clientX - mouse.lx, dy = e.clientY - mouse.ly, dtE = Math.max(now - mouse.lt, 0.004);
      mouse.vx = lerp(mouse.vx, dx / dtE, 0.35);
      mouse.vy = lerp(mouse.vy, -dy / dtE, 0.35);
      mouse.accX += dx / W * 2; mouse.accY += -dy / H * 2;
      if (now - mouse.segT > 0.035) {
        if (Math.hypot(mouse.accX, mouse.accY) > 1e-4) {
          mouse.segs.push({ x: mouse.x, y: mouse.y, dx: mouse.accX, dy: mouse.accY, t: S.anim.wall });
          if (mouse.segs.length > 32) mouse.segs.shift();
        }
        mouse.accX = 0; mouse.accY = 0; mouse.segT = now;
      }
    }
    mouse.lx = e.clientX; mouse.ly = e.clientY; mouse.lt = now;
  }

  S.bindInput = function () {
    canvas = document.getElementById('c');
    // any movement counts as activity for the chrome's idle dimming, and nothing else
    addEventListener('pointermove', () => { mouse.lastMove = S.anim.wall; }, { passive: true });
    canvas.addEventListener('pointerdown', e => {
      // the canvas listener runs before ui.js's document listener, so a click that only closes the open pop-over
      // still sees it open here and never starts a drag
      if (e.button !== 0 || !e.isPrimary || mouse.drag || (S.ui && S.ui.open)) return;
      e.preventDefault();                                   // no text selection / focus change from a drag
      mouse.drag = true; mouse.inside = true; mouse.pid = e.pointerId;
      mouse.lx = null; mouse.accX = 0; mouse.accY = 0; mouse.segT = performance.now() / 1000;
      try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* synthetic pointer: capture unavailable */ }
      canvas.classList.add('drag');
      dragMove(e);
    });
    canvas.addEventListener('pointermove', e => {
      if (!mouse.drag || e.pointerId !== mouse.pid) return;
      if (!(e.buttons & 1)) { endDrag(); return; }          // the button came up outside the window
      dragMove(e);
    }, { passive: true });
    for (const ev of ['pointerup', 'pointercancel', 'lostpointercapture']) canvas.addEventListener(ev, e => { if (e.pointerId === mouse.pid) endDrag(); });
    addEventListener('blur', endDrag);
  };
  // one live input step (before the wind): the drag velocity decays (fast attack in dragMove, ~0.09 s release, also
  // after the button is released) and the wake segments older than their envelope are dropped
  S.stepInput = function (dt) {
    const k = Math.exp(-dt / 0.09);
    mouse.vx *= k; mouse.vy *= k;
    const [W, H] = S.cssSize();
    mouse.vxn = mouse.vx / W; mouse.vyn = mouse.vy / H;
    S.pruneSegs();
  };
  S.pruneSegs = function () {   // drop wake segments older than their envelope, in place
    const wall = S.anim.wall;
    let k = 0;
    for (let i = 0; i < mouse.segs.length; i++) if (wall - mouse.segs[i].t < 3.6) mouse.segs[k++] = mouse.segs[i];
    mouse.segs.length = k;
  };
})(window.SNOW);

</script>
<script>/* js/ui.js */
// =====================================================================================
//  ui.js — the chrome (stage-1 owner: lane B): one season glyph in the corner, a glass pop-over, a start hint.
//  Registers only; main.js calls S.bindUI and S.syncUI at boot, and S.updateUI every frame. It drives the sim only
//  through the module APIs (S.climate.api: setSeason, speed; S.weather.api: setWeather, amount, auto: the same calls
//  window.snowSim exposes) and reads the module state / snapshots for the status line and the checked controls.
// =====================================================================================
(function (S) {
  'use strict';
  const SEASONS = ['spring', 'summer', 'autumn', 'winter'];
  const WX_KO = { clear: '맑음', cumulus: '구름', overcast: '흐림', fog: '안개', rain: '비', snow: '눈', blizzard: '폭설' };
  const SPEEDS = [0.25, 0.5, 1, 2, 4, 8];
  const YEAR_MIN = 20;   // one year at 1x, in real minutes (YEAR = 1200 climate-s)

  // open: pop-over shown; hover: the pointer rests on it; last: S.anim.wall of the last interaction (it closes after
  // 6 s idle unless hovered or keyboard-focused); hintDone: the pop-over was opened, the hint stays hidden; txt: last
  // written text per element (DOM writes only on change)
  const ui = S.ui = {
    icon: null, pop: null, hint: null, hintDone: false, el: {}, open: false, hover: false, last: 0, season: -1, txt: new Map(),
    touch() { ui.last = S.anim.wall; },
    show(kbd) {
      if (ui.hint) { ui.hintDone = true; ui.hint.classList.remove('on'); }   // the hint never sits under the open glass
      ui.open = true; ui.pop.classList.add('open'); ui.icon.classList.add('open'); ui.icon.setAttribute('aria-expanded', 'true');
      ui.touch(); syncUI();
      if (kbd) (ui.el.seasons.querySelector('[tabindex="0"]') || ui.pop.querySelector('button')).focus();
    },
    close() {
      ui.open = false; ui.pop.classList.remove('open'); ui.icon.classList.remove('open'); ui.icon.setAttribute('aria-expanded', 'false');
      const a = document.activeElement;   // never leave focus inside the hidden glass
      if (a && ui.pop.contains(a)) { if (a.matches(':focus-visible')) ui.icon.focus(); else a.blur(); }
    },
  };

  const seasonOf = phase => Math.floor(phase * 4) % 4;
  // 1년 = 20분 at 1x: 80분 -> '1시간 20분', 2.5분 -> '2분 30초'
  function yearText(speed) {
    if (!(speed > 0)) return '시간 멈춤';
    const sec = Math.round(YEAR_MIN * 60 / speed), h = Math.floor(sec / 3600), m = Math.floor(sec / 60) % 60, s = sec % 60;
    return '1년 = ' + [h ? h + '시간' : '', m ? m + '분' : '', s ? s + '초' : ''].filter(Boolean).join(' ');
  }
  const speedText = v => (v === 0.25 ? '0.25' : v === 0.5 ? '0.5' : String(+v.toFixed(2))) + '배';
  const nearestStop = v => { let k = 0; for (let i = 1; i < SPEEDS.length; i++) if (Math.abs(Math.log2(SPEEDS[i] / v)) < Math.abs(Math.log2(SPEEDS[k] / v))) k = i; return k; };
  function setText(el, t) { if (ui.txt.get(el) !== t) { ui.txt.set(el, t); el.textContent = t; } }
  function setProp(el, k, v) { if (el.style.getPropertyValue(k) !== v) el.style.setProperty(k, v); }

  // a radiogroup of buttons: roving tabindex, arrows move and pick (rows of `cols` for the grid), Home / End
  function radios(group, cols, pick) {
    const btns = [...group.querySelectorAll('[role=radio]')];
    group.addEventListener('click', e => { const b = e.target.closest('[role=radio]'); if (b) { pick(b.dataset.v); syncUI(); } });
    group.addEventListener('keydown', e => {
      const i = btns.indexOf(document.activeElement), n = btns.length;
      if (i < 0) return;
      const step = { ArrowRight: 1, ArrowLeft: -1, ArrowDown: cols, ArrowUp: -cols }[e.key];
      let j = step !== undefined ? (i + step + n) % n : e.key === 'Home' ? 0 : e.key === 'End' ? n - 1 : -1;
      if (j < 0) return;
      e.preventDefault();
      btns[j].focus(); btns[j].click();
    });
    return btns;
  }
  function check(btns, v) {
    let idx = 0;
    btns.forEach((b, i) => {
      const on = b.dataset.v === v;
      if (on) idx = i;
      if (b.getAttribute('aria-checked') !== String(on)) { b.setAttribute('aria-checked', String(on)); b.tabIndex = on ? 0 : -1; }
    });
    return idx;
  }

  S.bindUI = function () {
    const $ = id => document.getElementById(id);
    if (!S.cfg.ui) { for (const id of ['icon', 'pop', 'hint']) $(id).remove(); document.querySelector('.sprite').remove(); return; }
    const clim = S.climate.api, wx = S.weather.api;
    ui.icon = $('icon'); ui.pop = $('pop'); ui.hint = $('hint');
    // touch screens have no hover and no mouse button: the wind comes from a finger sweeping across the scene
    if (matchMedia('(hover: none) and (pointer: coarse)').matches) ui.hint.textContent = '화면을 쓸어 바람을 일으켜 보세요';
    const el = ui.el = { glyphs: [...ui.icon.querySelectorAll('.glyph')], season: $('stSeason'), wx: $('stWx'), prog: $('stProg'), year: ui.pop.querySelector('.yr'),
      seasons: $('seasons'), thumb: ui.pop.querySelector('.seg .thumb'), speed: $('speed'), speedV: $('speedv'), ticks: [...ui.pop.querySelectorAll('.ticks b')],
      amount: $('amount'), amountV: $('amountv') };
    el.seasonBtns = radios(el.seasons, 1, v => clim.setSeason(v === 'auto' ? null : v));
    el.wxBtns = radios($('weathers'), 4, v => { wx.setWeather(v); if (v === 'auto') wx.auto = true; });
    el.speed.addEventListener('input', () => { clim.speed = SPEEDS[+el.speed.value]; syncUI(); });
    el.amount.addEventListener('input', () => { wx.amount = +el.amount.value; });   // the setter re-syncs the chrome
    ui.season = seasonOf(S.climate.s.phase);                                          // the boot glyph shows without a fade
    el.glyphs[ui.season].classList.add('on');

    ui.icon.addEventListener('click', () => { if (ui.open) ui.close(); else ui.show(false); });
    ui.icon.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); if (ui.open) ui.close(); else ui.show(true); } });
    for (const ev of ['pointermove', 'pointerdown', 'input', 'click', 'keydown']) ui.pop.addEventListener(ev, ui.touch, { passive: true });
    ui.pop.addEventListener('pointerenter', () => { ui.hover = true; });
    ui.pop.addEventListener('pointerleave', () => { ui.hover = false; ui.touch(); });
    // outside press closes (bubble phase: input.js's canvas listener has already seen the pop-over open and so
    // started no drag)
    document.addEventListener('pointerdown', e => { if (ui.open && !ui.pop.contains(e.target) && !ui.icon.contains(e.target)) ui.close(); });
    addEventListener('keydown', e => {
      if (e.key !== 'Escape' || !ui.open) return;
      const inside = ui.pop.contains(document.activeElement);
      ui.close();
      if (inside) ui.icon.focus();
    });
  };

  // the controls follow the sim state (they also change through window.snowSim); cheap: writes only on change
  function syncUI() {
    if (!ui.pop) return;
    const el = ui.el, c = S.climate.s, w = S.weather.s;
    const sv = c.pinned === null ? 'auto' : SEASONS[seasonOf(c.pinned)];
    setProp(el.thumb, '--i', String(check(el.seasonBtns, sv)));
    check(el.wxBtns, w.manual || (w.auto ? 'auto' : w.cur));
    const k = nearestStop(c.speed || 0.25);
    if (+el.speed.value !== k) el.speed.value = k;
    setProp(el.speed, '--p', (k * 20) + '%');
    el.ticks.forEach((b, i) => b.classList.toggle('on', i === k));
    setText(el.speedV, yearText(c.speed));
    const vt = speedText(c.speed) + ', ' + yearText(c.speed);
    if (el.speed.getAttribute('aria-valuetext') !== vt) el.speed.setAttribute('aria-valuetext', vt);
    if (+el.amount.value !== w.amount) el.amount.value = w.amount;
    setProp(el.amount, '--p', (w.amount * 100).toFixed(1) + '%');
    setText(el.amountV, Math.round(w.amount * 100) + '%');
    status();
  }
  S.syncUI = syncUI;

  // status line: '늦가을 · 눈', or '늦가을 · 눈 → 맑음' with the hairline filling while a transition runs (the season
  // label is the sim's: 초봄 / 봄 / 늦봄 ... 늦겨울, see sim/climate.js); the dot
  // under the season segments shows how far the year (from 1 March) has come
  function status() {
    const el = ui.el, c = S.climate.s, w = S.weather.s;
    setText(el.season, S.climate.seasonKo(c.phase));      // the same label as snowSim.state().seasonKo
    const moving = !!w.next && w.next !== w.cur && w.progress < 1;
    setText(el.wx, moving ? WX_KO[w.cur] + ' → ' + WX_KO[w.next] : (WX_KO[w.cur] || ''));
    el.prog.classList.toggle('on', moving);
    setProp(el.prog, '--p', moving ? w.progress.toFixed(3) : '0');
    setProp(el.year, '--y', c.phase.toFixed(4));
  }

  S.updateUI = function () {
    if (!ui.icon || S.frameNo % 6) return;
    const wall = S.anim.wall, readyTime = S.R.readyTime;
    if (ui.open && !ui.hover && !ui.pop.querySelector(':focus-visible') && wall - ui.last > 6) ui.close();
    if (ui.open) syncUI();
    ui.icon.classList.toggle('idle', !ui.open && wall - S.mouse.lastMove > 4);
    const si = seasonOf(S.climate.s.phase);   // the glyph cross-fades on a season change
    if (si !== ui.season) { ui.season = si; ui.el.glyphs.forEach((g, i) => g.classList.toggle('on', i === si)); }
    // the hint fades in once the scene is ready, out after ~5 s, then leaves the DOM; as it goes, the icon lifts
    // for two seconds (the one moment the corner glyph announces itself)
    if (readyTime >= 0) {
      const since = wall - readyTime;
      if (ui.hint) {
        if (since > 0.5 && since < 5.5 && !ui.hintDone) ui.hint.classList.add('on');
        else if (since >= 5.5) { ui.hint.classList.remove('on'); if (since > 7.2) { ui.hint.remove(); ui.hint = null; } }
      }
      ui.icon.classList.toggle('lift', since >= 5.5 && since < 7.5);
    }
  };
})(window.SNOW);

</script>
<script>/* js/main.js */
// =====================================================================================
//  main.js — the orchestrator (frozen): the animation clocks, one sim step in the contract order, fastForward /
//  advance, window.snowSim (state() + every sim module's api), the frame loop and boot. The only file with load-time
//  side effects: it boots at the end when a document exists (in node, for tests/sim.mjs, it only registers).
//
//  Per live step (dt real s): input -> climate / weather / ground (dt x speed climate s, substeps <= 0.25 s) -> wind
//  (dt) -> the animation integrals (dt): dispA / dispB here, the derive modules' own (cloud; fallI, tumI, rainI,
//  veilI, veilR, gustR), the tree-sway phase here. Then per frame: S.deriveF() -> S.render().
// =====================================================================================
(function (S) {
  'use strict';
  const { clamp, lerp, camR } = S;
  const cfg = S.cfg;
  const FRAMES = cfg.frames;
  const R = S.R, perf = S.perf;
  const MODS = ['climate', 'weather', 'ground', 'wind'];
  const DERIVE = ['surface', 'precip', 'atmos'];
  const SUB = 0.25;      // the climate substep limit (climate s) and the fastForward / advance step (s)

  // =====================================================================================
  //                                   animation state
  // =====================================================================================
  // Physical time only (never scaled by the climate speed): particle motion, flutter, sway and the twinkle clocks.
  //   time    animation clock (s): shader clocks (uTime, uFlakeT, uTwinkleT), the natural wind, ?fixed frame indices
  //   wall    wall clock (s): UI timers, wake segment ages, bake swap / reveal timing; never fast-forwarded
  //   fps     smoothed frame rate (snowSim.state)
  //   dispA, dispB   integrals of S.wind.s.windA / windB (m): the only wind the particles see (lattice-wrapped)
  //   swayPh  tree-sway phase (rad, wrapped by 2 pi)
  // The derive modules add their own integrals in init() (derive/atmos.js: cloud; derive/precip.js: fallI, tumI,
  // rainI, veilI, veilR, gustR) and advance them in step(dt, ff).
  const anim = S.anim = { time: 0, wall: 0, fps: 60, dispA: [0, 0, 0], dispB: [0, 0, 0], swayPh: 0 };

  S.initSim = function (c) {
    anim.time = 0; anim.wall = 0; anim.dispA = [0, 0, 0]; anim.dispB = [0, 0, 0]; anim.swayPh = 0;
    for (const m of MODS) S[m].init(c);
    for (const k of DERIVE) S.derive[k].init();
  };

  // One sim step of dt real seconds. ff: inside fastForward / advance: no input and no wall clock (the wind steer only
  // decays), the periodic phases (sway, veil / rain-veil scrolls) hold; climate, weather and ground run exactly the
  // live steps, so ?t and snowSim.advance are deterministic
  function simStep(dt, ff) {
    if (!ff) { anim.wall += dt; anim.time += dt; S.stepInput(dt); }
    const dtc = dt * S.climate.s.speed, n = Math.max(1, Math.ceil(dtc / SUB - 1e-9)), h = dtc / n;
    for (let i = 0; i < n; i++) { S.climate.step(h, ff); S.weather.step(h, ff); S.ground.step(h, ff); }
    S.wind.step(dt, ff);
    const wA = S.wind.s.windA, wB = S.wind.s.windB;
    for (let i = 0; i < 3; i++) { anim.dispA[i] += wA[i] * dt; anim.dispB[i] += wB[i] * dt; }
    for (const k of DERIVE) S.derive[k].step(dt, ff);
    if (!ff) {
      const wl = wA[0] * camR[0] + wA[2] * camR[2];
      anim.swayPh = (anim.swayPh + (1.3 + 0.08 * Math.abs(wl)) * dt) % (2 * Math.PI);
    } else anim.time += dt;
  }
  // run T real seconds of sim with the fastForward step (deterministic: ?t at boot, snowSim.advance in the console)
  function advance(T) { for (let t = 0; t < T; t += SUB) simStep(Math.min(SUB, T - t), true); }
  S.simStep = simStep; S.advance = advance;

  // snowSim.state(): the Phase-1 fields first, then every module's snapshot (keys never override earlier ones)
  S.state = function () {
    const wx = S.weather.s, w = S.wind.s;
    const st = { coverage: +S.ground.s.cover.toFixed(4), storm: +wx.curtain.toFixed(4), sky: +wx.ch.overcast.toFixed(4), tail: +wx.tail.toFixed(4),
      windX: +((w.windA[0] + w.windB[0]) / 2).toFixed(3), windZ: +((w.windA[2] + w.windB[2]) / 2).toFixed(3),
      flakeCount: S.precipCount.snow, fps: +anim.fps.toFixed(1), ready: R.readyTime >= 0, amount: wx.amount, auto: wx.auto,
      quality: perf.rs, perfLevel: perf.level, frameMs: +perf.avgMs.toFixed(1), buildMs: Math.round(R.buildMs), compileMs: Math.round(S.compileMs), res: [R.W, R.H], renderRes: [R.Ws, R.Hs] };
    for (const m of MODS) { const snap = S[m].snapshot(); for (const k of Object.keys(snap)) if (!(k in st)) st[k] = snap[k]; }
    st.rainCount = S.precipCount.rain;
    st.g3 = R.g3Fmt;
    return st;
  };
  // window.snowSim: state, advance, and the api of every sim module (accessors kept): climate (setSeason, speed),
  // weather (setWeather, setStorm, triggerBlizzard, amount, auto), ground (setCoverage, reset, resetSnow), wind
  S.makeApi = function () {
    const api = { state: S.state, advance(sec) { advance(Math.max(0, +sec || 0)); return S.state(); } };
    for (const m of MODS) Object.defineProperties(api, Object.getOwnPropertyDescriptors(S[m].api));
    return api;
  };

  // =====================================================================================
  //                                   frame loop + boot
  // =====================================================================================
  let lastNow = 0;
  S.frameNo = 0;
  // one frame: real dt (clamped) -> stripe budget -> fixed step under ?fixed / ?frames -> sim step -> S.F -> render ->
  // quality controller -> chrome
  function frame() {
    if (!FRAMES || S.frameNo + 1 < FRAMES) requestAnimationFrame(frame);
    const now = performance.now() / 1000;
    let dt = clamp(now - lastNow, 0, 0.1); lastNow = now;   // clamp tab switches / stalls
    if (R.bakeFrame) { S.adaptStripe(dt); R.bakeFrame = false; }   // dt is the cost of the previous (stripe) frame
    if (cfg.fixed || FRAMES) dt = 1 / 60;
    if (dt > 0) { anim.fps = lerp(anim.fps, 1 / Math.max(dt, 1e-3), 0.05); }
    simStep(dt, false);
    if (!S.ctxLost) {
      S.deriveF();
      S.render();
      if (!cfg.fixed && R.readyTime >= 0 && anim.wall - R.readyTime > 3 && !R.gbNext) S.controller(dt);
    }
    S.updateUI();
    S.checkSize();            // twice a second: a stale canvas size (a missed resize event on a phone) schedules a resize
    S.frameNo++;
    if (FRAMES && S.frameNo >= FRAMES) window.__done = true;   // test hook: the loop has stopped
  }

  function boot() {
    S.initContext();          // fatal (throws) without WebGL2
    S.bindGLEvents();
    { const [w, h] = S.targetSize(); S.frameCamera(w / h); }       // this viewport's framing before the sim starts (its wind is camera-relative)
    S.initSim(cfg);
    S.bindInput();
    S.bindUI();
    S.syncUI();
    window.snowSim = S.makeApi();
    lastNow = performance.now() / 1000;
    advance(cfg.t0); anim.time = cfg.t0;                           // ?t: the same steps as snowSim.advance
    if (cfg.cover !== null) S.ground.api.setCoverage(cfg.cover);   // ?cover applies after the fast-forward
    try { S.initGL(); } catch (e) { S.fatal('초기화 실패: ' + e.message); }
    requestAnimationFrame(frame);
  }
  if (typeof document !== 'undefined') boot();
})(window.SNOW);

</script>

      const k = 1 - Math.exp(-dt / 25);
      cv[0] += (tx - cv[0]) * k; cv[1] += (tz - cv[1]) * k;
      const c = S.anim.cloud;
      c[0] -= cv[0] * dt; c[1] -= cv[1] * dt;     // q = p + off: the pattern moves by -off
    },
    frame(F) {
      const wx = S.weather.s, ch = wx.ch, cs = S.climate.s;
      // the snow the camera sees: the cover level after the per-frame snowline, through the shared offset model
      // (derive/surface.js coverAt = SURFACE's effectiveCover without its per-pixel shift; surface.frame ran first) at
      // the meadow (visCover, most of the frame), the slopes (~800 m) and the summits (~2000 m). With the neutral
      // snowline this is uCover itself (Phase 1)
      // (the scene's keys: scene.atmos.coverMix / coverAlt; the valley's are .7 meadow, .2 at 800 m, .1 at 2000 m)
      const surf = S.derive.surface, A = S.scene.atmos, M = A.mist, CL = A.cloud;
      const cover = A.coverMix[0] * surf.visCover + A.coverMix[1] * surf.coverAt(A.coverAlt[0]) + A.coverMix[2] * surf.coverAt(A.coverAlt[1]);
      const precip = ch.precip, snowFrac = ch.snowFrac;
      const snowFall = precip * snowFrac, rain = precip * (1 - snowFrac);
      // the deck's light response starts at overcast .15: thin cloud (the snow preset's .35) is broken sun, not grey;
      // 0 and 1 are Phase 1's ends (calm, storm)
      const od = smooth(0.15, 1, ch.overcast), wd = smooth(0, 1, wx.white);
      const fog = smooth(0, 1, ch.fog), cum = ch.cumulus;
      // season weights, pulled toward winter by falling snow (and a little by lying snow)
      // (stage 2b: at most 70% from falling snow, so a late-autumn first snow keeps some of the golden low sun on the
      // larches and the tawny meadow; mid-winter, the Phase-1 anchor, is the winter key anyway)
      const wk = clamp(Math.max(0.7 * smooth(0, 0.5, snowFall), 0.5 * cover), 0, 1);
      for (let i = 0; i < 4; i++) sw[i] = cs.seasonW[i] * (1 - wk) + (i === 3 ? wk : 0);
      // snow-lit grey (snow falling or lying) vs the green-meadow overcast palettes
      const snowy = clamp(Math.max(smooth(0, 0.3, snowFall), cover), 0, 1);
      // crisp air of fair weather (clear, cumulus): no deck, no fog, no precipitation (0 at the Phase-1 anchor)
      const crisp = (1 - od) * (1 - fog) * (1 - smooth(0, 0.3, precip));

      // ---- sun: season colour x intensity; overcast takes it down (the storm keeps ~20% for snow relief; a grey
      // deck over a green meadow keeps less: no hard shadows), fog days dim it a little more
      const sunK = (1 - 0.8 * od - 0.12 * od * (1 - snowy)) * (1 - 0.25 * fog * (1 - od));
      const sunI = sMix1(SEASON.sunI, sw) * sunK;
      seasonMix(tmp.a, SEASON.sun, sw);
      for (let i = 0; i < 3; i++) lighting.sun[i] = tmp.a[i] * sunI;
      // ---- ambient / sky / fog colours: clear season palette -> overcast palette by od
      const pal = (key, out) => {
        seasonMix(tmp.a, SEASON[key], sw);
        // clear days: a slightly deeper horizon (less milk) than the Phase-1 calm
        if (key === 'hor' || key === 'fog') { seasonMix(tmp.c, SEASON.zen, sw); mix3(tmp.a, tmp.a, tmp.c, 0.12 * crisp); }
        // the overcast palette for this ground: dull grey -> rain grey -> fog day, then snow-lit grey
        mix3(tmp.b, DULLP[key], RAINP[key], smooth(0, 0.5, rain));
        mix3(tmp.b, tmp.b, FOGP[key], fog);
        mix3(tmp.b, tmp.b, LIT[key][1], snowy);
        mix3(out, tmp.a, tmp.b, Math.max(od, 0.6 * fog));
      };
      pal('amb', lighting.amb); pal('zen', lighting.zen); pal('hor', lighting.hor); pal('fog', lighting.fog);
      seasonMix(horBand, SEASON.band, sw);
      mix3(horBand, horBand, lighting.hor, Math.max(od, fog));      // the band is a clear-air effect
      // ---- haze / extinction / mist
      // haze: the season's clear-day haze -> the deck's haze (dry 1.8x the winter haze, rain 3.8x, snowing 5.5x = Phase
      // 1's 1/42000 (1 + 4.5 od)); fog days thicken it a little more
      const rk = smooth(0, 0.6, rain);
      // heavier rain thickens the air: the rain's extinction and its share of the deck haze scale with the rain rate and
      // the user's amount (as the particles and the far curtains do, derive/precip.js), relative to the canonical rain
      // preset (rate .65) at the default amount (amountMul 1), where the factor is 1: x1.18 at amount 1, ~x1.5 at rate 1
      const heavyR = Math.pow(rain * (0.6 + 0.4 * S.amountMul()) / 0.65, 0.6);
      const fs = smooth(0.4, 1.0, ch.fog);           // the fog sea forms only on fog days (fog .2 under rain / storms: more valley mist)
      // (stage 2b: rain air is clearer than it was: the valley keeps its depth under the deck, the far ridges dissolve
      // into it layer by layer instead of the whole left half going flat grey)
      const hazeDeck = (1.8 + 1.0 * rk * heavyR + 3.7 * smooth(0, 0.6, snowFall)) / 42000;    // a snowing deck: Phase 1's 5.5x
      // a fog-sea day is an inversion: the air above the sea is clearer than a grey day's (the ridges stand out crisply
      // over the white sea)
      lighting.fogP[0] = lerp(sMix1(SEASON.haze, sw) * (1 - 0.3 * crisp), hazeDeck, od) * (1 - 0.45 * fs);
      lighting.fogP[1] = sMix1(SEASON.hazeH, sw);
      lighting.fogP[2] = stormExt(wd, wx.tail * smooth(0, 0.3, snowFall)) + 0.000008 * rk * heavyR;   // the tail is thinning snow
      // the mist layer: the Phase-1 valley mist (reference level -650 m, 260 m scale) rises into the fog sea on fog days:
      // a dense, shallow layer (12 m scale) whose top (~-72 m, swelling +-20 m) floods the valley and the chalet basin
      // while the near meadow, the crowns of the forest band and every ridge stand above it. uFogP.w: the density at
      // the reference level (1/m)
      // (a snowing deck: Phase 1's (1 + 4.7 od); a dry deck keeps the season's, rain fills the valley with low cloud)
      // (stage 2b: fair weather thins it to a light valley haze (crisp): in the sun of a clear day the dense floor
      // mist read as a lone glowing blob over the far valley)
      // calm: no snow falling and no fog sea (dry or rainy days): the valley mist stays an even haze there too
      const calm = (1 - smooth(0, 0.3, snowFall)) * (1 - fs);
      const mist = sMix1(SEASON.mist, sw) * (1 + 4.7 * smooth(0, 0.6, snowFall) * od) * (1 + 2 * ch.fog * (1 - 0.6 * rk)) * (1 - Math.max(0.6 * crisp, 0.45 * calm));
      lighting.fogP[3] = mist * Math.pow(M.fogInv * mist, -fs);   // geometric blend mist -> 1/fogInv (valley 1/180): the sea rises / drains smoothly
      const even = Math.max(crisp, 0.8 * calm);
      // (the levels, scales and bank terms of the scene's mist profile, scene.atmos.mist; the valley's in the comments)
      mistP[0] = lerp(M.level[0], M.level[1], fs);           // reference level depth (level -x m): 650 -> 72
      // scale height (m): on calm days a deeper, even layer (a valley haze over the whole valley, not a dense film
      // pooled on the valley floor, which glowed as one bright spot under a grey sky)
      mistP[1] = lerp(lerp(M.scale[0], M.scale[1], even), M.scale[2], fs);           // 260, 560, 12
      // (stage 2b: fair weather keeps the mist an even valley haze: a dense bank at the valley floor ~5 km out read as
      // a lone glowing blob)
      mistP[2] = lerp(lerp(M.floor[0], M.floor[1], even), M.floor[2], fs);        // bank floor .3, .55, .8
      mistP[3] = lerp(lerp(M.gain[0], M.gain[1], even), M.gain[2], fs);           // bank gain 1.3, .35, .45
      mistQ[0] = M.swell * fs;                // fog-sea top swell (m, +-; valley 20), drifting with half the cloud wind
      mistQ[1] = M.glow * fs;                 // sun glow of the fog-sea top (x sun visibility; valley .22)
      mistQ[2] = fs * M.sea;                  // fog-sea weight (soft far shoreline, sea texture, haze in front; valley: fs)
      mistQ[3] = 0;
      F.uMistP = mistP; F.uMistQ = mistQ;
      F.uSunCol = lighting.sun; F.uSkyAmb = lighting.amb; F.uSkyZen = lighting.zen; F.uSkyHor = lighting.hor; F.uFogCol = lighting.fog;
      F.uFogP = lighting.fogP; F.uHorBand = horBand;

      // ---- clouds
      cloudOff[0] = S.anim.cloud[0]; cloudOff[1] = S.anim.cloud[1];
      F.uCloudOff = cloudOff;
      F.uCloudCov = ch.cloudCov;
      F.uOvercast = ch.overcast;
      F.uCumulus = cum; F.uFogDay = ch.fog; F.uCirrus = ch.cirrus;
      // the slab: Phase 1 renders only the far field (left of centre from 19 km, right from 13 km). Cumulus open it to
      // the whole sky band (the nearest slab the camera sees is ~8 km out at the top of the frame) but keep the far cut
      // in front of the left massif (its jagged summit, 17.5 km out, stays a clean silhouette: a flat cumulus base
      // across it reads as a mesa). A grey deck (overcast, rain) closes in everywhere, the massif's summit included,
      // and under rain it lowers to ~1150 m so the tops of the walls go into the cloud. Not under a snow curtain: the
      // blizzard keeps the Phase-1 storm sky
      const deck = smooth(0.3, 0.9, ch.overcast) * (1 - smooth(0, 0.3, F.uSnowCurtain));
      const near = Math.max(cum, deck);
      // (the cuts are the scene's composition, scene.atmos.cloud; the valley's in the comments)
      cloudP[0] = lerp(lerp(CL.cutL[0], CL.cutL[1], cum), CL.cutL[2], deck);   // cut distance, left of the side split: 19000, 18000, 9000
      cloudP[1] = lerp(CL.cutR[0], CL.cutR[1], near);     // cut distance, right of it: 13000, 3000
      cloudP[2] = lerp(CL.fade[0], CL.fade[1], near);     // cut fade (m): 5000, 2500
      cloudP[3] = lerp(CL.undul[0], CL.undul[1], cum);    // base undulation (m, peak to peak; 700, 160): cumulus share a flat condensation level
      // slab base (m): a dry grey deck is a high lid (~2900 m, the massif's summit just grazing it; a flat base across
      // the massif at 1500-2000 m read as a table mountain), a rain deck hangs low (~1150 m: the walls go into it)
      cloudQ[0] = lerp(lerp(1500, 1700, cum), lerp(2900, 1150, rk), deck);
      cloudQ[1] = lerp(3600, 4400, deck * (1 - rk));   // slab top (m)
      cloudQ[2] = deck;                        // the near grey deck (its ragged, soft base)
      cloudQ[3] = lerp(CL.split[0], CL.split[1], near);   // side split: sin(azimuth) where the left cut starts to give way (0, -.3)
      F.uCloudP = cloudP; F.uCloudQ = cloudQ;
      // cloud shadows: Phase 1 0.65, crisp deep shadows under fair-weather cumulus
      F.uShadowAmp = lerp(0.65, 0.85, cum);
      // sky-pass EMA (0.3 per frame in render.js): a jump of the cloud inputs (debug hooks, instant picks, setStorm)
      // restarts the accumulation for one frame instead of ghosting the old clouds for ~10 frames
      let jump = 0;
      [ch.cloudCov, cum, ch.overcast, ch.fog, lighting.sun[0], lighting.amb[2]].forEach((v, i) => {
        if (haveLast) jump = Math.max(jump, Math.abs(v - last[i]) / (i >= 4 ? Math.max(last[i], 0.05) : 1));   // light: relative
        last[i] = v;
      });
      haveLast = true;
      F.uSkyResp = jump > 0.08 ? 1 : 0;      // a 60 s transition at 8x on a 10 fps device moves ~0.013 per frame
      F.uCloudSoft = (CL.soft || 0) * cum;   // (stage 2b) the scene's cumulus clean-up (FS_SKY); the valley's profile: 0

      // ---- exposure: Phase 1 (full cover sits sunlit snow below the ACES shoulder) x a partial auto-exposure on
      // the light level (overcast / rain days on a green meadow are lifted ~1.3-1.55x so they read soft, not murky).
      // Snow in view or a snow curtain keeps the Phase-1 storm exposure (the storm stays moody)
      const E = 0.5 * lum(lighting.sun) + lum(lighting.amb);
      // (stage 2b: a rain day is lifted less: it stays a little darker and moodier than a dry grey day)
      const comp = Math.min(1.55 - 0.3 * rk, Math.pow(E_REF / E, 0.45));
      const keep = Math.max(cover, smooth(0, 0.5, F.uSnowCurtain), 0.6 * smooth(0, 0.3, snowFall));
      F.uExposure = lerp(1.0, 0.54, Math.pow(cover, 1.3)) * lerp(1.0, 1.05, F.uSnowCurtain) * lerp(comp, 1, keep) * (1 - 0.1 * fog);
      F.uBloomStr = 0.12 + 0.05 * fog;
      // ---- grade: season white balance (rain cools it), desaturation (overcast, rain), S-curve (flatter in rain / fog)
      seasonMix(grade, SEASON.wb, sw);
      const rg = rk * od;
      grade[0] *= 1 - 0.02 * rg; grade[2] *= 1 + 0.02 * rg;
      F.uGrade = grade;
      gradeP[0] = 0.1 * od + 0.02 * rg + 0.06 * fog;    // desaturation (rain: wet colours stay rich)
      gradeP[1] = 0.2 * (1 - 0.2 * rg - 0.35 * fog);    // S-curve strength
      // sparkle gate (direct sun); above 1 on crisp fair days (stage 2b): denser, brighter glints on clear winter snow
      gradeP[2] = (1 - od) * (1 - 0.7 * fog) * (1 + 0.9 * crisp);
      F.uGradeP = gradeP;
    },
  };
})(window.SNOW);

</script>
<script>/* js/derive/house.js */
// =====================================================================================
//  derive/house.js (Phase-3 owner: lane H) — the house scene's per-frame look: the sim state -> S.F, run by
//  S.deriveF (render.js) after derive/atmos.js and only while the house is the active scene (scenes/house.js derive:
//  'house'); derive/events.js runs after it. Pure JS (no GL, no DOM).
//    uCozy   0..1: the window, porch and street-lamp light (SURFACE_HOUSE): a golden-hour baseline, stronger under a
//            deck, in fog, rain, snow and storms (the hazards may flicker it after this: derive/events.js)
//  The house is always seen at the end of the day. Two looks over the shared atmosphere, blended by the weather:
//   - golden hour (fair weather, g): a warm low sun, a cooler, deeper sky light (the shade), a deep blue anti-solar
//     sky fading to a pale horizon under a peach evening haze, a few sunset clouds and cirrus streaks lit by the low
//     sun, a warm white balance;
//   - dusk (a deck, fog, precipitation: ev): the late grey light of a cozy evening, dimmer and bluer, so the warm
//     windows, the porch lantern and the street lamp carry the scene (uCozy 1).
//  Rule: never mutate the arrays an earlier derive set (S.lighting.*: derive/atmos.js recomputes from them and keys its
//  sky-history reset on them); write your own and assign them to F.
//  The bake variant (init / step, whatever the scene, like every derive clock): the deciduous and fruit trees are
//  bare from the leaf drop (~25 November, year phase .745) to the leaf-out (1 March, phase 0), with a small hysteresis;
//  S.setBakeVariant (gl.js) makes the engine rebake the house behind the live scene and dissolve it in (render.js).
//  S.derive.house = { init(), step(dt, ff), frame(F), variant }
// =====================================================================================
(function (S) {
  'use strict';
  const { smooth, lerp } = S;
  const sun = new Float32Array(3), hor = new Float32Array(3), zen = new Float32Array(3), band = new Float32Array(3), amb = new Float32Array(3), fog = new Float32Array(3), fogP = new Float32Array(4);
  const grade = new Float32Array(3), gradeP = new Float32Array(3), comp = new Float32Array(4), skyH = new Float32Array(4), cloudQ = new Float32Array(4);
  // golden hour (relative tints over the season's light, absolute sky targets of a clear evening)
  const SUN_T = [1.14, 0.76, 0.46];         // the low sun through a long air path

        const e = [o[0] + dx * bl, o[1] + dy * bl, o[2] + dz * bl];
        const br = mpd(o, e, 4, 0.26, rnd, 1);
        br.forEach((p, i) => push(p, 1, i === 0, 0.62 * (1 - i / br.length) + 0.05));
        if (rnd() < 0.6) subs.push([br, bl]);
      }
      for (const [br, bl] of subs) {
        if (np > MAXP - 9) break;
        const o = br[3 + Math.floor(rnd() * 8)], ang = rnd() * 6.283, sl = bl * (0.3 + 0.35 * rnd());
        const e = [o[0] + Math.cos(ang) * sl * 0.7, o[1] - sl * 0.75, o[2] + Math.sin(ang) * sl * 0.7];
        const sb = mpd(o, e, 3, 0.28, rnd, 1);
        sb.forEach((p, i) => push(p, 2, i === 0, 0.38 * (1 - i / sb.length) + 0.04));
      }
    }
    bolt.n = np;
  }

  // =====================================================================================
  //                                   earthquake
  // =====================================================================================
  // the shake (closed form in the quake's age tau): a low-frequency sway (the S waves) and a fast jitter (strongest in
  // the P waves), plus roll; amplitudes in uv (x: of the width, y: of the height) and rad, times the envelope
  const QA = { x: [0.0072, 0.0026], y: [0.004, 0.0034], r: [0.0055, 0.0014] };
  let qseed = 1;
  const nz = (k, x) => S.vn1(qseed + k * 101, x);
  const hfK = tau => 1 + 1.2 * (1 - smooth(2.4, 3.6, tau));
  const lfK = tau => 0.15 + 0.85 * smooth(1.8, 3.2, tau);
  function shake(tau, e, out) {
    const h = hfK(tau), l = lfK(tau);
    out[0] = e * (QA.x[0] * l * nz(1, tau * 1.6) + QA.x[1] * h * nz(2, tau * 7.9));
    out[1] = e * (QA.y[0] * l * nz(3, tau * 2.0) + QA.y[1] * h * nz(4, tau * 10.7));
    out[2] = e * (QA.r[0] * l * nz(5, tau * 0.85) + QA.r[1] * h * nz(6, tau * 4.6));
  }
  const sh0 = [0, 0, 0], sh1 = [0, 0, 0];
  let eZ = 0, swayKick = 0;                // the overscan follower; the sway phase offset applied so far
  const jitter = new Float32Array(3);
  const dust = { on: false, t: 0, seed: 0, kind: 0, k: 0, col: new Float32Array(4) };
  const ROCK_DUST = [0.44, 0.42, 0.39], STREET_DUST = [0.5, 0.45, 0.38], POWDER = [0.82, 0.86, 0.92];

  // =====================================================================================
  //                                   wildfire smoke
  // =====================================================================================
  // smoke optical depth through the sun's path: red survives, blue does not
  const SMOKE_T = [0.8, 1.55, 2.5];        // (stage 2b: redder)
  const SMOKE_TINT = [0.7, 0.36, 0.15];

  const draw = { bolt: null, dust: null, jitter: null };
  S.derive.events = {
    draw,
    init() { eZ = 0; swayKick = 0; bolt.key = ''; bolt.n = 0; },
    step(dt, ff) {
      const ev = S.events.s;
      const e = ev.quake;
      eZ = e > eZ ? e : eZ * Math.exp(-dt / 1.1);
      if (eZ < 1e-4) eZ = 0;
      if (ff) return;
      // the sway kick: the tree-sway phase follows the shaking (zero-mean, returns to the plain phase as it ends)
      let k = 0;
      if (ev.quakeT >= 0) { qseed = S.hash32((S.cfg.seed >>> 0) + 7777 * (ev.quakeN + 1)); k = Math.min(1, e * 1.4) * 1.8 * nz(9, ev.quakeT * 2.7); }
      if (k !== swayKick) { S.anim.swayPh += k - swayKick; swayKick = k; }
    },
    frame(F) {
      const ev = S.events.s, ch = S.weather.s.ch, sc = sceneCfg(), house = S.sceneId === 'house';
      const rain = ch.precip * (1 - ch.snowFrac);
      flash.fill(0); flashFoot.fill(0); flashPos[0] = 0; flashPos[1] = 1500; flashPos[2] = 4000; flashPos[3] = 0;
      quake.fill(0); quakeZ[0] = 1; quakeZ[1] = quakeZ[2] = quakeZ[3] = 0;
      smokeU.fill(0); smokeSun.fill(0); fireU.fill(0); fireQ.fill(0); crack.fill(0); crackQ.fill(0);
      draw.bolt = null; draw.dust = null; draw.jitter = null;

      // ---- thunderstorm: a darker, lower deck (the lightning channel eases in and out with the weather). A scene derive
      // that owns its storm palette (stormLook: the house's dusk already darkens for ch.lightning) keeps it; the deck
      // still lowers (the strikes start from it)
      const lg = clamp(ch.lightning || 0, 0, 1);
      const sd = S.scene && S.scene.derive ? S.derive[S.scene.derive] : null;
      if (lg > 0) {
        const g = smooth(0, 1, lg);
        if (!(sd && sd.stormLook)) {
          for (const k of ['uSkyAmb', 'uSkyZen', 'uSkyHor', 'uFogCol', 'uHorBand']) {
            const a = own(F, k), m = 1 - (k === 'uSkyAmb' ? 0.3 : k === 'uSkyZen' ? 0.42 : 0.42) * g;
            a[0] *= m; a[1] *= m; a[2] *= m * (1 + 0.04 * g);    // a slightly bluer, darker storm light
          }
          // (stage 2b) and the exposure keeps it dark: derive/atmos lifts a dark rain day (up to x1.55), which turned
          // the valley's thunderstorm into a bright, hazy rain day; a storm reads heavier than rain, and the strokes pop
          F.uExposure *= 1 - 0.22 * g;
          const sn = own(F, 'uSunCol'); for (let i = 0; i < 3; i++) sn[i] *= 1 - 0.35 * g;   // the deck swallows the sun
          own(F, 'uGradeP')[1] += 0.08 * g;                     // a little more contrast under the storm
        }
        own(F, 'uCloudQ')[0] *= 1 - 0.2 * g;                    // the deck hangs lower (~920 m under the storm)
      }

      // ---- lightning
      const st = ev.strike, age = st ? ev.t - st.t0 : 1e9;
      if (st && age >= 0 && age < st.dur + 0.7) {
        placeStrike(st, F);
        const fc = [0.78, 0.86, 1.0];                           // cool white
        // the camera's distance from the channel (its nearest point) sets how bright the flash is here
        const T = place.top, L = place.kind === 0 ? place.lfoot : place.foot, cam = S.CAM.pos;
        const ab = [T[0] - L[0], T[1] - L[1], T[2] - L[2]], ab2 = ab[0] * ab[0] + ab[1] * ab[1] + ab[2] * ab[2] || 1;
        const hc = clamp(((cam[0] - L[0]) * ab[0] + (cam[1] - L[1]) * ab[1] + (cam[2] - L[2]) * ab[2]) / ab2, 0, 1);
        const dc = Math.hypot(L[0] + ab[0] * hc - cam[0], L[1] + ab[1] * hc - cam[1], L[2] + ab[2] * hc - cam[2]);
        const kd = place.kind === 2 ? 0.5 : (place.kind === 1 ? 0.75 : 1) / (1 + Math.pow(dc / sc.D0, 1.5));
        const I = ev.flash * kd;
        if (I > 0) {
          for (let i = 0; i < 3; i++) flash[i] = fc[i] * I * 2.6;
          flash[3] = ev.flash;
          flashPos[0] = T[0]; flashPos[1] = T[1]; flashPos[2] = T[2]; flashPos[3] = Math.sqrt(ab2);
          flashFoot[0] = L[0]; flashFoot[1] = L[1]; flashFoot[2] = L[2]; flashFoot[3] = place.kind;
          // the flash's ambient (every surface through its AO and normals), the sky light (what the rain drops and the
          // wet ground mirror: the lit deck; the clouds' gaps) and the lit rain haze
          const ka = place.kind === 2 ? 0.04 : 1;
          const amb = own(F, 'uSkyAmb'), zen = own(F, 'uSkyZen'), hor = own(F, 'uSkyHor'), fog = own(F, 'uFogCol');
          for (let i = 0; i < 3; i++) {
            amb[i] += fc[i] * I * 0.9 * ka; zen[i] += fc[i] * I * 2.0 * ka; hor[i] += fc[i] * I * 2.2 * ka; fog[i] += fc[i] * I * 0.4 * ka;
          }
        }
        // the bolt: the channel glows through every stroke (the main channel; the branches mostly in the first),
        // with a faint continuing current and a short warm afterglow
        if (place.kind !== 2) {
          const key = st.n + ':' + S.sceneId + ':' + S.CAM.pos.join(',') + ':' + S.camF.join(',');
          if (key !== bolt.key) { genBolt(st); bolt.key = key; }
          const cc = st.amp * (age < st.dur ? 0.12 * (1 - 0.5 * age / st.dur) : Math.max(0, 0.06 * (1 - (age - st.dur) / 0.5)));
          const main = ev.flash + cc, br = st.amp * Math.exp(-age / 0.06) + 0.3 * ev.flash;
          bolt.I[0] = main; bolt.I[1] = br; bolt.I[2] = 0.8; bolt.I[3] = 9;
          // the cooling channel: warmer while the continuing current dominates
          const warm = cc / (cc + ev.flash + 1e-4);
          bolt.C[0] = 1.0; bolt.C[1] = 1 - 0.18 * warm; bolt.C[2] = 1 - 0.45 * warm; bolt.C[3] = F.uCloudQ[0];
          if (main > 0.002) draw.bolt = bolt;
          // (stage 2b) the stroke blooms: the channel's glare spreads over the clouds and the rain around it
          F.uBloomStr += 0.4 * clamp(ev.flash * st.amp, 0, 1);
        }
      }

      // ---- earthquake: the shake, its overscan and blur, the particles' parallax, the dust, the cracks
      if (ev.quakeT >= 0 || eZ > 0) {
        const tau = Math.max(ev.quakeT, 0), e = ev.quake;
        qseed = S.hash32((S.cfg.seed >>> 0) + 7777 * (ev.quakeN + 1));
        if (ev.quakeT >= 0 && e > 0) {
          shake(tau, e, sh0); shake(tau - 1 / 60, e, sh1);
          quake[0] = sh0[0]; quake[1] = sh0[1]; quake[2] = sh0[2]; quake[3] = e;
          quakeZ[1] = sh0[0] - sh1[0]; quakeZ[2] = sh0[1] - sh1[1];
          // the parallax of a shaking camera: the nearest particles move most (a ~2 cm translation)
          for (let i = 0; i < 3; i++) jitter[i] = -(S.camR[i] * sh0[0] + S.camU[i] * sh0[1]) * 1.6;
          draw.jitter = jitter;
        }
        // the overscan zoom: keeps the shaken, rolled frame's edges out of view (a bound of the shake's amplitude)
        const asp = S.R && S.R.W ? S.R.W / S.R.H : 16 / 9, h = hfK(tau), l = lfK(tau);
        const bx = eZ * (QA.x[0] * l + QA.x[1] * h), by = eZ * (QA.y[0] * l + QA.y[1] * h), br = eZ * (QA.r[0] * l + QA.r[1] * h);
        const m = Math.max(bx + br * 0.5 / asp, by + br * 0.5 * asp);
        quakeZ[0] = eZ > 0 ? 1 / (1 - 2 * (m + 0.003 * smooth(0, 0.05, eZ))) : 1;   // (+ room for the blur taps)
        // the house's window / porch / street-lamp light flickers with the shaking (the wiring shakes; a few short
        // drop-outs in the main shock). §1 lets this lane scale uCozy; lane H may take it over in its own shading
        // (S.derive.house.quakeFlicker = true) and read uQuake instead
        if (house && ev.quakeT >= 0 && e > 0 && typeof F.uCozy === 'number' && !(S.derive.house && S.derive.house.quakeFlicker)) {
          const fl = 0.5 + 0.5 * nz(11, tau * 9.0), drop = smooth(0.55, 0.8, nz(12, tau * 3.1)) * smooth(0.5, 0.8, e);
          F.uCozy *= 1 - clamp(e * 1.2, 0, 1) * (0.55 * (1 - fl) + 0.4 * drop);
        }
      }
      // dust: from the main shock for ~40 s (plumes stream down the cliffs / puff off the street edges, then settle)
      const qa = ev.quakeT >= 0 ? ev.quakeT : -1;
      if (ev.crackT >= 0 && ev.crackT < 38 || qa >= 2.4) {
        dust.on = true; dust.t = ev.crackT >= 0 ? ev.crackT : qa - 2.5; dust.seed = S.hash32((S.cfg.seed >>> 0) * 31 + ev.quakeN + 5) >>> 8;
        dust.kind = house ? 1 : 0;
        // what the ground gives: dry ground dust; wet ground little; under snow the house's street stays still, while
        // the valley's cliffs shed powder snow instead of rock flour (white plumes)
        const g = S.ground.s, surf = S.derive.surface;
        const snowy = house ? smooth(0.1, 0.5, surf.visCover) : smooth(0.15, 0.7, surf.coverAt(1300));
        dust.k = ev.quakeMag * (1 - 0.65 * smooth(0.1, 0.8, g.wet)) * (house ? 1 - snowy : 1 + 0.3 * snowy);
        for (let i = 0; i < 3; i++) dust.col[i] = house ? STREET_DUST[i] : lerp(ROCK_DUST[i], POWDER[i], snowy);
        if (dust.k > 0.01) draw.dust = dust;
      }
      // the cracks: open with the main shock in a few tenths of a second, fade over a minute
      if (ev.crackT >= 0) {
        const c = sc.crack, L = landFrame(), cam = L.pos;
        const cx = cam[0] + L.f[0] * c.ahead + L.r[0] * c.side, cz = cam[2] + L.f[1] * c.ahead + L.r[1] * c.side;
        const ang = (S.rand(S.cfg.seed, 2e6 + ev.quakeN, 7) - 0.5) * 0.7;
        crack[0] = cx; crack[1] = cz; crack[2] = c.radius;
        crack[3] = smooth(0, 0.5, ev.crackT) * (1 - smooth(18, 60, ev.crackT));
        crackQ[0] = L.r[0] * Math.cos(ang) + L.f[0] * Math.sin(ang); crackQ[1] = L.r[1] * Math.cos(ang) + L.f[1] * Math.sin(ang);
        crackQ[2] = c.cell; crackQ[3] = house ? 1 : 0;
      }

      // ---- wildfire smoke (rain dampens it: washes the haze, quenches the embers)
      F.uAshRate = 0; F.uEmberRate = 0;
      if (ev.smoke > 0) {
        const sm = ev.smoke * (1 - 0.45 * smooth(0, 0.6, rain));
        const sun = own(F, 'uSunCol'), amb = own(F, 'uSkyAmb'), zen = own(F, 'uSkyZen'), hor = own(F, 'uSkyHor');
        const band = own(F, 'uHorBand'), fog = own(F, 'uFogCol'), fogP = own(F, 'uFogP'), grade = own(F, 'uGrade'), gp = own(F, 'uGradeP');
        const lA = lum(amb), lZ = lum(zen), lH = lum(hor), lS = lum(sun);
        for (let i = 0; i < 3; i++) {
          // the sun through the smoke: dim and red; the sky light scattered by the smoke: brown-orange
          sun[i] = lerp(sun[i], sun[i] * Math.exp(-SMOKE_T[i]), sm);
          // (stage 2b: the 2020 orange sky rather than a beige fog: a saturated amber-orange low sky and haze under a
          // dark rust pall overhead, warm orange-brown ambient light, a warmer grade)
          amb[i] = lerp(amb[i], (lA * 1.0 + 0.03 * lS) * [1.34, 0.92, 0.58][i], sm);
          zen[i] = lerp(zen[i], Math.max(lZ, 0.18) * [1.25, 0.72, 0.4][i] * 0.5, sm);
          hor[i] = lerp(hor[i], Math.max(lH, 0.25) * [1.8, 0.82, 0.28][i], sm);
          band[i] = lerp(band[i], Math.max(lH, 0.25) * [1.95, 0.86, 0.26][i], sm);
          fog[i] = lerp(fog[i], Math.max(lum(fog), 0.22) * [1.7, 0.8, 0.3][i] * 0.76, sm);
          grade[i] *= lerp(1, [1.06, 0.98, 0.88][i], sm);
        }
        fogP[0] = lerp(fogP[0], Math.max(fogP[0], sc.haze), sm);
        // (stage 2b) the smoke lies low: half the haze's scale height, so the sky darkens from the glowing orange low down
        // to the rust-brown pall overhead (the sky pixel sees the zenith colour through the thinner smoke up there)
        fogP[1] = lerp(fogP[1], 0.5 * fogP[1], sm);
        gp[0] += 0.06 * sm;                                    // a little muted (stage 2b: was .24, a washed sepia)
        gp[1] *= 1 - 0.2 * sm;                                 // lower contrast
        gp[2] *= 1 - smooth(0, 0.25, sm);                      // no snow sparkle in the smoke
        F.uExposure *= 1 - 0.14 * sm;                           // (stage 2b: a dimmer, deeper orange day; was x1.15, a bright ochre)
        smokeU[0] = SMOKE_TINT[0]; smokeU[1] = SMOKE_TINT[1]; smokeU[2] = SMOKE_TINT[2]; smokeU[3] = sm;
        // the veiled sun disc and the far fire, fixed in the scene (relative to its landscape framing)
        landFrame();
        const sd = landDir(sc.sun.az), ce = Math.sqrt(1 - sc.sun.el * sc.sun.el);
        smokeSun[0] = sd[0] * ce; smokeSun[1] = sc.sun.el; smokeSun[2] = sd[1] * ce;
        smokeSun[3] = sm * (1 - 0.85 * smooth(0.3, 0.9, ch.overcast));
        const fd = landDir(sc.fire.az);
        fireU[0] = fd[0]; fireU[1] = fd[1]; fireU[2] = sc.fire.half; fireU[3] = sm * (1 - 0.6 * smooth(0.3, 0.9, ch.overcast));
        // the columns lean downwind (the natural wind across the fire's direction)
        const w = S.wind.s.natural, across = w[0] * (-fd[1]) + w[2] * fd[0];
        fireQ[0] = sc.fire.base; fireQ[1] = clamp(across * 0.08, -0.9, 0.9); fireQ[2] = ev.fireClock; fireQ[3] = (ev.fireN * 0.37) % 1;
        F.uAshRate = ev.smoke * (1 - 0.6 * smooth(0, 0.6, rain));
        F.uEmberRate = Math.pow(ev.smoke, 1.5) * Math.pow(1 - smooth(0, 0.5, rain), 2);
      }

      F.uFlash = flash; F.uFlashPos = flashPos; F.uFlashFoot = flashFoot; F.uQuake = quake; F.uQuakeZ = quakeZ;
      F.uSmoke = smokeU; F.uSmokeSun = smokeSun; F.uFire = fireU; F.uFireQ = fireQ; F.uCrack = crack; F.uCrackQ = crackQ;
      F.uDustRate = draw.dust ? 1 : 0;
    },
  };
})(window.SNOW);

</script>
<script>/* js/precip.js */
// =====================================================================================
//  precip.js (Phase-3 owner: lane Z, hazards) — the precipitation layers and their draw: the layer descriptors, the
//  per-layer lattice wrap of the wind / fall integrals, and S.drawPrecip(ctx), which render.js calls between FXAA and
//  bloom (premultiplied alpha into R.hdr), then S.drawHazards(ctx): the lightning bolt and the quake's dust plumes
//  (Phase 3, lane Z). Registers only.
//
//  Layer descriptor: { id, kind: 'snow' | 'rain' | 'ash' | 'ember', prog, z0, z1, fade, base, max, heavy,
//                      vlo, vhi, fallKey, rateKey, wet (snow) | push (rain) }   (ash / ember: Phase 3, the wildfire)
//    id        uLayer inside its program (VS_FLAKE: 0 near bokeh, 1 crystals, 2 mid, 3 far, 4 hero; VS_RAIN: 5 near
//              defocused drops, 6 near streaks, 7 mid, 8 far fine streaks; VS_ASH: 9 far, 12 mid, 13 near flakes;
//              VS_EMBER: 10 the drifting sparks, 14 a few close ones). Distinct ids = independent hashes.
//    prog      the S.P program that draws it ('flake' | 'rain' | 'ash' | 'ember')
//    z0 z1 fade   camera-space depth slice (m) and its edge fade length
//    base max     instance count at density x1 / hard cap; heavy: count multiplier at full uHeavy
//    vlo vhi      fall-speed range (m/s at fall factor 1) of its 40 speed bins (uFallLH)
//    fallKey      the S.anim fall integral its bins wrap ('fallI' | 'rainI' | 'ashI' | 'emberI')
//    rateKey      the S.F rate its count scales with ('uPrecipSnow' | 'uPrecipRain' | 'uAshRate' | 'uEmberRate')
//    wet          snow: count multiplier at full wet snow (x (1 + (wet - 1) x uWetSnow): fewer, bigger clumps)
//    push         rain: drag-wake weight (uPushK; VS_FLAKE keeps Phase 1's 1)
//  count = min(max x flakeMul, base x amountMul x flakeMul x F[rateKey] x (1 + (heavy - 1) x F.uHeavy) x the wet
//  multiplier); a layer with count 0 is skipped (no program switch, no cost). Layers draw far to near (sorted by z1),
//  switching program only when the kind changes, so rain and snow slices interleave by depth. Sleet is both
//  populations at once, their counts cross-fading with snowFrac (instances enable in id order and the last one
//  fades: no pops); a particle never changes kind, bin or speed range.
//  Budget at amount 0.5: calm snow ~60k, blizzard ~183k; rain .65 ~15k; heavy rain at the caps (precip 1, heavy 1,
//  amount 1) ~54k instances, about half the blizzard's GPU cost. Wildfire at full smoke: ~22k ash, ~400 embers.
//  Earthquake parallax: while the frame shakes (derive/events.js draw.jitter, a ~2 cm camera translation), every
//  layer's wind integrals are offset by the same world vector before the lattice wrap (affine: both integrals alike),
//  so the nearest particles jitter against the scene and the far ones barely move.
// =====================================================================================
(function (S) {
  'use strict';
  const { camR, camU, camF } = S;   // mutated in place by S.frameCamera; S.TANH is read per use
  const R = S.R;
  const NB = 40;                                   // fall-speed bins (must match PRECIP_VS)
  const SNOW = { kind: 'snow', prog: 'flake', vlo: 0.4675, vhi: 1.5525, fallKey: 'fallI', rateKey: 'uPrecipSnow' };
  // rain bins: the drop speeds of VS_RAIN (1.6-4.4 mm drops: 5.7-8.9 m/s)
  const RAIN = { kind: 'rain', prog: 'rain', vlo: 5.5, vhi: 9.0, fallKey: 'rainI', rateKey: 'uPrecipRain' };
  // wildfire (Phase 3): ash falls slowly; embers rise and sink (negative speeds rise)
  const ASH = { kind: 'ash', prog: 'ash', vlo: 0.2, vhi: 0.9, fallKey: 'ashI', rateKey: 'uAshRate', heavy: 1 };
  const EMBER = { kind: 'ember', prog: 'ember', vlo: -0.7, vhi: 0.3, fallKey: 'emberI', rateKey: 'uEmberRate', heavy: 1 };
  const LAYERS = S.LAYERS = [
    // heavy: per-layer density multiplier at full blizzard (total flake count ends up > x6)
    // wet: count multiplier for wet snow (fewer, bigger clumps: the near tiers gain, the far fine field thins)
    { ...SNOW, id: 3, z0: 26, z1: 240, fade: 22, base: 46000, max: 125000, heavy: 6.5, wet: 0.75 },
    { ...SNOW, id: 2, z0: 8, z1: 30, fade: 4, base: 12000, max: 50000, heavy: 4.5, wet: 0.9 },
    { ...SNOW, id: 1, z0: 2.3, z1: 9.0, fade: 0.9, base: 2500, max: 14000, heavy: 3.2, wet: 1.35 },
    { ...SNOW, id: 4, z0: 0.9, z1: 2.4, fade: 0.3, base: 36, max: 220, heavy: 1.7, wet: 1.5 },     // hero crystals (sparse, in focus)
    { ...SNOW, id: 0, z0: 0.25, z1: 0.8, fade: 0.15, base: 20, max: 140, heavy: 2.0, wet: 1.0 },   // near bokeh discs (~3 on screen)
    // rain: far fine streaks, mid streaks, near sharp streaks, a few big defocused drops at the lens
    { ...RAIN, id: 8, z0: 14, z1: 70, fade: 8, base: 14000, max: 34000, heavy: 2.5, push: 0.45 },
    { ...RAIN, id: 7, z0: 4.5, z1: 18, fade: 2, base: 8000, max: 17000, heavy: 2.2, push: 0.6 },
    { ...RAIN, id: 6, z0: 1.3, z1: 5.5, fade: 0.6, base: 1100, max: 2600, heavy: 2.0, push: 0.8 },
    { ...RAIN, id: 5, z0: 0.3, z1: 1.5, fade: 0.2, base: 30, max: 100, heavy: 1.6, push: 1.0 },
    // Phase 3 (hazards lane Z): wildfire ash (grey irregular flakes, 0.2-0.9 m/s) and embers (glowing sparks, rising
    // and sinking, additive), counts by F.uAshRate / uEmberRate (derive/events.js; 0 without a fire: skipped before any
    // GL call). The quake's dust is anchored on the scene, not a slice-box population: S.drawHazards draws it
    { ...ASH, id: 9, z0: 24, z1: 110, fade: 10, base: 12000, max: 20000 },
    { ...ASH, id: 12, z0: 4.5, z1: 26, fade: 2.5, base: 9000, max: 16000 },
    { ...ASH, id: 13, z0: 0.6, z1: 5, fade: 0.5, base: 900, max: 2000 },
    { ...EMBER, id: 10, z0: 3, z1: 60, fade: 6, base: 380, max: 900 },
    { ...EMBER, id: 14, z0: 0.7, z1: 3.5, fade: 0.4, base: 10, max: 30 },
  ].sort((a, b) => b.z1 - a.z1);
  for (const L of LAYERS) { L.hx = 0; L.hy = 0; L.dA = new Float32Array(3); L.dB = new Float32Array(3); L.fall = new Float32Array(3 * NB); }
  S.layoutLayers = function () {
    const asp = R.W / R.H;
    const tanH = S.TANH;
    for (const L of LAYERS) { L.hx = L.z1 * tanH * asp * 1.1 + 0.3; L.hy = L.z1 * tanH * 1.1 + 0.3; }
  };
  const count = S.precipCount = { snow: 0, rain: 0, ash: 0, ember: 0, dust: 0 };   // instances drawn last frame, per kind

  // Lattice wrap of the per-layer displacement integrals (all CPU-side, in double precision). The shader folds
  // positions into the camera-aligned slice box with a mod, so shifting a displacement by any lattice vector of
  // that box is invisible: that keeps the uploaded floats small (no precision loss) with no discontinuity.
  const AXES = [camR, camU, camF];
  const boxS = [0, 0, 0], shift = [0, 0, 0], cq = [0, 0, 0];
  const jA = new Float64Array(3), jB = new Float64Array(3);   // the shaken integrals (wrapLayer; no per-frame arrays)
  function latticeShift(cx, cy, cz) {   // camera-space coords -> the lattice vector to subtract (world space, in shift[])
    shift[0] = shift[1] = shift[2] = 0;
    cq[0] = cx; cq[1] = cy; cq[2] = cz;
    for (let j = 0; j < 3; j++) { const ax = AXES[j], n = Math.floor(cq[j] / boxS[j]) * boxS[j]; shift[0] += ax[0] * n; shift[1] += ax[1] * n; shift[2] += ax[2] * n; }
  }
  function wrapLayer(L) {
    const anim = S.anim;
    boxS[0] = 2 * L.hx; boxS[1] = 2 * L.hy; boxS[2] = L.z1 - L.z0;
    // wind: both integrals shifted by the same vector (the shader mixes them affinely); a shaking camera's parallax
    // (the quake) offsets both alike
    const J = S.derive.events.draw.jitter;
    let a = anim.dispA, b = anim.dispB;
    if (J) { for (let i = 0; i < 3; i++) { jA[i] = a[i] + J[i]; jB[i] = b[i] + J[i]; } a = jA; b = jB; }
    latticeShift(a[0] * camR[0] + a[1] * camR[1] + a[2] * camR[2], a[0] * camU[0] + a[1] * camU[1] + a[2] * camU[2], a[0] * camF[0] + a[1] * camF[1] + a[2] * camF[2]);
    for (let i = 0; i < 3; i++) { L.dA[i] = a[i] - shift[i]; L.dB[i] = b[i] - shift[i]; }
    // fall: one reduced vector per speed bin, (0, -k*I, 0) with I the layer's fall integral
    const fallI = anim[L.fallKey];
    for (let j = 0; j < NB; j++) {
      const vy = -(L.vlo + (j + 0.5) / NB * (L.vhi - L.vlo)) * fallI;
      latticeShift(vy * camR[1], vy * camU[1], vy * camF[1]);
      L.fall[3 * j] = -shift[0]; L.fall[3 * j + 1] = vy - shift[1]; L.fall[3 * j + 2] = -shift[2];
    }
  }

  // per-program setup, once per frame when a program is first needed (S.F is uploaded by ctx.use); uniform values
  // persist per program and the texture units are shared, so a later switch back only rebinds the program
  const msArr = new Float32Array(32 * 4), maArr = new Float32Array(32);
  const ready = {};                                // this frame's uniform locations of each program once set up
  let nSeg = 0;
  function setup(u, ctx) {
    const gl = S.gl, Ws = R.Ws, Hs = R.Hs;
    gl.uniform2f(u.uRes, Ws, Hs);
    ctx.bindGB(u, 8);
    ctx.bindTex(2, R.scene.texs[0], u.uScene);       // scene alpha: snow fraction x sun visibility
    gl.uniform1f(u.uAspect, Ws / Hs);
    gl.uniform1f(u.uFocalPx, Hs * 0.5 / S.TANH);
    // focus at 1.3 m with a gentle circle of confusion: the hero tier (0.9-2.4 m) is sharp, only the near discs
    // (and the nearest raindrops) defocus
    gl.uniform1f(u.uCocK, 12 * Hs / 1080);
    gl.uniform1f(u.uFocus, 1.3);
    gl.uniform1ui(u.uSeed, S.cfg.seed);
    gl.uniform4fv(u.uMs, msArr); gl.uniform1fv(u.uMa, maArr); gl.uniform1i(u.uMn, nSeg);
  }

  // ctx (render.js): { use(prog) -> uniform locations (binds the program and uploads S.F), bindGB(u, unit0),
  // bindTex(unit, tex, loc) }. The target (R.hdr) is bound and the viewport set by the caller.
  S.drawPrecip = function (ctx) {
    const gl = S.gl, P = S.P, F = S.F, perf = S.perf, mouse = S.mouse;
    for (const k in count) count[k] = 0;
    nSeg = mouse.segs.length;
    for (let i = 0; i < nSeg; i++) { const m = mouse.segs[i]; msArr[i * 4] = m.x; msArr[i * 4 + 1] = m.y; msArr[i * 4 + 2] = m.dx; msArr[i * 4 + 3] = m.dy; maArr[i] = S.anim.wall - m.t; }
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
    const dens = S.amountMul() * perf.flakeMul;
    let cur = null, u = null;
    for (const k in ready) ready[k] = null;
    for (const L of LAYERS) {
      const wetK = L.wet ? 1 + (L.wet - 1) * F.uWetSnow : 1;
      const cnt = Math.min(L.max * perf.flakeMul, L.base * dens * F[L.rateKey] * (1 + (L.heavy - 1) * F.uHeavy) * wetK);   // the cap thins too, or the rung is a no-op in a blizzard
      const ni = Math.ceil(cnt);
      if (!(ni > 0)) continue;
      if (L.prog !== cur) {
        cur = L.prog;
        if (ready[cur]) { u = ready[cur]; gl.useProgram(P[cur].p); }
        else { u = ready[cur] = ctx.use(P[cur]); setup(u, ctx); }
      }
      wrapLayer(L);
      gl.uniform3fv(u.uDispA, L.dA); gl.uniform3fv(u.uDispB, L.dB); gl.uniform3fv(u.uFallQ, L.fall);
      gl.uniform2f(u.uFallLH, L.vlo, L.vhi);
      gl.uniform1i(u.uLayer, L.id);
      gl.uniform3f(u.uSlice, L.z0, L.z1, L.fade);
      gl.uniform2f(u.uHalfXY, L.hx, L.hy);
      gl.uniform1f(u.uCount, cnt);
      if (L.kind === 'rain') gl.uniform1f(u.uPushK, L.push);
      gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, ni);
      count[L.kind] += ni;
    }
    gl.disable(gl.BLEND);
  };

  // The hazard draws after the precipitation (render.js; same target R.hdr, same ctx), from derive/events.js draw:
  //  - the quake's dust plumes (program 'dust'; premultiplied): 40 plumes x 36 puffs, each plume anchored on the
  //    scene through the G-buffer (VS_DUST);
  //  - the lightning bolt (program 'bolt'; additive): one instanced quad per channel segment from uBolt[] (the
  //    strike's points), depth-tested against the G-buffer and veiled by the cloud pass (bound at units 5, 6).
  // Nothing (no program switch, no GL call) while neither is on.
  const DUST_N = 40 * 36;
  const dustU = new Float32Array(4);
  S.drawHazards = function (ctx) {
    const d = S.derive.events.draw;
    count.dust = 0;
    if (!d.dust && !d.bolt) return;
    const gl = S.gl, P = S.P, Ws = R.Ws, Hs = R.Hs;
    gl.enable(gl.BLEND);
    if (d.dust) {
      const u = ctx.use(P.dust);
      gl.uniform2f(u.uRes, Ws, Hs);
      ctx.bindGB(u, 8);
      gl.uniform1f(u.uAspect, Ws / Hs);
      gl.uniform1f(u.uFocalPx, Hs * 0.5 / S.TANH);
      dustU[0] = d.dust.t; dustU[1] = d.dust.seed; dustU[2] = d.dust.kind; dustU[3] = d.dust.k;
      gl.uniform4fv(u.uDust, dustU);
      gl.uniform4fv(u.uDustC, d.dust.col);
      gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
      gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, DUST_N);
      count.dust = DUST_N;
    }
    if (d.bolt && d.bolt.n > 1) {
      const b = d.bolt, u = ctx.use(P.bolt);
      gl.uniform2f(u.uRes, Ws, Hs);
      ctx.bindGB(u, 8);
      const sky = R.sky[R.skyI];                     // this frame's cloud pass (render.js swapped it after drawing)
      ctx.bindTex(5, sky.texs[0], u.uBoltSky); ctx.bindTex(6, sky.texs[1], u.uBoltSkyD);
      gl.uniform1f(u.uAspect, Ws / Hs);
      gl.uniform1f(u.uFocalPx, Hs * 0.5 / S.TANH);
      gl.uniform4fv(u.uBolt, b.pts);
      gl.uniform1i(u.uBoltN, b.n);
      gl.uniform4fv(u.uBoltI, b.I);
      gl.uniform4fv(u.uBoltC, b.C);
      gl.blendFunc(gl.ONE, gl.ONE);
      gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, b.n - 1);
    }
    gl.disable(gl.BLEND);
  };
})(window.SNOW);
